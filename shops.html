<script id="md" type="application/json">"# 서풍의 광시곡 — 상점별 무기·아이템 정리\n\n> **현재 진행 시점**: 제피르 팰컨 기지 (3차) 작전 회의 끝. 에스테 도데의 요청으로 리브레빌로 출발\n>\n> 표시: ✅ 리마스터에서 확인됨(유저 실플레이 글) · 📖 원작(1998) 공략 기준 — 리마스터에서 값이 다를 수 있음 · ❓ 아직 모름\n>\n> 돈 단위는 **엘드(Eld)**. 이미 들른 곳과 지금 갈 수 있는 곳만 적는다.\n\n---\n\n## 지금 할 만한 돈벌이\n\n상점마다 같은 물건 값이 다르다. 싸게 파는 곳에서 사서 비싸게 사 주는 곳에 팔면 돈이 불어난다. 리마스터에서도 그대로 된다. ✅\n\n| 사는 곳 | 물건 | 사는 값 | 파는 곳 | 파는 값 | 한 개당 남는 돈 |\n|---|---|---|---|---|---|\n| 카라카스 무기점 (총 상인) | 라이플 | 1,350 | 카라카스 검 연구회 | 1,500 | 150 |\n| 카라카스 무기점 (총 상인) | 화승총 | 1,170 | 카라카스 검 연구회 | 1,300 | 130 |\n| 카라카스 무기점 (총 상인) | 자동소총 | ❓ | 카라카스 검 연구회 | ❓ | 라이플보다 큼 |\n| 해적키드의 비밀상점 | 클레이모어 | 4만 미만 📖 | 카라카스 검 연구회 | 52,000 | 1만 넘게 |\n| 제피르 팰컨 기지 병사 | 기관소총(기관총) | 싸다 ❓ | 카라카스 검 연구회 | ❓ | 남는다는 증언 있음 |\n\n- 라이플로 밑천을 만든 뒤 자동소총으로 갈아타면 더 빨리 모인다.\n- 해적키드 상점은 **3번만** 열 수 있다. 마지막에 갈 때는 돈을 꽉 채워 가서 클레이모어를 몰아 사 두면, 카라카스에 팔아 크게 남길 수 있다.\n- 리마스터는 물건이 한 칸에 하나씩 따로 쌓인다. 많이 팔 때 하나하나 체크하기 귀찮다면 **오른쪽 키(패드는 왼쪽 스틱을 오른쪽 아래로 문지르기)**로 체크하고 내려가면 빠르다. ✅\n- 배속과 인카운터 끄기를 켜 두고 왔다 갔다 하면 훨씬 덜 지루하다.\n\n---\n\n## 상점별 정리 (들른 순서)\n\n### 폭풍도\n- 아수라전 전에 상점에서 **라임**(기력 회복)과 **어설트소드**(여분 무기)를 넉넉히 사 두라는 공략이 있다. 📖\n- 리마스터에서는 해변의 **죄수**가 **만능열쇠**를 판다. 이걸로 섬 곳곳의 잠긴 상자에서 소검과 레이피어를 꺼낼 수 있다. ✅(나무위키)\n\n### 카라카스 — 일반 상점들\n무기점, 액세서리점, 아이템점이 있다.\n\n- **무기점** 📖\n  - **Chry.기리엄**: 한계력 1,000짜리 좋은 중검. 막는 역할에 좋다.\n  - **크리사오르**: 같이 추천되는 검.\n  - **에스톡**: 공격력 80짜리 세검. 때리는 역할에 좋다.\n  - 따로 있는 **총 상인**: 화승총 1,170, 라이플 1,350, 자동소총. ✅\n  - 한 명은 중검으로 막고, 한 명은 세검으로 때리게 나누면 전투가 편하다.\n- **아이템점** 📖\n  - 회복약, **라임**, **만능열쇠**. 필드와 던전에 잠긴 상자가 많아서 만능열쇠는 늘 몇 개 들고 다니는 게 좋다.\n- **액세서리점** 📖\n  - 브레스잼을 아이템점보다 비싸게 사 준다. (→ 아래 \"보석 파는 곳\")\n- 마을 집들의 상자에서 **각성제 5개**를 얻을 수 있다. 📖\n\n### 카라카스 — 검 연구회 (제국 학술원 산하)\n마을 서쪽(2번 블록)에 있다. 시라노가 있던 제국 학술원이 운영하는 곳이다.\n\n- **사는 값도 파는 값도 일반 무기점의 두 배**다. 그래서 물건을 살 때는 비싸지만, 팔 때는 여기가 제일 좋다. 📖\n- 파는 물건\n  - **스타더스트**: 1,600,000. 초반 최고의 검. 위의 돈벌이로 돈을 모아서 사는 사람이 많다. ✅\n  - **듀렌달**: 스타더스트까지는 무리일 때 타협안으로 많이 산다. 📖\n  - **그람**(세검), **플레이트 아머**(방어력 +30 액세서리). 📖\n  - **클레이모어**: 104,000. 여기서 사는 건 손해고, 다른 데서 싸게 사서 여기 **52,000**에 파는 게 맞다. ✅\n- 사 주는 값: 라이플 1,500, 화승총 1,300, 클레이모어 52,000. ✅\n- 스타더스트가 너무 멀면 **암흑검**이나 **실버소드**만 사도 한동안 괜찮다는 의견이 있다. ✅\n\n### 프리토리아\n- 상점에 **기본 마법을 쓰게 해 주는 마법 반지**가 줄줄이 있다. 반지를 끼면 그 속성 마법을 쓸 수 있다. 📖(나무위키)\n- 근처 산의 **피닉스 동굴**은 상점은 아니지만, 듀렌달급 무기가 있으면 돈과 경험치를 많이 벌 수 있는 곳이다. 📖\n\n### 제피르 팰컨 기지\n- 작전회의실 **클라우제비츠 옆 병사들**이 물건을 싸게 판다. 📖\n- 여기서 **기관소총(기관총)**을 잔뜩 사서 카라카스 검 연구회에 팔면 남는다는 증언이 있다. ✅\n- 정확한 품목과 값은 ❓ — 직접 보면 알려 주세요.\n\n### 해적키드의 비밀상점 (해적키드의 동굴)\n기지를 나와 작전 방향 반대쪽(왼쪽)의 동굴. 첫 갈림길에서 오른쪽, 다음 갈림길에서 왼쪽 끝. (지도첩 \"해적키드의 동굴 가는 길\" 참고)\n\n- **딱 3번만** 이용할 수 있다. 다 쓰고 나오면 동굴 입구로 바로 옮겨진다. 📖\n- 다음 갈림길의 오른쪽 끝에는 상자가 많다. 상점에 가기 전에 먼저 챙기자. 📖\n- 파는 물건 📖\n  - **클레이모어**: 돈으로 살 수 있는 검 중 가장 비싼 검인데 4만 엘드도 안 된다.\n  - **듀렌달**: 이것도 싸게 사서 카라카스에 팔면 남는다는 증언이 있다. ✅\n  - **미스릴탄**: 가장 좋은 탄약. 원래는 한참 뒤에야 파는 물건이라 미리 사 두면 좋다.\n  - **불의 문장**: 에스메랄다에게 끼우면 화염 마법을 쓰고 지력도 오른다.\n  - **완전 회복약**: 고급 회복약과 비슷한 값. 10~20개쯤 사 두면 좋다.\n- 첫 갈림길 왼쪽 끝의 **제프리 바지**는 붙는 능력이 작동하지 않아서 사실상 쓸모없다. 📖\n\n### 파로 마을\n- **약국**(아이템 상점)이 있다. 파로 마을 사건 퀘스트에서 단서를 얻는 곳이기도 하다. 📖\n- 판매 목록 ❓\n\n### 게이시르 시티\n- 무기점에 좋은 무기가 있다는 말을 들었다. 판매 목록과 값 ❓ — 보시면 알려 주세요.\n- 상점은 아니지만, 총을 든 병사의 \"무인에게 중요한 것\" 퀘스트로 시티를 돌면 보석을 준다. 3바퀴에 **브레스잼**, 10바퀴에 **다이아몬드잼**. 다른 지역으로 넘어가면 처음부터 다시 센다. 📖\n\n---\n\n## 보석 파는 곳\n\n보석은 아무 데나 팔지 말고, 비싸게 사 주는 곳까지 들고 간다.\n\n| 보석 | 파는 곳 | 값 |\n|---|---|---|\n| 브레스잼 | 카라카스 아이템점 | 900 📖 |\n| 브레스잼 | 카라카스 액세서리점 | **1,100** 📖 |\n| 다이아몬드잼 | 리브레빌 | **30,000** ✅ |\n| 다이아몬드잼 | 로우엔 액세서리점 | 26,000 ✅ |\n\n- 다이아몬드잼은 지금 갈 수 있는 상점에서 파는 것보다 리브레빌이나 로우엔까지 들고 가는 게 낫다.\n\n---\n\n## 출처\n- 나무위키 [창세기전 외전 서풍의 광시곡](https://namu.wiki/w/%EC%B0%BD%EC%84%B8%EA%B8%B0%EC%A0%84%20%EC%99%B8%EC%A0%84%20%EC%84%9C%ED%92%8D%EC%9D%98%20%EA%B4%91%EC%8B%9C%EA%B3%A1)\n- 네이버 블로그 My Wind is High — 원작 공략 연재 ([폭풍도와 아수라검(2)](https://m.blog.naver.com/fireblow/10014023441), [카나와의 만남 — 카라카스](https://m.blog.naver.com/fireblow/10014103815), [성녀 에스메랄다를 찾아서 — 검 연구회·피닉스 동굴](https://m.blog.naver.com/fireblow/10014133965), [니코시아 지방으로...(1)](https://m.blog.naver.com/fireblow/10014241209), [(2)](https://m.blog.naver.com/fireblow/10014358512))\n- 루리웹 [서풍의 광시곡 끄적끄적5](https://m.ruliweb.com/game/138/read/4053113) — 원작\n- 디시 창세기전 갤러리 (리마스터)\n  - [서풍의 광시곡 리마스터 정보 공략 모음](https://m.dcinside.com/board/warofgenesis/137782)\n  - [초반에 돈복사 하는 방법](https://m.dcinside.com/board/warofgenesis/137821)\n  - [카라카스 대량 거래 요령](https://m.dcinside.com/board/warofgenesis/138110)\n  - [중반 이후 돈복사 루트](https://m.dcinside.com/board/warofgenesis/138514) — 클레이모어·다이아몬드잼 시세\n  - [9장 섭퀘+제피르팰컨 비밀던전 가는 길](https://m.dcinside.com/board/warofgenesis/137888) — 댓글의 기지 기관총, 키드 상점 듀렌달 증언\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
