<script id="md" type="application/json">"# 서풍의 광시곡 — 진행 중인 내용\n\n> **현재 진행 시점**: 게이시르 대성당 (이스카리옷을 물리침 — 체사레는 사이럽스 수중 도시에)\n>\n> 하다가 만 일, 나중에 챙길 일을 적어 둔다. 끝나면 지우지 말고 ✅ 표시하고 어디서 끝냈는지 적는다.\n\n---\n\n## 🎯 지금 하러 가는 것\n\n### 🌊 사이럽스 수중 도시 — 체사레를 쫓아\n- 대성당에서 그리마가 된 이스카리옷을 물리쳤다. 체사레는 **파괴신을 되살리러 사이럽스의 수중 도시**에 갔다고 한다. 그리로 간다.\n- 사이럽스는 게임 처음, 사막에서 구조된 뒤 들렀던 호숫가 마을이다. 수중 도시로 들어가는 방법은 자료에서 찾지 못했다. 마을 사람들 말을 들어 본다.\n- 시라노에게 시간이 얼마 없다. 체사레와 결판이 날 수 있으니 각성제, 회복약을 넉넉히 챙긴다.\n- 메디치가 빠졌을 수 있다. 메디치에게 좋은 장비를 끼워 뒀다면 뺄 수 있는지 본다.\n- 사이럽스 상점이 있으면 무엇을 파는지 본다. 남은 보석은 값을 비교해서 판다(다이아몬드잼은 리브레빌 30,000이 가장 비쌌다).\n\n---\n\n### ✅ 게이시르 대성당 (이스카리옷을 물리침)\n- 이스카리옷이 그리마로 변했지만 물리쳤다. 체사레는 사이럽스 수중 도시로 가 있었다.\n\n### ✅ 로우엔 — 메르세데스를 만나러 (메르세데스의 저택에서 끝남)\n- 클라우제비츠가 함정이라고 말렸지만 갔다. 독배를 마셨고, 메르세데스가 세상을 떠났다.\n\n### ✅ 제14장 드래건 스트라이크 작전 (제피르 팰컨 보급로에서 끝냄 — 비프로스트군에 이김)\n- 시라노 일행이 비프로스트 보급기지를 쳐부쉈다.\n- 리델과 메디치가 자리를 비운 사이 빼앗긴 아군 보급로를 시라노와 카나가 되찾았다. 카타리나를 다시 물리쳤다.\n\n### ✅ 마키아벨리 추적 (비프로스트 궁에서 끝냄 — 붙잡았다가 살려 보냄)\n- 리브레빌 → 안타나나리보 → 망티고아 산 → 비프로스트 궁으로 쫓아갔다. 망티고아 산에서 발키리 대장 카타리나를 물리쳤다.\n- 리브레빌에서 각성제를 샀다. 망티고아 산에서 엑스칼리버를 고치고 일각수의 뿔을 얻었다.\n\n### ✅ 카슈미르의 보물 찾기 (화룡굴 2차에서 찾음)\n- 보물찾기 일행(카나, 실버, 이자벨, 메디치)이 게이시르 숲 화룡굴에서 보물을 찾았다.\n- 카나의 장비를 훔쳐 간 개구리가 어떻게 됐는지는 아직 모른다. 카나 장비 칸이 비어 있다면 채워 둔다. 보르도 개구리 상점에 카나 장비가 올라와 있는지도 나중에 본다.\n\n### ✅ 낡은 엑스칼리버 고치기 (망티고아 산 1차에서 끝냄, 일각수의 뿔도 얻음)\n- 유니콘 동굴에서 **파즈**를 만나 고쳤다. 동굴 북서쪽 상자를 먼저 열고, 나갔다가 다시 들어가는 방법이었다.\n- 이제 시라노는 **엑스칼리버**를 쓴다. 쓰던 검(멸살지옥검, 유성의 검, 스타더스트 등)은 리델에게 넘길지 견줘 본다.\n- **일각수의 뿔**은 보조 장비 칸에 단다. 얼음 마법과 소환수 **크리스탈 유니콘**을 쓸 수 있다.\n\n순서: ~~카라카스(카그에게 향초)~~ ✅ → ~~니코시아(샤론의 사인)~~ ✅ → ~~파로 마을(소녀에게 사인)~~ ✅ → ~~로우엔(카오스 큐브 전설)~~ ✅ → ~~마검숲~~ ✅ → **보르도** (도착, 개구리 상점 ✅)\n\n### ✅ 1. 카라카스 — 요리사 카그에게 사랑의 향초 (카라카스 3차에서 끝냄, 실버잼 받음)\n- 카라카스를 떠나기 전에 **검 연구회**에서 클레이모어 값을 확인해 둔다(보르도 개구리 상점 돈 불리기용).\n\n### ✅ 2. 니코시아 — 샤론의 사인 (니코시아 2차에서 받음)\n- 샤론은 **니코시아 마을 여관**에 있었다(니코시아 1차). 그때 노래가 지겨워 더는 부르고 싶지 않다고 했다. 사인을 순순히 해 줄지는 모른다.\n- 니코시아는 꽤 멀다. 지도에서 갈 수 있는지 먼저 본다.\n- **다른 길**: 파로 마을 다른 집에 **샤론의 사인을 가진 사람**이 있다. **'아스모데우스의 파편'**을 갖다주면 사인을 준다고 한다. 파편이 어디 있는지는 자료에서 찾지 못했다. 니코시아에서 사인을 못 받으면 이쪽을 노린다.\n\n### ✅ 3. 파로 마을 — 소녀에게 사인 전달 (파로 마을 2차에서 끝냄, 얼음의 반지 받음)\n- 사인을 받으면 **파로 마을 소녀**에게 갖다준다. 무엇을 주는지는 자료에서 찾지 못했다.\n\n### ✅ 4. 로우엔 — 카오스 큐브 전설 마저 듣기 (로우엔 2차에서 끝냄, 호크아이 받음)\n- 도착하자마자 시라노가 \"이렇게까지 부탁하는데 들어주자\"며 **실버잼**을 얻었다(로우엔 2차). 주점의 **지도 제작을 도와 달라는 사람**에게 '무시한다'를 고르면 받는 보상이 먼저 나온 것으로 보인다.\n- ⚠️ 그 뒤 주점에서 그 사람에게 '무시한다'를 다시 고르자 **게임이 멈췄다**(조작 불가). 자동 저장에서 다시 해도 똑같이 멈췄다(재현됨). 실버잼은 이미 받아져 있다. 보상이 먼저 나와 이벤트가 꼬인 버그로 보인다. **이 사람에게는 '무시한다'를 고르지 않는다.** 실버잼은 이미 받았으니 더 할 일은 없다.\n- 리브레빌에서 듣다 만 **아웬과 엘 이야기**의 뒷부분을 듣는다. 로우엔의 누구에게서 듣는지는 자료에서 찾지 못했다. 마을 사람들에게 두루 말을 건다. (→ 떡밥 \"리브레빌 1차 — 카오스 큐브의 전설\" 참고)\n- 다이아몬드잼을 아직 안 팔았다면 여기서 판다(액세서리점 26,000).\n\n- 포로 구출 임무가 끝나면 한동안 제국령을 마음대로 못 다니니, 이 셋은 **보르도에 들어가기 전에** 끝낸다.\n- 로우엔에서 다이아몬드잼을 아직 안 팔았다면 잊지 말고 판다.\n\n---\n\n원래 순서: ~~멤피스 포로 구출~~ ✅ → ~~로우엔 동굴에서 유성검~~ ✅ → ~~마검숲에서 멸살지옥검~~ ✅ → ~~보르도 포로 구출~~ ✅ (보르도 1차)\n\n### ✅ 1. 마검숲 — 멸살지옥검 (마검숲 2차에서 얻음. 숲 끝에서 커티스 요원들을 물리침)\n- 암흑 속성이라 암흑 몬스터에겐 잘 안 듣는다. 시라노는 엑스칼리버가 낫고, 실버나 샤른호스트에게 줄지 견줘 본다(유성검, 스타더스트가 더 나을 수 있다).\n- 비석이 있는 곳에는 검이 없다. 자료로는 멸살지옥검이 **숲 끝(가장 안쪽)**에 꽂혀 있다고 한다. 비석에서 멈추지 말고 더 들어간다.\n- 로우엔에서 나와 **보르도로 가는 길**에 있다. 길가 표지판에서 갈라지는 길로 들어간다(원작 기준).\n- 숲은 복잡하지 않지만 **지키는 적이 세다.** 레벨이 낮으면 로우엔 동굴 갈림길(인어 1 + 파란 슬라임 3 파티, 경험치 4,390)에서 올리고 간다. 인어의 얼음 마법을 조심한다.\n- 포로 구출 임무가 끝나면 한동안 못 오니 **보르도에 들어가기 전에** 얻는다.\n\n### 2. 로우엔에서 할 일\n- **다이아몬드잼 팔기**: 액세서리점에서 26,000에 사 준다. 보르도 개구리 상점에서 클레이모어 살 돈이 된다.\n- 🔸 **약국 안쪽 상자**: 안에 상자가 보이는데, 들어가려 하면 NPC가 막는다. 여는 방법은 자료에서 찾지 못했다. 마을 사람 말에 실마리가 있는지 보고, 나중에 로우엔에 다시 오면 또 시도해 본다.\n- ✅ **투기장 평생 이용권**을 얻었다.\n- 🔸 **투기장 평생 이용권 써 보기**: 로우엔에 투기장이 있다면(네메아의 사자 주인의 형이 한다던 곳) 찾아가 본다. 카라카스 투기장에서도 써 볼 수 있다. 레벨 올리기에 좋을 수 있다.\n- **카오스 큐브 전설 뒷부분 듣기**: 리브레빌에서 듣다 만 아웬과 엘 이야기가 로우엔에서 이어진다. 마을 사람들에게 두루 말을 건다. (→ 떡밥 \"리브레빌 1차 — 카오스 큐브의 전설\" 참고)\n\n### 다이아몬드잼 참고\n- ✅ 유성검 던전에서 다이아몬드잼을 샀다.\n- 유성검 던전 **오른쪽 아래 끝 NPC**가 **다이아몬드잼을 20,000**에 판다. 로우엔 액세서리점에서 26,000에 사 주니 사서 되팔면 남는다. 보르도에서 클레이모어를 살 돈을 여기서 만든다.\n  - 가진 돈을 거의 다 다이아몬드잼으로 바꿔 두는 게 좋다. 자료에선 50만 엘드쯤 들고 가길 권한다.\n  - 가장 비싸게 사 주는 곳은 리브레빌(30,000)이지만 너무 돌아간다. 바로 북쪽 로우엔에서 팔고 보르도로 올라가는 게 편하다.\n\n### ✅ 3. 보르도 — 포로 구출, 개구리 상점 (보르도 1차에서 끝냄)\n- ✅ 개구리 상점을 열고 공짜 무기 셋을 받았다. 영주를 무찌르고 마지막 포로까지 구했다. (→ 아래 할 일 \"보르도 주점의 개구리 상점\" 참고)\n\n- 출처: [디시 — 중반 이후 돈복사 루트](https://m.dcinside.com/board/warofgenesis/138514), [Daum 팁 — 멸살지옥검 얻는 방법](https://m.tip.daum.net/question/184133), 나무위키\n\n---\n\n## ✅ 포로 구출 임무 동안 꼭 챙길 것 (보르도 1차에서 임무를 마침 — 다 챙겼다)\n\n- 지금(포로 구출 임무 중)이 **구 제국령을 가장 자유롭게 돌아다닐 수 있는 때**다. 이 임무가 끝나면 한동안 제국령을 마음대로 못 다닌다.\n- 그래서 아래 것들을 **이 임무가 끝나기 전에** 다 얻어 둔다. (출처: [디시 — 중반 이후 돈복사 루트](https://m.dcinside.com/board/warofgenesis/138514), 나무위키)\n\n| 얻을 것 | 어디서 | 메모 |\n|---|---|---|\n| ~~피닉스의 알~~ ✅ (소환수 피닉스, 화염 마법) | 프리토리아 산 피닉스의 동굴 | 포로 구출 임무 중에 얻음 |\n| ~~크림슨 헬카이트~~ ✅ (용의 문장, 소환수) | 게이시르 숲 화룡굴 | 이미 얻음 |\n| ~~썬더메어~~ ✅ (전격 소환수) | 리브레빌 투기장 안쪽 던전 | 리브레빌 2차에 얻음 |\n| ~~유성의 검~~ ✅ | 로우엔 동굴(유성검 던전) | 멤피스에서 로우엔 가는 길에 얻음 |\n| ~~멸살지옥검~~ ✅ | 마검숲 (로우엔~보르도 사이) | 마검숲 2차에 얻음 |\n| ~~롱기누스의 창~~ ✅ | 제피르 팰컨 기지 비밀 던전 | 기지 4차(포로 구출 출발 전)에 얻음 |\n\n### 🔸 라몬 저택 지하의 잠긴 문 세 개 — 열지 말 것\n- 프리토리아 라몬 저택 지하에 잠긴 문이 세 개 있는데, **만능 열쇠로 열어도 아무것도 없다.** 원래부터 장식이다. 열쇠를 아낀다. ([디시](https://m.dcinside.com/board/warofgenesis/138296))\n\n---\n\n## 포로 구출 진행 상황\n- ✅ **프리토리아** — 새 영주를 물리치고 포로를 구함\n- ✅ **멤피스** — 투르족 군대를 고용한 영주를 무찌르고 포로를 구함 (멤피스 1차)\n- ✅ **보르도** — 투르족 용병을 고용한 영주를 무찌르고 마지막 포로를 구함 (보르도 1차)\n- **세 곳 포로를 다 구했다.**\n\n---\n\n## 할 일\n\n### ✅ 로우엔 산 탈출 (프레데릭의 대포 부대 함정 — 빠져나옴)\n- 카나는 들를 곳이 있다며 따로 움직였다. 나중에 다시 만나기로 했다.\n\n### ✅ 보르도 주점의 개구리 상점 (보르도 1차에서 끝냄, 사리사다·자동소총·암흑검 받음)\n- 보르도 **주점에 앉은 녹색 개구리**에게 **열 번** 말을 걸면 상점을 열어 준다. 중간에 대사가 같아도 멈추지 말고 계속 건다.\n- **클레이모어를 26,000**에 판다. 가장 싸다. 카라카스 검 연구회에 **52,000**에 되팔 수 있어 두 배 장사다.\n- 상점을 **5번, 10번, 15번** 열 때마다 공짜 무기를 준다. 리마스터에선 **사리사다(창), 자동소총, 암흑검**을 받았다(원작 자료엔 창이 \"파랑스\"로 나온다). 그 뒤로는 상점만 열린다.\n- 상점 이름은 **\"비밀의 개구리 상점\"**이다. 이제 보르도에 오면 언제든 클레이모어를 살 수 있다.\n- 돈은 다이아몬드잼을 판 돈으로 산다. 가진 돈을 거의 다 클레이모어로 바꿔 두고, 나중에 카라카스 검 연구회에서 판다.\n- 돈 불리기 루트: 유성검 던전 오른쪽 아래 끝 NPC에게 **다이아몬드잼을 20,000**에 산다 → 로우엔 액세서리점에 26,000에 판다 → 보르도 개구리에게 클레이모어를 산다 → 카라카스 검 연구회에 판다.\n- 출처: [디시 — 중반 이후 돈복사 루트](https://m.dcinside.com/board/warofgenesis/138514), 나무위키\n\n### ✅ 파로 마을 — 웨어링 집안 사건 조사 (파로 마을 1차에서 해결, 블러디 스톤 받음)\n- 약국에서 \"댄 웨어링 씨가 좋아할 만한 물건\"을 물어 **가시독말풀** 단서를 얻었다. (\"극약을 팔았냐\"고 대놓고 물으면 혼만 난다.)\n- 웨어링 집에서 진실을 밝히고, 브리앙에게서 가보 **블러디 스톤**(흡혈 능력)을 받았다.\n\n### ✅ 리브레빌 투기장 열고 썬더메어 얻기 — 리브레빌 2차(포로 구출 임무 중)에 얻음\n- 주점 → 무기 상점 → 투기장 주인 집에서 열쇠 → 투기장 안 미로 동굴. 한 번만 들어갈 수 있는 곳이었다.\n- 던전 여덟 번째 구역 보물상자 근처 좀비 4마리(경험치 4,050)는 레벨 올리기 좋았던 자리다. 이제는 다시 못 들어간다.\n\n### 🔸 다이아몬드잼 팔기\n- 지금 갈 수 있는 상점에서는 팔지 말고, 비싸게 사 주는 곳까지 들고 간다.\n\n| 파는 곳 | 값 (개당) |\n|---|---|\n| **리브레빌** | **30,000** — 가장 비싸다 |\n| 로우엔 액세서리점 | 26,000 |\n\n- 둘 다 리마스터에서 확인된 값이다. (출처: [디시 창세기전 갤러리 — 중반 이후 돈복사 루트](https://m.dcinside.com/board/warofgenesis/138514))\n- 리브레빌과 로우엔 중 먼저 들르는 곳에서 팔면 된다. 리브레빌이 4,000엘드 더 쳐 주니 금방 갈 수 있으면 리브레빌로 간다.\n- **유성검 던전** 오른쪽 아래 끝 NPC가 다이아몬드잼을 **20,000**에 판다. 사서 되팔면 남는다. (→ 할 일 \"보르도 주점의 개구리 상점\" 돈 불리기 루트 참고)\n- 게이시르 시티 병사 퀘스트(10바퀴 돌기)로 다이아몬드잼을 더 얻을 수 있다. (→ `상점_정리.md` \"게이시르 시티\" 참고)\n\n### 🔸 돈 모아서 해적키드 상점에서 클레이모어 사기\n- **해적키드의 비밀상점**: 제피르 팰컨 기지를 나와 작전 방향 반대쪽(왼쪽) 동굴. 첫 갈림길에서 오른쪽, 다음 갈림길에서 왼쪽 끝. (→ 지도첩 \"해적키드의 동굴 가는 길\" 참고)\n- 클레이모어 값은 4만 엘드가 안 된다(원작 기준). 다른 데서는 돈으로 살 수 있는 검 중 가장 비싼 검이다.\n- **보르도 개구리 상점이 26,000으로 더 싸다.** 보르도에 갈 거라면 거기서 사는 게 낫다. (→ 할 일 \"보르도 주점의 개구리 상점\" 참고)\n- 상점은 **딱 3번만** 열 수 있다. 돈을 넉넉히 모은 뒤에 가야 한 번에 많이 산다.\n- 돈 모으는 법 (→ `상점_정리.md` \"지금 할 만한 돈벌이\" 참고)\n  - 카라카스 무기점 총 상인에게 라이플(1,350)을 사서 검 연구회에 1,500에 판다. 밑천이 생기면 자동소총으로 갈아탄다.\n  - 제피르 팰컨 기지 병사에게 기관소총을 사서 카라카스 검 연구회에 판다.\n- 쓰고 남는 클레이모어는 카라카스 검 연구회에 **52,000**에 팔 수 있다. 여러 자루 사 두면 그 자체로 돈벌이가 된다.\n- 간 김에 미스릴탄, 불의 문장(에스메랄다용), 완전 회복약도 같이 사 둔다.\n\n### ✅ 제피르 팰컨 기지 비밀 던전에서 롱기누스의 창 얻기 — 기지 4차(포로 구출 출발 전)에 얻음\n- **창 계열 최강 무기.** 제피르 팰컨에 들어간 뒤로는 언제든 갈 수 있다.\n- 가는 길: 작전회의실(클라우제비츠 있는 방)에서 **오른쪽** → 술집을 지나 더 오른쪽으로 가면 비밀 던전 입구. 던전을 따라 **북동쪽 끝**에 창이 있다. (기지에서 들은 \"벽 뒤로 빨려 들어간 사람\" 소문이 이 던전 얘기로 보인다.)\n- 잠긴 보물상자가 많으니 **만능 열쇠를 여러 개** 챙겨 간다.\n- 몬스터가 아주 세다. 적갈색 '발 없는 기사'는 한 대에 천몇백씩 깎는다. 레벨이 낮으면 부스트를 켜거나 레벨을 올린 뒤 간다. 잡을 수만 있으면 한 파티에 경험치 800이라 레벨 올리기엔 최고다.\n- 출처: [tali.kr — 제피르팰컨 비밀던전 롱기누스의 창](https://tali.kr/2548), [디시 — 9장 섭퀘+비밀던전 가는 길](https://m.dcinside.com/board/warofgenesis/137888)\n\n### 🔸 기지에 올 때마다 보르스 옆 서랍 누르기 (서브 퀘스트 \"비밀의 서랍\")\n- 제피르 팰컨 작전회의실의 **보르스 옆 서랍**을 누르면 보르스가 손대지 말라고 한다.\n- 이야기가 진행되면서 **기지에 들를 때마다 한 번씩 꼭 눌러 둔다.** 한 번이라도 빠뜨리면 마지막 이벤트가 안 열릴 수 있다. (리마스터 확인: [디시 — 보르스 서랍 열기](https://m.dcinside.com/board/warofgenesis/139202))\n- 서랍을 실제로 열 수 있는 건 **한참 뒤**, 보르스가 자리에 없을 때다. 그때 열지 말지 고를 수 있다.\n- 누른 시점 기록\n  - 제피르 팰컨 기지 3차 (니코시아 정탐 직후) — ❓ 누르셨으면 알려 주세요\n  - 제피르 팰컨 기지 4차 (안타나나리보 구출 직후) — ❓ 이번에도 눌러 주세요\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
