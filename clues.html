<script id="md" type="application/json">"# 서풍의 광시곡 — NPC 대화 떡밥 정리\n\n> **현재 진행 시점**: 리브레빌 — 에스테의 저택 (4차 — 작전 회의 뒤, 크리스의 피아노)\n>\n> 표시: 🔸 아직 안 풀림 · ✅ 풀림 · `[외부 설정]` 이 게임 밖(전작/후속작/설정집)에서 온 정보\n\n---\n\n## 인물\n\n### 에스메랄다\n- 사막에서 쓰러진 시라노를 구해 사이럽스 여관으로 데려온 **젊은 여의사**(23세).\n- **프리토리아** 출신. 무료 진료소를 운영하며 가난한 사람들을 공짜로 치료해 줘서 \"**프리토리아의 성녀**\"라고 불린다.\n- 🔸 여기서 한 번 보고 끝나는 인물이 아니다. → 카라카스 근처 숲에서 다친 아이들을 데리고 그를 찾아가게 됐다.\n\n### 루스 그랜드 (루스 그랜트)\n- 사이럽스 시장 후보. 이번이 **네 번째 도전**.\n- 전대 시장의 비서 출신. 주점에 머물면서 평민, 선원들과 허물없이 어울리는 개혁파.\n- **여성층과 서민층**이 강하게 지지한다. 공약은 치안 정상화와 제국의 부흥.\n- 시라노가 다카마에 가려는 이유를 사실대로 말하자, 금지된 항로를 쓸 수 있게 해 주고 여비까지 대 줬다.\n  - 🔸 **어떤 힘으로 출항 금지를 뚫었나**: 게임에서 따로 설명하지 않는 듯하고, 자료에서도 못 찾았다. 루스가 선원들과 가깝고, 시장과 사이가 나쁜 다카마 행 선장도 루스 쪽 사람일 가능성이 크다(추측).\n  - 🔸 헤어질 때 \"폭풍도 갔다 와서 술 한잔 사라\"고 했다. 다시 만나게 될지 지켜볼 것.\n  - 🔸 **왜 처음 보는 시라노를 이렇게까지 돕나**: 루스는 \"제국의 부흥\"을 내건 사람이고, 시라노는 제국 7용사 번스타인 가문 사람이다. 그 점이 마음을 움직였을 수 있다(추측).\n\n### 샤를르\n- 사이럽스 현 시장. 사막을 오가던 **대상(거상) 출신**이라 돈이 아주 많다.\n- 대중 앞에 거의 안 나오고 그라나다 상단 근처 관저에 틀어박혀 있다.\n\n### 이올린 팬드래건\n- 폭풍도 해변에 쓰러진 시라노를 구해 준 노부인(73세). 라시드 대왕의 누나이자 팬드래건의 전 국왕. 창세기전 2의 \"복수의 여신\".\n- 흑태자가 죽은 뒤 폭풍도에 남아, 아수라를 뽑겠다고 찾아오는 사람들을 말려 왔다.\n- 시라노가 아수라를 찾는다고 해도 그 목적 자체를 탓하지는 않는다. 그저 \"위험하다\"며 위치를 알려주지 않을 뿐이다.\n  - 50년 동안 아수라를 노리고 온 사람을 수없이 봐 와서, 이유를 캐묻기보다 목숨을 걱정하는 쪽인 듯하다.\n  - 아수라는 손만 대도 **영혼을 빨아들이는 마검**이 돼 있어서, 뽑으려던 사람들이 다 죽었다. 이올린이 막는 건 칼을 지키려는 게 아니라 사람을 살리려는 것에 가깝다.\n- 집 벽에 **흑태자의 그림**과 **폭풍도 산봉우리 풍경화**를 걸어 두었다. 시라노는 이 그림들로 아수라의 위치를 짐작한다.\n- 흑태자의 그림을 걸어 둔 것도 눈에 띈다. 조국을 무너뜨린 원수의 그림을 왜 걸어 두었을까.\n  - `[외부 설정]` 창세기전 2에서 이올린은 함께 싸운 지휘관 **G.S**를 사랑했는데, G.S가 바로 흑태자였다. 창세전쟁이 끝난 뒤 흑태자는 자기 안의 힘이 폭주해 세상을 망칠 괴물이 되기 전에 끝내 달라고 이올린에게 부탁했고, 이올린은 **폭풍도 정상**에서 그 부탁을 들어줬다. 원수이자 연인이었던 셈.\n- 🔸 왜 혼자 폭풍도에 남아 아수라 곁을 지키고 있나. (위 사연과 이어지는 듯)\n\n### 실버\n- 머매니안해의 **해적 두목**(26세). 자료에 따르면 오래된 해적단 **블루시드**의 후계자다. 해적이지만 세상 물정에 밝고 여러 지역의 지리와 말에 능하다.\n- 폭풍도에서 돌아오던 연락선을 덮쳤다가 시라노와의 결투에서 졌다. \"이기면 평생 종 노릇\"이라는 약속을 그대로 지켜, 부하들과도 헤어지고 **시라노의 첫 동료**가 됐다. 배짱 좋고 한 말은 지키는 사람.\n- 자세한 만남 과정 → \"폭풍도를 떠나는 바닷길\" 항목 참고.\n\n---\n\n## 인페르노 탈출 ~ 사막 (사이럽스 이전)\n\n> Gemini 대화에서 옮겨 온 내용. 어느 장소에서 들은 대사인지는 기록이 없다.\n\n### 인페르노\n- 단순한 감옥이 아니라 죄수들에게 **유황을 캐게 하려고** 유황 동굴을 감옥으로 만든 곳이다. 유황은 화약의 원료라 총포가 퍼진 이 시대엔 귀한 자원. 사형 대신 위험한 광산에서 일을 시키던 실제 역사 속 형벌 노역장과 같은 구조다.\n\n### 루벤\n- NPC들이 **루벤**이라는 사람을 안 좋게 말한다.\n  - ✅ 시라노를 둘러싼 음모와 관련이 있나 → 있다. 재판에서 시라노에게 불리한 증언을 한 사람이다. (→ 카라카스 1차 \"카라카스 영주 루벤\" 참고)\n- 🔸 시라노를 둘러싼 음모와 관련이 있을지도.\n\n### 번스타인 가문 지하의 메두사\n- NPC 얘기로는 **번스타인 가문 저택 지하에 메두사**가 있다고 한다.\n- 메인 줄거리를 크게 끌고 가는 존재는 아니고, 번스타인 가문의 과거와 얽힌 숨은 이야기나 탐험 요소에 가깝다.\n- 🔸 왜 번스타인 저택 지하에 메두사가 있을까.\n\n---\n\n## 사이럽스 (1차 — 사막 구조 직후)\n\n### 어떤 도시인가\n- 대륙 동부와 서부 사이, 트리시스 사막 아래에 있는 **자유무역 도시**. 동서 중계 무역으로 번성했다.\n- 빈부 차이가 극단적이다. 매일 밤 파티를 여는 상류층 옆에 빈민가가 붙어 있다.\n- 시장은 시민 선거로 뽑고 연임할 수 있다.\n\n### 사람들이 시장을 싫어하는 이유\n- **치안이 엉망이다.** 사막엔 도적, 바다엔 해적이 들끓는다. 사람들은 해적이 늘어난 게 **투르 제국** 탓이라고 본다. 시라노가 사막에서 습격당한 것도 이 도적 떼 때문이다.\n  - 🔸 해적이 투르와 직접 손잡은 건지, 전쟁 통에 늘어난 건지는 아직 모른다.\n- **교회가 돈을 더 걷는다.** 시장이 주신교 세력이 커지는 걸 눈감아 주고 성금까지 더 걷게 둬서 상인들이 힘들어졌다.\n- **뱃길이 막혔다.** 시장은 **해적 때문**이라며 상류층 편을 들어 항로를 막고 출항 허가권을 혼자 쥐고 있다. **다카마 행 선장을 싫어해서 다카마 행 배에 출항 금지를 걸었다.**\n  - 🔸 사람들은 해적은 핑계일 뿐 **다른 속셈**이 있다고 의심한다. 출항 허가권을 혼자 쥐면 물자 흐름을 마음대로 주무를 수 있다는 점과 관련이 있어 보인다(추측).\n  - 🔸 시라노는 폭풍도에 가려면 다카마 행 배를 타야 해서 이 문제에 바로 걸린다. 지도로 보면 폭풍도는 다카마보다 사이럽스가 더 가깝지만, 폭풍도로 가는 연락선은 팬드래건의 다카마 항에서 뜨기 때문에 일부러 돌아가야 한다.\n\n### 제국 시절을 그리워하는 분위기\n- 창세전쟁 때 사이럽스는 흑태자의 제국 세력 아래 있었다. 제국이 무너진 뒤 동서 관계가 좋아지자 둘 사이를 이어주던 무역이 필요 없어져 도시가 기울었다. 최대 상단인 그라나다 상단도 망할 뻔했다.\n- 여기에 치안과 교회 문제까지 겹치니 \"차라리 제국 시절이 나았다\"는 마음이 깔려 있다. 루스가 공약에 \"제국의 부흥\"을 넣은 것도 이 분위기와 맞닿아 있다.\n- 🔸 오프닝에서 체사레가 내건 \"흑태자의 영광 재현\"과도 이어지는 것 같다(추측).\n\n### 소문 — 이상한 장소들\n- 🔸 **화룡산의 용**: 천 년에 한 번 깨어난다는 소문. 말한 사람도 지어낸 말이라고 했다. 나무위키에서 화룡산은 못 찾았고, 비슷한 이름으로 후반 숨은 던전 **게이시르 숲 '화룡굴'**이 있다. → 화룡굴에서 **용의 문장**(소환수 크림슨 헬카이트)을 얻었다. 소문 속 용이 이것으로 보인다(추측).\n- 🔸 **프리토리아 근처 산의 이상한 기운**: 인페르노와 프리토리아 근처 산에서 이상한 기운이 흘러나온다고 한다.\n  - 데이모스는 아닐 가능성이 크다. 데이모스는 인페르노 안에 봉인돼 있었고, 마지막 힘(암흑혈)은 이미 시라노에게 넘어갔다.\n  - 게임 중반 이후 들를 수 있는 숨은 장소 **프리토리아 산**이 있는데, 이 소문과 이어지는 듯하다.\n  - ✅ 그 기운의 정체 → 프리토리아 산 **피닉스의 동굴**에 잠든 **피닉스의 알**이었던 것으로 보인다. (프리토리아 산에서 풀림 → 그 항목 참고)\n- 두 소문 모두 본 줄거리보다는 나중에 찾아가는 **숨은 던전 힌트**일 가능성이 크다.\n- 프리토리아 근방에 **전설의 창**이 있다는 소문도 나중에 들었다. (→ 카라카스 근처 숲 \"소문 — 프리토리아 근방의 전설의 창\" 참고)\n\n### `[외부 설정]` 루스와 샤를르의 악연 (창세기전 4)\n- 1229년, 도적단 간부 **베라**가 샤를르와 사이럽스 부자들을 몰살하려다 붙잡혔다. 베라는 샤를르 등 부유층의 정치 싸움에 밀려 망한 집안의 딸이었고, 광장에서 샤를르를 \"부모님의 원수\"라고 외치자 샤를르가 그 자리에서 총으로 쏴 죽였다.\n- 당시 시장 비서였던 루스는 베라의 오랜 친구였다. 이 일로 샤를르의 본성을 보고 맞서게 됐다.\n\n---\n\n## 팬드래건 왕국 소식 (사이럽스 1차 — 사막 구조 직후)\n\n- 팬드래건 국왕 **성왕 라시드**는 왕성을 비운 지 오래다. **50년 전쟁** 때문에 실버 애로우를 이끌고 동쪽 아스타니아 전선에 나가 있다.\n  - NPC가 말한 \"왕위 계승자 라시드 3세\"는 라시드 대왕 본인이 아니라 **손자**를 가리킨다 ✅ (다카마 항에서 풀림 → 아래 \"라시드 3세\" 항목)\n- 라시드가 동쪽에 묶인 사이 서쪽 구 제국령은 **체사레의 주신교 세력**이 차지했다. 사이럽스에서 교회가 커지는 것도 같은 흐름이다.\n- 첫 왕비는 **로빈**. 1217년 귀족들의 반대를 무릅쓰고 결혼해 우드스톡, 헨리, 캘리 왕녀를 낳았고, 1228년 캘리를 낳다가 세상을 떠났다. 3년 뒤 라시드는 귀족들 등쌀에 밀려 **올리비아**와 재혼했다.\n- `[외부 설정]` 장남 우드스톡은 1239년 투르에 사절로 갔다가 붙잡혀 생사를 모르고, 차남 헨리가 태자가 됐다. 로빈의 자식들과 올리비아의 자식들 사이에 후계 갈등의 불씨가 있다. 주로 후속작에서 다뤄진다.\n- 🔸 왕이 오래 비운 팬드래건 본국이 앞으로 어떻게 얽힐지.\n\n---\n\n## 다카마 항 (1차 — 폭풍도 가는 길)\n\n### 장사가 안 되는 항구\n- 다카마 항은 팬드래건 왕국의 항구이자 머매니안해 무역의 중심으로, 안타리아 최고의 항구로 꼽힌다. 아미고 상단이 이곳을 발판으로 컸다.\n- 그런데 지금은 **투르족 때문에 장사를 못 한다**는 불만이 나온다. 사람들은 이걸 왕국의 **정책 실패**로 본다.\n  - 투르와의 50년 전쟁으로 바닷길이 위험해졌고, 해적까지 늘었다. 사이럽스에서 들은 \"해적은 투르 탓\"이라는 말과 같은 흐름.\n  - 🔸 어떤 정책이 실패라는 건지는 아직 모른다. 배경 설정으로 보면, 1209년경 라르고 무어와 페넬로가 투르까지 가는 안전한 항로를 열었고 이것이 50년 전쟁의 불씨가 됐다. 이 항로를 연 것, 또는 전쟁 대응을 두고 하는 말일 수 있다(추측).\n\n### 출입 통제\n- 다카마 항에는 **자유무역지대**가 있고, 그 안쪽 팬드래건 본토로는 **허가증이 없으면 못 들어간다.**\n- 시라노는 탈옥수 신분이라 허가증을 받을 길이 없다. 이번에는 항구에서 폭풍도 배만 타고 떠나야 하는 처지.\n- 🔸 전쟁 중이라 외부인 출입을 막는 것으로 보인다(추측). 팬드래건 본토에 들어갈 날이 올지.\n\n### 라시드 3세 — 검은 머리의 왕손\n- 라시드 대왕의 **손자**. 복잡한 문제에 얽매여 있고, 머리가 **검다**고 한다. 사이럽스에서 \"왕성을 비운 지 오래\"라고 들은 그 인물. (← 팬드래건 왕국 소식 참고)\n- `[외부 설정]` 검은 머리와 복잡한 문제는 서로 이어진 이야기다.\n  - 라시드의 장남 우드스톡은 투르에 사절로 갔다가 붙잡혀 실종됐는데, 사실은 **한 제국**으로 건너가 그곳 여인과 결혼해 아들을 낳았다. 이 아들이 동방 어머니를 닮아 **검은 머리**다.\n  - 실종 15년쯤 뒤 우드스톡 부자가 팬드래건으로 돌아왔지만, 그사이 차남 헨리가 이미 태자가 돼 있었다.\n  - 헨리 쪽(콘월가)은 태자 자리를 뺏길까 봐, 새 왕비 쪽(버몬트가)도 견제하느라 이 부자를 몰아붙였다. \"왕실에 동방 이민족의 피를 섞었다\"는 비난도 받았다. 우드스톡은 결국 병으로 먼저 세상을 떴고, 라시드만 장손을 감싸고 있다.\n  - 즉 검은 머리는 **이민족 혼혈**이라는 표시이고, 그게 후계 다툼에서 약점으로 쓰이는 것이 \"복잡한 문제\"다.\n\n### 라시드 대왕은 왜 매년 폭풍도로 연락선을 보내나\n- NPC가 던진 질문. 폭풍도 행 연락선은 이 때문에 다카마 항에서 뜬다.\n- ✅ (폭풍도에서 직접 만나 풀림) 폭풍도에 라시드의 누나 **이올린 팬드래건**이 산다. 창세기전 2의 \"복수의 여신\"으로, 팬드래건의 전 국왕(왕위를 동생 라시드에게 넘김)이다. 흑태자가 죽은 뒤 폭풍도에 남아, 흑태자의 마검 아수라를 뽑겠다고 찾아오는 사람들을 막아 왔다. 지금 73세. 라시드는 그런 누나를 챙기려고 해마다 배를 보낸다.\n\n---\n\n## 폭풍도 가는 바닷길\n\n- 머매니안해에 **크라켄**이 나타났다. 창세기전 2 시절에도 이 바다에 \"바다의 제왕\" 폴라 크라켄이 나타난 적이 있다.\n- 🔸 이번 크라켄이 그때 그 녀석과 관계가 있는지는 모른다.\n- 연락선은 회오리바람과 크라켄 때문에 침몰했다.\n\n---\n\n## 폭풍도 (1차)\n\n### 작은할아버지 빈센트 번스타인\n- 시라노의 작은할아버지 **빈센트 번스타인**은 과거 이올린 등과 함께 싸웠다. (시라노 아버지 루크의 삼촌)\n- `[외부 설정]` 창세기전 2에서의 행적\n  - 흑태자를 따르던 **제국 7용사** 중 한 명. 재상 베라딘과 사이가 틀어져 변방 커티스 총독으로 밀려나 있었다.\n  - 그 무렵 다갈로 가던 이올린 일행을 보고도 쫓는 척만 하고 놓아 줬다.\n  - 베라딘이 그를 암살하라고 명령했지만 동료 7용사들이 죽은 척 빼돌려 줬고, 이후 **실버 애로우 쪽으로 넘어가** G.S(흑태자)의 용병대에서 함께 싸웠다.\n  - 흑태자가 제국으로 돌아온 뒤 그의 편지를 받고 제국으로 돌아갔다. 제국군이라면 이를 갈던 이올린도 이때만은 그동안 도와줘서 고맙다며 좋게 보내 줬다.\n- ✅ 이올린이 번스타인 가문 사람인 시라노를 어떻게 대할지 → **번스타인 공에게 진 빚을 갚겠다며 검술을 가르쳐 주기로 했다.** 자기 자신을 위해서라는 뜻도 내비쳤다(혼자 지내는 적적함을 달래려는 마음도 있는 듯).\n\n### 아수라 도전\n- 처음엔 아수라를 손에 넣으려다 **실패**했다. 이올린 말로는 **검술이 모자라서**.\n- 그래도 다른 도전자들처럼 영혼을 빼앗기지는 않았다. 데이모스에게 받은 **암흑혈** 덕분이다. 이올린도 이걸 알아챘다.\n- ✅ 검술을 익히면 아수라를 다룰 수 있을지 → 이올린에게 검술을 배운 뒤 **아수라 수호신**을 쓰러뜨리고 아수라를 손에 넣었다.\n- 🔸 데이모스는 왜 하필 시라노에게 아수라를 맡겼나. 암흑혈을 넘겨준 것도 아수라를 견딜 수 있게 하려던 것이었을까(추측).\n- 🔸 영혼을 빨아들이던 마검이 시라노 손에서는 어떻게 될지.\n\n### 이올린을 오래전에 만난 것 같다\n- 아수라를 얻은 뒤 시라노가 이올린에게 **오래전에 만난 적이 있는 것 같다**고 말한다. 둘은 이번에 처음 만났다.\n- 🔸 왜 그런 느낌이 들었는지 게임에서 아직 설명하지 않았다. 흑태자와 이어진 길이 두 가지 있어서 둘 다 후보다(추측).\n  - **아수라를 통해**: 아수라는 흑태자가 죽은 자리에 꽂혀 50년을 버텼고, 손댄 사람의 영혼을 빨아들여 품는 칼이다. 이번에도 수호신을 내보내 시라노를 시험할 만큼 스스로 뜻이 있는 것처럼 움직였다. 이 칼에 흑태자의 무언가가 남아 있다면, 칼의 주인이 되면서 그 느낌이 시라노에게 넘어왔을 수 있다. 칼을 얻은 **직후에** 이 말을 했다는 점이 이쪽에 무게를 싣는다.\n  - **데이모스를 통해**: `[외부 설정]` 흑태자도 데이모스에게 암흑혈의 힘을 받은 사람이다. 시라노와 흑태자는 같은 피를 나눠 받은 셈이라, 그 피가 흑태자의 기억을 실어 왔을 수도 있다.\n- `[외부 설정]` 이올린에게 흑태자는 원수이자 연인이었고, 폭풍도 정상에서 자기 손으로 그를 보냈다(→ 위 \"이올린 팬드래건\" 항목 참고). 시라노의 이 말이 이올린에게는 꽤 무겁게 들렸을 것이다.\n\n### 마장기 아스모데우스\n- 시라노의 추리: **아스모데우스가 잠든 곳에 아수라가 있다.**\n- 아스모데우스는 창세기전 시리즈 **최강의 마장기**. 신화 시대에 12주신이 파괴신들을 막으려고 만들었지만, 너무 강해서 신 스무 명이 힘을 모아야 겨우 움직일 정도였다.\n- `[외부 설정]` 창세기전 2에서 **흑태자**가 혼자 이걸 움직여 창세전쟁 마지막 싸움에 나섰다. 흑태자가 죽은 뒤 폭풍도 정상에 잠들어 있다.\n- 🔸 이올린이 지키는 건 아수라만이 아닐지도. 아스모데우스가 앞으로 다시 움직일 일이 있을까.\n\n---\n\n## 폭풍도를 떠나는 바닷길 (팬드래건 연락선)\n\n### 해적의 습격\n- 머매니안해에서 연락선이 **해적**에게 습격당했다. 사이럽스에서 \"바다에 해적이 들끓는다\"고 들은 게 그대로 눈앞에 벌어진 셈이다. (→ 사이럽스 1차 \"치안이 엉망이다\", 다카마 항 1차 \"장사가 안 되는 항구\" 참고)\n- 올 때는 크라켄, 갈 때는 해적. 이 바다가 얼마나 험해졌는지 보여 준다.\n- 🔸 사이럽스 사람들 말처럼 해적이 투르 제국과 손잡은 건지는 아직 모른다.\n\n### 해적 두목 실버와의 결투\n- 해적을 뚫고 갑판에 오른 시라노가 사이럽스까지 데려다 달라고 하자, 실버는 배짱이 마음에 든다며 결투를 걸었다. 조건은 \"이기면 사이럽스는 물론 평생 종 노릇\".\n- ✅ 결투의 결과, 실버가 약속을 지킬지 → 시라노가 이겼고, 실버는 약속대로 사이럽스까지 데려다 주고 시라노를 따르기로 했다. (실버 소개는 위 \"인물 → 실버\" 참고)\n- `[외부 설정]` 블루시드는 창세기전 2 시절 라시드가 천공의 아성을 찾아다닐 때 **크라켄까지 부리며** 이름을 떨친 해적단이다. (→ \"폭풍도 가는 바닷길\" 크라켄 항목 참고)\n  - 🔸 올 때 배를 가라앉힌 크라켄과 이 해적들이 관계가 있을지(추측).\n- ✅ 시라노는 왜 다카마가 아니라 **사이럽스**로 가려 했나 → 사이럽스에서 트리시스 사막을 건너 **게이시르**로 가려던 것. 사이럽스는 사막 바로 아래에 있어 게이시르로 가는 길목이다. (루스에게 들르는지는 아직 모른다 → 사이럽스 1차 \"루스 그랜드\" 항목 참고)\n- 실버는 사이럽스에서 **부하들과 헤어지고** 시라노를 따라나섰다.\n  - 🔸 두목이 떠난 해적단은 어떻게 될지.\n\n---\n\n## 트리시스 사막 (2차 — 게이시르로 가는 길)\n\n- 실버와 함께 사막을 건너 **게이시르**로 간다. 처음 사막을 건널 때는 도적 떼에 일행을 잃고 쓰러졌다. (→ 사이럽스 1차 \"치안이 엉망이다\" 참고)\n- 🔸 게이시르에 가서 무엇부터 할지. 고향이자 번스타인 가문이 무너진 곳이고, 체사레의 본거지다. (→ 세계관 / 큰 떡밥의 \"번스타인 가문 멸문\", \"체사레\" 참고)\n\n---\n\n## 구 게이시르 제국령 (1차 — 폭풍도에서 돌아온 직후)\n\n- 사막을 건너자 지도에 **카라카스**가 새로 나타났다. (→ 아래 \"카라카스 (1차)\" 참고)\n\n### 제피르 팰컨의 카나\n- 도착하자마자 만난 젊은 여자. **제국 병사들에게 쫓기고** 있었는데, 시라노 일행이 병사들을 물리쳐 줬다. 카나는 고맙다고만 하고 **곧바로 사라졌다.**\n- 레지스탕스 **제피르 팰컨** 소속. 자료에 따르면 제피르 팰컨에서 **가장 어린 부대장**이고, 총을 쓴다.\n- 인페르노에서 시라노를 꺼내 준 **메디치**도 제피르 팰컨이다. 입단을 거절했던 그 조직과 다시 엮이는 셈. (→ 세계관 / 큰 떡밥 \"제피르 팰컨\" 참고)\n- 🔸 왜 쫓기고 있었나. 무슨 작전 중이었는지. 쫓기는 몸이라 처음 보는 사람들과 오래 얽히지 않으려고 서둘러 떠난 듯하다(추측).\n- ✅ 이렇게 헤어졌지만 다시 만날 것 같다 → 다음 날 카라카스 화형식에 자기 부대를 이끌고 나타났다. 혼자 쫓기던 것도 이 작전과 관련이 있었을 듯하다(추측). (→ 카라카스 1차 \"카라카스 영주 루벤\" 참고)\n- 🔸 제국 병사가 레지스탕스를 쫓는다는 건, 이 지역이 체사레(주신교) 쪽 손에 있다는 뜻으로 보인다(추측).\n\n---\n\n## 카라카스 (1차 — 폭풍도에서 돌아온 직후)\n\n### 어떤 마을인가\n- 게이시르 시티 북쪽, 사방이 깊은 숲인 작은 시골 마을. 사냥꾼들이 사냥으로 먹고산다.\n- 조용해 보여도 여러 지역과 맞닿은 길목이라, 국경을 넘나드는 여행객과 행상인이 꼭 거쳐 간다. 그래서 도로 표지판이 잘 갖춰져 있다.\n- 동북쪽으로 가면 **리브레빌**이라는 도시가 나온다. 자료로는 비프로스트와 가까운데도 이상하게 따뜻한 곳이고, 교역과 개발로 커진 대도시다. 도시와 이름이 같은 아름다운 다리가 명물인데, 다리를 지을 때의 잔혹한 전설이 전해진다.\n  - 🔸 다리에 얽힌 전설이 무엇인지.\n- `[외부 설정]` 아수라 프로젝트에서는 카라카스와 리브레빌이 원래 **가라드** 땅이었다고 나온다. 창세기전 2의 서부 삼국동맹(게이시르·가라드·트리시스) 중 하나다.\n\n### 투기장 '네메아의 사자'\n- 카라카스에 있는 투기장. 입장권을 사서 지하로 내려가면 싸울 수 있고 경험치를 얻는다. 다만 끝없이 싸울 수 있는 건 아니다.\n- 공략 글에 따르면 투기장 주인이 **로우엔에서 형이 하는 투기장**도 있다고 말한다.\n- 공략 메모 (사용자가 물어봐서 찾은 내용)\n  - 원작 공략집에서는 **리브레빌의 투기장**이 숨겨진 이벤트로 꼽힌다. 이 투기장 안쪽이 **썬더메어 던전**으로 이어지고, 거기서 전격 소환수 **썬더메어**를 얻는다.\n  - 이 던전은 **딱 한 번만** 들어갈 수 있다. 투기장 밖으로 나갔다가 다른 지역으로 가면 문이 다시 잠긴다. 들어가면 썬더메어를 꼭 얻고 나와야 한다.\n  - 썬더메어 던전은 레벨 올리기 좋은 곳으로도 꼽힌다. 다만 미로라 지도가 안 나온다.\n- 이름은 그리스 신화에서 따왔다. (→ 아래 \"이름의 모티브\" 참고)\n\n### 검 연구회 상점\n- 카라카스에 **게이시르 학술원 산하 검 연구회**가 운영하는 상점이 있다. 좋은 칼이 많지만 비싸다.\n- 제국 학술원은 시라노가 학자로 있던 곳이다. 학술원이 무기 연구까지 하고 있다. (→ 1. 시라노의 몰락 참고)\n- 공략 자료로는 여기서 **그람**(검)과 **플레이트 아머**를 살 수 있다. 값은 마을 일반 무기상의 두 배인데, 물건을 팔 때도 두 배로 쳐준다. 그래서 일반 무기상에서 비싼 무기를 사서 여기 팔면 돈을 모을 수 있다.\n\n### 요리사 카그의 부탁\n- 카라카스의 요리사 **카그**가 좋은 식재료를 구해다 달라고 부탁했다.\n- 원작 자료(나무위키, 공략 글)에는 이 인물이 안 나온다. 리마스터에서 서브 퀘스트에 표시가 붙는 등 곁가지가 손봐졌다고 하니, 리마스터에서 새로 들어간 서브 퀘스트로 보인다(추측).\n- 카그가 좋아할 만한 **'사랑의 향초'**를 **프리토리아에 사는 사람**이 발견했다는 말을 들었다. (원래 들은 표현은 \"사랑의 항초\". 향기 나는 풀이라는 뜻의 \"향초\"로 보인다.)\n  - 마침 프리토리아로 가는 길이라, 거기서 찾아보면 된다.\n- ✅ 누가 갖고 있는지 → 파로 마을의 **카그의 형**이었다(파로 마을 1차에서 풀림). ✅ 갖다주면 카그가 무엇을 주는지 → **실버잼**(카라카스 3차에서 풀림). → 로우엔 1차에서 사랑의 향초는 **파로 마을**에서 얻는다고 다시 들었다(로우엔 1차 \"요리사 카그의 사랑의 향초\" 참고).\n\n### 영주들 평판이 나쁘다\n- **라몬**: 프리토리아의 영주. 평소 이상한 행동으로 이름이 높다. 자료로는 여자 문제로 악명이 높고, 반발하는 영민에게 마녀재판(종교재판) 누명을 씌운다고 한다.\n  - 프리토리아는 에스메랄다가 무료 진료소를 하는 곳이다. (→ 인물 \"에스메랄다\" 참고)\n- **루벤 공작**: 라몬 못지않다고 한다. 바로 이 카라카스의 영주다. (→ 아래 \"카라카스 영주 루벤\" 참고)\n- 구 제국령은 영주마다 따로 다스리는 땅이라, 영주가 엉망이면 영민이 고스란히 당한다. (→ 0. 배경 \"제국 자치령\" 참고)\n\n### 카라카스 영주 루벤\n**누구인가**\n- **13년 전 종교 재판에서 시라노에게 불리한 증언을 한 사람**이다. 프롤로그의 \"친구와 사촌의 모함\" 중 하나가 루벤이다. 마을에서 루벤의 행차를 본 시라노가 분노했다.\n- 그 대가로 체사레에게서 멸문한 **번스타인 가문의 땅 일부**를 받아 영주가 됐다. 성도 번스타인이다(루벤 번스타인). 33세.\n- 마을에선 **잔혹하기로 유명**하다. 자료에 따르면 악마 숭배를 병적으로 두려워해서 그 핑계로 영민들을 탄압한다. 투르 제국에서 무기를 들여와 무기상도 한다.\n- 체사레 덕에 영주가 됐는데도 영지 안에 교회를 못 짓게 했고, 종교재판도 교회 대신 자기가 직접 한다고 한다. 체사레 편이면서도 교회 세력이 커지는 건 경계하는 듯하다.\n- 자료에 따르면 만일을 대비해 저택과 영지 곳곳에 비밀통로를 만들어 두고 몰래 엿보는 버릇이 있다. 겁 많고 의심 많은 사람이다.\n\n**화형식과 도주**\n- 카라카스에 온 건 **제피르 팰컨을 도와준 사람**을 태우는 화형식 때문이었다. 이 지역은 레지스탕스를 돕기만 해도 목숨이 걸린다. (→ 구 게이시르 제국령 1차 \"제피르 팰컨의 카나\" 참고)\n  - ✅ 제피르 팰컨이 자기들을 도운 사람을 그냥 두고 볼지 → 화형식 날 **카나가 이끄는 부대**가 화형을 막으러 나타났다.\n- 시라노가 경비병들과 싸우는 사이 루벤은 **도망쳤다.**\n- 저택으로 쳐들어가려던 시라노 일행에게 카나가 손을 내밀었다. 서로 돕는 조건으로 **저택으로 통하는 비밀통로**로 함께 숨어들었다. 시라노는 복수, 카나는 레지스탕스 작전. 목적은 달라도 노리는 사람은 같았다.\n  - 🔸 카나는 그 비밀통로를 어떻게 알았나. 제피르 팰컨이 미리 알아 둔 것인지.\n- 저택에서 찾아낸 루벤은 **가짜**였다. 겁 많은 루벤다운 대비다.\n  - ✅ 어디로 숨었나 → 근처 **다른 영주에게 도망간** 것으로 보인다.\n  - ✅ 누구에게 갔나 → 영주가 아니라 근처에 주둔하던 **이루스 장군**이었다. (→ \"제피르 팰컨 기지 (1차)\" 참고)\n- 일이 끝나자 시라노는 카나에게 이제 같이 다니지 말자고 하고, 따로 루벤을 쫓기로 했다.\n  - 🔸 복수는 자기 일이라 레지스탕스를 끌어들이고 싶지 않은 듯하다(추측). (→ 카라카스 2차 \"제피르 팰컨 합류\"에서 결국 함께하기로 함)\n  - ✅ 또 마주칠 것 같다 → 바로 근처 숲에서 몰래 따라오다 들켰다. (→ \"카라카스 근처 숲\" 참고)\n\n**아직 모르는 것**\n- ✅ 왜 시라노를 배신했나 → 루벤은 시라노의 **배다른 동생**이었고, 질투 때문이었다. 체사레의 압박도 있었다. (카라카스 2차에서 풀림 → 카라카스 2차 \"루벤의 고백과 죽음\" 참고)\n- ✅ \"친구와 사촌\" 중 나머지 한 사람은 누구인가 → **이스카리옷**. 루벤이 죽으면서 이름을 댔다. (카라카스 2차에서 풀림)\n\n---\n\n## 카라카스 근처 숲 (루벤을 쫓는 길)\n\n### 몰래 따라온 카나\n- 같이 다니지 말자고 했는데도 카나가 몰래 뒤따라오다 들켰다. (→ 카라카스 1차 \"카라카스 영주 루벤\" 참고)\n- 🔸 왜 따라왔나. 루벤을 쫓는 목적이 같아서인지, 시라노가 어떤 사람인지 궁금해서인지.\n\n### 일가족 사살\n- 제국 병사들이 한 가족을 쫓다가 눈앞에서 **일가족을 사살**했다.\n- 화형식과 같은 흐름이다. 이 지역에선 악마 숭배나 레지스탕스 협력을 핑계로 재판도 없이 사람을 죽인다. (→ 카라카스 1차 루벤 \"화형식과 도주\" 참고)\n- 병사들을 물리치고 보니 **두 아이**가 중상이지만 살아 있었다.\n- 🔸 이 가족은 왜 쫓겼나. 무슨 죄를 뒤집어썼나.\n- 🔸 병사들은 루벤의 사병인가, 체사레(교회) 쪽 군대인가.\n\n### 다시 에스메랄다에게\n- 카나가 아이들을 **프리토리아**의 유명한 의사 **에스메랄다**에게 데려가자고 했다. 길을 아는 카나가 안내해야 해서 다시 함께 가기로 했다.\n- 사막에서 쓰러진 시라노를 살려 준 그 의사다. 시라노로서는 은인을 다시 만나러 가는 길. (→ 인물 \"에스메랄다\" 참고)\n- 프리토리아는 이상한 행동으로 유명한 영주 **라몬**의 땅이다. (→ 카라카스 1차 \"영주들 평판이 나쁘다\" 참고)\n- 🔸 사막에서 만났을 땐 사이럽스에 있었는데, 지금은 프리토리아에 돌아와 있는 셈이다. 다시 만나면 어떨지.\n\n### 소문 — 프리토리아 근방의 전설의 창\n- 프리토리아 근방에 **전설의 창**이 있다는 소문을 들었다.\n- 사이럽스에서도 \"프리토리아 근처 산에서 이상한 기운이 흘러나온다\"는 소문을 들었다. 같은 동네를 두고 두 번째 나온 이상한 얘기다. (→ 사이럽스 1차 \"소문 — 이상한 장소들\" 참고)\n- 🔸 어떤 창인지, 어디에 있는지. 화룡산 소문처럼 본 줄거리보다는 나중에 찾아가는 **숨은 장소 힌트**일 가능성이 크다(추측).\n\n### 소문 — 칼스 장군의 검\n- **칼스 장군**이 쓰던 전설의 검 **멸살지옥검**이 **마검숲**에 꽂혀 있다는 소문을 들었다. 숲은 **로우엔 지방, 보르도 근처**라고 한다. 로우엔 바로 북쪽이 보르도라, 두 도시 사이 어디쯤으로 보인다.\n- 검 이름은 NPC도 멸살지옥검이라고 했다. 칼스의 애검이고, 아수라와 함께 창세기전 시리즈 모든 작품에 나오는 이름난 마검이다.\n- `[외부 설정]` 칼스는 창세기전 2에서 흑태자를 따르던 **제국 7용사** 중 한 명이자 **제국 4천왕의 수장**이다. 시라노의 작은할아버지 빈센트도 7용사였으니, 칼스는 빈센트의 옛 동료인 셈이다. (→ 폭풍도 1차 \"작은할아버지 빈센트 번스타인\" 참고)\n- ✅ 로우엔 근처 어디인지 → 마검숲. 이름부터 이 검이 잠든 숲이라는 뜻으로 보인다.\n- ✅ 마검숲에 가면 검을 그냥 얻을 수 있을지 → 지키는 건 없었지만 **커티스 요원들**이 먼저 와서 노리고 있었다. 물리치고 얻었다. (마검숲 2차에서 풀림)\n- 로우엔은 알프레드 프레데릭(메르세데스의 남편)의 영지다. 로우엔 1차, 2차에 들렀다. (→ 1. 시라노의 몰락 참고)\n\n### 소문 — 제피르 팰컨 본부의 이상한 동굴\n- **제피르 팰컨 본부** 안에 이상한 동굴로 이어지는 길이 있다는 소문을 들었다.\n- 시라노는 아직 제피르 팰컨에 들어가지 않았고, 본부가 어디인지도 모른다.\n- ✅ 그 동굴에 무엇이 있는지 → 기지 **지하의 숨은 던전**이었고, 끝에서 **롱기누스의 창**을 얻었다. (제피르 팰컨 기지 4차에서 풀림)\n  - 제피르 팰컨에 들어간 뒤 기지에서 \"친구가 벽 뒤로 빨려 들어갔다\"는 말을 들었다. (→ 제피르 팰컨 기지 2차 \"벽 뒤로 빨려 들어간 사람\" 참고)\n\n---\n\n## 프리토리아 (1차 — 다친 아이들을 데리고)\n\n### 영주 라몬 자작\n- 마을 사람들도 영주가 **이상한 사람**이라고 한다. 카라카스에서 들은 평판 그대로다. (→ 카라카스 1차 \"영주들 평판이 나쁘다\" 참고)\n- **여성 편력**이 심하고 사람들을 많이 괴롭힌다.\n- **2층 저택**에 막대한 재산을 쌓아 두고 있다.\n- 에스메랄다에게 구혼했다가 거절당하자 마녀로 몰아 끌고 갔다. (→ 아래 \"에스메랄다\" 참고)\n- 🔸 최근 라몬 때문에 **한 가족이 죽었다**고 한다. 카라카스 근처 숲에서 제국 병사들에게 사살된 그 일가족일 가능성이 크다(추측). 살아남은 두 아이가 지금 시라노 일행과 함께 있다. (→ \"카라카스 근처 숲\" 일가족 사살 참고)\n  - 맞다면 그 병사들은 루벤이 아니라 라몬 쪽 사람들이었다는 뜻이 된다.\n\n### 에스메랄다\n- 마을 사람들이 모두 칭송한다. 가난한 사람들을 **공짜로 치료**해 주는 의사다. (→ 인물 \"에스메랄다\" 참고)\n- 시라노가 다시 만나 다친 두 아이의 치료를 맡겼다.\n- 다음 날 **라몬 자작이 에스메랄다를 끌고 갔다.** 죄목은 **악마의 힘을 빌려 사람들을 치료했다**는 것, 즉 마녀 누명이다.\n  - 진짜 이유는 라몬의 **구혼을 거절**해서 앙심을 품은 것이라고 한다. 마을 사람들이 말한 여성 편력, 그리고 반발하는 사람에게 마녀재판 누명을 씌운다는 얘기가 그대로 들어맞았다. (→ 카라카스 1차 \"영주들 평판이 나쁘다\" 참고)\n  - 시라노도 13년 전 악마 숭배 누명으로 모든 걸 잃었다. 은인이 같은 누명을 쓰고 끌려간 셈이다.\n- ✅ 시라노가 에스메랄다를 구하러 갈지 → 은혜를 갚으려 곧장 라몬의 저택으로 출발했다.\n- 라몬의 저택에서 무사히 **구해 냈다.** 그 뒤 시라노 일행을 따라가겠다며 합류했다. (→ \"제피르 팰컨 기지 (1차)\" 참고)\n- 영주는 사람들을 괴롭히고, 의사는 사람들을 살린다. 이 마을에서 둘은 정반대 자리에 있다.\n\n### 괴도 샤른호스트\n- 에스메랄다를 구하러 들어간 라몬 자작의 저택에서 만났다. **악덕 영주만 노리는 괴도**라고 한다.\n  - 라몬은 2층 저택에 막대한 재산을 쌓아 둔 악덕 영주다. 괴도가 노릴 만한 곳이다. (→ 위 \"영주 라몬 자작\" 참고)\n- 에스메랄다를 구해 낸 뒤 **조용히 사라졌다.**\n- **카나와 이미 아는 사이**로 보인다.\n  - 🔸 둘은 어떻게 아는 사이인가. 괴도와 레지스탕스가 서로 돕는 관계일지.\n- 🔸 괴도는 정체를 숨기는 사람이다. 샤른호스트의 진짜 정체는 무엇인지. (→ 카라카스 2차 \"샤른호스트 난입\"에서 스스로 \"흑영의 마지막 후계자\"라고 밝힘)\n- 이름은 실존 인물에서 따왔다. (→ 아래 \"이름의 모티브\" 참고)\n\n### 지리학자 라르고\n- 마을 사람 말로는 지리학자 **라르고**는 실버 애로우 사람인데, 남은 생을 제국령에서 보내며 **제국령 지도 만드는 데 몸을 바쳤다.**\n- 이 라르고는 투르까지 가는 항로를 연 **라르고 무어**로 보인다(추측). 1209년경 페넬로와 함께 그 항로를 열었고, 이것이 50년 전쟁의 불씨가 됐다. (→ 다카마 항 1차 \"장사가 안 되는 항구\" 참고)\n- **서부의 지리학회** 사람들 얘기도 나왔다.\n  - 🔸 지리학회가 무엇을 하는 곳인지, 라르고와 관계가 있는지.\n\n---\n\n## 제피르 팰컨 기지 (1차 — 에스메랄다 구출 직후)\n\n### 어떤 조직인가\n- 체사레와 영주들의 횡포에 맞서는 레지스탕스. 자료에 따르면 정체를 감춘 **총수** 아래 **군사 한 명**과 **부대장 네 명**이 있고, 부대는 넷이다. 정면 싸움보다는 게릴라전으로 싸운다.\n  - 1부대 **메디치**, 2부대 **이자벨**, 3부대 **리델**, 4부대 **카나**. 군사는 **클라우제비츠**.\n  - 🔸 총수는 누구인가. 막대한 돈과 장비를 대 준다고 한다.\n- 기지는 프리토리아 근처 산속에 있다. 지도첩으로 보면 프리토리아 산과 이어진 드래건 브레스 산맥 남단 쪽이다.\n\n### 만난 사람들\n- **클라우제비츠**: 조직의 군사. 에스메랄다가 받는 신망을 믿고 시라노 일행에게 함께하자고 했다.\n- **이자벨**: 2부대장. 자료로는 24세, 창을 잘 쓴다. 카나가 외부인을 데려온 것을 경솔하다고 나무랐다.\n- **리델**: 3부대장. 이자벨과 함께 카나를 나무랐다.\n  - 카나가 혼자 움직이다 일을 키우는 게 이번만은 아닌 듯하다. 4부대장 중 가장 어리다. (→ 구 게이시르 제국령 1차 \"제피르 팰컨의 카나\" 참고)\n- **메디치**: 1부대장. 인페르노에서 시라노를 꺼내 준 은인이다. 시라노는 그를 알아보고 제피르 팰컨과 함께 움직여 보기로 했다. 은혜는 꼭 갚는 시라노다운 결정이다.\n  - 🔸 메디치도 시라노를 기억할지.\n- 클라우제비츠와 리델이라는 이름은 실존 군사학자에게서 따왔다. (→ \"이름의 모티브\" 참고)\n\n### 이루스 장군\n- 루벤이 몸을 맡긴 사람. 근처에 주둔 중인 **제국 최고의 맹장**이고, 예전에 **제국 4천왕**으로 꼽히던 전설적인 인물이다.\n- `[외부 설정]` 창세기전 2에서 재상 베라딘 아래의 제국 4천왕 중 한 명으로, '무신'이라 불렸다. 칼스와 함께 실버 애로우가 가장 두려워한 상대였다. (→ 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- 🔸 흑태자 시절의 거물이 왜 이런 시골에 주둔하며 루벤 같은 영주를 감싸 주나.\n- 카라카스 2차에서 그리마를 쓰는 모습이 드러난다. (→ 카라카스 2차 \"이루스의 그리마\" 참고)\n\n---\n\n## 카라카스 (2차 — 카라카스 공격 작전)\n\n### 작전\n- 제피르 팰컨이 카라카스를 치기로 했다. 메디치는 **이루스 장군**을 맡고, 카나를 포함한 시라노 일행은 **포로 구출**을 맡았다.\n- 포로는 **루벤 저택 지하**에 붙잡혀 있는 것으로 보고, 그쪽으로 다시 숨어들려 했다.\n- 🔸 포로는 누구인가. 카나가 자리를 비운 사이 붙잡힌 제피르 팰컨 사람들일 가능성이 크다(추측).\n- 1차 방문 때 정리한 루벤 이야기와 이어진다. (→ 카라카스 1차 \"카라카스 영주 루벤\" 참고)\n\n### 시라노의 불길한 예감\n- 저택에 들어가기 직전 시라노가 안 좋은 느낌을 받고, 데이모스 때문인가 싶어하며 메디치에게 가 본다.\n- ✅ **메디치 쪽이 위험한가** → 위험했다. 메디치가 **이루스 장군에게 밀리고** 있었다. (카라카스 2차에서 풀림)\n- ✅ **그 예감은 데이모스의 힘 때문인가** → 그렇다고 시라노가 판단한다. 시라노 안에 있는 **데이모스의 영혼이 그리마를 쓰는 이루스에게 끌린** 것이다. (카라카스 2차에서 풀림)\n  - 암흑혈은 몸에 힘만 준 게 아니라, 같은 암흑 쪽 힘을 알아채는 감각까지 준 셈이다. (→ 폭풍도 1차 \"아수라 도전\" — 암흑혈 덕에 영혼을 안 빼앗긴 일 참고)\n\n### 이루스의 그리마\n- 이루스가 시라노에게서 **데이모스와 흑태자의 파동**을 느끼고, **그리마**로 변해 싸운다.\n- `[외부 설정]` **그리마**는 암흑신과 그 권속인 데블족이 몸을 거대하고 흉측하게 바꿔 힘을 끌어올리는 능력, 또는 그렇게 바뀐 모습이다. 신 이름이 아니다. 창세기전 2에서 데이모스는 궁극 그리마를 흑태자에게 넘겨줬다. (원래 메모: \"창세전쟁에서 살아남은 암흑신 중 하나\")\n- 🔸 **이루스는 정체가 무엇인가.** 4천왕 출신 인간 장군인 줄 알았는데 그리마를 쓴다. 암흑 쪽 존재이거나 그 피를 이은 사람일 수 있다(추측).\n- 🔸 **흑태자의 파동은 어디서 왔나.** 데이모스 쪽은 암흑혈로 설명되지만, 흑태자 쪽은 아직이다. 흑태자의 칼 아수라 때문일 수도, 흑태자도 데이모스에게 힘을 받은 사람이라 같은 피로 이어져서일 수도 있다(추측). 흑태자 시절 제국 4천왕이었던 이루스라서 단번에 알아봤을 것이다(추측). (→ 폭풍도 1차 \"이올린을 오래전에 만난 것 같다\" 참고)\n- ✅ 메디치도 못 버틴 상대가 그리마까지 썼다. 시라노가 이길 수 있을지 → 끼어든 **샤른호스트**와 힘을 합쳐 물리쳤다. (카라카스 2차에서 풀림)\n\n### 샤른호스트 난입\n- 이루스의 **결계를 뚫고** 뛰어들어 시라노와 함께 싸웠다. 프리토리아에서 만났던 그 괴도다. (→ 프리토리아 1차 \"괴도 샤른호스트\" 참고)\n- 등장하며 외친 말: \"달은 져서 칼에 드리우고, 암흑 속 흑영은 천하를 멸한다. 나는 흑영의 마지막 후계자, 샤른호스트다!\" 앞 구절은 흑영끼리 쓰는 **암호**로 보인다.\n- `[외부 설정]` **흑영(흑영대)**: 제국이 부리던 암살·첩보 특수부대. 대륙 최고 실력이라 팬드래건 왕국이 따로 맞설 부대를 만들 정도였고, 흑태자도 다시 일어서자마자 가장 먼저 흑영대부터 손에 넣었다. 흑태자가 죽고 제국이 무너지면서 겉으로는 사라졌다.\n- 그런데 쓰는 검법은 **팬드래건(왕국)의 검법**이라 시라노가 이상하게 여겼다. `[외부 설정]` 제국 부대였던 흑영이라면 강한 한 방을 앞세우는 제국 검법을 써야 맞다. 팬드래건 검법은 빠른 검이다. 시라노는 이올린에게 팬드래건 검법을 배웠으니 단번에 알아봤을 것이다(추측). (→ 폭풍도 1차 참고)\n- 🔸 **샤른호스트는 누구인가.** 흑영의 후예라면서 왜 적국 팬드래건의 검법을 쓰나. 그 검법은 누구에게 배웠나.\n- 🔸 제국 시절 조직의 후예가, 흑태자 시절 4천왕이던 이루스를 왜 막아섰나. 시라노에게서 흑태자의 파동이 느껴진 것과 이어지는지.\n- 🔸 결계를 뚫고 들어온 걸 보면 이 싸움을 미리 지켜보고 있었던 듯하다. 왜 시라노를 돕나.\n\n### 루벤의 고백과 죽음\n- 이루스를 물리친 뒤 쓰러진 메디치를 실버에게 맡기고, 시라노는 혼자 루벤 저택으로 들어가 루벤을 쓰러뜨렸다.\n- **루벤은 시라노의 배다른 동생이었다.** 루크 번스타인의 아들이지만 천한 신분으로 자랐고, 모든 걸 가진 시라노를 부러워했다. 1차 때 적어 둔 \"성도 번스타인이다\"가 이걸로 설명된다. (→ 카라카스 1차 \"카라카스 영주 루벤\" 참고)\n  - 루벤은 \"아버지가 돌아가신 15년 전부터 이날을 기다렸다\"고 했다. 그런데 루크는 시라노가 잡혀간 뒤(13년쯤 전)에 죽었다. 이야기와 숫자가 딱 맞지는 않아서 원래 표현을 남긴다. 시라노도 나중에 \"게이시르 시티, 15년 만\"이라고 해서, 게임에서는 15년으로 세는 듯하다. (→ 제피르 팰컨 기지 2차 \"15년 만의 게이시르 시티\" 참고)\n- **루크 번스타인의 죽음**: 시라노를 구하려고 **체사레에게 맞섰고**, 그러다 **프레데릭과의 결투에서 죽었다.** 감옥에서 들은 \"반란을 일으켰다가 진압됐다\"는 소식의 속사정이다. (→ 세계관 \"번스타인 가문 멸문\" 참고)\n- 죽기 전 남긴 말: 시라노에게 미안하다, **체사레를 조심하라**, 시라노를 함정에 빠뜨린 건 체사레다. 자기와 **이스카리옷**도 체사레 때문에 어쩔 수 없이 거짓 증언을 했다는 투였다.\n- 🔸 **이스카리옷은 누구이고 지금 어디 있나.** 시라노를 모함한 \"친구\" 쪽이다. 루벤 말대로 억지로 증언했다면, 이스카리옷도 체사레에게 약점을 잡혔던 걸까. (→ 제피르 팰컨 기지 2차 \"이스카리옷과 제국 학술원\" 참고)\n- 🔸 질투로 배신했다는 말과, 체사레 때문에 어쩔 수 없었다는 말이 같이 나왔다. 어느 쪽이 더 컸는지는 루벤만 안다.\n- 🔸 아버지를 죽인 사람이 **프레데릭**이다. 메르세데스가 결혼한 바로 그 사람이다. (→ 세계관 \"메르세데스는 왜 프레데릭과 결혼했나\" 참고)\n\n### 제피르 팰컨 합류\n- 싸움이 끝나자 클라우제비츠가 함께하자고 다시 제안했다. 이번 일로 **교회 쪽은 시라노를 제피르 팰컨 사람으로 볼 테니** 혼자 움직이기 어려울 거라는 이유다.\n- 시라노는 체사레를 같은 적으로 둔 제피르 팰컨과 **함께하기로 했다.** 기지에서 \"일단 같이 움직여 보자\"던 데서 한 걸음 더 나간 것이다. (→ 제피르 팰컨 기지 1차 \"만난 사람들\" 참고)\n  - 1차 때 혼자 루벤을 쫓겠다며 카나를 떼어 놓던 것과 비교하면, 루벤의 유언으로 원수가 체사레 하나로 좁혀지면서 혼자 싸울 이유가 줄었다(추측). (→ 카라카스 1차 \"화형식과 도주\" 참고)\n- 🔸 시라노가 제피르 팰컨 안에서 어떤 자리를 맡게 될지. 외부인을 데려왔다고 카나를 나무랐던 리델, 이자벨이 시라노를 어떻게 대할지.\n\n---\n\n## 제피르 팰컨 기지 (2차 — 카라카스 공격 직후 작전 회의)\n\n### 니코시아의 교회 요새\n- 체사레가 **니코시아** 지방에 **요새**를 세우고 무언가 준비하고 있다는 정보가 들어왔다. 니코시아는 게이시르 시티 남쪽의 작은 마을이다. 제피르 팰컨의 다음 임무는 이곳 **정탐**이다.\n- 🔸 요새에서 무엇을 준비하나. 체사레의 야망(제국 통일, 흑태자 영광 재현)과 이어지는 일일 것이다(추측). (→ 세계관 \"체사레는 왜 시라노를 함정에 빠뜨렸나\" 참고)\n- 🔸 루벤이 죽기 전 \"체사레를 조심하라\"고 했다. 시라노에게는 체사레의 속셈에 처음으로 직접 다가가는 임무다. (→ 카라카스 2차 \"루벤의 고백과 죽음\" 참고)\n\n### 로우엔과 프레데릭 공\n- **로우엔** 지방은 지금 제국에서 가장 강한 **프레데릭 공**의 영지다.\n- 프레데릭은 시라노의 아버지 루크를 결투에서 죽였고, 메르세데스와 결혼한 사람이다. (→ 카라카스 2차 \"루벤의 고백과 죽음\", 세계관 \"메르세데스는 왜 프레데릭과 결혼했나\" 참고)\n- 칼스 장군의 검이 꽂혀 있다는 마검숲도 로우엔 근처다. (→ 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- 🔸 제국 최강이라는 프레데릭은 체사레 편인가, 아니면 따로 노는 세력인가.\n\n### 15년 만의 게이시르 시티\n- 회의실을 나서며 시라노가 \"게이시르 시티, 15년 만인가\" 하고 혼잣말을 한다. 니코시아가 게이시르 시티 남쪽이라, 가는 길에 고향을 지나게 된다.\n- 게이시르 시티는 시라노가 약혼식 날 끌려간 곳이고, 번스타인 가문이 무너진 곳이며, 체사레의 본거지다. (→ 트리시스 사막 2차 \"게이시르에 가서 무엇부터 할지\" 참고)\n- 루벤도 \"15년 전부터 이날을 기다렸다\"고 했다. 둘 다 15년이라고 하니, 게임은 시라노가 잡혀간 때부터 15년쯤 지난 것으로 세는 듯하다. 지금까지 문서에 적어 온 \"13년 전\"은 프롤로그 연도(에스겔력 1249년 말 → 1263년)로 계산한 숫자라 조금 어긋난다. (→ 카라카스 2차 \"루벤의 고백과 죽음\" 참고)\n- 🔸 고향에서 누구를 만나게 될지. 번스타인 저택과 집안 사람들은 어떻게 됐을지, 체사레나 메르세데스와 마주치게 될지.\n\n### 벽 뒤로 빨려 들어간 사람\n- 기지의 한 사람이, 친구가 **벽 뒤로 빨려 들어간** 적이 있다고 말한다.\n- 카라카스 근처 숲에서 들은 \"제피르 팰컨 본부 안에 이상한 동굴로 이어지는 길이 있다\"는 소문과 딱 맞는다. 기지 어딘가의 벽이 그 동굴 입구일 가능성이 크다(추측). (→ 카라카스 근처 숲 \"소문 — 제피르 팰컨 본부의 이상한 동굴\" 참고)\n- ✅ 어느 벽인가, 그 너머에 무엇이 있나 → 작전회의실 오른쪽, 술집 너머로 이어지는 **기지 지하 던전**이었다. 강한 몬스터가 들끓고, 가장 안쪽에 **롱기누스의 창**이 있었다. (제피르 팰컨 기지 4차에서 풀림)\n- 🔸 빨려 들어간 친구는 어떻게 됐나. 레지스탕스 기지 바로 밑에 왜 이런 곳이 있고, 왜 전설의 창이 잠들어 있었나.\n\n### 이스카리옷과 제국 학술원\n- 기지의 한 사람이 제국 학술원을 **\"이스카리옷의 제국 학술원\"**이라고 부르면서, 그곳에서 **마법의 극한**을 연구한다고 말한다.\n- 학술원 앞에 이스카리옷의 이름이 붙는 걸 보면, 시라노를 모함했던 친구 이스카리옷이 지금은 **학술원을 손에 쥔 자리**에 있는 듯하다(추측). 시라노가 학자로 있던 바로 그곳이다. (→ 카라카스 2차 \"루벤의 고백과 죽음\" 참고)\n- 카라카스에서는 학술원이 검 연구회를 두고 무기까지 연구하는 걸 봤다. 이번엔 마법이다. 학자들 모임치고는 힘을 기르는 쪽으로 너무 많이 손을 뻗고 있다. (→ 카라카스 1차 \"검 연구회 상점\" 참고)\n- 🔸 모함의 대가로 학술원 자리를 받은 걸까. \"마법의 극한\"이라는 연구로 무엇을 만들려고 하나. 체사레의 계획과 이어지나.\n\n---\n\n## 게이시르 시티 (1차 — 니코시아로 가는 길)\n\n### 대성당 아래의 지하수로\n- **게이시르 대성당** 아래에 예전에 묻어 둔 **지하수로**가 있다고 한다.\n- 대성당은 주신교의 중심이고, 게이시르는 체사레의 본거지다. 그런 곳 밑으로 몰래 드나들 길이 있다는 얘기다.\n- 카라카스에서도 루벤 저택 밑 지하수로로 숨어들었다. 이번에도 쓸 일이 생길지 모른다(추측). (→ 카라카스 2차 \"작전\" 참고)\n- 🔸 누가 왜 만들었고, 지금 어디로 이어지나. 아는 사람이 많은가.\n\n### 니코시아 — 교회 세력이 센 곳\n- 니코시아는 **교회 세력이 아주 강한 곳**이라고 한다.\n- 체사레가 하필 거기에 요새를 세운 이유가 이걸로 어느 정도 설명된다. 자기 편이 많은 땅이라 일을 꾸미기 좋았을 것이다(추측). 정탐하러 가는 시라노 일행에게는 그만큼 위험한 곳이다. (→ 제피르 팰컨 기지 2차 \"니코시아의 교회 요새\" 참고)\n\n### 소문 — 로우엔 근처에 박힌 이상한 칼\n- 로우엔 근처의 **숲과 산**에 **이상한 칼이 박혀 있다**는 소문을 또 들었다.\n- 숲 쪽은 카라카스 근처 숲에서 들은 **마검숲의 멸살지옥검** 얘기와 같은 것으로 보인다. (→ 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- 이번엔 **산**도 같이 나온다. 숲의 검과 같은 걸 두고 하는 말인지, 산에도 칼이 따로 박혀 있다는 건지는 모르겠다.\n- ✅ 로우엔 근처 산에 박혀 있다는 칼은 무엇인가 → 산속 동굴(유성검 던전)에 있던 **유성의 검**이었다. 숲 쪽 칼(멸살지옥검)과는 따로 있는 칼이다. (로우엔 동굴에서 풀림)\n\n### 마을 곳곳의 암살자\n- 마을 곳곳에 **수상한 암살자들**이 많이 돌아다닌다.\n- 체사레의 본거지 한복판이다. 누가 보낸 자들이고 누구를 노리는지는 아직 모른다.\n- 🔸 누구의 사람들인가(체사레? 교회? 다른 세력?). 노리는 게 시라노 일행인가, 다른 누구인가.\n\n### 가수 샤론\n- 게이시르에서는 **샤론**이라는 가수가 유명하다.\n- ✅ 어디 있나 → 니코시아 마을 여관에 있었다. (니코시아 1차에서 풀림 → 니코시아 1차 \"가수 샤론\" 참고)\n\n### 무기점\n- 게이시르 시티 무기점에 좋은 무기가 있다고 한다. 제국령의 중심 도시라 물건도 좋은 모양이다.\n\n---\n\n## 니코시아 (1차 — 교회 요새 정탐 임무)\n\n### 시골 마을에 왜 요새를?\n- 니코시아는 막상 와 보니 **한적한 시골 마을**이다. 지킬 것도 없어 보이는 곳에 체사레가 요새를 짓고 있다.\n- 게이시르에서 들은 대로 교회 세력이 센 곳이라, 눈에 띄지 않게 일을 꾸미기에는 오히려 알맞을 수 있다(추측). (→ 게이시르 시티 1차 \"니코시아 — 교회 세력이 센 곳\", 제피르 팰컨 기지 2차 \"니코시아의 교회 요새\" 참고)\n- ✅ 요새 안에서 무엇을 하고 있었나 → 교회 세력이 **마장기 아수라 MK.2**를 만들고 있었다. (니코시아 교회 요새 1차에서 풀림)\n\n### 가수 샤론\n- 게이시르에서 이름을 들은 유명 가수 **샤론**이 니코시아 마을 **여관**에 있다. (→ 게이시르 시티 1차 \"가수 샤론\" 참고)\n- 정작 본인은 노래하는 게 **지겨워서 더는 부르고 싶지 않다**고 한다. 유명세와 달리 지쳐 있다.\n- 🔸 왜 노래에 질렸나. 이름난 가수가 왜 이 시골 마을 여관에 와 있나.\n\n### 카나의 고향\n- 니코시아 근처가 **카나의 고향**이다. 카나에게는 고향 바로 옆에 체사레가 요새를 짓고 있는 셈이다.\n- 시라노가 15년 만에 고향 게이시르를 지나온 바로 다음이라, 둘 다 고향 근처에서 체사레와 맞닥뜨리는 모양새가 된다. (→ 게이시르 시티 1차 참고)\n- 🔸 카나가 제피르 팰컨에 들어간 까닭이 고향과 관계가 있을까. 고향에 아직 가족이나 아는 사람이 있을까. (→ 구 게이시르 제국령 1차 \"제피르 팰컨의 카나\" 참고)\n\n---\n\n## 니코시아 교회 요새 (1차 — 정탐 작전)\n\n### 크리스\n- 교회 요새 안에서 만난 사람. 자료상 이름은 **크리스티나**, 줄여서 크리스라고 부른다.\n- 교회와 싸우고 있는 건 분명한데, **왜 싸우는지는 대답해 주지 않는다.**\n- 마장기를 쓰러뜨린 뒤 **제피르 팰컨에 들어오고 싶다**고 한다. 받아들일지는 기지에 돌아가 의논하기로 했다.\n- 🔸 교회와 무슨 원한이 있나. 왜 혼자 교회 요새에 들어와 있었나. 이유를 숨기는 까닭은.\n- ✅ 기지에서 크리스를 받아들일까 → 받아들였다. (제피르 팰컨 기지 3차에서 풀림) 처음 물음: 카나가 시라노 일행을 데려왔을 때 리델과 이자벨이 경솔하다고 나무랐던 걸 보면, 이번에도 반대하는 사람이 나올 수 있다(추측). (→ 제피르 팰컨 기지 1차 \"만난 사람들\" 참고)\n\n### 마장기 아수라 MK.2\n- 교회 뒤편에 **제국 마장기 아수라 MK.2**가 있었다. 체사레가 시골 마을에 요새를 지은 까닭이 이것이었다. 교회 세력이 몰래 **마장기를 만들고** 있었다. (→ 니코시아 1차 \"시골 마을에 왜 요새를?\" 참고)\n- 이름이 흑태자의 마검 **아수라**와 같다. 시라노가 폭풍도에서 얻은 그 검이다. \"제국\" 마장기라는 이름을 붙인 것도, 흑태자 시절 제국의 영광을 되살리려는 체사레의 야망과 맞닿아 보인다(추측). (→ 폭풍도 1차 \"아수라 도전\", 세계관 \"체사레는 왜 시라노를 함정에 빠뜨렸나\" 참고)\n- \"MK.2\"라면 1호기나 다른 기체가 따로 있을 수 있다(추측).\n- 🔸 마장기는 무엇에 쓰려고 만드나. 누가 설계했나. 제국 학술원이 \"마법의 극한\"을 연구한다던 얘기와 이어질까. (→ 제피르 팰컨 기지 2차 \"이스카리옷과 제국 학술원\" 참고)\n\n---\n\n## 한편, 비프로스트 (막간 — 니코시아 정탐 직후)\n\n### 모젤 공왕과 원로원\n- 원로원이 **모젤 공왕**에게 따진다. 원로원의 반대를 무시하고 **군비를 늘렸다**는 것.\n- 원로원 말로는 공왕이 **어떤 여자에게 놀아나서** 그 여자가 시키는 대로 군사비를 올리고 있다.\n- 공왕은 원로원을 **무력으로 쫓아냈다.** 원로원 중심으로 돌아가던 나라에서 공왕이 혼자 힘을 쥐려는 모양새다.\n- ✅ 공왕 뒤의 그 여자는 누구인가 → 애첩 **조세핀**이다. 그 뒤에는 **체사레**가 있었다. (한편, 체사레와 마키아벨리에서 풀림)\n- ✅ 늘린 군대로 어디를 치려는가 → 비프로스트 근처 **제국령의 소영주들**을 압박하고 있다. (제피르 팰컨 기지 3차에서 풀림 → 그 항목 참고)\n- `[외부 설정]` 비프로스트는 대륙 북쪽 만년설 산악 지대의 나라로, 옛날 게이시르 제국에 반발한 사람들이 세웠다. 원로원 중심으로 다스리고, 오랫동안 중립을 지켜 왔다. 정규군은 여자들이 맡는 전통이 있다. (나무위키 「비프로스트 공국」)\n- `[외부 설정]` 모젤 공왕(모젤 2세)의 아버지 **모젤 공왕**도 원로원과 맞서다가 제국의 개입으로 살해됐다. 그 뒤 나라가 공왕파와 원로원파로 갈라졌고, 공왕파가 어린 아들을 공왕으로 세웠다. 흑태자가 비프로스트를 쳤을 때는 팬드래건으로 피신해 있었다. (창세기전 2, 나무위키 「모젤 2세」) — 아버지 대의 원로원 갈등이 아들 대에 다시 벌어지는 셈이다.\n\n---\n\n## 제피르 팰컨 기지 (3차 — 니코시아 정탐 직후 작전 회의)\n\n### 크리스 입단\n- 의논 끝에 **크리스를 제피르 팰컨 일원으로 받아들였다.** 교회와 싸우는 이유는 여전히 모른다. (→ 니코시아 교회 요새 1차 \"크리스\" 참고)\n\n### 리브레빌의 에스테 도데\n- **리브레빌** 영주 **에스테 도데**가 제피르 팰컨에 전령을 보냈다. 절세 미녀로 이름난 영주다.\n- 리브레빌은 **교회의 힘이 그리 세지 않은** 곳이다. 비프로스트와 가까운 교역 도시라는 건 카라카스에서 들었다. (→ 카라카스 1차 \"어떤 마을인가\" 참고)\n- 시라노는 **제국의 영주가 레지스탕스에 도움을 청하는 게 이상하다**고 본다. 클라우제비츠는 에스테가 교회와 가깝지 않으니 **함정은 아닐 것**이라고 한다.\n- 🔸 에스테는 왜 하필 제피르 팰컨을 찾았나. 교회(체사레) 쪽에 기댈 수 없거나 기대기 싫은 사정이 있을까.\n- 🔸 정말 함정이 아닐까. 시라노가 처음부터 의심을 거두지 않은 점은 기억해 둔다.\n\n### 비프로스트의 압박\n- **모젤 공왕**이 군대를 움직여 비프로스트 근처 **제국령 소영주들을 압박**하고 있다. 원로원을 쫓아내면서까지 늘린 군대가 바로 남쪽 제국령을 향했다. (→ 한편, 비프로스트 \"모젤 공왕과 원로원\" 참고)\n- 🔸 모젤 공왕은 제국령을 압박해서 무엇을 얻으려 하나. 체사레는 이걸 알고 어떻게 나올까. → 공왕 곁의 조세핀이 체사레 사람이었다. 압박 자체가 체사레의 판일 수 있다(추측). (→ 한편, 체사레와 마키아벨리 참고)\n\n---\n\n## 리브레빌 (1차 — 에스테 도데의 요청)\n\n### 에스테 도데의 부탁 — 동쪽 도로의 새 영지\n- 리브레빌 동쪽에서 **커티스**로 가는 도로의 북쪽 고원지대가 **새 영지로 분리**되고 마을이 들어섰다. 그 마을이 이 도로에 **통행세**를 걷는다. 이 도로는 리브레빌의 생명줄이나 다름없다.\n- 에스테가 그곳 영주에게 얘기해 보려 했지만 **답신이 없다.** 그 길로 일하러 나간 사람들도 언제부턴가 **돌아오지 않는다.**\n- 상대는 화력이 상당하고 특히 **몬스터를 부린다.** 그래서 리브레빌 혼자 못 싸우고 제피르 팰컨을 불렀다.\n- 대가: **해마다 100만 엘드**, **제피르 팰컨 간부들의 신분 보장**, **에스테 저택을 자유롭게 써도 된다**는 것. 레지스탕스에게 영주가 이런 조건을 내건다는 건 꽤 큰 결단이다.\n- 🔸 누가 이 고원을 따로 영지로 떼어 줬나. 새 영주는 누구고, 뒤에 누가 있나.\n- 🔸 사람을 부리는 게 아니라 **몬스터를 부린다**는 건 어떻게 가능한가. 니코시아에서 교회가 몰래 마장기를 만들던 것처럼, 뒤에 큰 세력이 있을 수 있다(추측). (→ 니코시아 교회 요새 1차 \"마장기 아수라 MK.2\" 참고)\n- ✅ 돌아오지 않는 사람들은 어떻게 됐나 → 안타나나리보 영주 쪽에 **갇혀 있었고**, 시라노가 구출했다. (→ 안타나나리보 1차 \"영주 저택\" 참고)\n- 🔸 제피르 팰컨을 처음 부른 이유가 이거였다. 비프로스트의 압박 얘기와는 따로인가, 이어지나. (→ 제피르 팰컨 기지 3차 \"비프로스트의 압박\" 참고) → 안타나나리보 영주가 비프로스트군과 함께 있었다. 이어질 가능성이 커졌다. (→ 안타나나리보 1차 \"영주 저택\" 참고)\n\n### 에스테와 메디치\n- 클라우제비츠는 먼저 와 있었고 **메디치는 늦게 도착**했다. 원래 잘 늦는 사람인 듯하다.\n- 에스테는 **처음 만난 메디치를 매우 반겼고**, 이야기 내내 말투에 호감이 묻어난다.\n- 그날 밤 저택 화원에서 **메디치가 카나에게 고백**했지만, 카나는 **따로 좋아하는 사람이 있다**며 연인 사이는 거절하고 자리를 피했다.\n- 그 직후 **에스테가 메디치에게 고백**했고 둘은 함께 방으로 갔다. 처음부터 보인 호감이 진심이었던 셈이다. 시라노는 이 장면을 **몰래 엿들었다.**\n- 🔸 카나가 좋아하는 사람은 누구인가. (→ 니코시아 1차 \"카나의 고향\" 참고)\n- 🔸 에스테는 처음 본 메디치에게 왜 이렇게 빨리 마음을 열었나. 이름만 듣고 알던 사이인가, 다른 속셈이 있나.\n- 🔸 카나에게 거절당한 직후 에스테를 받아들인 메디치. 이 일이 제피르 팰컨 안에서 어떤 영향을 줄까.\n\n### 안타나나리보 조사 임무 (다음 날)\n- 처음엔 안타나나리보가 문제의 새 영지 마을인 줄 알았다. 막상 가 보니 아닌 것 같다. (→ 안타나나리보 1차 참고)\n- 클라우제비츠가 시라노에게 맡긴 일: **영주 저택 조사**, **실종된 마을 사람들 구출**.\n- 이름은 마다가스카르의 수도에서 따왔다. (→ 아래 \"이름의 모티브\" 참고)\n\n### 잠긴 투기장\n- 리브레빌 투기장은 **이상한 자물쇠로 잠겨 있다.** 카라카스의 '네메아의 사자'처럼 들어가서 싸울 수가 없다.\n- 투기장 주인은 **북쪽 블록, 내려가는 계단 쪽**에 있다.\n- 공략 자료로는 이 투기장 안쪽이 **썬더메어 던전**이다. 열쇠는 따로 아이템으로 나오지 않고, 이벤트로 문이 열리는 식이다. (→ 카라카스 1차 \"투기장 '네메아의 사자'\" 참고)\n  - 한 번 열린 뒤 투기장을 나와 다른 지역으로 가면 **다시 잠기고 다시는 못 들어간다.** 열리면 썬더메어를 꼭 얻고 나와야 한다.\n  - ✅ 여는 법 → 리브레빌 2차에서 풀림. 투기장 주인 집에서 열쇠를 찾아 열었다.\n- 🔸 누가, 왜 투기장을 잠가 두었나.\n\n### 비프로스트 공왕의 애첩 조세핀\n- 비프로스트 **모젤 공왕**에게 **조세핀**이라는 애첩이 있다.\n- 원로원이 공왕더러 \"어떤 여자에게 놀아나 그 여자가 시키는 대로 군비를 늘린다\"고 따졌는데, 그 여자가 조세핀으로 보인다(추측). (→ 한편, 비프로스트 \"모젤 공왕과 원로원\" 참고)\n- ✅ 뒤에 누가 있나 → **체사레**와 줄이 닿아 있다. 모젤 2세를 홀려 비프로스트를 체사레 손에 넣으려는 것으로 보인다. (한편, 체사레와 마키아벨리에서 풀림)\n  - ✅ 조세핀은 어떤 사람인가. 처음부터 체사레가 보낸 사람인가 → 시골 농부의 딸을 체사레가 꾸며 공왕 곁에 앉혔다. 비프로스트 사정을 마키아벨리에게 넘기는 스파이다. (한편, 마키아벨리와 조세핀에서 풀림)\n\n### 카오스 큐브의 전설\n- 리브레빌에서 **카오스 큐브**에 얽힌 옛날이야기를 들을 수 있다. 전쟁이 끊이지 않던 시절, 결혼을 약속한 연인 **아웬**(여자)과 **엘**(남자)의 이야기다.\n- 이야기가 길어서 **다음 부분은 로우엔**에서 들을 수 있다. 공략 자료로도 리브레빌과 로우엔 두 마을을 돌며 이어 듣는 이야기라고 나온다.\n- 어느 집 사람은 **자기 집에 카오스 큐브가 있다**고 한다. 전설 속 물건이 실제로 전해 내려온다는 얘기다.\n- 공략 자료로는 카오스 큐브가 이 게임에서 **장신구**로도 나온다. 끼면 XP가 두 배로 빨리 차는 '열혈' 능력이 생긴다.\n- 🔸 카오스 큐브는 무엇인가. 아웬과 엘은 어떻게 됐나. → 로우엔 2차에서 끝까지 들었다(로우엔 2차 \"카오스 큐브 전설의 끝\" 참고).\n- 🔸 그 집의 카오스 큐브를 얻을 수 있을까.\n\n### 그때 구한 아이들\n- 카라카스 근처 숲에서 제국 병사에게 일가족이 사살될 때 살아남은 **두 아이**가 리브레빌의 한 집에 사는 것 같다. 프리토리아에서 에스메랄다에게 치료를 맡긴 뒤로 소식이 없던 아이들이다. (→ 카라카스 근처 숲 \"일가족 사살\", 프리토리아 1차 참고)\n- 🔸 누가 아이들을 리브레빌로 데려왔나. 친척 집인가.\n\n### 얻은 물건 — 제프리 바지\n- **제프리 바지**를 얻었다. 설명에는 효능이 \"미상\"이라고만 나온다. 자료에서도 효과를 찾지 못했다.\n- 🔸 제프리는 누구고, 이 바지는 무엇에 쓰나.\n\n---\n\n## 안타나나리보 (1차 — 실종자 조사 임무)\n\n### 문제의 마을은 여기가 아니다?\n- 마을 사람들 얘기로는 안타나나리보가 **통행세를 걷고 사람들이 사라지는 그 마을은 아닌 것 같다.** 문제의 마을은 이 근처 어딘가로 보인다. (→ 리브레빌 1차 \"에스테 도데의 부탁\", \"안타나나리보 조사 임무\" 참고)\n- 마을 밖에는 **안타나나리보 요새**로 가는 길만 열려 있다. 근처 **망티고아 산** 위로는 아직 못 올라간다.\n- 🔸 그렇다면 클라우제비츠는 왜 시라노를 여기로 보냈나. 여기서 무엇을 알아내야 하나.\n- 🔸 요새가 클라우제비츠가 말한 \"영주 저택\"인가.\n\n### 영주 저택 — 영주와 비프로스트군\n- 영주 저택을 뒤지다 **영주**가 **비프로스트군**과 함께 있는 걸 맞닥뜨려 싸웠고, 시라노가 **영주를 처단**했다.\n- 비프로스트가 제국령 소영주들을 압박한다더니, 군대가 이미 이 영지 안까지 들어와 영주와 손잡고 있었다. (→ 제피르 팰컨 기지 3차 \"비프로스트의 압박\" 참고)\n- 이 영주가 비프로스트 편에 붙은 거라면, 리브레빌 동쪽 도로의 새 영지 일도 비프로스트와 이어질 수 있다(추측). (→ 리브레빌 1차 \"에스테 도데의 부탁\" 참고)\n- 🔸 영주는 왜 비프로스트와 손잡았나. 협박을 받았나, 스스로 붙었나.\n- ✅ 사라진 마을 사람들은 어디 있나 → 이곳에 **갇혀 있던 리브레빌 주민들**을 찾아내 구출했다. (안타나나리보 1차에서 풀림)\n  - 🔸 왜 사람들을 가둬 두었나. 무엇에 쓰려고 했나.\n- 🔸 비프로스트가 군대를 제국령 안까지 들인 건 모젤 공왕의 뜻인가, 애첩 조세핀의 뜻인가. (→ 리브레빌 1차 \"비프로스트 공왕의 애첩 조세핀\" 참고) → 조세핀 뒤에 체사레가 있다는 게 드러났다. (→ 한편, 체사레와 마키아벨리 \"조세핀은 체사레의 사람\" 참고)\n\n---\n\n## 한편, 프레데릭 저택 (막간 — 안타나나리보 구출 직후)\n\n### 집 나간 딸 크리스티나\n- 메르세데스와 프레데릭의 딸 **크리스티나**(15세)가 집을 나간 지 **석 달**이 됐다. 할아버지 **체사레**가 모르는 사람에게 시집가라고 강요하자, 피하듯 여행을 떠난 것으로 보인다.\n- 어릴 때부터 **프레데릭에게 무술**을 배웠다. 부녀 사이는 나쁘지 않아 보인다.\n- 제피르 팰컨에 들어온 **크리스**의 자료상 이름도 **크리스티나**다. 교회와 싸우면서 이유는 끝내 말하지 않았다. 할아버지가 교회의 수장 체사레라면 숨길 만하다. 같은 사람일 가능성이 크다(추측). (→ 니코시아 교회 요새 1차 \"크리스\", 제피르 팰컨 기지 3차 \"크리스 입단\" 참고)\n  - 🔸 정말 같은 사람이라면, 크리스는 시라노의 원수 체사레의 손녀이고 메르세데스의 딸이다. 시라노는 아직 모른다.\n- ✅ 체사레는 열다섯 살 손녀를 누구에게 시집보내려 했나 → **비프로스트**다. 프레데릭은 이 혼사에 반대했다. (한편, 체사레와 마키아벨리에서 풀림)\n  - 🔸 비프로스트의 누구에게인가. 왜 하필 비프로스트인가.\n\n### 프레데릭은 어떤 사람인가\n- 딸 걱정을 하는 메르세데스에게 나무람을 들어도 웃어넘긴다. 자기도 그 나이엔 세상을 돌아다니며 견문을 넓혔다는 것이다. 딸을 믿고 풀어 두는 아버지로 보인다.\n- 장인 체사레가 **평민들을 너무 억누르는 것**을 걱정한다. 체사레의 사위이면서도 생각이 다 같지는 않은 모양이다. (→ 제피르 팰컨 기지 2차 \"로우엔과 프레데릭 공\"의 \"체사레 편인가\" 참고)\n- 장면 분위기로는 나쁜 사람으로 그려지지 않는다. 그런데 시라노에게는 아버지 루크를 결투에서 죽이고 메르세데스와 결혼한 사람이다. (→ 카라카스 2차 \"루벤의 고백과 죽음\" 참고)\n- 🔸 시라노가 알던 원수의 모습과, 여기서 보이는 사람 좋은 아버지의 모습이 어떻게 맞물릴까.\n- 저택 위치는 게이시르로 들었다. 프레데릭의 영지는 로우엔이다. (→ 제피르 팰컨 기지 2차 \"로우엔과 프레데릭 공\" 참고)\n\n### 제피르 팰컨을 노린다\n- 체사레가 **니코시아에 세운 교회가 제피르 팰컨에게 부서졌다**는 소식이 프레데릭 귀에도 들어갔다. (→ 니코시아 교회 요새 1차 \"마장기 아수라 MK.2\" 참고)\n- 프레데릭은 **제피르 팰컨을 한번 혼내 줘야겠다**고 한다. 그들을 상대하면서 **크리스티나의 행방**도 찾아볼 생각이다.\n- 🔸 제국 최강이라는 프레데릭이 직접 나선다. 제피르 팰컨, 그리고 시라노와 언제 어디서 마주칠까.\n- 🔸 크리스가 정말 크리스티나라면, 프레데릭은 딸이 있는 곳을 치러 오는 셈이다.\n\n### 메르세데스\n- 시라노의 옛 약혼녀. 지금은 프레데릭의 아내이고 크리스티나의 어머니다. 딸 걱정에 남편을 나무란다.\n- 🔸 메르세데스는 시라노가 탈옥해 살아 있다는 걸 알까. (→ 세계관 \"메르세데스는 왜 프레데릭과 결혼했나\" 참고)\n\n---\n\n## 제피르 팰컨 기지 (4차 — 안타나나리보 구출 직후 작전 회의)\n\n### 새 후원자\n- 리브레빌 주민 구출로 제피르 팰컨에 **후원자**가 생겼다. 해마다 100만 엘드와 간부 신분 보장을 내건 **에스테 도데**일 가능성이 크다(추측). (→ 리브레빌 1차 \"에스테 도데의 부탁\" 참고)\n- 🔸 이름 없이 \"후원자\"라고만 했다. 정말 에스테인가. 제피르 팰컨에 돈을 대 왔다는 정체 모를 **총수**와는 다른 사람인가. (→ 제피르 팰컨 기지 1차 \"어떤 조직인가\" 참고)\n\n### 가끔 사라지는 클라우제비츠\n- 메디치 말로는 군사 **클라우제비츠**가 가끔 **남몰래 사라질 때**가 있다.\n- 리브레빌에서도 다른 사람들보다 먼저 와 있었다. 혼자 따로 움직이는 일이 잦은 사람이다. (→ 리브레빌 1차 \"에스테와 메디치\" 참고)\n- 🔸 어디에 가서 무엇을 하나. 누구를 만나나.\n\n### 기지 지하의 롱기누스의 창\n- 기지 지하 숨은 던전에서 **롱기누스의 창**을 얻었다. 창 계열에서 가장 센 무기다. (→ 제피르 팰컨 기지 2차 \"벽 뒤로 빨려 들어간 사람\" 참고)\n- 이름은 십자가에 매달린 예수의 옆구리를 찔렀다는 로마 병사 롱기누스의 창에서 따왔다. 성창(聖槍)이라고도 부른다. (→ \"이름의 모티브\" 참고)\n\n### 기지 지하에서 없어진 물건\n- 기지 지하에서 만난 사람이 **물건이 없어졌다**고 한다.\n- 이 얘기와 이어지는 이벤트는 자료(나무위키, 디시 갤러리 공략 글, 서브 퀘스트 목록)에서 찾지 못했다. 기지에서 챙길 이벤트로 알려진 건 **보르스 옆 서랍**과 **지하 던전(롱기누스의 창)** 정도다.\n- 🔸 무엇이 없어졌고, 누가 가져갔나.\n\n### 로우엔군이 움직인다\n- **프레데릭의 로우엔군**이 움직이고 있다. 프레데릭이 저택에서 말한 그대로다. (→ 한편, 프레데릭 저택 \"제피르 팰컨을 노린다\" 참고)\n- 프레데릭의 힘을 빌린 **지방 영주들**이 제피르 팰컨 포로를 붙잡아 두고 있다. 프레데릭이 직접 치기보다 영주들을 앞세우는 모양새다.\n- 🔸 이번엔 루벤이나 라몬 같은 악덕 영주가 아니라, 나쁜 사람으로 그려지지 않던 프레데릭이 상대다. 시라노에게는 아버지의 원수이기도 하다.\n\n### 포로가 갇힌 세 곳\n- **프리토리아**: 에스메랄다의 고향. 라몬 자작을 몰아낸 뒤 제피르 팰컨 세력 아래 있었지만, 얼마 전 **프레데릭의 지휘로 새 영주**가 들어섰다. (→ 프리토리아 1차 참고)\n  - 에스메랄다는 프리토리아에 가면 **자기 병원**에 들러 볼 수 있겠다며 가 보고 싶어 한다. 라몬에게 끌려간 뒤 시라노 일행을 따라나서느라 병원을 비워 둔 채다. (→ 프리토리아 1차 \"에스메랄다\" 참고)\n  - 🔸 새 영주는 누구인가. 에스메랄다의 병원과 마을 사람들은 무사한가.\n- **멤피스**: 처음 나온 이름이다. ✅ 어떤 곳인가 → 난폭한 새 영주가 들볶아 살기 힘들어진 마을이었다. 영주를 무찌르고 포로를 구했다(멤피스 1차 참고).\n- **보르도**: 로우엔 바로 북쪽. 칼스 장군의 멸살지옥검이 꽂혀 있다는 **마검숲**이 로우엔과 보르도 사이에 있다고 들었다. (→ 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- 이름은 실제 도시에서 따왔다. 멤피스(고대 이집트의 수도, 미국 테네시의 도시), 보르도(프랑스 남서부의 포도주 도시). (→ \"이름의 모티브\" 참고)\n\n---\n\n## 프리토리아 산 — 피닉스의 동굴 (포로 구출 가는 길)\n\n### 피닉스의 알\n- 피닉스의 동굴 깊은 곳에서 **피닉스의 알**을 얻었다. 화염 마법을 붙여 주고 소환수 **피닉스**를 불러낸다.\n- 사이럽스에서 들은 \"프리토리아 근처 산의 이상한 기운\"은 이 알이었던 것으로 보인다(추측). (→ 사이럽스 1차 \"소문 — 이상한 장소들\" 참고)\n- 프리토리아 근방에 **전설의 창**이 있다는 소문도 들었는데, 창은 이 산이 아니라 기지 지하에서 나왔다(롱기누스의 창). (→ 카라카스 근처 숲 \"소문 — 프리토리아 근방의 전설의 창\", 제피르 팰컨 기지 4차 참고)\n- 피닉스는 불 속에서 죽었다가 다시 살아난다는 전설의 새다. 불사조라고도 한다. (→ \"이름의 모티브\" 참고)\n\n---\n\n## 프리토리아 (2차 — 포로 구출 임무)\n\n- 도착했다. 새 영주가 누구인지, 포로가 어디 있는지 아직 모른다.\n- 에스메랄다의 **진료소**에 들러 봤는데 따로 이벤트는 없었다.\n- 영주 저택은 1차 때 에스메랄다를 구하러 들어갔던 **옛 라몬 저택** 그대로다. 주인만 프레데릭이 앉힌 새 영주로 바뀌었다. (→ 프리토리아 1차 \"영주 라몬 자작\", 제피르 팰컨 기지 4차 \"포로가 갇힌 세 곳\" 참고)\n\n### 기다리고 있던 새 영주\n- 저택에서 만난 새 영주는 **제피르 팰컨이 올 것을 미리 알고** 있었다. 포로를 미끼로 붙잡아 두고 **투르족 용병**을 사서 기다렸다.\n  - 🔸 어떻게 알았을까. 포로를 잡아 둔 것 자체가 제피르 팰컨을 끌어내려는 덫이었나. 아니면 안에서 정보가 샌 걸까. (→ 제피르 팰컨 기지 4차 \"가끔 사라지는 클라우제비츠\" 참고)\n- **투르족**은 동쪽에서 50년째 팬드래건과 전쟁 중인 투르 제국 사람들이다. 그런 투르 사람을 제국령 영주가 용병으로 쓰고 있다.\n  - 옛 영주 라몬도 투르에서 무기를 들여와 팔았다. 프리토리아는 주인이 바뀌어도 투르와 끈이 이어져 있다. (→ 프리토리아 1차 \"영주 라몬 자작\" 참고)\n  - 🔸 투르와 제국(체사레, 프레데릭 쪽) 사이에 따로 손잡은 게 있나. (→ 세계관 \"투르 제국 / 50년 전쟁\" 참고)\n- 싸움에서 이기자 시라노는 영주를 죽이지 않고 **포로를 풀어 주고 떠나라**고만 했다. 라몬 때처럼 피를 보지 않고 끝냈다.\n  - 🔸 영주가 물러난 프리토리아는 다시 제피르 팰컨 쪽이 되나. 프레데릭은 이 소식을 듣고 어떻게 나올까. (→ 한편, 프레데릭 저택 \"제피르 팰컨을 노린다\" 참고)\n- 1차 방문 때 들은 마을 이야기는 → 프리토리아 1차 참고.\n\n---\n\n## 리브레빌 (2차 — 포로 구출 임무 중 들름)\n\n### 열린 투기장과 썬더메어\n- 투기장 주인과 친하다는 무기 상점 주인을 거쳐, 주인의 집에서 **투기장 열쇠**를 찾았다. 투기장 안쪽은 지도도 안 나오는 미로 동굴이었다. (→ 리브레빌 1차 \"잠긴 투기장\" 참고)\n- 가장 깊은 곳에서 소환수 **썬더메어**를 얻었다. 적 전체에 번개를 떨어뜨린다.\n- 🔸 주인은 왜 투기장을 잠가 두고 자리를 비웠나. 투기장 밑에 왜 저런 동굴이 있나.\n- 이름은 영어 thunder(천둥)와 mare(악몽, 또는 암말)를 합친 말로 보인다(추측). (→ \"이름의 모티브\" 참고)\n\n---\n\n## 멤피스 (1차 — 포로 구출 임무)\n\n### 영주가 바뀐 뒤 무너진 마을\n- 예전엔 살기 좋은 마을이었는데, **영주가 바뀐 뒤로** 사람들을 들볶아 살 수가 없게 됐다. 새 영주는 **난폭하기로 소문**이 났다.\n  - 포로를 붙잡아 둔 것도 이 영주였다. 저택에 숨어들어 영주를 무찌르고 포로를 구했다.\n- 이곳에서 결혼해 살려면 **결혼세**를 내야 한다. 그래서인지 **여자들이 마을에 남으려 하지 않는다.**\n- 마을을 버리고 **리브레빌로 떠나는** 사람이 많다. 리브레빌은 에스테 도데가 꾸려 가는 자유 도시다. (→ 리브레빌 1차 참고)\n\n### 또 투르족 용병\n- 멤피스 영주도 **투르족 군대**를 사서 저택을 지키고 있었다. 프리토리아 새 영주에 이어 두 번째다. (→ 프리토리아 2차 \"기다리고 있던 새 영주\" 참고)\n- 프레데릭 편에 선 영주들이 한결같이 투르 병력을 쓴다. 한 영주의 일이 아니라 뒤에서 누군가 투르와 줄을 대 주고 있는 것처럼 보인다(추측).\n  - 🔸 그 줄을 댄 게 프레데릭인가, 체사레인가. 50년째 팬드래건과 싸우는 투르가 왜 제국령 영주들을 돕나. (→ 세계관 \"투르 제국 / 50년 전쟁\" 참고)\n\n### 근처를 지나간 아름다운 여인\n- 얼마 전 마을 근처를 **아름다운 여인**이 지나가는 걸 본 사람이 있다.\n- 🔸 누구일까. 이름도 생김새도 나오지 않았다.\n\n### 혼자 사는 남자, 시드\n- 마을 **왼쪽 위 집**에 **시드**라는 남자가 산다. 늘 혼자 지내고 언제나 슬픈 얼굴이다.\n- 직접 말을 걸면: 꿈은 **학자**였다. 어딘가에서 **간신히 목숨만 건져 도망쳐** 왔고, 이곳에 온 지는 **10년쯤** 됐다.\n- 🔸 어디서, 무엇에게서 도망쳤나. 학자의 꿈을 왜 접었나.\n  - 학문과 엮인 위험이라면, 시라노가 금서 『창세전쟁의 비록』을 읽었다가 죄인으로 몰린 일이 먼저 떠오른다. 이어져 있는지는 아직 모른다(추측). (→ 세계관 \"『창세전쟁의 비록』\" 참고)\n\n---\n\n## 로우엔 동굴 — 유성검 던전 (멤피스에서 로우엔 가는 길)\n\n### 산에 박힌 칼의 정체\n- 카라카스에서 들은 \"로우엔 근처 산에 박힌 이상한 칼\"은 이 동굴의 **유성의 검**이었다. 숲에 꽂혀 있다는 멸살지옥검과는 다른 칼이다. (→ 카라카스 \"소문 — 로우엔 근처에 박힌 이상한 칼\" 참고)\n- 🔸 누가 왜 이 동굴에 칼을 두었나. 이름처럼 하늘에서 떨어진 별(운석)과 얽힌 칼인가.\n- 이름의 모티브 → \"유성의 검\" 참고.\n\n---\n\n## 마검숲 (보르도 가는 길, 멸살지옥검을 찾으러)\n\n### 칼 스타이너의 비석\n- **\"칼 스타이너, 이곳에서 검의 도를 얻다\"**라고 새긴 비석이 있다. 그런데 그 자리에 멸살지옥검은 없다.\n- 비석의 뜻은 \"검이 여기 있다\"가 아니라 \"이 사람이 여기서 깨달음을 얻었다\"는 기념비에 가깝다. 검을 찾는 사람에겐 엉뚱한 곳처럼 보일 수밖에 없다.\n- 🔸 **칼 스타이너는 누구인가.** 소문 속 \"칼스 장군\"과 같은 사람일까.\n  - `[외부 설정]` 나무위키에는 칼스의 이름이 **칼스 브란트**로 나온다. 비석의 \"칼 스타이너\"와는 성이 다르다. 칼스를 달리 부른 이름인지, 다른 검사인지는 확인하지 못했다.\n  - 같은 사람이라면, 칼스가 이 근처에서 검술을 깨친 인연으로 검이 이 숲에 남게 됐다는 이야기일 수 있다(추측). (→ 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- ✅ 멸살지옥검은 숲 어디에 있나 → 비석보다 더 들어간 **숲 가장 안쪽**에 꽂혀 있었다. (마검숲 2차에서 풀림)\n\n---\n\n## 반란군의 마을 (1차 — 로우엔 가는 길)\n\n### 스스로 일어난 작은 반란군\n- 누가 이끌어 세운 게 아니라 사람들이 **스스로 모여 만든** 반란군 마을이다.\n- 규모가 작아서 **제피르 팰컨도, 영주들도 크게 신경 쓰지 않는다.**\n- 🔸 **무엇에 맞선 반란군인가.** 마을 사람 말에는 아직 나오지 않았다.\n  - 영주들이 신경 쓰지 않는다는 말로 보면, 맞서는 상대는 **제국령 영주들**(그리고 그 뒤의 교회 세력) 쪽일 가능성이 크다(추측). 멤피스처럼 영주가 들볶는 마을이 많으니 그런 데서 버티다 못한 사람들이 모였을 수 있다. (→ 멤피스 1차 \"영주가 바뀐 뒤 무너진 마을\" 참고)\n  - 바로 옆 로우엔이 프레데릭의 영지라는 점도 걸린다. 프레데릭에 맞선 사람들인지는 모르겠다. (→ 한편, 프레데릭 저택 참고)\n  - 제피르 팰컨과 같은 쪽에 서 있는 셈인데도 서로 손잡지 않았다. 🔸 앞으로 엮이게 될까.\n\n---\n\n## 로우엔 (1차 — 포로 구출 임무 중, 보르도 가는 길)\n\n### 약국 안쪽의 막힌 상자\n- 약국 안쪽에 상자가 있는데, 들어가려 하면 NPC가 들어가지 말라고 막는다.\n- 🔸 무엇이 들었고, 어떻게 해야 들어갈 수 있나.\n\n### 투기장 평생 이용권\n- 로우엔에서 **투기장 평생 이용권**을 얻었다.\n- 카라카스 투기장 '네메아의 사자'는 입장권을 사서 들어가야 했고, 끝없이 싸울 수도 없었다. 이용권이 그 제한을 풀어 주는 물건일 수 있다(추측). (→ 카라카스 1차 \"투기장 '네메아의 사자'\" 참고)\n- 네메아의 사자 주인이 **로우엔에서 형이 하는 투기장**이 있다고 했다. 이용권이 하필 로우엔에서 나온 것도 그와 이어져 보인다(추측).\n- 🔸 로우엔 투기장은 어디 있나.\n\n### 요리사 카그의 사랑의 향초\n- 카라카스 주점 요리사 **카그**의 부탁을 풀 방법을 들었다. **파로 마을**에서 **사랑의 향초**를 얻어 카그에게 갖다주면 된다.\n- 카라카스에서는 \"프리토리아에 사는 사람이 사랑의 향초를 발견했다\"고 들었는데, 얻는 곳은 파로 마을이라고 한다. 프리토리아 사람이 파로 마을에서 찾아냈다는 얘기일 수 있다(추측). (→ 카라카스 1차 \"요리사 카그의 부탁\" 참고)\n- ✅ 누가 갖고 있나 → 파로 마을에 사는 **카그의 형**이었다. 형에게서 사랑의 향초를 얻었다. (파로 마을 1차에서 풀림)\n- ✅ 갖다주면 카그가 무엇을 주나 → **실버잼**. (카라카스 3차에서 풀림)\n\n---\n\n## 파로 마을 (1차 — 요리사 카그의 사랑의 향초를 찾으러)\n\n### 평화롭다는 마을\n- 마을 사람 말로는 바깥세상은 시끄러워도 **이 마을만은 평화롭고 조용하다.** 영주에게 들볶이는 멤피스나 반란군이 모인 마을과는 딴판이다. (→ 멤피스 1차, 반란군의 마을 1차 참고)\n- 그런데 바로 그 마을에서 웨어링 집안 부자는 저주와 \"끔찍한 짓\"을 이야기한다. 겉으로 보이는 평화와는 어긋난다. (→ 아래 \"웨어링 집안\" 참고)\n- 🔸 정말 평화로운 마을인가. 마을 사람들은 웨어링 집안 일을 모르는 걸까.\n- 🔸 교회 세력이나 영주들은 왜 이 마을을 건드리지 않나. 작고 외진 마을이라 거둘 것이 적어서일 수 있다(추측). 반란군의 마을도 규모가 작아 아무도 신경 쓰지 않는다고 했다. (→ 반란군의 마을 1차 참고)\n\n### 아이들을 좋아한다는 영주\n- 마을 사람 말로는 이 마을 **영주가 아이들을 좋아하는지**, 영주 집안에 **아이들이 꽤 많다**고 한다. 그런데 그 아이들이 **모두 여자아이**다.\n- 영주는 **꽃도 좋아해서** 저택 **정원에 꽃이 아주 많다**고 한다.\n- 마을 사람은 좋게 말하지만, 어디서 온 아이들인지, 왜 그렇게 많은지는 말하지 않는다. 그냥 넘기기엔 수상하다.\n- 지금까지 만난 영주들은 하나같이 평판이 나빴다. 프리토리아의 라몬은 여자 문제와 마녀재판으로, 멤피스 영주는 결혼세로 사람들을 괴롭혔다. (→ 카라카스 1차 \"영주들 평판이 나쁘다\", 멤피스 1차 참고)\n- 🔸 그 아이들은 누구인가. 영주는 왜 **여자아이만** 모으나.\n- 🔸 웨어링 집안의 \"끔찍한 짓\", \"최근 일련의 사건\"과 이어지는 일인가. (→ 아래 \"웨어링 집안\" 참고)\n\n### 메디치 현상수배\n- 마을에 **메디치의 현상수배**가 붙어 있다. 제피르 팰컨을 이끄는 메디치가 이제 수배자로 쫓기고 있다.\n- 카라카스 공격, 니코시아 교회 요새 습격, 포로 구출까지 제피르 팰컨이 크게 움직인 뒤다. 프레데릭이 로우엔군을 움직인 것과 같은 흐름으로 보인다(추측). (→ 제피르 팰컨 기지 4차 \"로우엔군이 움직인다\" 참고)\n- 교회도 영주도 관심 없다는 이 조용한 마을에까지 수배령이 닿았다. (→ 위 \"평화롭다는 마을\" 참고)\n- 🔸 누가 수배를 내렸나(체사레? 프레데릭?). 시라노는 수배되지 않았나.\n\n### 소문 — 누군가 아수라를 뽑았다\n- **제국의 패자(覇者)를 정한다는 마검 아수라**를 **누군가 뽑았다**는 소문이 돈다.\n- 아수라를 뽑은 건 바로 시라노다. 폭풍도에서 이올린에게 검술을 배우고 아수라 수호신을 쓰러뜨려 손에 넣었다. (→ 폭풍도 1차 \"아수라 도전\" 참고)\n  - 그 일이 소문이 되어 이 외진 마을까지 퍼졌다. 다만 뽑은 사람이 누구인지는 아직 알려지지 않은 모양이다.\n- 아수라는 흑태자의 검이다. 사람들은 이 검을 단순한 명검이 아니라 **제국의 주인을 가리는 징표**처럼 여기고 있다.\n  - 체사레는 제국 통일과 흑태자의 영광 재현을 꿈꾼다. 이 소문이 체사레 귀에 들어가면 그냥 넘기지 않을 것이다(추측). (→ 세계관 \"마검 아수라\", \"체사레는 왜 시라노를 함정에 빠뜨렸나\" 참고)\n- 🔸 아수라를 뽑은 사람이 시라노라는 게 알려지면 어떻게 될까.\n\n### 샤론의 사인을 받아 달라는 소녀\n- 마을 소녀가 **가수 샤론**을 만나면 **사인을 받아 달라**고 부탁한다. 샤론의 이름이 이 작은 마을까지 퍼져 있다.\n- 샤론은 니코시아 마을 여관에 있었다. 그런데 정작 본인은 노래에 질려 더는 부르고 싶지 않다고 했다. (→ 니코시아 1차 \"가수 샤론\", 게이시르 시티 1차 \"가수 샤론\" 참고)\n- 마을의 다른 집에 **샤론의 사인을 이미 가진 사람**이 있다. **'아스모데우스의 파편'** 같은 걸 갖다주면 사인을 넘겨줄 생각이 있다고 한다.\n  - 니코시아까지 샤론을 찾아가지 않아도, 이 사람과 바꾸는 길이 있는 셈이다.\n- 🔸 **아스모데우스의 파편**은 무엇이고 어디서 얻나. 자료에서 찾지 못했다.\n- 사인은 니코시아 2차에 **샤론에게 직접 받았다.** 아스모데우스의 파편으로 바꿀 필요는 없어졌다.\n- ✅ 사인을 갖다주면 소녀는 무엇을 주나 → **얼음의 반지**. (파로 마을 2차에서 풀림)\n- 이름 모티브 → \"아스모데우스\" 참고.\n\n### 웨어링 집안 — \"저주받은 피\"\n마을 초입의 집에 사는 웨어링 부자와, 아들의 약혼녀 다이아나를 둘러싼 이야기다.\n\n**브리앙과 다이아나**\n- 다이아나는 **게이시르 학술원**에서 브리앙을 처음 만났다. 조용한 곳을 찾아 **파로**로 왔고, **1년 뒤 약혼**했다.\n- 다이아나는 마을 **최고의 미인**, 브리앙은 **마을 여자들이 다 바라보던** 남자였다. 그래서 약혼을 발표하자 **질투 때문에 아무도 반기지 않았다.**\n- 다이아나는 브리앙이 **지극히 정상**으로 보인다며, 병이라면 **무슨 수를 써서라도 고치겠다**고 한다. 약혼은 아직 깨지지 않았다.\n\n**브리앙이 털어놓은 일 — 늑대**\n- 증세는 **작년 가을 마을 축제** 날 시작됐다. 그날 저녁 브리앙은 술에 크게 취했다.\n- 정신을 차리고 숙취로 아픈 머리를 식히러 세면실에 갔더니 **손에 피가 묻어 있었다.** 정작 자기 몸엔 다친 데가 없었다.\n- 다음 날 **마을에 늑대가 나타나 닭과 가축을 죽이고 달아났다**는 얘기가 돌았다. 브리앙은 그게 **자기가 한 짓**이라고 믿는다. 잠든 사이 자기도 모르게 그러는 것 같다고 한다.\n- 그래서 결혼하면 **다이아나를 해칠까 봐** 결혼할 수 없다며 자책에 빠져 있다. 앞서 \"내 손으로 끔찍한 짓을 했다\"던 말이 이것이다.\n- ✅ 정말 브리앙이 늑대가 되어 가축을 죽였나 → 아니다. 댄이 가시독말풀로 환각에 빠뜨려 그렇게 믿게 만들었다. (파로 마을 1차에서 풀림)\n\n**집안 내력이라는 말들**\n- 아버지 **댄 웨어링**은 집안이 **저주받았다**며 결혼을 반대한다. **최근 일련의 사건**으로 아들도 **집안의 피를 깨달은 모양**이라며 음산하게 웃는다.\n- 주점 사람 말로는, 웨어링 집안은 **돈이 많아** 예부터 **유산과 상속을 둘러싼 음모**가 끊이지 않았다. 다툼을 줄이려고 **친척끼리 혼인**을 시켜 왔는데, 그러다 **집안 대대로 정신병**이 생긴 것 같다고 한다.\n- 댄의 오랜 친구 **헤이슨**은 미친 사람은 늘 미쳐 있는 게 아니라 **발작이 가끔 오는 것**이고, 이건 **고칠 수 없는 집안 내력**이라고 한다. 그래서 친구 아들이 불행해지지 않게 **다이아나를 설득해 결혼을 단념시키려** 한다.\n- 마을 바깥에서 만난 사람도 **\"그 약혼은 잘못된 거였다, 그 집안은 아예 결혼을 시키지 말아야 한다\"**고 펄쩍 뛴다.\n\n**레이첼과 헤이슨 — 브리앙은 댄의 아들인가**\n- 댄의 아내는 **레이첼**이다. 그런데 **헤이슨도 레이첼을 좋아했다.** 댄과 레이첼이 결혼하자 헤이슨은 멀리 여행을 떠났다.\n- 헤이슨이 떠나고 얼마 안 돼 레이첼이 **브리앙을 예정보다 일찍 낳았다.** 마을 사람들은 브리앙이 정말 댄의 아들인지 수군거렸고, 레이첼과 헤이슨 사이를 의심했다. 댄은 자기 아들이 맞다고 공개적으로 밝혔다.\n- 헤이슨은 **돌아온 지 얼마 안 됐다.**\n- 브리앙이 댄의 친아들이 아니라면, \"웨어링 집안의 피\"라는 말부터 흔들린다.\n- 브리앙이 댄의 친아들이 아니라는 건 댄 스스로 털어놓았다(아래 \"풀린 진실\" 참고).\n\n**시라노의 의심 — 일부러 꾸민 일인가**\n- 시라노는 브리앙이 이상해진 게 **누가 일부러 꾸민 일**이라면 **약국**에서 단서를 얻을 수 있으리라 본다.\n- 약국에 대놓고 \"극약을 판 적 없냐\"고 물었다가 **혼만 났다.** (자동 저장 시점부터 다시 해서) 이번엔 **\"댄 웨어링 씨가 좋아할 만한 물건\"**을 물었다.\n- 약국 주인 말:\n  - 댄은 요즘 **눈이 안 좋아서** **가시독말풀로 만든 약**을 먹고 있다. **오래 먹어 와서 먹는 양도 잘 안다.**\n  - 그런데 **요새 약국에 오지 않는다.** 가시독말풀을 사다 주면 좋겠다고 한다.\n- 시라노 일행은 약은 받지 않고 **웨어링 집**으로 향한다.\n- `[실제 식물 정보]` 가시독말풀(흰독말풀 무리, 영어 thorn apple)은 실제로 **독이 있는 풀**이다. 눈동자를 키우는 성분이 있어 옛날엔 약으로도 썼지만, 양이 넘치면 **헛것을 보고 날뛰거나 정신을 잃고 그때 일을 기억 못 하는** 중독을 일으킨다.\n- ✅ 가시독말풀은 어디에 쓰였나 → 댄이 브리앙에게 먹였다. (파로 마을 1차에서 풀림)\n- ✅ 브리앙의 \"기억 안 나는 밤\"과 가시독말풀은 관계가 있나 → 있다. (파로 마을 1차에서 풀림)\n\n**풀린 진실 — 댄이 꾸민 일**\n- 웨어링 집에서 브리앙과 이야기하던 중 다이아나와 헤이슨이 뒤따라 들어온다. 그 자리에서 시라노가 사건을 밝힌다.\n- 브리앙은 미친 게 아니라, **누군가 그를 미친 사람처럼 보이게 하려고 판 함정**에 빠졌던 것이다.\n- 꾸민 사람은 아버지 **댄**이다. 브리앙이 **자기 친아들이 아니라는 데서 온 질투**로, 브리앙에게 **가시독말풀**을 먹여 환각에 빠뜨리고 미친 것처럼 보이게 연극을 했다.\n  - 시라노는 사고로 죽었다는 브리앙의 **어머니 레이첼**의 죽음도 단순한 사고가 아닐 거라고 짚는다.\n- 댄의 고백: 레이첼이 임신했다고 했을 때 당황하고 분노했다. 그는 **자식을 볼 수 없는 몸**이었다.\n- 광기 어린 말을 쏟아내던 댄은 머리가 아프다며 약을 사러 간다고 나간다. 곧 **총소리**가 들린다. 스스로 목숨을 끊은 것으로 보인다.\n- 브리앙은 다이아나와 **당분간 여행을 다니며 머리를 식히겠다**고 한다. 그리고 집안의 가보 **블러디 스톤**을 시라노에게 준다.\n  - 아이템 설명에 **\"흡혈 능력\"**이라고 적혀 있다. 공격으로 준 피해의 일부만큼 자기 체력을 되찾는 능력으로 보인다(추측, 자료에서 정확한 수치는 찾지 못했다).\n\n**의문**\n- ✅ 저주인가, 병인가, 누가 꾸민 일인가 → **댄이 가시독말풀로 꾸민 일**이었다. 저주도 유전병도 아니었다. (파로 마을 1차에서 풀림)\n- 🔸 브리앙의 친아버지는 헤이슨인가. 댄이 친아들이 아니라고 했을 뿐, 누구인지는 끝내 말하지 않았다. 마을 소문과 헤이슨이 끝까지 브리앙 일에 나선 걸 보면 헤이슨일 가능성이 커 보인다(추측).\n- 🔸 레이첼의 죽음은 정말 댄의 짓인가. 시라노의 짐작으로 남았다.\n- ✅ 아들의 불행을 막겠다는 댄은 왜 그 얘기를 하며 웃었나 → 브리앙을 미친 사람으로 만든 게 바로 댄이었다. (파로 마을 1차에서 풀림)\n- 🔸 바깥에서 화를 내던 사람은 누구인가(약혼녀 쪽 가족? 질투하던 마을 사람?).\n- ✅ 브리앙이 결혼하려던 상대는 누구인가 → 마을 최고의 미인 **다이아나**. (파로 마을 1차에서 풀림)\n- ✅ 다이아나는 지금 어떻게 됐나 → 브리앙 곁을 지키며 병이라면 고치겠다고 한다. (파로 마을 1차에서 풀림)\n- ✅ 브리앙이 말한 \"끔찍한 짓\"은 무엇인가 → 잠든 사이 늑대가 되어 가축을 죽였다고 스스로 믿는 일. (파로 마을 1차에서 풀림. 정말 그런지는 🔸)\n- 이름 모티브 → \"웨어링\" 참고.\n\n---\n\n## 카라카스 (3차 — 요리사 카그에게 사랑의 향초 전달)\n\n### 카그의 부탁을 마치다\n- 파로 마을의 카그의 형에게서 받은 **사랑의 향초**를 카라카스 주점의 **카그**에게 전했다. 답례로 **실버잼**을 받았다. (→ 카라카스 1차 \"요리사 카그의 부탁\", 로우엔 1차 \"요리사 카그의 사랑의 향초\", 파로 마을 1차 참고)\n- 카라카스에서 처음 부탁을 듣고, 로우엔에서 실마리를 듣고, 파로 마을에서 향초를 얻어 돌아오기까지 세 마을을 돈 서브 퀘스트였다.\n\n---\n\n## 니코시아 (2차 — 샤론의 사인을 받으러)\n\n### 샤론의 사인\n- 파로 마을 소녀의 부탁으로 니코시아 여관의 **샤론**을 다시 찾아가 **사인**을 받았다. (→ 니코시아 1차 \"가수 샤론\", 파로 마을 1차 \"샤론의 사인을 받아 달라는 소녀\" 참고)\n- 1차 때 노래가 지겹다던 샤론이지만, 먼 마을의 어린 팬 얘기에는 사인을 해 주었다.\n- 🔸 샤론은 왜 노래에 질렸나. 이번에도 풀리지 않았다.\n\n---\n\n## 파로 마을 (2차 — 소녀에게 샤론의 사인 전달)\n\n### 소녀의 답례 — 얼음의 반지\n- 니코시아에서 받아 온 샤론의 사인을 소녀에게 전하고 **얼음의 반지**를 받았다. (→ 파로 마을 1차 \"샤론의 사인을 받아 달라는 소녀\", 니코시아 2차 참고)\n- 파로 마을 → 니코시아 → 파로 마을을 오간 서브 퀘스트였다.\n- 이름으로 보아 얼음 속성 장신구로 보인다. 정확한 효과는 자료에서 찾지 못했다.\n\n---\n\n## 로우엔 (2차 — 카오스 큐브 전설을 들으러)\n\n### 제국의 영화를 되살리자는 도시\n- 로우엔 사람들은 **실버 애로우가 투르 제국과의 전쟁으로 크게 약해진 지금**이 **옛 제국의 영화를 되살릴 더없이 좋은 때**라고 말한다. (→ 세계관 \"투르 제국 / 50년 전쟁\" 참고)\n- 로우엔의 **남자들은 모두 프레데릭군 병사**다. 도시 전체가 하나의 군대인 셈이다. 1차 때 본 반듯한 거리와 병사들도 그래서였다. (→ 로우엔 1차, 제피르 팰컨 기지 4차 \"로우엔군이 움직인다\" 참고)\n- 마을 사람들은 **로우엔에 대한 자부심**이 커 보인다. 멤피스나 파로처럼 영주를 두려워하거나 모르는 척하는 분위기와는 다르다.\n- 사람들은 대부분 **프레데릭을 좋게 보고**, **제피르 팰컨은 좋지 않게** 본다. 다른 곳에선 악덕 영주를 몰아내는 편이던 제피르 팰컨이 여기선 질서를 어지럽히는 무리다.\n  - 프레데릭은 영지를 잘 다스려 백성의 신뢰를 얻은 영주로 보인다. 라몬이나 멤피스 영주처럼 쉽게 \"악당\"으로 몰 수 없는 상대다. (→ 제피르 팰컨 기지 4차 \"로우엔군이 움직인다\" 참고)\n- 체사레의 \"제국 통일, 흑태자 영광 재현\"과 같은 말이 프레데릭의 영지에서는 사람들 입에서 자연스럽게 나온다. 체사레는 장인, 프레데릭은 사위다. (→ 한편, 프레데릭 저택 참고)\n- 🔸 프레데릭도 장인 체사레의 야망에 함께하나. 막간에서는 체사레가 평민을 너무 억누르는 걸 걱정하던 사람이다.\n- 🔸 50년 전쟁이 서쪽을 어떻게 흔드나 → 실버 애로우가 약해진 틈에 제국 부활을 꿈꾸는 세력이 커지고 있다. (세계관 \"투르 제국 / 50년 전쟁\"의 실마리)\n\n### 카오스 큐브 전설의 끝\n- 리브레빌에서 듣다 만 **아웬과 엘**의 이야기를 로우엔에서 끝까지 들었다. 다 듣고 나니 **호크아이**를 얻었다. (→ 리브레빌 1차 \"카오스 큐브의 전설\" 참고)\n- 전설의 뒷부분 내용 ❓ — 들은 내용을 알려 주면 채운다.\n- 🔸 호크아이는 어떤 물건인가. 이름(매의 눈)으로 보아 명중률을 올려 주는 장비로 보인다(추측).\n\n### 소문 — 보르도 근처의 이상한 안경 쓴 사람들\n- **보르도 근처**에 **이상한 안경을 쓴 사람들**이 돌아다닌다고 한다. 보르도는 마지막 포로가 갇힌 곳이고, 가는 길에 마검숲이 있다.\n- 🔸 누구인가. 포로를 잡아 둔 쪽과 관계가 있나. (→ 마검숲 2차 \"커티스 요원들\" 참고)\n\n### 소문 — 검을 고치는 달인 파즈\n- **파즈**라는 **검 고치는 달인**이 있었는데, 마지막으로 **안타나나리보 근방**에서 본 뒤로 소식이 끊겼다고 한다.\n- 이올린에게 받은 **낡은 엑스칼리버**를 고칠 사람으로 보인다. 공략 자료로는 안타나나리보 옆 **망티고아 산**의 유니콘 동굴에서 파즈를 만날 수 있다. 망티고아 산은 안타나나리보 1차 때 아직 못 올라갔다. (→ 안타나나리보 1차 \"문제의 마을은 여기가 아니다?\" 참고)\n- ✅ 파즈는 어디 있나 → 망티고아 산 **유니콘 동굴**에서 만나 엑스칼리버를 고쳤다. (망티고아 산 1차에서 풀림)\n  - 🔸 왜 그 동굴에 들어가 소식이 끊겼나.\n\n### 도착하자마자 받은 실버잼\n- 로우엔에 들어서자마자 시라노가 **\"이렇게까지 부탁하는데 들어주자\"**고 하더니 **실버잼**을 얻었다.\n- 🔸 누가 무엇을 부탁했나. 앞서 들은 부탁 중 하나가 마무리된 것인지(로우엔 1차에서 들은 일?), 새로 생긴 일인지 확실치 않다. 카라카스의 카그도 실버잼을 줬는데, 같은 물건이 또 나왔다. (→ 카라카스 3차 참고)\n\n---\n\n## 마검숲 (2차 — 멸살지옥검을 얻으러)\n\n### 멸살지옥검\n- 비석에서 더 들어간 **숲 가장 안쪽**에 꽂혀 있었다. 카라카스 근처 숲에서 들은 소문 그대로 칼스 장군의 검이다. (→ 마검숲 1차 \"칼 스타이너의 비석\", 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n- 장비할 수 있는 사람: 시라노, 실버, 샤른호스트, 메디치. 들면 필살기 **진무 천지파열**을 쓸 수 있다.\n- **암흑 속성**이라 암흑 속성 몬스터에게는 잘 안 듣는다. 이름값에 비해 성능은 애매하다는 평이 많다.\n- `[외부 설정]` 칼스는 화룡 **헬카이트**를 봉인한 사람으로 나오고, 리메이크에선 이 검으로 헬카이트를 베었다고 한다. 시라노가 게이시르 숲 화룡굴에서 크림슨 헬카이트를 얻은 것과 묘하게 겹친다.\n\n### 커티스 요원들\n- 숲에 **커티스 요원들**이 먼저 와 있었다. 전형적인 악당처럼 굴면서, **자기네 윗선이 멸살지옥검을 탐낸다**고 하고 덤벼들었다. 꽤 강하다.\n- 커티스는 리브레빌 동쪽 도로가 이어지는 곳이다. 제국령 밖 세력이 제국의 이름난 검을 노리고 사람을 보낸 셈이다. (→ 리브레빌 1차 참고)\n- 🔸 **그 \"윗선\"은 누구인가.** 게임 안에서는 아직 밝혀지지 않았다.\n- 🔸 커티스는 왜 제국의 옛 유물을 모으나. 아수라를 누가 뽑았다는 소문(파로 마을 1차)과 이어지는지도 궁금하다.\n- 🔸 로우엔에서 들은 **보르도 근처의 이상한 안경 쓴 사람들**이 이들일까(추측). 보르도는 바로 위다. 화룡굴에서도 선글라스 낀 조직원들이 나왔다(→ 화룡굴 2차 참고). (→ 로우엔 2차 \"소문 — 보르도 근처의 이상한 안경 쓴 사람들\" 참고)\n\n---\n\n## 보르도 (1차 — 포로 구출 임무, 마지막 포로)\n\n### 들어서며\n- 포로가 갇힌 세 곳 가운데 **마지막 도시**다. 프리토리아와 멤피스에선 영주가 포로를 붙잡고 있었다. (→ 프리토리아 2차, 멤피스 1차 참고)\n- ✅ 여기 포로는 누가 붙잡고 있나 → **보르도 영주**였다. 투르족 용병을 세워 두었는데, 무찌르고 포로를 구했다(보르도 1차). 이것으로 세 곳 포로를 다 구했다.\n- 🔸 로우엔에서 들은 **이상한 안경 쓴 사람들**, 마검숲의 **커티스 요원들**이 이 도시와 엮여 있을까. (→ 로우엔 2차, 마검숲 2차 참고)\n\n### 마을 분위기 — 유난한 주신교 신앙\n- 보르도 사람들은 **이상하리만큼 주신교를 떠받든다.**\n- 바로 아래 로우엔 사람들은 프레데릭을 따르고 제국의 영화를 되찾자던 곳이다. 이웃한 두 도시가 기대는 곳이 서로 다르다. (→ 로우엔 2차 참고)\n- 🔸 왜 이 도시만 유독 신앙이 깊은가. 포로를 붙잡은 쪽과 이어지는지도 궁금하다. 서쪽 구 제국령은 체사레의 주신교 세력이 쥐고 있다. (→ \"팬드래건 왕국 소식 (사이럽스 1차)\" 참고)\n\n### 세 번째 투르족 용병\n- 보르도 영주도 **투르족 용병**을 사서 저택을 지키고 있었다. 프리토리아, 멤피스에 이어 **세 곳 모두**다. (→ 프리토리아 2차 \"기다리고 있던 새 영주\", 멤피스 1차 \"또 투르족 용병\" 참고)\n- 이제 우연으로 보기 어렵다. 포로를 쥔 영주들 뒤에서 누군가 한꺼번에 투르 병력을 대 준 것으로 보인다(추측).\n  - 🔸 그 줄을 댄 게 프레데릭인가, 체사레인가. 주신교를 이렇게 떠받드는 도시의 영주가 50년째 팬드래건과 싸우는 투르의 칼을 빌린다는 것도 묘하다. (→ 위 \"마을 분위기 — 유난한 주신교 신앙\", 세계관 \"투르 제국 / 50년 전쟁\" 참고)\n\n### 새로 온 루치아 가족\n- 마을 사람들 입에 가장 많이 오르내리는 건 **최근 이사 온 루치아 씨네 가족**이다. 이상한 가족이고, **가족끼리 서먹서먹하다**고 한다.\n- 🔸 이 가족은 어디서 왜 왔나. 서로 왜 데면데면한가.\n\n### 소문 — 근처 숲의 이상한 검과 이상한 소리\n- 근처 숲에 **이상한 검**이 있고 **이상한 소리**가 난다는 이야기를 많이 한다.\n- 시라노 일행이 막 지나온 **마검숲의 멸살지옥검** 이야기로 보인다. 그 칼은 이미 손에 넣었다. 소리는 숲에 와 있던 커티스 요원들 때문이었을지도 모른다(추측). (→ 마검숲 2차, 카라카스 근처 숲 \"소문 — 칼스 장군의 검\" 참고)\n\n### 주점의 말하는 개구리 — 비밀의 개구리 상점\n- 주점에 사람처럼 앉은 **녹색 개구리**가 말을 한다. 열 번쯤 말을 걸어야 상점을 연다. 상점을 여러 번 열수록 덤으로 무기를 얹어 준다.\n- 자료로는 이 개구리가 **사람 물건을 훔쳐다 되파는 장물 장사꾼**이다. 상점 물건은 다 훔쳐 모은 것이라 한다. (나무위키)\n- 개발 뒷이야기: 최연규 디렉터가 게임 잡지 기자 시절 쓰던 필명 **'최개굴'**에서 따온 캐릭터다. 상점이 처음 열릴 때 나오는 **오타('도대체' 대목)도 일부러 넣은 것**이라고 한다. (나무위키)\n- [외부 설정] 개구리 옆에 후드를 쓴 여자가 있다면, 나무위키는 그를 **메이 오스틴**(코델리아 오스틴의 어머니)이라 적는다. 이 게임 안에서 따로 밝혀지는 건 아니다.\n\n\n---\n\n## 합류 장소 (포로 구출 직후)\n\n### 바뀐 합류 장소\n- 메디치가 약속 시간이 지나도 오지 않았다. 보르스가 \"클라우제비츠의 요청으로 모두 로우엔 산 정상으로 갔다\"고 전했다.\n- 보르스도 이유는 몰랐다. 프레데릭이 로우엔 산 근처에 있으니 그와 엮인 일일 거라고만 짐작했다.\n- 🔸 보르스는 이 말을 누구에게서 들었나.\n\n### 따로 움직인 카나\n- 카나는 **들를 곳이 있다**며 일행과 떨어졌다. 나중에 다시 만나기로 했다.\n- 🔸 어디에 무슨 일로 갔나.\n\n---\n\n## 로우엔 산 정상 (함정)\n\n### 누가 꾸몄나\n- 정상에는 클라우제비츠 혼자였다. 그는 **시라노가 여기서 만나자고 했다**고 들었다. 시라노 쪽엔 **클라우제비츠가 불렀다**는 말이 왔다. 양쪽에 서로 다른 거짓말을 해서 한곳에 모은 것이다.\n- 곧바로 **프레데릭의 대포 부대**가 산을 두들겼다. 제피르 팰컨 사람들이 어디로 모일지 미리 알고 기다린 셈이다.\n- 🔸 **누가 합류 장소를 바꿨나.** 제피르 팰컨의 연락 길을 알고 양쪽에 거짓 말을 넣을 수 있는 사람이어야 한다. 게임 안에서는 아직 안 밝혀졌다.\n  - 지금까지 비슷한 의심이 몇 번 나왔다. 프리토리아 새 영주는 제피르 팰컨이 올 걸 미리 알고 있었고, 세 영주 모두 투르 용병을 쓰고 있었다. (→ 프리토리아 2차 \"기다리고 있던 새 영주\", 보르도 1차 \"세 번째 투르족 용병\" 참고)\n  - 메디치가 말한 \"가끔 남몰래 사라지는 클라우제비츠\" 이야기도 있다. 다만 이번엔 클라우제비츠도 속아서 이 자리에 왔다. (→ 제피르 팰컨 기지 4차 \"가끔 사라지는 클라우제비츠\" 참고)\n- 🔸 메디치와 나머지 사람들은 어디 있나. 정말 로우엔 산으로 왔나.\n- 프레데릭이 막간에서 \"제피르 팰컨을 한번 혼내 줘야겠다\"던 말이 이렇게 돌아왔다. (→ 한편, 프레데릭 저택 \"제피르 팰컨을 노린다\", 제피르 팰컨 기지 4차 \"로우엔군이 움직인다\" 참고)\n  - 🔸 이 계략을 프레데릭이 직접 꾸몄나, 아니면 누가 그에게 정보를 넘겼나. (→ 한편, 프레데릭 포병대 \"혼내 주기만 한 프레데릭\" 참고)\n\n\n---\n\n## 한편, 프레데릭 포병대 (막간 — 로우엔 산 탈출 직후)\n\n### 혼내 주기만 한 프레데릭\n- 프레데릭은 함정에 걸린 제피르 팰컨을 **이만큼 혼내 줬으면 됐다**며 **추격대를 보내지 않았다.** 목적은 이뤘다며 바로 돌아갈 채비를 했다.\n- 막간에서 \"한번 혼내 줘야겠다\"던 말 그대로다. 쓸어버릴 생각까진 없었던 셈이다. (→ 한편, 프레데릭 저택 \"제피르 팰컨을 노린다\" 참고)\n- 🔸 프레데릭이 말한 **\"목적\"**은 무엇이었나. 혼쭐만 내는 것인가, 다른 게 더 있나.\n- 🔸 합류 장소를 바꿔 함정을 판 건 프레데릭 쪽인가. 프레데릭은 \"함정\"이라고만 했고, 어떻게 꾸몄는지는 말하지 않았다. (→ 로우엔 산 정상 \"누가 꾸몄나\" 참고)\n\n### 달아나는 무리 속 크리스티나\n- 달아나는 제피르 팰컨 가운데 **크리스티나로 보이는 사람**이 있다는 보고가 들어왔다. 프레데릭은 오히려 호탕하게 웃으며 **\"정말 녀석답군\"** 했다.\n- 크리스가 크리스티나일 거라는 짐작이 한층 굳어졌다. 프레데릭도 이제 딸이 제피르 팰컨에 있다는 걸 안다. (→ 한편, 프레데릭 저택 \"집 나간 딸 크리스티나\" 참고)\n- 딸이 자기와 맞서는 쪽에 있다는 걸 알고도 웃어넘긴다. 저택에서 \"나도 그 나이엔 세상을 돌아다녔다\"던 모습과 같다.\n- 🔸 추격대를 안 보낸 것이 딸 때문이기도 했을까(추측).\n- 🔸 이 소식이 메르세데스나 체사레 귀에도 들어갈까.\n\n\n---\n\n## 한편, 체사레와 마키아벨리 (막간 — 로우엔 산 탈출 직후)\n\n### 믿을 수 없게 된 프레데릭\n- 마키아벨리가 프레데릭이 **제피르 팰컨을 쓸어버릴 수 있었는데도 쫓지 않고 물러났다**고 보고했다. 체사레와 마키아벨리는 못마땅해하며 **프레데릭을 더는 믿을 수 없다**고 했다. (→ 한편, 프레데릭 포병대 \"혼내 주기만 한 프레데릭\" 참고)\n- 프레데릭은 **크리스티나를 비프로스트에 시집보내는 일**에도 반대했다. 장인과 사위 사이가 벌어지고 있다. (→ 한편, 프레데릭 저택 \"집 나간 딸 크리스티나\" 참고)\n  - 저택에서 프레데릭이 체사레가 평민을 너무 억누른다고 걱정하던 것과 이어진다. (→ 한편, 프레데릭 저택 \"프레데릭\" 참고)\n- ✅ 체사레가 프레데릭에게 쓴다는 **\"대책\"**은 무엇인가 → **비프로스트군을 써서 제피르 팰컨과 프레데릭을 함께 없애려** 한다. (같은 막간에서 풀림 → 아래 \"비프로스트를 손에 넣으려는 체사레\" 참고)\n- 🔸 체사레 쪽에서는 프레데릭이 왜 물러났다고 보나. 딸이 그 무리에 있었다는 건 아는가.\n\n### 조세핀은 체사레의 사람\n- 체사레가 마키아벨리에게 **조세핀에게서 연락이 왔는지** 물었다. 비프로스트 공왕의 애첩 조세핀이 체사레와 줄이 닿아 있다.\n- **모젤 2세는 이미 조세핀에게 푹 빠졌다**고 한다. 원로원이 \"공왕이 어떤 여자에게 놀아나 시키는 대로 군비를 늘린다\"고 따졌던 그 일이 체사레의 손에서 나온 셈이다. (→ 한편, 비프로스트 \"모젤 공왕과 원로원\", 리브레빌 1차 \"비프로스트 공왕의 애첩 조세핀\" 참고)\n- **방해 세력**은 **암흑살수**를 보내 없앴다고 한다.\n  - ✅ 방해 세력이 누구였나 → 원로원 **고위 인사들**이었다. 체사레가 보낸 살수들이 없앴다. (한편, 마키아벨리와 조세핀에서 풀림)\n  - 🔸 **암흑살수**는 어떤 자들인가. 체사레가 부리는 자객 무리로 보인다.\n\n### 비프로스트를 손에 넣으려는 체사레\n- 체사레는 마키아벨리에게 **비프로스트군을 데려오라**고 했다. 모젤은 다루기 쉬운 인물이니 이 기회를 잘 쓰면 **비프로스트까지 손에 넣을 수 있다**는 것이다.\n- 마키아벨리는 위험하지 않겠냐, **프레데릭이 크게 반발할 것**이라 했지만, 체사레는 대책이 있다고만 했다.\n- 둘의 목표는 **제국령 통일**이고, 비프로스트를 손에 넣는 것도 그 하나다. (→ 세계관 \"체사레는 왜 시라노를 함정에 빠뜨렸나\" 참고)\n- 비프로스트군이 제국령 소영주들을 누르고, 안타나나리보 영주가 비프로스트군과 손잡고 있던 것도 이 판 위의 일로 보인다(추측). (→ 제피르 팰컨 기지 3차 \"비프로스트의 압박\", 안타나나리보 1차 참고)\n- 비프로스트군을 데려오라는 건 **제피르 팰컨과 프레데릭을 치우는 데 쓰려는** 것이다. 제 손에 피를 묻히지 않고 반란군과 말 안 듣는 사위를 함께 정리하려는 셈이다.\n  - 🔸 프레데릭은 체사레의 사위이고 크리스티나의 아버지다. 그런 사람까지 없애려 한다. 메르세데스는 이 일을 알까.\n  - 🔸 그 크리스티나는 지금 제피르 팰컨에 있다. 둘 다 치면 손녀도 위험해진다.\n- 🔸 크리스티나를 비프로스트에 시집보내려던 것도 비프로스트를 손에 넣으려는 계획의 하나였을까(추측).\n\n### 로우엔 산 함정과는?\n- 🔸 이 막간에선 로우엔 산의 합류 장소를 누가 바꿨는지 나오지 않았다. 체사레 쪽은 프레데릭이 몰아붙이길 바랐던 것으로 보인다. (→ 로우엔 산 정상 \"누가 꾸몄나\" 참고)\n\n\n---\n\n## 제피르 팰컨 기지 (5차 — 로우엔 산 탈출 직후 작전 회의)\n\n### 벌써 알고 있는 클라우제비츠\n- 체사레가 비프로스트군을 끌어들이려 한다는 것, 마키아벨리가 비프로스트로 떠났다는 것을 클라우제비츠는 **벌써 보고받아** 알고 있었다. 막간에서 체사레와 마키아벨리가 밀담을 나눈 바로 뒤다. (→ 한편, 체사레와 마키아벨리 참고)\n- 🔸 이렇게 빨리 어디서 들었나. 체사레 쪽 가까이에 제피르 팰컨의 눈이 있는 걸까. 메디치가 말한 \"가끔 남몰래 사라지는 클라우제비츠\"와도 이어 볼 만하다. (→ 제피르 팰컨 기지 4차 \"가끔 사라지는 클라우제비츠\" 참고)\n\n### 마키아벨리 — 시라노의 어릴 적 단짝\n- 체사레 곁의 책사 **마키아벨리**는 **시라노의 어릴 적 단짝**이다. 클라우제비츠와 함께 **제국의 두 현자**로 이름났다.\n- 시라노가 직접 마키아벨리를 뒤쫓기로 했다. 마키아벨리는 **리브레빌**을 지나 **안타나나리보**로 갔다고 한다.\n  - 안타나나리보는 영주가 비프로스트군과 손잡고 있다가 시라노에게 처단된 곳이다. 비프로스트군이 제국령으로 들어오는 길목인 셈이다(추측). (→ 안타나나리보 1차 \"영주 저택 — 영주와 비프로스트군\" 참고)\n  - 🔸 리브레빌에는 왜 들렀나. 리브레빌 영주 에스테 도데와 만났을까. (→ 리브레빌 1차 \"에스테 도데의 부탁\" 참고)\n- ✅ 시라노는 옛 친구가 체사레 밑에 있다는 걸 어떻게 받아들일까. 마키아벨리는 시라노가 인페르노에서 살아 나왔다는 걸 알까 → 비프로스트 궁에서 마주쳤다. 시라노는 크게 화를 냈지만 끝내 죽이지 않고 살려 보냈다. (비프로스트 궁에서 풀림 → \"살려 보낸 마키아벨리\" 참고)\n- 🔸 시라노를 모함한 건 \"친구와 사촌\"이었고, 그 친구는 루벤, 이스카리옷으로 이미 밝혀졌다. 마키아벨리는 13년 전 그 일 때 어디에 있었나. (→ 세계관 \"시라노를 모함한 친구와 사촌\" 참고)\n- 🔸 같은 \"현자\" 소리를 듣는 클라우제비츠와 마키아벨리는 서로 아는 사이일까.\n\n### 카슈미르의 보물 지도\n- 클라우제비츠가 옛 용병 집단 **카슈미르**가 남긴 **보물 지도**를 손에 넣었다. **진짜**로 확인됐다고 한다.\n- 로우엔 산에서 프레데릭에게 얻어맞아 **자금과 장비가 바닥났다.** 보물을 찾으면 이걸 메울 수 있다. (→ 로우엔 산 정상, 한편, 프레데릭 포병대 참고)\n- 🔸 카슈미르는 어떤 용병 집단이었나. 왜 보물을 남겼나.\n- 🔸 이 일에 왜 하필 **실버**가 필요한가. 실버가 카슈미르와 무슨 사연이 있을까.\n\n### 갈라진 일행\n- **보물찾기**: 카나, 실버, 이자벨, 메디치\n- **마키아벨리 추적**: 시라노, 리델\n- 리델은 시라노와 짝이 된 데 당황한다. 처음 기지에 왔을 때 외부인을 데려왔다고 카나를 나무랐던 사람이다. (→ 제피르 팰컨 기지 1차 \"만난 사람들\" 참고)\n- 카나는 떠나기 직전까지 시라노와 같이 가고 싶어 한다.\n- 🔸 클라우제비츠는 왜 카나를 시라노와 떼어 놓았나. 로우엔 산 직전에도 카나는 따로 움직였다. (→ 합류 장소 \"따로 움직인 카나\" 참고)\n\n### 비프로스트 — 발키리와 망티고아 산\n- 비프로스트는 정예 부대 **발키리**로 유명하다. 마키아벨리가 데려오려는 비프로스트군과 맞붙게 되면 이 부대가 나올 수 있다(추측).\n  - `[외부 설정]` 발키리는 비프로스트의 최정예 사단으로, **여자로만** 이뤄져 있다. 비프로스트 남자들이 레인저로 집을 비우는 일이 많아 여자들이 군사를 맡아 온 전통이다. 창세기전 2의 사라 란드그리드 때 대륙 전체에 이름을 떨쳤다. 이 게임부터 가벼운 **세검**을 쓴다는 설정이 붙었다. (나무위키 「발키리(창세기전 시리즈)」)\n- 클라우제비츠 말로는 비프로스트 **망티고아 산**에 **유니콘의 정령이 봉인된 동굴**이 있다.\n  - 망티고아 산은 안타나나리보 1차 때 못 올라간 그 산이다. 로우엔 2차 소문의 검 고치는 달인 **파즈**도 공략 자료로는 이 동굴(유니콘 동굴)에 있다. (→ 안타나나리보 1차 \"문제의 마을은 여기가 아니다?\", 로우엔 2차 \"검을 고치는 달인 파즈\" 참고)\n  - 🔸 누가, 왜 유니콘의 정령을 봉인했나.\n  - ✅ 소환수로 얻게 될까 → 동굴에서 **일각수의 뿔**을 얻었다. (망티고아 산 1차에서 풀림 → 그 항목 참고)\n\n---\n\n## 리브레빌 (3차 — 마키아벨리 추적 중 들름)\n\n### 마키아벨리가 간 길\n- 마키아벨리는 **안타나나리보**를 거쳐 **망티고아 산**으로 갔다. 기지에서 들은 \"리브레빌 → 안타나나리보\"에 이어지는 길이다. (→ 제피르 팰컨 기지 5차 \"마키아벨리 — 시라노의 어릴 적 단짝\" 참고)\n- 망티고아 산은 클라우제비츠가 **유니콘의 정령이 봉인된 동굴**이 있다고 한 곳이다. (→ 제피르 팰컨 기지 5차 \"비프로스트 — 발키리와 망티고아 산\" 참고)\n- ✅ 비프로스트로 가는 길이라 산을 넘는 걸까, 아니면 그 동굴에 볼일이 있는 걸까 → 공왕을 만나러 산을 넘어가는 길이었다. (망티고아 산 카타리나 항목에서 풀림)\n\n---\n\n## 망티고아 산 — 유니콘 동굴 (1차 — 마키아벨리 추적 중)\n\n### 파즈와 엑스칼리버\n- 소문으로만 듣던 검 고치는 달인 **파즈**를 유니콘 동굴에서 만났다. 이올린에게 받은 **낡은 엑스칼리버**를 제대로 된 **엑스칼리버**로 고쳤다. (→ 로우엔 2차 \"검을 고치는 달인 파즈\" 참고)\n- 🔸 이올린은 왜 낡은 엑스칼리버를 시라노에게 맡겼나. 고친 엑스칼리버에 무슨 사연이 있을까.\n\n### 일각수의 뿔 — 유니콘의 정령\n- 동굴에서 **일각수의 뿔**을 얻었다. 클라우제비츠가 말한 \"유니콘의 정령이 봉인된 동굴\"이 이곳이다. (→ 제피르 팰컨 기지 5차 \"비프로스트 — 발키리와 망티고아 산\" 참고)\n- 공략 자료로는 보조 장비 칸에 다는 물건이다. 달면 **빙한(얼음) 마법**을 쓸 수 있고, 소환수 **크리스탈 유니콘**도 불러낼 수 있다. 피닉스의 알, 썬더메어처럼 소환수를 주는 물건이다. 쓸 만한 소환수라는 평이 많다.\n- 🔸 정령을 이 뿔에 봉인한 건 누구인가.\n\n### 마키아벨리는?\n- ✅ 마키아벨리가 이 산으로 갔다는데, 아직 마주치지 않았다. 동굴에 들렀을까, 산을 넘어 비프로스트로 갔을까 → 산을 넘어 공왕에게 가고 있었다. (망티고아 산 카타리나 항목에서 풀림)\n\n---\n\n## 망티고아 산 (마키아벨리 추적 중 — 카타리나와 싸움)\n\n### 발키리 대장 카타리나\n- 마키아벨리가 금발의 여인 **카타리나**에게 **시라노 일행을 막아 달라**고 부탁한다. 카타리나는 비프로스트 정예 부대 **발키리의 대장**이다. 기지에서 들은 \"비프로스트 하면 발키리\"가 이렇게 앞을 막아선다. (→ 제피르 팰컨 기지 5차 \"비프로스트 — 발키리와 망티고아 산\" 참고)\n- `[외부 설정]` 비프로스트 최강의 검사로 꼽힌다. 모젤 2세의 충직한 부하이고, 제국에 대한 미움이 크다. 어머니는 창세기전 2의 발키리 대장 **사라 란드그리드**다. (나무위키 「카타리나 메디시스」)\n- 🔸 카타리나는 체사레의 속셈(비프로스트까지 손에 넣으려는 것)을 알고 마키아벨리를 돕는 걸까. 제국을 미워한다면 더 그렇다.\n- 시라노 일행이 카타리나를 이겼다. 카타리나는 하늘을 나는 짐승을 불러 타고 달아났다. 게임에선 **드레이크**로 보였다(이름 확인 필요).\n  - 날짐승을 부려 타고 다니는 걸 보면, 발키리는 땅에서 싸우는 부대만은 아닌 듯하다(추측).\n  - 🔸 놓쳐 버린 카타리나는 다시 앞을 막을까. 공왕에게 시라노 일행 이야기가 들어가겠다.\n\n### 마키아벨리를 기다리는 공왕\n- **비프로스트의 공왕**(모젤 2세)이 마키아벨리를 기다리고 있다. 마키아벨리는 공왕을 직접 만나 비프로스트군을 끌어들이려는 것으로 보인다. (→ 한편, 체사레와 마키아벨리 참고)\n- 공왕 곁에는 체사레 쪽 사람인 애첩 **조세핀**이 있다. 공왕을 움직일 준비가 이미 돼 있는 셈이다. (→ 리브레빌 1차 \"비프로스트 공왕의 애첩 조세핀\" 참고)\n- ✅ 마키아벨리는 망티고아 산에서 어디로 갔나 → 산을 넘어 공왕이 기다리는 비프로스트 쪽으로 가고 있었다. 동굴에 볼일이 있던 건 아니었다. (이 항목에서 풀림, → 리브레빌 3차, 망티고아 산 1차 참고)\n\n---\n\n## 한편, 보물찾기 일행 (카나·실버·이자벨·메디치 — 화룡굴로 가기 전)\n\n### 장비를 훔쳐 간 개구리\n- 카나의 장비가 **몽땅 사라졌다.** 이자벨은 **물건을 훔쳐다 판다는 개구리** 소문을 들은 적이 있어, 눈앞의 개구리를 범인으로 보고 쫓고 있다.\n- 보르도 주점의 말하는 개구리가 연 **비밀의 개구리 상점**이 떠오른다. 자료로는 그 개구리가 남의 물건을 훔쳐다 되파는 장물 장사꾼이다. 같은 개구리일 가능성이 크다(추측). (→ 보르도 1차 \"주점의 말하는 개구리\" 참고)\n- 🔸 정말 그 개구리인가. 훔쳐 간 카나의 장비는 되찾을 수 있을까. 개구리 상점 진열대에 올라오는 건 아닐까.\n\n### 보물은 화룡굴에?\n- 실버는 카슈미르의 보물이 **게이시르 숲 한가운데의 화룡굴**에 있는 것 같다고 본다. (→ 제피르 팰컨 기지 5차 \"카슈미르의 보물 지도\" 참고)\n- 화룡굴은 전에 이미 들어가 **크림슨 헬카이트**(소환수)를 얻은 곳이다. 그때는 카슈미르의 보물 같은 건 보지 못했다.\n- ✅ 정말 화룡굴에 있었나 → 있었다. 화룡굴에서 보물을 찾았다. (화룡굴 2차에서 풀림)\n- 🔸 그때 못 본 안쪽 자리가 있는 걸까. 실버는 지도를 어떻게 읽어 화룡굴을 짚었나. (→ 제피르 팰컨 기지 5차 \"왜 하필 실버가 필요한가\" 참고)\n\n---\n\n## 게이시르 숲 화룡굴 (2차 — 카슈미르의 보물 찾기)\n\n### 찾아낸 보물\n- 화룡굴에서 **카슈미르의 보물**을 찾았다. 로우엔 산에서 바닥난 자금과 장비를 메울 수 있게 됐다. (→ 제피르 팰컨 기지 5차 \"카슈미르의 보물 지도\" 참고)\n- 보물은 **보석 더미**였다. 너무 많아 다 가져갈 수 없어서, 들 수 있는 만큼만 챙겨 나가기로 했다.\n- 🔸 남겨 둔 보석은 어떻게 되나. 나중에 다시 가져올 수 있을까.\n\n### 들이닥친 선글라스 조직원들\n- 보물을 찾자마자 **선글라스를 낀 조직원들**이 들이닥쳤다. 물리쳤지만 더 몰려올 기세라 오래 머물 수 없었다.\n- 로우엔에서 들은 \"**보르도 근처의 이상한 안경 쓴 사람들**\" 소문이 이들 같다. 마검숲에서 멸살지옥검을 노리던 **커티스 요원들**과 같은 무리일 수도 있다(추측). 유물에 이어 이번엔 보물까지 노린다. (→ 로우엔 2차 \"소문 — 보르도 근처의 이상한 안경 쓴 사람들\", 마검숲 2차 \"커티스 요원들\" 참고)\n- 🔸 이들은 누구고, 보물이 여기 있는 건 어떻게 알았나. 보물찾기 일행을 뒤쫓아 온 걸까.\n- 🔸 카나의 장비를 훔쳐 간 개구리는 어떻게 됐나. (→ 한편, 보물찾기 일행 \"장비를 훔쳐 간 개구리\" 참고)\n\n### 클라우제비츠는 이걸 어떻게 알았나\n- 클라우제비츠는 진짜 보물 지도를 구해 와, 이걸 찾으면 살림을 메울 수 있다고 처음부터 장담했다. 그리고 정말로 보물이 있었다.\n- 앞서도 체사레와 마키아벨리가 밀담을 나눈 바로 뒤에, 비프로스트군 이야기를 벌써 보고받아 알고 있었다. 메디치는 클라우제비츠가 가끔 남몰래 사라진다고 했다.\n- 그런데 로우엔 산에선 바뀐 합류 장소에 클라우제비츠도 속아 넘어갔다. 늘 다 아는 사람은 아니다. (→ 로우엔 산 정상 \"누가 꾸몄나\" 참고)\n- 🔸 지도를 어디서 손에 넣었고, 진짜인지 어떻게 확인했나. 정보가 너무 빠르고 정확하다. 클라우제비츠에게 따로 정보가 들어오는 길이 있는 걸까. (→ 제피르 팰컨 기지 5차 \"벌써 알고 있는 클라우제비츠\", 제피르 팰컨 기지 4차 \"가끔 사라지는 클라우제비츠\" 참고)\n\n---\n\n## 한편, 마키아벨리와 조세핀 (막간 — 화룡굴 보물을 찾은 뒤)\n\n### 조세핀 — 체사레가 심어 둔 사람\n- 조세핀은 본래 **시골 농부의 딸**이다. 체사레가 곱게 꾸며 **모젤 공왕 곁**에 앉혔다. 공왕 곁에서 비프로스트 사정을 살펴 마키아벨리에게 넘기는 **스파이**다. (→ 리브레빌 1차 \"비프로스트 공왕의 애첩 조세핀\", 한편, 체사레와 마키아벨리 \"조세핀은 체사레의 사람\" 참고)\n- 그런데 조세핀은 체사레와는 **거래를 할 뿐**이라고 한다. 충성하는 게 아니라 이익을 주고받는 사이라는 것이다.\n- 🔸 조세핀이 체사레에게서 얻으려는 건 무엇인가. 거래라면 언제든 등을 돌릴 수도 있다.\n\n### 공왕이 군대를 움직인 까닭\n- 조세핀 말로는 모젤 공왕은 **어릴 때 제국에게 수모를 당했다.** 그래서 제국을 치고 싶었지만 원로원의 보수적인 태도에 막혀 참아 왔다.\n- **체사레가 보낸 살수들**이 원로원 **고위 인사들을 없애**, 이제 공왕을 막을 사람이 없다. 체사레 막간에서 들은 \"방해 세력은 암흑살수로 없앴다\"가 이 일이다. (→ 한편, 비프로스트 \"모젤 공왕과 원로원\", 한편, 체사레와 마키아벨리 참고)\n- 정리하면, 체사레는 제국을 미워하는 공왕의 마음을 부추겨 비프로스트군을 제국으로 끌어들이고, 그 군대로 **제피르 팰컨과 프레데릭**을 치우려 한다. 공왕은 제국을 친다고 생각하지만, 실은 체사레의 칼 노릇을 하는 셈이다(추측).\n- `[외부 설정]` 모젤 2세의 아버지도 제국의 개입으로 살해됐고, 어린 모젤 2세는 흑태자가 비프로스트를 쳤을 때 피신해야 했다. \"어릴 때 당한 수모\"가 이 일들로 보인다. (나무위키 「모젤 2세」, → 한편, 비프로스트 참고)\n\n### 아스카론 — 발굴 중인 마장기\n- 마키아벨리가 \"지난번 발굴한다던 것\"을 물었다. 마장기 **아스카론**이다. **자리는 찾았지만** 파내는 데 **엄청난 시간과 사람**이 들어 아직 멀었다.\n- 마키아벨리가 이걸 챙겨 묻는 걸 보면, 아스카론 발굴도 체사레 쪽이 눈여겨보는 일이다.\n- `[외부 설정]` 아스카론은 비프로스트의 **전설 속 수호신 같은 1급 마장기**다. 비프로스트 초대 공왕이 탔는데, 제국의 계략으로 계곡에 파묻혀 행방불명됐다. 그 뒤로 외적이 쳐들어올 때마다 아스카론이 나타난다는 전설이 생겼다. 이름은 성 게오르기우스가 용을 벨 때 썼다는 검 **아스칼론**에서 왔다. (나무위키 「아스카론(창세기전 시리즈)」)\n- 🔸 비프로스트의 수호신을 파내는 일에 왜 제국(체사레) 쪽이 관심을 두나. 다 파내면 누구 손에 들어가나.\n- 니코시아 교회 요새에서도 체사레 쪽이 **마장기 아수라 MK.2**를 만들고 있었다. 체사레는 마장기를 계속 모으고 있다. (→ 니코시아 교회 요새 1차 \"마장기 아수라 MK.2\" 참고)\n\n### 발키리면 충분하다\n- 마키아벨리는 비프로스트 대군만 있으면 마장기까지 낼 필요는 없다고 본다. **발키리**가 나서면 제피르 팰컨도, 프레데릭의 **대포 부대**도 쉽게 정리할 거라고 한다.\n- 그 발키리 대장 **카타리나**는 방금 망티고아 산에서 시라노에게 졌다. (→ 망티고아 산 \"발키리 대장 카타리나\" 참고)\n- 🔸 마키아벨리는 카타리나가 졌다는 걸 알까.\n\n### 비프로스트가 제국을 삼킨다면? — 체사레의 복안\n- 조세핀은 그렇게 대군을 끌어들이다간 **비프로스트가 오히려 제국을 점령할 수도 있겠다**고 비꼬았다. 마키아벨리는 그 일에는 **체사레가 복안을 마련해 두었다**고 답했다.\n- 체사레는 프레데릭에게도 \"대책이 있다\"고 했고, 그 대책은 비프로스트군으로 제피르 팰컨과 프레데릭을 함께 치우는 것이었다. 이번엔 그 비프로스트군을 막을 수도 따로 마련해 둔 셈이다. (→ 한편, 체사레와 마키아벨리 \"비프로스트를 손에 넣으려는 체사레\" 참고)\n- 🔸 그 복안은 무엇인가. 쓸모가 다한 비프로스트군을 어떻게 치울 생각인가.\n- 🔸 조세핀이 일부러 이 말을 꺼낸 건 체사레 쪽 속내를 떠보려던 걸까(추측). \"거래를 할 뿐\"이라던 말과 이어 볼 만하다. → 이 대화를 공왕이 엿듣고 있었다(아래 \"엿들은 공왕\" 참고).\n\n### 엿들은 공왕 — 조세핀은 이중 스파이?\n- 조세핀과 마키아벨리의 대화를 **모젤 공왕이 엿듣고** 있었다. 조세핀이 일부러 들려준 것으로 보인다.\n- 그렇다면 조세핀은 체사레에게 비프로스트 사정을 넘기면서, 공왕에게도 체사레 쪽 속내를 흘리는 셈이다. 체사레와는 \"거래를 할 뿐\"이라던 말과 맞아떨어진다(추측).\n- 🔸 조세핀은 **이중 스파이**인가. 정말 편을 드는 쪽은 누구인가. 공왕인가, 자기 자신인가.\n- 공왕은 체사레의 속셈을 듣고도 군대를 보낼 생각이다. **추기경의 요청으로 군을 보낸다는 명분**이 있으니 **팬드래건도 어쩌지 못할 것**이라고 한다.\n  - 🔸 추기경의 파병 요청은 **공식적인** 것인가. 공식 요청이라면 비프로스트군은 \"초대받아 들어온 군대\"가 되고, 팬드래건이 따질 거리가 사라진다.\n  - 🔸 공왕은 체사레의 \"복안\"을 알고도 군대를 보낸다. 공왕에게도 따로 속셈이 있을까.\n\n---\n\n## 비프로스트 궁 (마키아벨리 추적 끝 — 마키아벨리와 마주함)\n\n### 마키아벨리의 철학 — \"제국통일론\"\n- 마키아벨리는 **자기 철학에 따라** 체사레를 따른다고 했다. 제국에는 **황제가 없다.** 그러니 **잔혹한 수단을 써서라도** 제국을 하나로 묶어 평화를 되찾을 군주가 필요하고, 그게 체사레라는 것이다. 그렇게 해야 **더 많은 피를 막을 수 있다**는 게 그의 대의다.\n- 실제 마키아벨리가 『군주론』에서 체사레 보르자를 본받을 군주로 꼽은 것과 그대로 겹친다. (→ 세계관 \"이름의 모티브\" 참고)\n- `[외부 설정]` 게임 매뉴얼에도 마키아벨리의 **'제국통일론'**이 실려 있다. 흑태자를 잃고 십여 개 영주로 갈라진 제국을, 체사레가 \"악마재판\"으로 약한 영주들을 몰락시켜 몇몇 군주에게 힘을 모았다고 본다. 피를 흘렸지만 그게 아니었다면 제국은 수백 년 동안 진흙탕이었을 것이라는 논리다. (나무위키 「마키아벨리(창세기전 시리즈)」)\n- `[외부 설정]` 마키아벨리는 **안타나나리보 출신**으로, 제국 학술원에서 시라노와 함께 공부한 친구다. 집안이 번스타인 가보다 한참 못했다. 고향 안타나나리보는 제국과 비프로스트의 국경이라 전쟁이 잦았는데, 그게 그를 강한 군주에 의한 통일을 바라는 사람으로 만들었다고 한다. (나무위키) — 이번에 쫓아온 길이 바로 그의 고향을 지나는 길이었다.\n\n### 시라노가 따진 세 가지\n- 시라노는 마키아벨리의 철학이 이런 것이냐고 따졌다.\n  1. 음모를 꾸며 **\"친구의 아들\"에게 누명을 씌우는 것** — 시라노 자신이 쓴 누명을 가리키는 것으로 보인다. \"친구\"가 누구인지(체사레의 친구였던 아버지 루크인지, 마키아벨리 자신인지)는 확인이 필요하다.\n  2. 권력을 잡으려고 **제 딸을 도구로 쓰는 것** — 체사레의 딸 **메르세데스**를 프레데릭과 맺어 준 일로 보인다(추측). 크리스티나를 비프로스트에 시집보내려 한 일도 같은 결이다. (→ 세계관 \"메르세데스는 왜 프레데릭과 결혼했나\", 한편, 체사레와 마키아벨리 \"믿을 수 없게 된 프레데릭\" 참고)\n  3. 이렇게 **조국에 외세를 끌어들이는 것** — 바로 지금 비프로스트군을 부르는 일이다.\n- 🔸 마키아벨리는 13년 전 시라노가 누명을 쓸 때 그 일을 알았나, 거들었나. (→ 제피르 팰컨 기지 5차 \"마키아벨리 — 시라노의 어릴 적 단짝\" 참고)\n\n### 살려 보낸 마키아벨리\n- 시라노는 이번엔 마키아벨리를 **죽이지 않았다.** 체사레에게 **\"시라노가 갈 테니 기다리라\"**고 전하라 했다. 체사레에게 정면으로 내민 선전포고다.\n- 리델은 반발했지만, 시라노가 이번만은 살려 주자고 **부탁**했다. 루벤, 이스카리옷을 끝까지 쫓았던 것과 다르다. 옛 친구에게만은 마음이 걸린 것으로 보인다. (→ 카라카스 1차, 2차 참고)\n- 🔸 마키아벨리를 놓아준 대가는 어떻게 돌아올까. 비프로스트군의 파병은 이걸로 멈출까.\n\n---\n\n## 한편, 프레데릭 (막간 — 비프로스트군이 제국령을 넘어옴)\n\n### 다 알고 있던 프레데릭\n- 비프로스트 대군이 제국령을 넘어왔다. 프레데릭은 이미 **올 줄 알고 있었고**, 그 뒤에 **체사레**가 있다는 것도 안다.\n- 체사레는 이 비프로스트군으로 **제피르 팰컨과 프레데릭을 함께 치우려** 했다. 프레데릭이 그 속셈까지 아는지는 아직 모른다. (→ 한편, 체사레와 마키아벨리 \"비프로스트를 손에 넣으려는 체사레\" 참고)\n- 🔸 프레데릭은 어디서 이걸 알았나. 체사레 곁에 프레데릭의 사람이 있는 걸까.\n\n### 제국의 자존심\n- 프레데릭은 비프로스트군이 **제국 땅을 밟지 못하게** 맞서기로 했다. 외세를 끌어들이는 건 **제국의 자존심을 짓밟는 일**이라 두고 볼 수 없다고 한다.\n- 시라노가 마키아벨리에게 \"조국에 외세를 끌어들이는 게 네 철학이냐\"고 따진 것과 같은 생각이다. 원수지간인 둘이 이 점에선 같은 편에 선다. (→ 비프로스트 궁 \"시라노가 따진 세 가지\" 참고)\n- 체사레가 평민을 너무 억누른다고 걱정하고, 크리스티나를 비프로스트에 시집보내는 데 반대하고, 로우엔 산에서 제피르 팰컨을 끝까지 쫓지 않은 것과 한 줄로 이어진다. 장인 체사레와는 생각이 갈수록 멀어진다. (→ 한편, 프레데릭 저택, 한편, 프레데릭 포병대 참고)\n\n### 클라우제비츠에게 보낸 전령\n- 발키리 부대는 혼자 상대하기 벅차다며, 프레데릭이 **제피르 팰컨의 클라우제비츠에게 전령을 보낸다.** 로우엔 산에서 대포로 몰아붙였던 상대에게 도움을 청하는 셈이다. (→ 로우엔 산 정상 참고)\n- 🔸 프레데릭과 클라우제비츠는 **서로 아는 사이**인가. 레지스탕스 지휘관에게 바로 전령을 보낼 줄 아는 걸 보면 그냥 적은 아닌 듯하다(추측).\n- 🔸 클라우제비츠가 늘 남보다 먼저 아는 정보와도 이어질까. (→ 화룡굴 2차 \"클라우제비츠는 이걸 어떻게 알았나\", 제피르 팰컨 기지 4차 \"가끔 사라지는 클라우제비츠\" 참고)\n- 🔸 제피르 팰컨은 이 손을 잡을까. 프레데릭은 시라노의 아버지 루크를 죽인 사람이다. 시라노가 받아들일 수 있을까. 그리고 그 진영에는 프레데릭의 딸 크리스티나도 있다.\n\n---\n\n## 한편, 체사레 (막간 — 프레데릭 출병 소식)\n\n### 웃는 체사레\n- 프레데릭이 비프로스트군에 맞서 출병했다는 소식에, 체사레는 **예상했다는 듯 웃었다.** 프레데릭이 **이기지 못할 것**으로 본다.\n- 체사레가 바라던 그대로다. 말 안 듣는 사위가 제 발로 비프로스트군 앞에 나섰다. \"대책이 있다\"던 게 이것이다. (→ 한편, 체사레와 마키아벨리 \"비프로스트를 손에 넣으려는 체사레\" 참고)\n- 🔸 프레데릭이 클라우제비츠에게 전령을 보낸 것, 제피르 팰컨과 손잡을 수 있다는 것까지 체사레는 알까. 둘이 함께 나서면 오히려 체사레 뜻대로 \"한꺼번에 치우기\" 좋은 판이 된다. (→ 한편, 프레데릭 \"클라우제비츠에게 보낸 전령\" 참고)\n\n### 대륙 전체를 하나로 — 체사레의 야망\n- 체사레는 곧 **제국은 물론 비프로스트, 팬드래건, 아스타니아까지**, **안타리아 대륙이 강력한 하나의 나라로 다시 태어날 것**이라고 했다.\n- 지금까지 들은 목표는 **제국령 통일**이었다. 그런데 꿈은 그보다 훨씬 크다. 대륙 전체다. (→ 한편, 체사레와 마키아벨리, 세계관 \"체사레는 왜 시라노를 함정에 빠뜨렸나\" 참고)\n  - **비프로스트**: 조세핀으로 공왕을 홀리고, 원로원을 살수로 없애고, 군대를 끌어냈다. 비프로스트군을 쓴 뒤 처리할 \"복안\"도 있다고 했다. (→ 한편, 마키아벨리와 조세핀 참고)\n  - **팬드래건**: 성왕 라시드가 50년 전쟁으로 동쪽 아스타니아 전선에 묶여 오래 왕성을 비우고 있다. (→ 팬드래건 왕국 소식 참고)\n  - **아스타니아**: 그 50년 전쟁이 벌어지는 동쪽 땅이다.\n- 🔸 도대체 어떻게 대륙 전체를 손에 넣으려는가. 제국령, 비프로스트 다음은 어떤 수를 쓸까. 니코시아의 아수라 MK.2, 비프로스트의 아스카론처럼 **마장기**를 챙기는 것도 이 꿈과 이어질까(추측). (→ 니코시아 교회 요새 1차 \"마장기 아수라 MK.2\", 한편, 마키아벨리와 조세핀 \"아스카론\" 참고)\n- \"다시 태어난다\"는 말에 눈이 간다. 대륙이 예전에 한 나라였다는 듯한 말이다. 흑태자가 대륙을 휩쓸던 시절의 제국을 떠올린 것일 수 있다(추측). 체사레는 흑태자의 영광을 되살리려 한다고 알려져 있다.\n### 30년 전에 떠난 \"당신\"\n- 체사레가 누군가에게 말을 건넨다. **\"당신이 세상을 뜬 지도 30년이 지났다. 이제 우리의 한을 풀 순간이 다가오고 있다.\"** (원래 대사: \"이제 당신이 세상을 뜬지도 30년이나 지났군... 이제 우리의 한을 풀 순간이 점차 다가오고 있소.\")\n- 존댓말(\"~소\")을 쓰는 걸 보면 아랫사람은 아니다. **30년 전에 죽은 사람**이고, 체사레와 **\"우리의 한\"**을 함께 품었던 사람이다.\n- 체사레가 대륙을 하나로 묶으려는 까닭이 야망만이 아니라 **누군가의 한을 푸는 일**이라는 뜻이 된다.\n- 🔸 \"당신\"은 누구인가. \"우리의 한\"이란 무엇인가. 30년 전에 무슨 일이 있었나.\n\n- `[외부 설정]` 아스타니아는 안타리아 대륙 동쪽의 왕국이다. 50년 전쟁은 투르 제국과 팬드래건·아스타니아 쪽이 동쪽에서 오래 치르는 전쟁이다. (나무위키)\n\n---\n\n## 리브레빌 — 에스테의 저택 (4차 — 작전 회의 뒤, 크리스의 피아노)\n\n### 다시 모인 제피르 팰컨\n- 마키아벨리를 쫓던 시라노·리델과 보물을 찾던 카나·실버·이자벨·메디치가 **리브레빌 에스테의 저택**에서 다시 모였다. 영주 **에스테**도 자리에 있다.\n- 리브레빌 1차 때 에스테가 내건 조건 중 하나가 \"**저택을 자유롭게 써도 된다**\"였다. 그 말대로 제피르 팰컨의 거점처럼 쓰이고 있다. (→ 리브레빌 1차 \"에스테 도데의 부탁\" 참고)\n- 비프로스트와 맞닿은 리브레빌이라, 비프로스트군을 막으러 나서기에도 알맞은 자리다(추측).\n\n### 원수와 손잡다\n- **프레데릭의 전령**이 와서 함께 비프로스트군을 막자고 했고, 제피르 팰컨은 **모두 함께 싸우기로** 했다. (→ 한편, 프레데릭 \"클라우제비츠에게 보낸 전령\" 참고)\n- 프레데릭은 로우엔 산에서 대포로 제피르 팰컨을 몰아붙인 상대이고, 시라노에겐 **아버지 루크를 죽인 원수**다. 그런데도 외세를 막는 데는 뜻이 같다. (→ 한편, 프레데릭 \"제국의 자존심\" 참고)\n- 🔸 시라노는 이 결정을 어떤 마음으로 받아들였나. 프레데릭과 얼굴을 마주하게 될까.\n- 🔸 크리스티나(크리스)는 아버지와 같은 편에서 싸우게 된다. 정체를 감춘 채로 괜찮을까.\n- 🔸 체사레는 둘이 함께 비프로스트군에 지기를 바란다. 손잡은 것이 오히려 체사레가 바라던 판이 되진 않을까. (→ 한편, 체사레 \"웃는 체사레\" 참고)\n\n### 인페르노 탈환 작전\n- 병력은 **비프로스트가 우세**하다. 그래서 **기습**으로 판을 뒤집어야 한다.\n- 계획은 비프로스트군이 차지한 **인페르노를 되찾아 방어 요새**로 쓰는 것이다.\n- 인페르노는 시라노가 13년 동안 갇혀 유황을 캐던 감옥이다. 유황 동굴이라 화약 원료가 나오고, 원래 사람을 가둬 두려고 만든 곳이라 지키기에도 좋다(추측). (→ 인페르노 탈출 ~ 사막 \"인페르노\" 참고)\n- 🔸 비프로스트군은 언제, 왜 하필 인페르노를 차지했나. 유황(화약)이 탐났을까.\n- 🔸 시라노는 자기가 갇혔던 곳으로 돌아가는 셈이다.\n\n### 팬드래건의 최신형 검 PS-7\n- 클라우제비츠가 **팬드래건의 최신형 검 PS-7**을 손에 넣었다. \"**운이 좋아** 구했다\"고만 한다.\n- 대본을 옮긴 자료로는 이름이 **PS-7 '블릿츠'**다. 팬드래건의 제식 검인 **PS(팬드래건 소드) 시리즈**의 최신형으로, 위력도 좋지만 **가볍고 고치기 쉬워** 쓸모가 많다고 소개한다. (Steemit 「서풍의 광시곡 7화」)\n- 팬드래건은 성왕 라시드가 동쪽 전선에 나가 있고, 본토는 허가증 없이는 들어가지도 못하는 나라다. 그런 나라의 최신 군용 검을 레지스탕스 군사가 구해 왔다. (→ 팬드래건 왕국 소식, 다카마 항 참고)\n- 🔸 클라우제비츠는 이걸 **어떻게** 구했나. 정말 운인가. 팬드래건 쪽에 닿는 줄이 있는 걸까.\n  - 보물 지도, 비프로스트군 소식, 프레데릭의 전령까지 이어 보면, 클라우제비츠 주변에는 설명 안 되는 일이 계속 쌓인다. (→ 게이시르 숲 화룡굴 2차 \"클라우제비츠는 이걸 어떻게 알았나\", 한편, 프레데릭 \"클라우제비츠에게 보낸 전령\" 참고)\n\n### 메디치와 에스테\n- 회의 뒤 메디치는 **에스테와 함께 나갔다.** 리브레빌 1차 때 에스테가 고백한 뒤로 둘 사이가 이어지고 있다. (→ 리브레빌 1차 \"에스테와 메디치\" 참고)\n- 🔸 메디치를 찾던 이자벨은 이 대답을 어떻게 받아들였을까.\n\n### 크리스의 피아노 — 어머니가 좋아하던 곡\n- 크리스가 저택의 피아노로 **어머니가 좋아하는 곡**을 쳤다. 어머니에게 배웠다고 한다. 크리스가 크리스티나라면 그 어머니는 **메르세데스**다. (→ 한편, 프레데릭 저택 \"집 나간 딸 크리스티나\" 참고)\n- 이 곡은 **시라노와 메르세데스에게 얽힌 곡**이다. 소리를 들은 시라노가 무서운 얼굴로 뛰어 들어와 누가 쳤는지 물었다. 크리스가 다시 치자, 시라노는 **곁에 앉아 함께 쳤다.** 어떻게 아느냐는 물음에는 \"신경 쓰지 말라\"고만 하고 나갔다.\n- 시라노는 아직 크리스가 메르세데스의 딸이라는 걸 모르는 것으로 보인다. 하지만 이 곡으로 무언가 눈치챘을 수 있다(추측).\n- 🔸 시라노는 크리스가 누구의 딸인지 알아챘을까.\n- 🔸 **크리스는 누구의 딸인가 — 시라노인가, 프레데릭인가.** 지금까지 나온 것:\n  - 크리스티나는 **열다섯 살**이다. 시라노가 잡혀간 건 13~15년 전이다. 게임 속 셈이 딱 맞지 않아 단정은 못 하지만, 메르세데스가 시라노와 약혼했던 무렵과 크리스티나가 태어난 때가 가깝다(추측). (→ 카라카스 2차 \"15년 전\" 셈 참고)\n  - 메르세데스는 시라노가 잡혀간 뒤 **프레데릭과 결혼했다.** 왜 그랬는지는 아직 모른다. (→ 세계관 \"메르세데스는 왜 프레데릭과 결혼했나\" 참고)\n  - 프레데릭은 크리스티나를 아끼고, 어릴 때부터 무술을 가르쳤다. 부녀 사이는 좋아 보인다. (→ 한편, 프레데릭 저택 참고)\n  - 메르세데스가 딸에게 시라노와의 곡을 가르쳤다. 시라노를 아직 잊지 못했다는 뜻일 수 있다(추측).\n\n---\n\n## 세계관 / 큰 떡밥\n\n- 🔸 **『창세전쟁의 비록』**: 시라노가 읽었다가 금서 죄로 몰린 책. 데이모스 말로는 진짜 역사가 적혀 있다. 창세전쟁의 진실은 왜 덮였나.\n- 🔸 **체사레는 왜 시라노를 함정에 빠뜨렸나**: 제국 통일, 흑태자 영광 재현이라는 야망과 어떻게 이어지나. → 함정을 판 게 체사레라는 건 죽어 가던 루벤이 확인해 줬다(카라카스 2차). 왜 그랬는지는 아직이다.\n- ✅ **시라노를 모함한 \"친구와 사촌\"**은 누구인가 → **루벤**(카라카스 1차)과 **이스카리옷**(카라카스 2차, 루벤의 유언). 루벤은 사촌이 아니라 배다른 동생이었다.\n- 🔸 **메르세데스는 왜 프레데릭과 결혼했나**. 프레데릭은 시라노의 아버지 루크를 결투에서 죽인 사람이다(카라카스 2차).\n- 🔸 **번스타인 가문 멸문**: 정말 반란이었나. → 루크는 시라노를 구하려고 체사레에게 맞섰고, 프레데릭과의 결투에서 죽었다(카라카스 2차, 루벤의 말). \"반란\"은 그걸 두고 붙인 이름일 가능성이 크다(추측).\n- 🔸 **마검 아수라**: 폭풍도에 있던 흑태자의 검. 손에 넣긴 했다(폭풍도 1차). 그런데 데이모스는 왜 \"거두어 달라\"고 했고, 이걸로 무엇을 해야 하나.\n- ✅ **제피르 팰컨**: 메디치가 속한 레지스탕스. 입단을 거절했지만 다시 엮일 듯. → 카나를 통해 다시 만나 함께 움직이기로 했고(제피르 팰컨 기지 1차), 카라카스 공격 뒤 **정식으로 함께하기로** 했다(카라카스 2차에서 풀림).\n- 🔸 **사이럽스 호수의 수중 도시**: 안타리아 8대 불가사의 중 하나. 게임 후반에 직접 가게 된다.\n- 🔸 **투르 제국 / 50년 전쟁**: 동쪽 전쟁이 서쪽에 어떤 영향을 미치나.\n\n\n### 이름의 모티브\n- 실존 인물과 문학, 신화에서 이름을 따온 경우가 많다. 시대가 서로 달라도 한 세계에 섞어 놓았다.\n  - **메디치**: 15세기 이탈리아 르네상스를 이끈 피렌체 가문(로렌초 데 메디치, 1449~1492).\n  - **프레데릭**: 18세기 프로이센의 프리드리히 대왕(1712~1786). 메디치와는 300년쯤 차이가 난다.\n  - **체사레 보르자**: 15세기 말 이탈리아의 실존 인물. 교황의 아들로 추기경을 지냈다.\n  - **마키아벨리**: 『군주론』을 쓴 피렌체의 니콜로 마키아벨리(1469~1527). 실제로 체사레 보르자를 가까이서 지켜봤고, 『군주론』에서 그를 본받을 군주로 꼽았다. 게임에서도 체사레의 곁에 있다.\n    - 게임에선 클라우제비츠와 함께 \"제국의 두 현자\"로 불린다. 『군주론』의 마키아벨리, 『전쟁론』의 클라우제비츠를 나란히 세운 셈이다.\n  - **카슈미르**: 인도 북쪽 히말라야 자락의 지역 이름(Kashmir)으로 보인다(추측).\n  - **인페르노**: 단테 『신곡』의 지옥편. \"지옥\"이라는 뜻.\n  - **클라우제비츠**: 19세기 프로이센의 군사학자 카를 폰 클라우제비츠(1780~1831). 『전쟁론』을 쓴 사람이다.\n  - **리델 하트**: 20세기 영국의 군인이자 군사학자 바실 리델 하트(1895~1970). 『전략론』을 썼다.\n  - **샤른호스트**: 18~19세기 프로이센의 장군 게르하르트 폰 샤른호스트(1755~1813). 나폴레옹에게 진 뒤 프로이센 군대를 뜯어고친 군사 개혁가다.\n  - **네메아의 사자**: 카라카스 투기장 이름. 그리스 신화에서 헤라클레스가 맡은 열두 과업 중 첫 번째로 잡은 사자다. 어떤 무기로도 가죽이 뚫리지 않아, 헤라클레스가 맨손으로 목을 졸라 잡았다.\n  - **데이모스**: 그리스 신화에서 \"공포\"를 뜻하는 신. 전쟁의 신 아레스의 아들이고, 쌍둥이 형제는 포보스다. 화성의 위성 이름이기도 하다.\n  - **이스카리옷**: 예수를 배신한 제자 가룟 유다(유다 이스카리옷). 이름부터 배신자다.\n  - **피닉스**: 불 속에서 죽었다가 재에서 다시 살아난다는 전설의 새. 불사조.\n  - **썬더메어**: thunder(천둥) + mare. mare는 악몽(nightmare)의 그 mare이자 암말이라는 뜻도 있다. 번개를 두른 말 모양 소환수와 어울린다(추측).\n  - **유성의 검**: 하늘에서 떨어진 운석의 쇠로 벼린 칼, 이른바 \"운철검(隕鐵劍)\" 이야기는 여러 나라 전설에 나온다. 이름은 거기서 따온 것으로 보인다(추측).\n  - **웨어링(Wearing)**: 영어로 늑대인간을 뜻하는 werewolf의 were-와 소리가 비슷하다. 늑대 소동이 나오는 집안 이름으로 일부러 고른 것일 수 있다(추측).\n  - **아스모데우스**: 유대교 전승의 악마. 구약 외경 『토빗기』에서 사라라는 여인에게 들러붙어, 그와 결혼한 남자 일곱을 첫날밤마다 죽였다. 정욕의 악마로 꼽힌다.\n  - **롱기누스의 창**: 십자가 매달린 예수의 옆구리를 찔렀다는 로마 병사 롱기누스의 창. 성창(聖槍)이라고도 한다.\n  - **도시 이름**: 아프리카 실제 도시 이름이 많다. 리브레빌(가봉의 수도), 프리토리아(남아공의 행정수도), 안타나나리보(마다가스카르의 수도). 멤피스와 보르도처럼 아프리카 밖의 이름도 섞여 있다.\n  - 시라노의 이야기 자체도 소설 『몬테크리스토 백작』(누명을 쓰고 감옥에 갇혔다가 탈옥해 복수하는 이야기)이 바탕이다.\n---\n\n## 메모\n- Gemini 대화(https://share.gemini.google/KH4UV6cEeZfa) 내용은 PDF(`서풍의 광시곡 로베르토 실존 인물 여부 - Google Gemini.pdf`)로 받아서 합쳤다.\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
