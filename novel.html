<script id="md" type="application/json">"# 서풍의 광시곡 — 인페르노에서 포로 구출 작전까지\n\n> `스토리_흐름.md`, `떡밥_정리.md`, 나무위키 자료를 바탕으로 쓴 소설.\n> **포로 구출 임무로 프리토리아 영주 저택에 들어간 시점까지**만 담았다. 그 뒤 이야기는 쓰지 않았다.\n> 대사와 장면 묘사는 줄거리에 맞춰 새로 지어 넣은 것이라 게임 대사와 다르다.\n\n---\n\n## 프롤로그 — 약혼식 날\n\n에스겔력 1249년 겨울, 게이시르 시티는 눈 대신 축하 꽃잎으로 덮여 있었다.\n\n번스타인 저택의 큰 홀에는 촛불이 수백 개 켜졌다. 제국 7용사 번스타인 가문의 외아들과 체사레 추기경의 딸이 약혼하는 날이었다. 시라노 번스타인은 제국 학술원에서 촉망받는 젊은 학자였고, 메르세데스는 그 곁에 선 것만으로도 홀을 환하게 만드는 사람이었다.\n\n\"떨려요?\"\n\n메르세데스가 작게 물었다. 시라노는 웃으며 고개를 저었다.\n\n\"책 한 권 끝까지 읽는 것보다 쉬운 일이죠.\"\n\n그 말이 끝나기도 전에 홀 문이 부서지듯 열렸다. 제국 경찰이었다.\n\n\"시라노 번스타인. 금서 『창세전쟁의 비록』을 읽은 죄로 체포한다.\"\n\n음악이 멎었다. 아버지 루크 번스타인이 앞으로 나섰지만 창끝이 먼저 그의 가슴을 막았다. 시라노는 끌려 나가며 뒤를 돌아봤다. 메르세데스는 하얗게 질린 얼굴로 서 있었고, 그 뒤 높은 자리에 앉은 체사레 추기경은 표정 하나 바뀌지 않았다.\n\n종교 재판은 짧았다. 증인석에 오른 사람은 둘이었다. 형제처럼 지내던 루벤, 그리고 학술원에서 함께 밤을 새우던 친구 이스카리옷. 둘은 시라노가 악마를 섬긴다고 말했다. 시라노는 그 말을 듣고도 믿을 수가 없어서, 반박할 말조차 떠올리지 못했다.\n\n사형이 선고됐다가, 유황 광산 감옥 인페르노에서 평생 노역하는 것으로 바뀌었다. 사람들은 그걸 자비라고 불렀다.\n\n감옥에서 들은 소식은 둘이었다. 번스타인 가문이 반란을 일으켰다가 진압돼 멸문했다는 것. 그리고 메르세데스가 알프레드 프레데릭이라는 영주와 결혼했다는 것.\n\n---\n\n## 1장 — 인페르노\n\n인페르노의 공기는 노랗고 매웠다.\n\n죄수들은 유황을 캤다. 화약의 원료라 총포가 퍼진 이 시대에는 금처럼 귀한 돌이었다. 숨을 쉴 때마다 목이 타들어 갔고, 기침에 피가 섞여 나오기 시작하면 남은 날을 손가락으로 셀 수 있었다.\n\n어느 날 갱도가 무너졌다. 흙먼지가 가라앉았을 때 시라노는 혼자였다. 돌아갈 길은 막혔고, 앞으로 난 길은 점점 더 깊은 어둠 속으로 내려갔다. 얼마를 헤맸는지 모를 즈음, 동굴 끝에서 무언가가 시라노를 불렀다.\n\n\"번스타인의 아이로구나.\"\n\n봉인된 13암흑신의 수장, 혼돈의 데이모스였다.\n\n시라노는 그 앞에서 처음으로 자기 이야기를 끝까지 했다. 데이모스는 비웃지 않았다. 대신 시라노가 읽었던 『창세전쟁의 비록』이 진짜 역사라는 것, 신들과 인류의 전쟁에서 인류를 이끈 건 패왕 흑태자와 성왕 라시드였다는 것, 그 진실을 덮으려는 자들이 지금 세상을 쥐고 있다는 것을 들려줬다. 그리고 시라노가 왜 그 책 한 권 때문에 모든 걸 잃었는지도.\n\n\"네 적은 증인석에 섰던 아이들이 아니다. 그 아이들을 세운 자다.\"\n\n체사레. 시라노는 그 이름을 이를 악물고 삼켰다.\n\n그 뒤로 시라노는 노역이 끝나면 데이모스를 찾아갔다. 역사학을 배우고, 증거를 쌓아 결론에 이르는 추론법을 배웠다. 감옥 안에서 학자로 사는 법을 다시 익힌 셈이었다.\n\n수감 4년째, 시라노의 몸은 한계에 왔다. 동굴 바닥에 쓰러진 그에게 데이모스가 말했다.\n\n\"내 마지막 힘을 주마. 대신 부탁이 하나 있다. 폭풍도에 흑태자의 마검 아수라가 있다. 그것을 찾아 거두어 다오.\"\n\n검고 뜨거운 것이 혈관을 타고 들어왔다. 암흑혈이었다. 데이모스의 기척은 그날로 사라졌다.\n\n그 뒤로 시라노는 유황 독에 시달리지 않았다. 오히려 몸 안에서 낯선 힘이 돌았다.\n\n---\n\n## 2장 — 케르베로스의 구멍\n\n그로부터 9년이 흘렀다. 에스겔력 1263년 84일.\n\n갱도에 총성이 울렸다. 레지스탕스 제피르 팰컨이 붙잡힌 동료들을 구하려고 인페르노를 습격한 것이었다. 앞장선 남자는 금발을 휘날리며 웃고 있었다. 제1부대장 로베르토 데 메디치.\n\n\"어차피 문을 열었으니, 다들 나가라고!\"\n\n메디치는 다른 죄수들의 사슬까지 풀어 줬다. 간수들이 몰려오자 메디치는 망설임 없이 깊은 수직굴, 죄수들이 케르베로스의 구멍이라 부르던 곳으로 뛰어내렸다. 시라노도 뒤따라 몸을 던졌다.\n\n밖에 나오니 하늘이 너무 넓었다.\n\n\"우리와 같이 가겠나? 제피르 팰컨은 실력 있는 사람을 반긴다.\"\n\n메디치의 제안에 시라노는 정중히 고개를 숙였다.\n\n\"고맙습니다. 하지만 먼저 지켜야 할 약속이 있습니다.\"\n\n폭풍도. 데이모스의 유언을 이룰 차례였다.\n\n---\n\n## 3장 — 사막의 성녀\n\n폭풍도로 가려면 먼저 트리시스 사막을 건너야 했다. 시라노는 대상 무리에 섞여 모래 위를 걸었다.\n\n120일 무렵, 모래 언덕 너머에서 도적 떼가 덮쳤다. 비명과 말 울음 속에서 시라노는 일행을 놓쳤다. 물도 없이 며칠을 헤매다가, 뜨거운 모래 위에 얼굴을 묻고 쓰러졌다.\n\n눈을 뜨니 천장이 보였다. 사이럽스 시티의 여관이었다.\n\n\"정신이 드세요? 사흘을 내리 주무셨어요.\"\n\n젊은 여의사였다. 이름은 에스메랄다. 고향 프리토리아에서 가난한 사람들을 공짜로 치료해 줘서 '프리토리아의 성녀'라고 불린다고, 여관 주인이 귀띔해 줬다.\n\n사이럽스는 어수선했다. 시장 선거가 코앞이었다. 사막에는 도적이, 바다에는 해적이 들끓는데 시장 샤를르는 손을 못 쓰고 있었다. 오히려 해적을 핑계로 뱃길을 막고, 교회가 성금을 더 걷는 걸 눈감아 주고 있었다. 시장이 싫어하는 선장이 모는 다카마 행 배에는 아예 출항 금지가 걸려 있었다. 사람들은 차라리 흑태자의 제국 시절이 나았다고 수군거렸다.\n\n문제는 폭풍도로 가는 연락선이 팬드래건 왕국의 다카마 항에서 뜬다는 것이었다. 다카마로 가는 배가 묶이면 시라노도 묶였다.\n\n시라노는 시장 관저를 찾아갔지만 소용없었다. 그다음 찾아간 사람은 네 번째로 시장 선거에 나선 루스 그랜드였다. 주점에서 선원들과 어울리던 루스는 시라노의 이야기를 끝까지 들었다. 시라노는 거짓말 대신 사실을 말했다. 폭풍도에 가야 한다고.\n\n\"좋아. 뱃길은 내가 어떻게든 뚫어 주지. 여비도 챙겨 가.\"\n\n루스는 웃으며 술잔을 들었다.\n\n\"폭풍도 갔다 와서 술 한잔 사라. 그거면 돼.\"\n\n---\n\n## 4장 — 폭풍도\n\n다카마 항은 안타리아 최고의 항구라는 이름이 무색했다. 투르 제국과의 50년 전쟁 탓에 장사가 안 된다는 불평이 부두마다 쌓여 있었다. 자유무역지대 안쪽, 팬드래건 본토로는 허가증 없이 한 발도 들일 수 없었다. 탈옥수에게 허가증이 있을 리 없었다.\n\n폭풍도 행 연락선은 시라노를 태워 주지 않았다. 시라노는 밤을 틈타 짐칸에 숨어들었다.\n\n배가 바다 한가운데 이르렀을 때 하늘이 뒤집혔다. 거센 회오리바람이 돛을 찢었고, 검은 물속에서 거대한 촉수가 솟아올랐다. 크라켄이었다. 배는 반으로 갈라졌다.\n\n---\n\n차가운 모래의 감촉. 누군가 시라노의 어깨를 흔들었다.\n\n\"아직 숨이 붙어 있구나.\"\n\n은발의 노부인이었다. 이올린 팬드래건. 라시드 대왕의 누나이자 한때 팬드래건의 왕이었던 사람. 라시드가 해마다 폭풍도로 배를 보내는 건 바로 이 누나를 위해서였다.\n\n몸을 추스른 시라노가 물었다.\n\n\"마검 아수라는 어디 있습니까.\"\n\n이올린의 눈빛이 식었다.\n\n\"위험한 물건이다. 몸이 나으면 돌아가거라.\"\n\n이올린은 이유를 캐묻지 않았다. 오십 년 동안 그 칼을 뽑겠다고 찾아왔다가 영혼을 빼앗기고 쓰러진 사람을 너무 많이 본 얼굴이었다.\n\n하지만 시라노는 학자였다. 이올린의 집 벽에는 그림 두 점이 걸려 있었다. 하나는 흑태자의 초상, 또 하나는 폭풍도 산봉우리를 그린 풍경화. 시라노는 두 그림을 오래 바라보며 『창세전쟁의 비록』의 구절을 하나하나 떠올렸다. 흑태자가 마지막에 몰았던 마장기 아스모데우스. 그것이 잠든 곳. 그리고 그림 속 봉우리.\n\n\"정상이군.\"\n\n시라노는 정상에 올라 아수라에 손을 뻗었다. 칼이 그를 거부했다. 몸이 튕겨 나갔지만, 다른 사람들처럼 영혼을 빼앗기지는 않았다. 핏속의 암흑혈이 그를 붙들고 있었다.\n\n뒤따라온 이올린이 그 모습을 지켜봤다.\n\n\"검술이 모자라서다. 칼이 너를 아직 주인으로 보지 않는 게지.\"\n\n그리고 한참 뒤에 덧붙였다.\n\n\"네 작은할아버지 빈센트에게 진 빚이 있다. 그걸 갚는 셈 치고 가르쳐 주마. ……나를 위해서이기도 하고.\"\n\n그날부터 시라노는 팬드래건의 검을 배웠다. 빠르고, 끊김 없이 흐르는 검이었다. 질풍마영참을 익혔고, 동굴에서 찾은 유리검을 손에 익혔다.\n\n다시 오른 정상에서, 아수라를 지키는 수호신이 시라노를 막아섰다. 긴 싸움 끝에 수호신이 무너졌다. 시라노가 손잡이를 쥐었을 때, 이번에는 칼이 그를 밀어내지 않았다.\n\n산을 내려온 시라노가 이올린을 보며 문득 말했다.\n\n\"이상하군요. 오래전에 당신을 만난 적이 있는 것 같습니다.\"\n\n이올린은 대답하지 않았다. 바다 쪽으로 고개를 돌렸을 뿐이다.\n\n---\n\n## 5장 — 해적 실버\n\n이번에는 몰래 탄 배가 아니었다. 라시드 대왕이 보낸 팬드래건 연락선이 시라노를 싣고 폭풍도를 떠났다.\n\n머매니안해 한복판에서 갈고리가 뱃전에 걸렸다. 해적이었다. 올 때는 크라켄, 갈 때는 해적. 이 바다가 얼마나 험해졌는지 보여 주는 길이었다.\n\n하지만 폭풍도에서 수련을 마친 시라노에게 해적들은 상대가 되지 않았다. 혼자 갑판까지 올라가자 뱃머리에 선 젊은 두목이 휘파람을 불었다.\n\n\"배짱 좋은데. 이름이 뭐야?\"\n\n\"사이럽스까지 데려다주면 없던 일로 하지.\"\n\n해적 두목 실버는 크게 웃었다.\n\n\"그럼 결투로 하자. 네가 이기면 사이럽스까지는 물론이고, 평생 네 종 노릇이라도 해 주지.\"\n\n결투는 오래 가지 않았다. 갑판에 주저앉은 실버는 칼을 거두고 손을 내밀었다.\n\n\"약속은 약속이지.\"\n\n사이럽스 부두에서 실버는 부하들과 작별했다. 그리고 짐 하나만 메고 시라노 옆에 섰다. 시라노의 첫 동료였다.\n\n---\n\n## 6장 — 카나, 그리고 카라카스\n\n둘은 트리시스 사막을 거꾸로 건넜다. 처음엔 도적 떼에 쓰러졌던 모래 위를, 이번엔 아수라와 동료를 데리고 걸었다. 그 끝에 고향 게이시르가 있었다. 체사레가 있는 곳이었다.\n\n구 게이시르 제국령에 들어서자마자 비명이 들렸다. 제국 병사들이 젊은 여자 하나를 쫓고 있었다. 시라노와 실버가 끼어들어 병사들을 쓰러뜨렸다.\n\n\"고마워요.\"\n\n여자는 그 한마디만 남기고 숲속으로 사라졌다. 손에 총을 쥔 뒷모습이었다.\n\n---\n\n카라카스는 숲속 사냥꾼 마을이었다. 여러 지역으로 이어지는 길목이라 행상인들이 꼭 거쳐 가는 곳이었다.\n\n마을 한가운데로 영주의 행차가 지나갔다. 말 위의 얼굴을 보는 순간 시라노의 손이 칼자루로 갔다.\n\n루벤.\n\n증인석에서 시라노가 악마를 섬긴다고 말했던 사람. 그 대가로 번스타인 가문 땅 일부를 받아 영주가 돼 있었다. 마을 사람들 말로는 잔혹하기로 이름난 영주였고, 내일 화형식을 열러 왔다고 했다. 레지스탕스 제피르 팰컨을 도와준 사람을 태우는 화형식이었다.\n\n다음 날, 장작더미에 불이 붙기 직전 총성이 울렸다. 숲에서 쏟아져 나온 무리를 이끄는 사람은 어제 그 여자였다. 제피르 팰컨 제4부대장, 카나.\n\n시라노도 칼을 뽑았다. 그런데 경비병들과 얽혀 싸우는 사이 루벤은 도망쳤다.\n\n루벤의 저택으로 쳐들어가려는 시라노 앞에 카나가 나타났다.\n\n\"저택으로 이어지는 비밀통로가 있어요. 서로 돕는 거라면, 같이 가요.\"\n\n목적은 달랐다. 시라노는 복수, 카나는 작전. 하지만 노리는 사람은 같았다.\n\n비밀통로 끝에서 찾아낸 루벤은 가짜였다. 겁 많고 의심 많은 루벤다운 대비였다. 진짜는 근처 다른 곳으로 몸을 숨긴 듯했다.\n\n\"이제부터는 따로 가지.\"\n\n시라노는 카나에게 그렇게 말하고 돌아섰다. 복수는 자기 일이었다. 남을 끌어들이고 싶지 않았다.\n\n---\n\n## 7장 — 숲의 아이들, 프리토리아의 마녀재판\n\n마을 밖 숲에서 시라노는 걸음을 멈췄다.\n\n\"따라오지 말라고 했을 텐데.\"\n\n나무 뒤에서 카나가 머쓱한 얼굴로 나왔다. 그때 숲 안쪽에서 총성이 연달아 울렸다.\n\n제국 병사들이 한 가족을 쫓고 있었다. 시라노 일행이 닿았을 때는 이미 늦었다. 병사들은 눈앞에서 일가족을 쏘아 쓰러뜨렸다. 재판도, 죄목도 없었다.\n\n병사들을 물리치고 보니 두 아이가 아직 숨을 쉬고 있었다. 많이 다쳤다.\n\n\"프리토리아에 에스메랄다라는 의사가 있어요. 그분이라면…….\"\n\n카나의 말에 시라노가 고개를 들었다. 사막에서 자신을 살려 준 그 이름이었다. 길을 아는 건 카나뿐이었다. 시라노는 결국 카나와 다시 함께 걷기로 했다.\n\n---\n\n프리토리아는 드래건 브레스 산맥 중턱, 인페르노와 가까운 마을이었다. 마을 사람들은 영주 라몬 자작을 싫어했다. 여자를 밝히고, 사람들을 괴롭히고, 2층 저택에 재산을 산처럼 쌓아 둔 영주였다. 반대로 에스메랄다 이야기를 할 때면 모두 얼굴이 밝아졌다.\n\n진료소에서 다시 만난 에스메랄다는 시라노를 알아봤다.\n\n\"사막에서 그분이시네요. 이번엔 직접 걸어오셨군요.\"\n\n에스메랄다는 아이들을 맡았다. 밤새 등불이 꺼지지 않았다.\n\n다음 날 아침, 진료소 문이 벌컥 열리며 간호사가 뛰쳐나왔다.\n\n\"선생님이 끌려가셨어요! 영주가, 악마의 힘으로 사람을 고쳤다면서…….\"\n\n사실은 라몬의 구혼을 거절한 앙갚음이었다. 시라노는 주먹을 쥐었다. 15년 전 자신이 썼던 것과 똑같은 누명이었다.\n\n라몬의 저택 안에서 일행은 낯선 사내와 마주쳤다. 능청스럽게 웃는 남자였다.\n\n\"악덕 영주의 금고는 내 담당이라서 말이야.\"\n\n괴도 샤른호스트. 카나와는 이미 아는 사이인 듯했다. 일행은 저택 깊은 곳에서 에스메랄다를 구해 냈다. 돌아보니 샤른호스트는 어느새 사라지고 없었다.\n\n---\n\n## 8장 — 제피르 팰컨\n\n카나를 따라 산속 기지로 갔다. 제피르 팰컨의 군사 클라우제비츠, 제3부대장 리델, 제2부대장 이자벨이 일행을 맞았다. 리델과 이자벨은 카나가 외부인을 데려온 걸 두고 경솔하다고 나무랐다.\n\n루벤의 행방도 알게 됐다. 근처에 주둔하던 이루스 장군에게 몸을 맡겼다는 것이다. 흑태자 시절 제국 4천왕으로 꼽히던 전설적인 무장이었다.\n\n시라노가 다시 혼자 길을 나서려 할 때, 문간에서 익숙한 목소리가 들렸다.\n\n\"어이, 케르베로스 구멍의 동지 아닌가.\"\n\n메디치였다. 시라노를 인페르노에서 꺼내 준 사람. 은혜는 갚는 게 시라노의 방식이었다. 그는 일단 제피르 팰컨과 함께 움직이기로 했다.\n\n---\n\n제피르 팰컨이 카라카스를 쳤다. 메디치는 이루스를 맡고, 시라노와 카나는 루벤 저택 지하의 포로를 구하기로 했다.\n\n저택 문 앞에서 시라노는 걸음을 멈췄다. 가슴 깊은 곳이 서늘하게 당겼다. 핏속의 무언가가 어딘가로 끌려가는 느낌이었다.\n\n\"……메디치 쪽이다.\"\n\n예감은 맞았다. 메디치가 이루스에게 밀려 쓰러져 있었다. 이루스가 시라노를 돌아봤다. 그 눈에 놀람이 스쳤다.\n\n\"데이모스…… 그리고 흑태자의 파동이라니.\"\n\n이루스의 몸이 부풀어 올랐다. 살갗이 갈라지고 거대하고 흉측한 모습으로 바뀌었다. 그리마였다. 시라노는 그제야 알았다. 아까 그 서늘한 끌림은 몸 안의 데이모스가 이 힘에 반응한 것이었다.\n\n그 순간 이루스가 쳐 둔 결계가 찢어지며 그림자 하나가 뛰어들었다.\n\n\"달은 져서 칼에 드리우고, 암흑 속 흑영은 천하를 멸한다. 나는 흑영의 마지막 후계자, 샤른호스트다!\"\n\n프리토리아의 그 괴도였다. 그런데 그가 휘두르는 검을 보고 시라노는 눈을 가늘게 떴다. 빠르고 끊김 없이 흐르는 검. 폭풍도에서 이올린에게 배운 바로 그 팬드래건의 검이었다. 제국의 그림자 부대 흑영의 후계자가, 왜 적국의 검을 쓰는가.\n\n물을 틈은 없었다. 둘은 등을 맞대고 싸웠고, 끝내 이루스를 물리쳤다.\n\n---\n\n쓰러진 메디치를 실버에게 맡기고, 시라노는 혼자 루벤의 저택으로 들어갔다.\n\n이번 루벤은 진짜였다. 칼이 몇 번 부딪치고, 루벤이 무너졌다. 시라노가 그를 안아 일으켰을 때 루벤은 피가 섞인 웃음을 지었다.\n\n\"형……. 나는 루크 번스타인의 아들이야. 형의 배다른 동생.\"\n\n천한 신분으로 자라며, 모든 걸 가진 시라노를 평생 부러워했다고 했다. 그 질투가 증인석으로 그를 데려갔다고.\n\n\"아버지는…… 형을 구하려고 체사레에게 맞섰어. 그러다 프레데릭과의 결투에서 돌아가셨어.\"\n\n반란이라는 말 뒤에 숨어 있던 진실이었다. 메르세데스가 결혼한 그 남자가 아버지를 죽였다.\n\n\"미안해, 형. 형을 함정에 빠뜨린 건 체사레야. 나도, 이스카리옷도…… 어쩔 수 없었어. 체사레를…… 조심해.\"\n\n형제처럼 지내던 동생은 그렇게 시라노의 품에서 숨을 거뒀다. 첫 번째 복수가 끝났는데, 손에 남은 건 무게뿐이었다.\n\n밖으로 나오자 클라우제비츠가 기다리고 있었다.\n\n\"이제 교회는 당신을 제피르 팰컨 사람으로 볼 겁니다. 혼자서는 움직이기 어려울 거요. 우리와 함께합시다.\"\n\n인페르노에서는 거절했던 제안이었다. 이번에는 시라노가 먼저 손을 내밀었다. 원수가 체사레 하나로 좁혀진 이상, 혼자 싸울 이유가 없었다.\n\n---\n\n## 9장 — 고향, 그리고 니코시아의 요새\n\n작전 회의에서 새 정보가 올라왔다. 체사레가 게이시르 시티 남쪽의 작은 마을 니코시아에 요새를 세우고 무언가를 준비하고 있다는 것이다. 다음 임무는 정탐이었다.\n\n로우엔 이야기도 나왔다. 지금 제국에서 가장 강한 프레데릭 공의 영지. 시라노는 그 이름을 듣고도 표정을 바꾸지 않았다.\n\n기지 사람들은 제국 학술원을 이제 '이스카리옷의 학술원'이라 불렀다. 그곳에서 마법의 극한을 연구한다고 했다. 시라노가 학자로 있던 바로 그 자리를, 그를 모함한 친구가 차지하고 있었다.\n\n회의실을 나서며 시라노가 혼잣말을 했다.\n\n\"게이시르 시티, 15년 만인가.\"\n\n---\n\n고향은 낯설었다. 거리는 그대로인데 공기가 달랐다. 골목마다 수상한 암살자들이 눈을 번득였다. 누구를 노리는지는 알 수 없었다. 대성당 아래에 예전에 묻어 둔 지하수로가 있다는 이야기를 주워들은 것 말고는, 시라노는 걸음을 서둘렀다.\n\n니코시아는 한적한 시골 마을이었다. 지킬 것도 없어 보이는 곳에 요새라니, 그것부터가 이상했다. 근처가 카나의 고향이라고 했다. 시라노도 카나도, 각자의 고향 바로 옆에서 체사레와 마주치는 셈이었다.\n\n교회 요새 안에서 일행은 크리스라는 사람과 마주쳤다. 혼자서 교회와 싸우고 있었다. 왜 싸우느냐는 물음에는 끝내 입을 열지 않았다.\n\n요새 뒤편에서 정체가 드러났다. 거대한 강철의 몸. 제국 마장기 아수라 MK.2였다. 교회가 이 시골 마을에서 몰래 마장기를 만들고 있었던 것이다.\n\n일행은 마장기를 쓰러뜨렸다. 연기가 걷히자 크리스가 말했다.\n\n\"나도 제피르 팰컨에 들어가고 싶어.\"\n\n---\n\n## 막간 — 북쪽의 소식\n\n같은 무렵, 대륙 북쪽 만년설 너머 비프로스트 공국.\n\n원로원 의원들이 모젤 공왕 앞에 섰다.\n\n\"원로원을 무시하고 군비를 늘리시다니요. 전하께서 어떤 여자에게 놀아나 그 여자 말대로 하신다는 소문이 파다합니다!\"\n\n공왕은 대답하지 않았다. 대신 병사들이 들어와 의원들을 끌어냈다. 북쪽에서도 전쟁의 냄새가 나기 시작했다.\n\n---\n\n## 10장 — 리브레빌의 밤\n\n기지로 돌아와 의논한 끝에 크리스를 받아들였다. 그 자리에 리브레빌 영주 에스테 도데의 전령이 왔다. 절세 미녀로 이름난 영주였다. 모젤 공왕이 군대를 움직여 비프로스트 근처 제국령의 소영주들을 압박하고 있다는 소식도 함께 왔다.\n\n\"제국의 영주가 레지스탕스에 도움을 청한다? 이상하군.\"\n\n시라노의 말에 클라우제비츠가 고개를 저었다.\n\n\"에스테 영주는 교회와 가깝지 않소. 함정은 아닐 거요.\"\n\n---\n\n리브레빌은 비프로스트와 가까운데도 이상하게 따뜻한 교역 도시였다. 투기장은 이상한 자물쇠로 굳게 잠겨 있었다. 마을 사람들은 비프로스트 공왕 곁에 조세핀이라는 애첩이 있다고 수군댔다. 원로원이 말한 '그 여자'일지도 몰랐다. 어떤 노인은 전쟁 통에 결혼을 약속한 연인 아웬과 엘의 이야기, 카오스 큐브의 전설을 들려주다가 뒷이야기는 로우엔에 가서 들으라며 말을 끊었다.\n\n어느 집 창가에서 시라노는 낯익은 얼굴 둘을 봤다. 카라카스 숲에서 구한 그 두 아이였다. 살아서, 웃고 있었다.\n\n영주 저택에는 클라우제비츠가 먼저 와 있었다. 메디치는 늘 그렇듯 늦었다. 에스테 도데는 시라노 일행과 이야기를 나누다가, 뒤늦게 들어선 메디치를 보자 눈에 띄게 반가워했다.\n\n에스테가 털어놓은 사정은 이랬다. 커티스로 이어지는 동쪽 도로, 리브레빌의 생명줄 같은 그 길 북쪽 고원지대가 새 영지로 떨어져 나가 마을이 생겼다. 그 마을이 도로에 통행세를 걷기 시작했다. 영주에게 연락해도 답이 없었다. 그 길로 일하러 나간 사람들은 언제부턴가 돌아오지 않았다. 상대는 화력도 갖췄고, 무엇보다 몬스터를 부렸다.\n\n\"도와주신다면 해마다 100만 엘드를 드리겠어요. 제피르 팰컨 간부들의 신분도 보장하고, 이 저택도 마음껏 쓰셔도 좋아요.\"\n\n레지스탕스에게 영주가 내걸기엔 무척 큰 조건이었다.\n\n---\n\n그날 밤, 시라노는 잠이 오지 않아 저택 화원으로 나갔다. 나무 그늘 너머에서 말소리가 들렸다.\n\n\"카나. 나는 당신이…….\"\n\n메디치였다. 카나는 한참 말이 없다가 조용히 대답했다.\n\n\"미안해요. 좋아하는 사람이 따로 있어요.\"\n\n카나의 발소리가 멀어졌다. 홀로 남은 메디치 앞에 다른 발소리가 다가왔다. 에스테였다.\n\n\"제 방까지, 에스코트는 해 주시겠죠?\"\n\n두 사람이 함께 저택 안으로 사라졌다. 시라노는 그늘 속에서 숨을 죽인 채 한참을 그대로 서 있었다.\n\n다음 날 아침, 클라우제비츠가 시라노를 불렀다.\n\n\"문제의 마을, 안타나나리보로 가 주시오. 영주 저택을 조사하고, 사라진 사람들을 구해 오는 거요.\"\n\n---\n\n## 11장 — 안타나나리보\n\n안타나나리보에 도착한 시라노는 고개를 갸웃했다. 마을 사람들 말을 들어 보면, 통행세를 걷고 사람들이 사라지는 그 마을은 이곳이 아닌 것 같았다. 근처 어딘가에 따로 있는 듯했다.\n\n마을 밖 망티고아 산으로 오르는 길은 아직 막혀 있었다. 열린 길은 하나, 안타나나리보 요새 쪽뿐이었다. 시라노는 그 길로 들어섰다.\n\n영주 저택은 조용했다. 너무 조용했다. 복도를 따라 방을 하나씩 뒤지던 시라노는, 가장 안쪽 홀의 문을 밀어 열고 걸음을 멈췄다.\n\n영주가 있었다. 그리고 그 곁에, 이 땅에 있어서는 안 될 군복들이 늘어서 있었다. 북쪽 비프로스트의 군대였다.\n\n남쪽 제국령의 소영주들을 압박한다던 그 군대가, 이미 이 영지 한가운데까지 들어와 영주와 나란히 서 있었다.\n\n\"제피르 팰컨의 개로군.\"\n\n영주의 손짓 하나에 비프로스트 병사들이 무기를 겨눴다. 시라노는 아수라를 뽑았다. 실버가 옆으로 붙고, 에스메랄다가 주문을 읊조렸다.\n\n싸움은 거칠었다. 하지만 끝은 정해져 있었다. 병사들이 하나둘 쓰러지고, 마지막으로 남은 영주가 벽에 등을 붙였다.\n\n시라노는 망설이지 않았다. 아수라가 한 번 번뜩였고, 영주는 쓰러졌다.\n\n홀에 정적이 내려앉았다. 시라노는 칼끝에서 핏방울이 떨어지는 걸 내려다보며 생각했다.\n\n이 영주는 왜 북쪽 군대와 손을 잡았을까. 사라진 마을 사람들은 지금 어디에 있을까. 리브레빌 동쪽 도로를 막은 새 영지는 이 일과 이어져 있을까. 그리고 모젤 공왕에게 군비를 늘리라 속삭였다는 그 여자는, 이 모든 것의 어디쯤에 서 있을까.\n\n창밖으로 망티고아 산의 그림자가 길게 드리워 있었다.\n\n시라노는 칼을 거두었다.\n\n생각은 나중이었다. 지금은 사람부터 찾아야 했다.\n\n저택 아래로 내려가는 계단은 눅눅하고 어두웠다. 맨 아래 철문 너머에서 희미한 기척이 났다. 실버가 자물쇠를 부수자, 퀭한 눈들이 일제히 불빛 쪽을 향했다. 흙투성이 옷에 손목마다 쓸린 자국이 선명했다.\n\n\"리브레빌에서 오셨습니까?\"\n\n맨 앞의 사내가 갈라진 목소리로 물었다. 시라노가 고개를 끄덕이자, 사내는 그대로 주저앉아 어깨를 떨었다. 동쪽 도로로 일하러 나갔다가 돌아오지 못한 사람들이었다. 에스테가 걱정하던 바로 그 사람들.\n\n에스메랄다가 한 사람씩 상처를 살폈다. 시라노는 그들이 왜 이곳에 갇혀 있어야 했는지 묻고 싶었지만, 먼저 물을 한 모금씩 건넸다.\n\n---\n\n## 막간 — 프레데릭 저택\n\n같은 무렵, 게이시르의 프레데릭 저택.\n\n창가에 선 메르세데스는 한참 동안 바깥만 바라보고 있었다. 정원의 나무들이 바람에 흔들렸다.\n\n\"크리스티나에게서는 아직 아무 소식도 없나요?\"\n\n책상 앞의 알프레드 프레데릭이 고개를 들었다.\n\n\"없소.\"\n\n\"석 달이에요. 그 애는 이제 겨우 열다섯이라고요.\"\n\n메르세데스가 돌아섰다. 목소리가 떨렸다.\n\n\"아버님이 모르는 사람에게 시집가라고 밀어붙이니, 도망치듯 나간 거예요. 그런데 당신은 어쩌면 그렇게 태평할 수가 있죠?\"\n\n프레데릭은 화를 내는 대신 웃었다.\n\n\"나도 그 나이엔 세상을 떠돌며 견문을 넓혔소. 그 애는 어릴 때부터 내게 검을 배웠지. 어디 가서 쉽게 당할 아이가 아니오.\"\n\n그 웃음에는 딸을 믿는 아버지의 여유가 묻어 있었다. 메르세데스는 더 말하지 못하고 입술을 깨물었다.\n\n프레데릭이 책상 위의 서류를 넘기며 화제를 바꿨다.\n\n\"그보다, 장인어른이 니코시아에 세운 교회가 제피르 팰컨에게 부서졌다고 하오.\"\n\n\"니코시아요?\"\n\n\"그렇소. 장인어른도 평민들을 너무 몰아세우시긴 하지. 그러니 저런 무리가 자꾸 생겨나는 거요.\"\n\n프레데릭은 잠시 말을 멈추고 창밖을 바라봤다. 그러고는 서류를 덮었다.\n\n\"그래도 제피르 팰컨은 한번 혼을 내 줘야겠소. 그자들을 쫓다 보면, 크리스티나가 어디 있는지도 알게 될지 모르지.\"\n\n메르세데스는 아무 대답도 하지 않았다. 창밖에서는 여전히 바람이 불고 있었다.\n\n---\n\n## 12장 — 세 곳의 포로\n\n기지 작전회의실의 공기는 오랜만에 가벼웠다.\n\n\"리브레빌 주민들을 구해 낸 덕에 후원자가 생겼소.\"\n\n클라우제비츠의 말에 몇몇이 웃음을 터뜨렸다. 누가 돈을 대기로 했는지는 굳이 말하지 않았다. 하지만 시라노의 머릿속에는 화원의 그날 밤, 메디치의 팔을 잡고 저택 안으로 사라지던 에스테의 뒷모습이 떠올랐다.\n\n웃음은 오래가지 않았다. 클라우제비츠가 지도 위에 손가락을 올렸다.\n\n\"좋은 소식만 있는 건 아니오. 프레데릭의 로우엔군이 움직이기 시작했소.\"\n\n회의실이 조용해졌다. 제국에서 가장 강하다는 군대였다. 시라노는 그 이름을 들으며 아무 표정도 짓지 않으려 애썼다. 아버지를 결투에서 쓰러뜨리고, 메르세데스를 아내로 맞은 사람.\n\n\"프레데릭의 힘을 등에 업은 영주들이 우리 동료들을 붙잡아 두고 있소. 새 작전의 목표는 포로 구출이오.\"\n\n손가락이 지도 위의 세 점을 차례로 짚었다.\n\n\"프리토리아. 멤피스. 보르도.\"\n\n프리토리아에서 손가락이 멈췄다. 에스메랄다가 고개를 들었다.\n\n\"프리토리아는 라몬을 몰아낸 뒤로 우리 쪽 도시였지만, 얼마 전 프레데릭의 지휘로 새 영주가 들어섰소.\"\n\n에스메랄다의 손이 무릎 위에서 꽉 쥐어졌다. 그녀의 진료소가 있는 곳이었다. 시라노와 처음 다시 만난 곳이기도 했다.\n\n회의가 끝나고 사람들이 하나둘 자리를 뜰 때, 에스메랄다가 시라노 곁으로 다가왔다.\n\n\"프리토리아라면…… 제 병원에 잠깐 들러 볼 수 있겠네요.\"\n\n아무렇지 않은 척하는 말투였지만, 눈길은 아직 지도 위의 그 점에 머물러 있었다. 라몬에게 끌려간 그날 이후로 한 번도 돌아가 보지 못한 곳이었다.\n\n\"들르지.\"\n\n시라노가 짧게 답하자 에스메랄다가 작게 웃었다.\n\n회의실 문을 나서는데 메디치가 어깨를 툭 쳤다. 늘 그렇듯 장난기 어린 얼굴이었지만, 목소리는 조금 낮았다.\n\n\"그거 알아? 우리 군사님, 가끔 아무한테도 말 안 하고 사라질 때가 있어.\"\n\n메디치는 턱으로 회의실 안쪽을 가리켰다. 클라우제비츠는 여전히 지도 앞에 서 있었다.\n\n\"어디 가는지는 아무도 몰라. 뭐, 그 양반 일이니 알아서 하겠지만.\"\n\n메디치는 휘파람을 불며 멀어졌다. 시라노는 잠시 클라우제비츠의 등을 바라보다가 회의실 안으로 다시 눈길을 돌렸다.\n\n시라노는 다시 지도를 내려다봤다. 프리토리아에서 멤피스로, 그리고 로우엔 바로 위의 보르도까지. 길은 점점 프레데릭의 땅 깊숙이 이어지고 있었다.\n\n---\n\n떠나기 전날 밤, 시라노는 술집 너머 복도 끝의 벽 앞에 섰다. 기지 사람 하나가 친구가 이 벽 뒤로 빨려 들어갔다고 했던 바로 그 자리였다.\n\n손을 대자 벽이 물결처럼 일렁였다. 그 너머로 축축한 돌계단이 아래로 이어져 있었다.\n\n기지 밑의 동굴은 깊고 넓었다. 어둠 속에서 다리가 없는 적갈색 기사들이 미끄러지듯 다가왔다. 한 번 휘두르는 창에 바위가 쪼개졌다. 실버가 이를 악물며 웃었다.\n\n\"레지스탕스 기지 밑에 이런 게 살고 있었다니. 다들 발 뻗고 잘 수가 없겠는데.\"\n\n몇 번이나 물러섰다가 다시 나아갔다. 잠긴 상자들을 하나씩 열며 북동쪽 끝까지 파고들었을 때, 동굴 가장 깊은 곳에 창 한 자루가 꽂혀 있었다. 오랜 세월 아무도 손대지 않은 창날이 횃불을 받아 희미하게 빛났다.\n\n롱기누스의 창이었다.\n\n시라노는 창을 뽑아 들고 잠시 동굴 안을 둘러봤다. 레지스탕스의 기지 바로 밑에, 왜 이런 창이 잠들어 있었을까. 빨려 들어갔다는 그 친구는 어떻게 됐을까. 대답해 줄 사람은 없었다.\n\n---\n\n## 13장 — 불사조의 동굴\n\n프리토리아로 내려가는 길은 산을 끼고 돌았다. 드래건 브레스 산맥의 남쪽 끝자락이었다.\n\n\"사이럽스에서 들은 얘기 기억나?\"\n\n실버가 산봉우리를 올려다보며 말했다.\n\n\"프리토리아 근처 산에서 이상한 기운이 흘러나온다던 거. 술 취한 선원 헛소리인 줄 알았는데.\"\n\n시라노도 느끼고 있었다. 산허리에 뚫린 동굴 입구에서 미지근한 바람이 새어 나왔다. 겨울 산인데도 그 앞의 눈은 다 녹아 있었다.\n\n동굴 안으로 들어갈수록 공기가 뜨거워졌다. 벽의 바위가 군데군데 붉게 달아 있었고, 어둠 속에서 불꽃을 두른 짐승들이 튀어나왔다. 에스메랄다가 이마의 땀을 훔쳤다.\n\n\"이 안에 뭐가 있길래 산이 통째로 달아올라 있는 걸까요.\"\n\n가장 깊은 곳은 둥근 돌방이었다. 가운데에 사람 머리만 한 알 하나가 놓여 있었다. 껍데기 아래로 불빛이 숨을 쉬듯 일렁였다.\n\n시라노가 손을 뻗자 뜨겁지 않았다. 오히려 따뜻했다. 알 속에서 무언가가 날개를 접고 잠들어 있는 기척이 났다.\n\n\"피닉스의 알이군.\"\n\n불 속에서 죽고 재에서 다시 태어난다는 새. 시라노는 알을 품에 안고 동굴을 나섰다. 바깥바람이 차가웠다. 산 아래로 프리토리아의 지붕들이 보였다.\n\n---\n\n## 14장 — 다시, 프리토리아\n\n프리토리아의 골목은 그대로였다. 비탈을 따라 늘어선 지붕들, 산에서 내려오는 찬 바람, 저 위로 보이는 영주 저택의 2층 창문까지.\n\n하지만 그 저택의 주인은 바뀌어 있었다. 라몬이 쫓겨난 자리에, 이번에는 프레데릭이 앉힌 사람이 들어와 있었다. 그리고 그 어딘가에 제피르 팰컨의 동료들이 갇혀 있었다.\n\n에스메랄다는 마을 어귀에서 걸음을 멈췄다. 눈길이 골목 안쪽, 자신의 진료소가 있는 쪽으로 향해 있었다.\n\n\"먼저 가 봐.\"\n\n시라노가 말했다. 에스메랄다는 고개를 끄덕였지만, 발을 떼기 전에 한 번 더 영주 저택 쪽을 올려다봤다.\n\n진료소 문은 잠겨 있지 않았다. 안은 조용했다. 약병이 늘어선 선반에 먼지가 엷게 앉아 있었고, 창가의 침대는 누가 정리해 둔 듯 반듯했다.\n\n에스메랄다는 선반을 손끝으로 한 번 쓸어 보고, 침대 시트를 한 번 펴 보고, 그러고는 돌아섰다.\n\n\"다행이에요. 아무 일도 없었네요.\"\n\n목소리는 밝았지만, 문을 닫는 손은 조금 오래 문고리에 머물렀다. 시라노는 아무 말 없이 기다렸다가, 함께 영주 저택 쪽으로 걸음을 옮겼다.\n\n---\n\n영주 저택의 문을 넘는 순간, 시라노는 묘한 기분이 들었다. 복도의 모양도, 계단의 삐걱임도 그대로였다. 에스메랄다를 구하러 숨어들었던 그날 밤과 다른 건 벽에 걸린 문장 하나뿐이었다.\n\n일행은 1층부터 훑었다. 방마다 문을 열고, 상자마다 뚜껑을 젖혔다. 라몬이 산처럼 쌓아 두었다던 재산은 어디로 갔는지, 남은 건 새 주인이 들여놓은 것들이었다.\n\n\"쓸 만한 건 다 챙겨.\"\n\n실버가 상자 하나를 들어 보이며 히죽 웃었다.\n\n\"악덕 영주 금고 털이는 원래 그 괴도 양반 담당인데, 오늘은 우리가 대신하는 걸로.\"\n\n2층까지 올라가 마지막 방의 서랍까지 비웠을 때, 저택은 이상하리만치 조용했다. 새 영주의 모습도, 갇힌 동료들의 기척도 아직 보이지 않았다.\n\n*(지금 여기까지)*\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
</html>
