<script id="md" type="application/json">"# 서풍의 광시곡 — 인페르노에서 독배까지\n\n> `스토리_흐름.md`, `떡밥_정리.md`, 나무위키 자료를 바탕으로 쓴 소설.\n> **제피르 팰컨이 두 갈래로 나뉜 뒤, 시라노와 리델이 발키리 대장 카타리나를 물리치고, 보물찾기 일행이 화룡굴에서 보물을 찾고, 시라노가 비프로스트 궁에서 마키아벨리를 살려 보내고, 프레데릭이 제피르 팰컨에 전령을 보내고, 제피르 팰컨이 에스테의 저택에 다시 모여 프레데릭과 손잡기로 하고, 시라노가 크리스의 피아노 소리를 듣고, 프레데릭과 함께 인페르노를 되찾고, 크리스가 집으로 돌아간 뒤, 드래건 스트라이크 작전에 이기고, 시라노가 프레데릭을 살려 보냈지만 프레데릭이 죽은 채 돌아오고, 체사레가 메르세데스 곁에 잔을 두고 간 뒤, 시라노가 메르세데스의 저택에서 독배를 마시고 쓰러진 뒤, 실버가 홀로 남아 길을 막는 시점까지**만 담았다. 그 뒤 이야기는 쓰지 않았다.\n> 대사와 장면 묘사는 줄거리에 맞춰 새로 지어 넣은 것이라 게임 대사와 다르다.\n\n---\n\n## 프롤로그 — 약혼식 날\n\n에스겔력 1249년 겨울, 게이시르 시티는 눈 대신 축하 꽃잎으로 덮여 있었다.\n\n번스타인 저택의 큰 홀에는 촛불이 수백 개 켜졌다. 제국 7용사 번스타인 가문의 외아들과 체사레 추기경의 딸이 약혼하는 날이었다. 시라노 번스타인은 제국 학술원에서 촉망받는 젊은 학자였고, 메르세데스는 그 곁에 선 것만으로도 홀을 환하게 만드는 사람이었다.\n\n\"떨려요?\"\n\n메르세데스가 작게 물었다. 시라노는 웃으며 고개를 저었다.\n\n\"책 한 권 끝까지 읽는 것보다 쉬운 일이죠.\"\n\n그 말이 끝나기도 전에 홀 문이 부서지듯 열렸다. 제국 경찰이었다.\n\n\"시라노 번스타인. 금서 『창세전쟁의 비록』을 읽은 죄로 체포한다.\"\n\n음악이 멎었다. 아버지 루크 번스타인이 앞으로 나섰지만 창끝이 먼저 그의 가슴을 막았다. 시라노는 끌려 나가며 뒤를 돌아봤다. 메르세데스는 하얗게 질린 얼굴로 서 있었고, 그 뒤 높은 자리에 앉은 체사레 추기경은 표정 하나 바뀌지 않았다.\n\n종교 재판은 짧았다. 증인석에 오른 사람은 둘이었다. 형제처럼 지내던 루벤, 그리고 학술원에서 함께 밤을 새우던 친구 이스카리옷. 둘은 시라노가 악마를 섬긴다고 말했다. 시라노는 그 말을 듣고도 믿을 수가 없어서, 반박할 말조차 떠올리지 못했다.\n\n사형이 선고됐다가, 유황 광산 감옥 인페르노에서 평생 노역하는 것으로 바뀌었다. 사람들은 그걸 자비라고 불렀다.\n\n감옥에서 들은 소식은 둘이었다. 번스타인 가문이 반란을 일으켰다가 진압돼 멸문했다는 것. 그리고 메르세데스가 알프레드 프레데릭이라는 영주와 결혼했다는 것.\n\n---\n\n## 1장 — 인페르노\n\n인페르노의 공기는 노랗고 매웠다.\n\n죄수들은 유황을 캤다. 화약의 원료라 총포가 퍼진 이 시대에는 금처럼 귀한 돌이었다. 숨을 쉴 때마다 목이 타들어 갔고, 기침에 피가 섞여 나오기 시작하면 남은 날을 손가락으로 셀 수 있었다.\n\n어느 날 갱도가 무너졌다. 흙먼지가 가라앉았을 때 시라노는 혼자였다. 돌아갈 길은 막혔고, 앞으로 난 길은 점점 더 깊은 어둠 속으로 내려갔다. 얼마를 헤맸는지 모를 즈음, 동굴 끝에서 무언가가 시라노를 불렀다.\n\n\"번스타인의 아이로구나.\"\n\n봉인된 13암흑신의 수장, 혼돈의 데이모스였다.\n\n시라노는 그 앞에서 처음으로 자기 이야기를 끝까지 했다. 데이모스는 비웃지 않았다. 대신 시라노가 읽었던 『창세전쟁의 비록』이 진짜 역사라는 것, 신들과 인류의 전쟁에서 인류를 이끈 건 패왕 흑태자와 성왕 라시드였다는 것, 그 진실을 덮으려는 자들이 지금 세상을 쥐고 있다는 것을 들려줬다. 그리고 시라노가 왜 그 책 한 권 때문에 모든 걸 잃었는지도.\n\n\"네 적은 증인석에 섰던 아이들이 아니다. 그 아이들을 세운 자다.\"\n\n체사레. 시라노는 그 이름을 이를 악물고 삼켰다.\n\n그 뒤로 시라노는 노역이 끝나면 데이모스를 찾아갔다. 역사학을 배우고, 증거를 쌓아 결론에 이르는 추론법을 배웠다. 감옥 안에서 학자로 사는 법을 다시 익힌 셈이었다.\n\n수감 4년째, 시라노의 몸은 한계에 왔다. 동굴 바닥에 쓰러진 그에게 데이모스가 말했다.\n\n\"내 마지막 힘을 주마. 대신 부탁이 하나 있다. 폭풍도에 흑태자의 마검 아수라가 있다. 그것을 찾아 거두어 다오.\"\n\n검고 뜨거운 것이 혈관을 타고 들어왔다. 암흑혈이었다. 데이모스의 기척은 그날로 사라졌다.\n\n그 뒤로 시라노는 유황 독에 시달리지 않았다. 오히려 몸 안에서 낯선 힘이 돌았다.\n\n---\n\n## 2장 — 케르베로스의 구멍\n\n그로부터 9년이 흘렀다. 에스겔력 1263년 84일.\n\n갱도에 총성이 울렸다. 레지스탕스 제피르 팰컨이 붙잡힌 동료들을 구하려고 인페르노를 습격한 것이었다. 앞장선 남자는 금발을 휘날리며 웃고 있었다. 제1부대장 로베르토 데 메디치.\n\n\"어차피 문을 열었으니, 다들 나가라고!\"\n\n메디치는 다른 죄수들의 사슬까지 풀어 줬다. 간수들이 몰려오자 메디치는 망설임 없이 깊은 수직굴, 죄수들이 케르베로스의 구멍이라 부르던 곳으로 뛰어내렸다. 시라노도 뒤따라 몸을 던졌다.\n\n밖에 나오니 하늘이 너무 넓었다.\n\n\"우리와 같이 가겠나? 제피르 팰컨은 실력 있는 사람을 반긴다.\"\n\n메디치의 제안에 시라노는 정중히 고개를 숙였다.\n\n\"고맙습니다. 하지만 먼저 지켜야 할 약속이 있습니다.\"\n\n폭풍도. 데이모스의 유언을 이룰 차례였다.\n\n---\n\n## 3장 — 사막의 성녀\n\n폭풍도로 가려면 먼저 트리시스 사막을 건너야 했다. 시라노는 대상 무리에 섞여 모래 위를 걸었다.\n\n120일 무렵, 모래 언덕 너머에서 도적 떼가 덮쳤다. 비명과 말 울음 속에서 시라노는 일행을 놓쳤다. 물도 없이 며칠을 헤매다가, 뜨거운 모래 위에 얼굴을 묻고 쓰러졌다.\n\n눈을 뜨니 천장이 보였다. 사이럽스 시티의 여관이었다.\n\n\"정신이 드세요? 사흘을 내리 주무셨어요.\"\n\n젊은 여의사였다. 이름은 에스메랄다. 고향 프리토리아에서 가난한 사람들을 공짜로 치료해 줘서 '프리토리아의 성녀'라고 불린다고, 여관 주인이 귀띔해 줬다.\n\n사이럽스는 어수선했다. 시장 선거가 코앞이었다. 사막에는 도적이, 바다에는 해적이 들끓는데 시장 샤를르는 손을 못 쓰고 있었다. 오히려 해적을 핑계로 뱃길을 막고, 교회가 성금을 더 걷는 걸 눈감아 주고 있었다. 시장이 싫어하는 선장이 모는 다카마 행 배에는 아예 출항 금지가 걸려 있었다. 사람들은 차라리 흑태자의 제국 시절이 나았다고 수군거렸다.\n\n문제는 폭풍도로 가는 연락선이 팬드래건 왕국의 다카마 항에서 뜬다는 것이었다. 다카마로 가는 배가 묶이면 시라노도 묶였다.\n\n시라노는 시장 관저를 찾아갔지만 소용없었다. 그다음 찾아간 사람은 네 번째로 시장 선거에 나선 루스 그랜드였다. 주점에서 선원들과 어울리던 루스는 시라노의 이야기를 끝까지 들었다. 시라노는 거짓말 대신 사실을 말했다. 폭풍도에 가야 한다고.\n\n\"좋아. 뱃길은 내가 어떻게든 뚫어 주지. 여비도 챙겨 가.\"\n\n루스는 웃으며 술잔을 들었다.\n\n\"폭풍도 갔다 와서 술 한잔 사라. 그거면 돼.\"\n\n---\n\n## 4장 — 폭풍도\n\n다카마 항은 안타리아 최고의 항구라는 이름이 무색했다. 투르 제국과의 50년 전쟁 탓에 장사가 안 된다는 불평이 부두마다 쌓여 있었다. 자유무역지대 안쪽, 팬드래건 본토로는 허가증 없이 한 발도 들일 수 없었다. 탈옥수에게 허가증이 있을 리 없었다.\n\n폭풍도 행 연락선은 시라노를 태워 주지 않았다. 시라노는 밤을 틈타 짐칸에 숨어들었다.\n\n배가 바다 한가운데 이르렀을 때 하늘이 뒤집혔다. 거센 회오리바람이 돛을 찢었고, 검은 물속에서 거대한 촉수가 솟아올랐다. 크라켄이었다. 배는 반으로 갈라졌다.\n\n---\n\n차가운 모래의 감촉. 누군가 시라노의 어깨를 흔들었다.\n\n\"아직 숨이 붙어 있구나.\"\n\n은발의 노부인이었다. 이올린 팬드래건. 라시드 대왕의 누나이자 한때 팬드래건의 왕이었던 사람. 라시드가 해마다 폭풍도로 배를 보내는 건 바로 이 누나를 위해서였다.\n\n몸을 추스른 시라노가 물었다.\n\n\"마검 아수라는 어디 있습니까.\"\n\n이올린의 눈빛이 식었다.\n\n\"위험한 물건이다. 몸이 나으면 돌아가거라.\"\n\n이올린은 이유를 캐묻지 않았다. 오십 년 동안 그 칼을 뽑겠다고 찾아왔다가 영혼을 빼앗기고 쓰러진 사람을 너무 많이 본 얼굴이었다.\n\n하지만 시라노는 학자였다. 이올린의 집 벽에는 그림 두 점이 걸려 있었다. 하나는 흑태자의 초상, 또 하나는 폭풍도 산봉우리를 그린 풍경화. 시라노는 두 그림을 오래 바라보며 『창세전쟁의 비록』의 구절을 하나하나 떠올렸다. 흑태자가 마지막에 몰았던 마장기 아스모데우스. 그것이 잠든 곳. 그리고 그림 속 봉우리.\n\n\"정상이군.\"\n\n시라노는 정상에 올라 아수라에 손을 뻗었다. 칼이 그를 거부했다. 몸이 튕겨 나갔지만, 다른 사람들처럼 영혼을 빼앗기지는 않았다. 핏속의 암흑혈이 그를 붙들고 있었다.\n\n뒤따라온 이올린이 그 모습을 지켜봤다.\n\n\"검술이 모자라서다. 칼이 너를 아직 주인으로 보지 않는 게지.\"\n\n그리고 한참 뒤에 덧붙였다.\n\n\"네 작은할아버지 빈센트에게 진 빚이 있다. 그걸 갚는 셈 치고 가르쳐 주마. ……나를 위해서이기도 하고.\"\n\n그날부터 시라노는 팬드래건의 검을 배웠다. 빠르고, 끊김 없이 흐르는 검이었다. 질풍마영참을 익혔고, 동굴에서 찾은 유리검을 손에 익혔다.\n\n다시 오른 정상에서, 아수라를 지키는 수호신이 시라노를 막아섰다. 긴 싸움 끝에 수호신이 무너졌다. 시라노가 손잡이를 쥐었을 때, 이번에는 칼이 그를 밀어내지 않았다.\n\n산을 내려온 시라노가 이올린을 보며 문득 말했다.\n\n\"이상하군요. 오래전에 당신을 만난 적이 있는 것 같습니다.\"\n\n이올린은 대답하지 않았다. 바다 쪽으로 고개를 돌렸을 뿐이다.\n\n---\n\n## 5장 — 해적 실버\n\n이번에는 몰래 탄 배가 아니었다. 라시드 대왕이 보낸 팬드래건 연락선이 시라노를 싣고 폭풍도를 떠났다.\n\n머매니안해 한복판에서 갈고리가 뱃전에 걸렸다. 해적이었다. 올 때는 크라켄, 갈 때는 해적. 이 바다가 얼마나 험해졌는지 보여 주는 길이었다.\n\n하지만 폭풍도에서 수련을 마친 시라노에게 해적들은 상대가 되지 않았다. 혼자 갑판까지 올라가자 뱃머리에 선 젊은 두목이 휘파람을 불었다.\n\n\"배짱 좋은데. 이름이 뭐야?\"\n\n\"사이럽스까지 데려다주면 없던 일로 하지.\"\n\n해적 두목 실버는 크게 웃었다.\n\n\"그럼 결투로 하자. 네가 이기면 사이럽스까지는 물론이고, 평생 네 종 노릇이라도 해 주지.\"\n\n결투는 오래 가지 않았다. 갑판에 주저앉은 실버는 칼을 거두고 손을 내밀었다.\n\n\"약속은 약속이지.\"\n\n사이럽스 부두에서 실버는 부하들과 작별했다. 그리고 짐 하나만 메고 시라노 옆에 섰다. 시라노의 첫 동료였다.\n\n---\n\n## 6장 — 카나, 그리고 카라카스\n\n둘은 트리시스 사막을 거꾸로 건넜다. 처음엔 도적 떼에 쓰러졌던 모래 위를, 이번엔 아수라와 동료를 데리고 걸었다. 그 끝에 고향 게이시르가 있었다. 체사레가 있는 곳이었다.\n\n구 게이시르 제국령에 들어서자마자 비명이 들렸다. 제국 병사들이 젊은 여자 하나를 쫓고 있었다. 시라노와 실버가 끼어들어 병사들을 쓰러뜨렸다.\n\n\"고마워요.\"\n\n여자는 그 한마디만 남기고 숲속으로 사라졌다. 손에 총을 쥔 뒷모습이었다.\n\n---\n\n카라카스는 숲속 사냥꾼 마을이었다. 여러 지역으로 이어지는 길목이라 행상인들이 꼭 거쳐 가는 곳이었다.\n\n마을 한가운데로 영주의 행차가 지나갔다. 말 위의 얼굴을 보는 순간 시라노의 손이 칼자루로 갔다.\n\n루벤.\n\n증인석에서 시라노가 악마를 섬긴다고 말했던 사람. 그 대가로 번스타인 가문 땅 일부를 받아 영주가 돼 있었다. 마을 사람들 말로는 잔혹하기로 이름난 영주였고, 내일 화형식을 열러 왔다고 했다. 레지스탕스 제피르 팰컨을 도와준 사람을 태우는 화형식이었다.\n\n다음 날, 장작더미에 불이 붙기 직전 총성이 울렸다. 숲에서 쏟아져 나온 무리를 이끄는 사람은 어제 그 여자였다. 제피르 팰컨 제4부대장, 카나.\n\n시라노도 칼을 뽑았다. 그런데 경비병들과 얽혀 싸우는 사이 루벤은 도망쳤다.\n\n루벤의 저택으로 쳐들어가려는 시라노 앞에 카나가 나타났다.\n\n\"저택으로 이어지는 비밀통로가 있어요. 서로 돕는 거라면, 같이 가요.\"\n\n목적은 달랐다. 시라노는 복수, 카나는 작전. 하지만 노리는 사람은 같았다.\n\n비밀통로 끝에서 찾아낸 루벤은 가짜였다. 겁 많고 의심 많은 루벤다운 대비였다. 진짜는 근처 다른 곳으로 몸을 숨긴 듯했다.\n\n\"이제부터는 따로 가지.\"\n\n시라노는 카나에게 그렇게 말하고 돌아섰다. 복수는 자기 일이었다. 남을 끌어들이고 싶지 않았다.\n\n---\n\n## 7장 — 숲의 아이들, 프리토리아의 마녀재판\n\n마을 밖 숲에서 시라노는 걸음을 멈췄다.\n\n\"따라오지 말라고 했을 텐데.\"\n\n나무 뒤에서 카나가 머쓱한 얼굴로 나왔다. 그때 숲 안쪽에서 총성이 연달아 울렸다.\n\n제국 병사들이 한 가족을 쫓고 있었다. 시라노 일행이 닿았을 때는 이미 늦었다. 병사들은 눈앞에서 일가족을 쏘아 쓰러뜨렸다. 재판도, 죄목도 없었다.\n\n병사들을 물리치고 보니 두 아이가 아직 숨을 쉬고 있었다. 많이 다쳤다.\n\n\"프리토리아에 에스메랄다라는 의사가 있어요. 그분이라면…….\"\n\n카나의 말에 시라노가 고개를 들었다. 사막에서 자신을 살려 준 그 이름이었다. 길을 아는 건 카나뿐이었다. 시라노는 결국 카나와 다시 함께 걷기로 했다.\n\n---\n\n프리토리아는 드래건 브레스 산맥 중턱, 인페르노와 가까운 마을이었다. 마을 사람들은 영주 라몬 자작을 싫어했다. 여자를 밝히고, 사람들을 괴롭히고, 2층 저택에 재산을 산처럼 쌓아 둔 영주였다. 반대로 에스메랄다 이야기를 할 때면 모두 얼굴이 밝아졌다.\n\n진료소에서 다시 만난 에스메랄다는 시라노를 알아봤다.\n\n\"사막에서 그분이시네요. 이번엔 직접 걸어오셨군요.\"\n\n에스메랄다는 아이들을 맡았다. 밤새 등불이 꺼지지 않았다.\n\n다음 날 아침, 진료소 문이 벌컥 열리며 간호사가 뛰쳐나왔다.\n\n\"선생님이 끌려가셨어요! 영주가, 악마의 힘으로 사람을 고쳤다면서…….\"\n\n사실은 라몬의 구혼을 거절한 앙갚음이었다. 시라노는 주먹을 쥐었다. 15년 전 자신이 썼던 것과 똑같은 누명이었다.\n\n라몬의 저택 안에서 일행은 낯선 사내와 마주쳤다. 능청스럽게 웃는 남자였다.\n\n\"악덕 영주의 금고는 내 담당이라서 말이야.\"\n\n괴도 샤른호스트. 카나와는 이미 아는 사이인 듯했다. 일행은 저택 깊은 곳에서 에스메랄다를 구해 냈다. 돌아보니 샤른호스트는 어느새 사라지고 없었다.\n\n---\n\n## 8장 — 제피르 팰컨\n\n카나를 따라 산속 기지로 갔다. 제피르 팰컨의 군사 클라우제비츠, 제3부대장 리델, 제2부대장 이자벨이 일행을 맞았다. 리델과 이자벨은 카나가 외부인을 데려온 걸 두고 경솔하다고 나무랐다.\n\n루벤의 행방도 알게 됐다. 근처에 주둔하던 이루스 장군에게 몸을 맡겼다는 것이다. 흑태자 시절 제국 4천왕으로 꼽히던 전설적인 무장이었다.\n\n시라노가 다시 혼자 길을 나서려 할 때, 문간에서 익숙한 목소리가 들렸다.\n\n\"어이, 케르베로스 구멍의 동지 아닌가.\"\n\n메디치였다. 시라노를 인페르노에서 꺼내 준 사람. 은혜는 갚는 게 시라노의 방식이었다. 그는 일단 제피르 팰컨과 함께 움직이기로 했다.\n\n---\n\n제피르 팰컨이 카라카스를 쳤다. 메디치는 이루스를 맡고, 시라노와 카나는 루벤 저택 지하의 포로를 구하기로 했다.\n\n저택 문 앞에서 시라노는 걸음을 멈췄다. 가슴 깊은 곳이 서늘하게 당겼다. 핏속의 무언가가 어딘가로 끌려가는 느낌이었다.\n\n\"……메디치 쪽이다.\"\n\n예감은 맞았다. 메디치가 이루스에게 밀려 쓰러져 있었다. 이루스가 시라노를 돌아봤다. 그 눈에 놀람이 스쳤다.\n\n\"데이모스…… 그리고 흑태자의 파동이라니.\"\n\n이루스의 몸이 부풀어 올랐다. 살갗이 갈라지고 거대하고 흉측한 모습으로 바뀌었다. 그리마였다. 시라노는 그제야 알았다. 아까 그 서늘한 끌림은 몸 안의 데이모스가 이 힘에 반응한 것이었다.\n\n그 순간 이루스가 쳐 둔 결계가 찢어지며 그림자 하나가 뛰어들었다.\n\n\"달은 져서 칼에 드리우고, 암흑 속 흑영은 천하를 멸한다. 나는 흑영의 마지막 후계자, 샤른호스트다!\"\n\n프리토리아의 그 괴도였다. 그런데 그가 휘두르는 검을 보고 시라노는 눈을 가늘게 떴다. 빠르고 끊김 없이 흐르는 검. 폭풍도에서 이올린에게 배운 바로 그 팬드래건의 검이었다. 제국의 그림자 부대 흑영의 후계자가, 왜 적국의 검을 쓰는가.\n\n물을 틈은 없었다. 둘은 등을 맞대고 싸웠고, 끝내 이루스를 물리쳤다.\n\n---\n\n쓰러진 메디치를 실버에게 맡기고, 시라노는 혼자 루벤의 저택으로 들어갔다.\n\n이번 루벤은 진짜였다. 칼이 몇 번 부딪치고, 루벤이 무너졌다. 시라노가 그를 안아 일으켰을 때 루벤은 피가 섞인 웃음을 지었다.\n\n\"형……. 나는 루크 번스타인의 아들이야. 형의 배다른 동생.\"\n\n천한 신분으로 자라며, 모든 걸 가진 시라노를 평생 부러워했다고 했다. 그 질투가 증인석으로 그를 데려갔다고.\n\n\"아버지는…… 형을 구하려고 체사레에게 맞섰어. 그러다 프레데릭과의 결투에서 돌아가셨어.\"\n\n반란이라는 말 뒤에 숨어 있던 진실이었다. 메르세데스가 결혼한 그 남자가 아버지를 죽였다.\n\n\"미안해, 형. 형을 함정에 빠뜨린 건 체사레야. 나도, 이스카리옷도…… 어쩔 수 없었어. 체사레를…… 조심해.\"\n\n형제처럼 지내던 동생은 그렇게 시라노의 품에서 숨을 거뒀다. 첫 번째 복수가 끝났는데, 손에 남은 건 무게뿐이었다.\n\n밖으로 나오자 클라우제비츠가 기다리고 있었다.\n\n\"이제 교회는 당신을 제피르 팰컨 사람으로 볼 겁니다. 혼자서는 움직이기 어려울 거요. 우리와 함께합시다.\"\n\n인페르노에서는 거절했던 제안이었다. 이번에는 시라노가 먼저 손을 내밀었다. 원수가 체사레 하나로 좁혀진 이상, 혼자 싸울 이유가 없었다.\n\n---\n\n## 9장 — 고향, 그리고 니코시아의 요새\n\n작전 회의에서 새 정보가 올라왔다. 체사레가 게이시르 시티 남쪽의 작은 마을 니코시아에 요새를 세우고 무언가를 준비하고 있다는 것이다. 다음 임무는 정탐이었다.\n\n로우엔 이야기도 나왔다. 지금 제국에서 가장 강한 프레데릭 공의 영지. 시라노는 그 이름을 듣고도 표정을 바꾸지 않았다.\n\n기지 사람들은 제국 학술원을 이제 '이스카리옷의 학술원'이라 불렀다. 그곳에서 마법의 극한을 연구한다고 했다. 시라노가 학자로 있던 바로 그 자리를, 그를 모함한 친구가 차지하고 있었다.\n\n회의실을 나서며 시라노가 혼잣말을 했다.\n\n\"게이시르 시티, 15년 만인가.\"\n\n---\n\n고향은 낯설었다. 거리는 그대로인데 공기가 달랐다. 골목마다 수상한 암살자들이 눈을 번득였다. 누구를 노리는지는 알 수 없었다. 대성당 아래에 예전에 묻어 둔 지하수로가 있다는 이야기를 주워들은 것 말고는, 시라노는 걸음을 서둘렀다.\n\n니코시아는 한적한 시골 마을이었다. 지킬 것도 없어 보이는 곳에 요새라니, 그것부터가 이상했다. 근처가 카나의 고향이라고 했다. 시라노도 카나도, 각자의 고향 바로 옆에서 체사레와 마주치는 셈이었다.\n\n교회 요새 안에서 일행은 크리스라는 사람과 마주쳤다. 혼자서 교회와 싸우고 있었다. 왜 싸우느냐는 물음에는 끝내 입을 열지 않았다.\n\n요새 뒤편에서 정체가 드러났다. 거대한 강철의 몸. 제국 마장기 아수라 MK.2였다. 교회가 이 시골 마을에서 몰래 마장기를 만들고 있었던 것이다.\n\n일행은 마장기를 쓰러뜨렸다. 연기가 걷히자 크리스가 말했다.\n\n\"나도 제피르 팰컨에 들어가고 싶어.\"\n\n---\n\n## 막간 — 북쪽의 소식\n\n같은 무렵, 대륙 북쪽 만년설 너머 비프로스트 공국.\n\n원로원 의원들이 모젤 공왕 앞에 섰다.\n\n\"원로원을 무시하고 군비를 늘리시다니요. 전하께서 어떤 여자에게 놀아나 그 여자 말대로 하신다는 소문이 파다합니다!\"\n\n공왕은 대답하지 않았다. 대신 병사들이 들어와 의원들을 끌어냈다. 북쪽에서도 전쟁의 냄새가 나기 시작했다.\n\n---\n\n## 10장 — 리브레빌의 밤\n\n기지로 돌아와 의논한 끝에 크리스를 받아들였다. 그 자리에 리브레빌 영주 에스테 도데의 전령이 왔다. 절세 미녀로 이름난 영주였다. 모젤 공왕이 군대를 움직여 비프로스트 근처 제국령의 소영주들을 압박하고 있다는 소식도 함께 왔다.\n\n\"제국의 영주가 레지스탕스에 도움을 청한다? 이상하군.\"\n\n시라노의 말에 클라우제비츠가 고개를 저었다.\n\n\"에스테 영주는 교회와 가깝지 않소. 함정은 아닐 거요.\"\n\n---\n\n리브레빌은 비프로스트와 가까운데도 이상하게 따뜻한 교역 도시였다. 투기장은 이상한 자물쇠로 굳게 잠겨 있었다. 마을 사람들은 비프로스트 공왕 곁에 조세핀이라는 애첩이 있다고 수군댔다. 원로원이 말한 '그 여자'일지도 몰랐다. 어떤 노인은 전쟁 통에 결혼을 약속한 연인 아웬과 엘의 이야기, 카오스 큐브의 전설을 들려주다가 뒷이야기는 로우엔에 가서 들으라며 말을 끊었다.\n\n어느 집 창가에서 시라노는 낯익은 얼굴 둘을 봤다. 카라카스 숲에서 구한 그 두 아이였다. 살아서, 웃고 있었다.\n\n영주 저택에는 클라우제비츠가 먼저 와 있었다. 메디치는 늘 그렇듯 늦었다. 에스테 도데는 시라노 일행과 이야기를 나누다가, 뒤늦게 들어선 메디치를 보자 눈에 띄게 반가워했다.\n\n에스테가 털어놓은 사정은 이랬다. 커티스로 이어지는 동쪽 도로, 리브레빌의 생명줄 같은 그 길 북쪽 고원지대가 새 영지로 떨어져 나가 마을이 생겼다. 그 마을이 도로에 통행세를 걷기 시작했다. 영주에게 연락해도 답이 없었다. 그 길로 일하러 나간 사람들은 언제부턴가 돌아오지 않았다. 상대는 화력도 갖췄고, 무엇보다 몬스터를 부렸다.\n\n\"도와주신다면 해마다 100만 엘드를 드리겠어요. 제피르 팰컨 간부들의 신분도 보장하고, 이 저택도 마음껏 쓰셔도 좋아요.\"\n\n레지스탕스에게 영주가 내걸기엔 무척 큰 조건이었다.\n\n---\n\n그날 밤, 시라노는 잠이 오지 않아 저택 화원으로 나갔다. 나무 그늘 너머에서 말소리가 들렸다.\n\n\"카나. 나는 당신이…….\"\n\n메디치였다. 카나는 한참 말이 없다가 조용히 대답했다.\n\n\"미안해요. 좋아하는 사람이 따로 있어요.\"\n\n카나의 발소리가 멀어졌다. 홀로 남은 메디치 앞에 다른 발소리가 다가왔다. 에스테였다.\n\n\"제 방까지, 에스코트는 해 주시겠죠?\"\n\n두 사람이 함께 저택 안으로 사라졌다. 시라노는 그늘 속에서 숨을 죽인 채 한참을 그대로 서 있었다.\n\n다음 날 아침, 클라우제비츠가 시라노를 불렀다.\n\n\"문제의 마을, 안타나나리보로 가 주시오. 영주 저택을 조사하고, 사라진 사람들을 구해 오는 거요.\"\n\n---\n\n## 11장 — 안타나나리보\n\n안타나나리보에 도착한 시라노는 고개를 갸웃했다. 마을 사람들 말을 들어 보면, 통행세를 걷고 사람들이 사라지는 그 마을은 이곳이 아닌 것 같았다. 근처 어딘가에 따로 있는 듯했다.\n\n마을 밖 망티고아 산으로 오르는 길은 아직 막혀 있었다. 열린 길은 하나, 안타나나리보 요새 쪽뿐이었다. 시라노는 그 길로 들어섰다.\n\n영주 저택은 조용했다. 너무 조용했다. 복도를 따라 방을 하나씩 뒤지던 시라노는, 가장 안쪽 홀의 문을 밀어 열고 걸음을 멈췄다.\n\n영주가 있었다. 그리고 그 곁에, 이 땅에 있어서는 안 될 군복들이 늘어서 있었다. 북쪽 비프로스트의 군대였다.\n\n남쪽 제국령의 소영주들을 압박한다던 그 군대가, 이미 이 영지 한가운데까지 들어와 영주와 나란히 서 있었다.\n\n\"제피르 팰컨의 개로군.\"\n\n영주의 손짓 하나에 비프로스트 병사들이 무기를 겨눴다. 시라노는 아수라를 뽑았다. 실버가 옆으로 붙고, 에스메랄다가 주문을 읊조렸다.\n\n싸움은 거칠었다. 하지만 끝은 정해져 있었다. 병사들이 하나둘 쓰러지고, 마지막으로 남은 영주가 벽에 등을 붙였다.\n\n시라노는 망설이지 않았다. 아수라가 한 번 번뜩였고, 영주는 쓰러졌다.\n\n홀에 정적이 내려앉았다. 시라노는 칼끝에서 핏방울이 떨어지는 걸 내려다보며 생각했다.\n\n이 영주는 왜 북쪽 군대와 손을 잡았을까. 사라진 마을 사람들은 지금 어디에 있을까. 리브레빌 동쪽 도로를 막은 새 영지는 이 일과 이어져 있을까. 그리고 모젤 공왕에게 군비를 늘리라 속삭였다는 그 여자는, 이 모든 것의 어디쯤에 서 있을까.\n\n창밖으로 망티고아 산의 그림자가 길게 드리워 있었다.\n\n시라노는 칼을 거두었다.\n\n생각은 나중이었다. 지금은 사람부터 찾아야 했다.\n\n저택 아래로 내려가는 계단은 눅눅하고 어두웠다. 맨 아래 철문 너머에서 희미한 기척이 났다. 실버가 자물쇠를 부수자, 퀭한 눈들이 일제히 불빛 쪽을 향했다. 흙투성이 옷에 손목마다 쓸린 자국이 선명했다.\n\n\"리브레빌에서 오셨습니까?\"\n\n맨 앞의 사내가 갈라진 목소리로 물었다. 시라노가 고개를 끄덕이자, 사내는 그대로 주저앉아 어깨를 떨었다. 동쪽 도로로 일하러 나갔다가 돌아오지 못한 사람들이었다. 에스테가 걱정하던 바로 그 사람들.\n\n에스메랄다가 한 사람씩 상처를 살폈다. 시라노는 그들이 왜 이곳에 갇혀 있어야 했는지 묻고 싶었지만, 먼저 물을 한 모금씩 건넸다.\n\n---\n\n## 막간 — 프레데릭 저택\n\n같은 무렵, 게이시르의 프레데릭 저택.\n\n창가에 선 메르세데스는 한참 동안 바깥만 바라보고 있었다. 정원의 나무들이 바람에 흔들렸다.\n\n\"크리스티나에게서는 아직 아무 소식도 없나요?\"\n\n책상 앞의 알프레드 프레데릭이 고개를 들었다.\n\n\"없소.\"\n\n\"석 달이에요. 그 애는 이제 겨우 열다섯이라고요.\"\n\n메르세데스가 돌아섰다. 목소리가 떨렸다.\n\n\"아버님이 모르는 사람에게 시집가라고 밀어붙이니, 도망치듯 나간 거예요. 그런데 당신은 어쩌면 그렇게 태평할 수가 있죠?\"\n\n프레데릭은 화를 내는 대신 웃었다.\n\n\"나도 그 나이엔 세상을 떠돌며 견문을 넓혔소. 그 애는 어릴 때부터 내게 검을 배웠지. 어디 가서 쉽게 당할 아이가 아니오.\"\n\n그 웃음에는 딸을 믿는 아버지의 여유가 묻어 있었다. 메르세데스는 더 말하지 못하고 입술을 깨물었다.\n\n프레데릭이 책상 위의 서류를 넘기며 화제를 바꿨다.\n\n\"그보다, 장인어른이 니코시아에 세운 교회가 제피르 팰컨에게 부서졌다고 하오.\"\n\n\"니코시아요?\"\n\n\"그렇소. 장인어른도 평민들을 너무 몰아세우시긴 하지. 그러니 저런 무리가 자꾸 생겨나는 거요.\"\n\n프레데릭은 잠시 말을 멈추고 창밖을 바라봤다. 그러고는 서류를 덮었다.\n\n\"그래도 제피르 팰컨은 한번 혼을 내 줘야겠소. 그자들을 쫓다 보면, 크리스티나가 어디 있는지도 알게 될지 모르지.\"\n\n메르세데스는 아무 대답도 하지 않았다. 창밖에서는 여전히 바람이 불고 있었다.\n\n---\n\n## 12장 — 세 곳의 포로\n\n기지 작전회의실의 공기는 오랜만에 가벼웠다.\n\n\"리브레빌 주민들을 구해 낸 덕에 후원자가 생겼소.\"\n\n클라우제비츠의 말에 몇몇이 웃음을 터뜨렸다. 누가 돈을 대기로 했는지는 굳이 말하지 않았다. 하지만 시라노의 머릿속에는 화원의 그날 밤, 메디치의 팔을 잡고 저택 안으로 사라지던 에스테의 뒷모습이 떠올랐다.\n\n웃음은 오래가지 않았다. 클라우제비츠가 지도 위에 손가락을 올렸다.\n\n\"좋은 소식만 있는 건 아니오. 프레데릭의 로우엔군이 움직이기 시작했소.\"\n\n회의실이 조용해졌다. 제국에서 가장 강하다는 군대였다. 시라노는 그 이름을 들으며 아무 표정도 짓지 않으려 애썼다. 아버지를 결투에서 쓰러뜨리고, 메르세데스를 아내로 맞은 사람.\n\n\"프레데릭의 힘을 등에 업은 영주들이 우리 동료들을 붙잡아 두고 있소. 새 작전의 목표는 포로 구출이오.\"\n\n손가락이 지도 위의 세 점을 차례로 짚었다.\n\n\"프리토리아. 멤피스. 보르도.\"\n\n프리토리아에서 손가락이 멈췄다. 에스메랄다가 고개를 들었다.\n\n\"프리토리아는 라몬을 몰아낸 뒤로 우리 쪽 도시였지만, 얼마 전 프레데릭의 지휘로 새 영주가 들어섰소.\"\n\n에스메랄다의 손이 무릎 위에서 꽉 쥐어졌다. 그녀의 진료소가 있는 곳이었다. 시라노와 처음 다시 만난 곳이기도 했다.\n\n회의가 끝나고 사람들이 하나둘 자리를 뜰 때, 에스메랄다가 시라노 곁으로 다가왔다.\n\n\"프리토리아라면…… 제 병원에 잠깐 들러 볼 수 있겠네요.\"\n\n아무렇지 않은 척하는 말투였지만, 눈길은 아직 지도 위의 그 점에 머물러 있었다. 라몬에게 끌려간 그날 이후로 한 번도 돌아가 보지 못한 곳이었다.\n\n\"들르지.\"\n\n시라노가 짧게 답하자 에스메랄다가 작게 웃었다.\n\n회의실 문을 나서는데 메디치가 어깨를 툭 쳤다. 늘 그렇듯 장난기 어린 얼굴이었지만, 목소리는 조금 낮았다.\n\n\"그거 알아? 우리 군사님, 가끔 아무한테도 말 안 하고 사라질 때가 있어.\"\n\n메디치는 턱으로 회의실 안쪽을 가리켰다. 클라우제비츠는 여전히 지도 앞에 서 있었다.\n\n\"어디 가는지는 아무도 몰라. 뭐, 그 양반 일이니 알아서 하겠지만.\"\n\n메디치는 휘파람을 불며 멀어졌다. 시라노는 잠시 클라우제비츠의 등을 바라보다가 회의실 안으로 다시 눈길을 돌렸다.\n\n시라노는 다시 지도를 내려다봤다. 프리토리아에서 멤피스로, 그리고 로우엔 바로 위의 보르도까지. 길은 점점 프레데릭의 땅 깊숙이 이어지고 있었다.\n\n---\n\n떠나기 전날 밤, 시라노는 술집 너머 복도 끝의 벽 앞에 섰다. 기지 사람 하나가 친구가 이 벽 뒤로 빨려 들어갔다고 했던 바로 그 자리였다.\n\n손을 대자 벽이 물결처럼 일렁였다. 그 너머로 축축한 돌계단이 아래로 이어져 있었다.\n\n기지 밑의 동굴은 깊고 넓었다. 어둠 속에서 다리가 없는 적갈색 기사들이 미끄러지듯 다가왔다. 한 번 휘두르는 창에 바위가 쪼개졌다. 실버가 이를 악물며 웃었다.\n\n\"레지스탕스 기지 밑에 이런 게 살고 있었다니. 다들 발 뻗고 잘 수가 없겠는데.\"\n\n몇 번이나 물러섰다가 다시 나아갔다. 잠긴 상자들을 하나씩 열며 북동쪽 끝까지 파고들었을 때, 동굴 가장 깊은 곳에 창 한 자루가 꽂혀 있었다. 오랜 세월 아무도 손대지 않은 창날이 횃불을 받아 희미하게 빛났다.\n\n롱기누스의 창이었다.\n\n시라노는 창을 뽑아 들고 잠시 동굴 안을 둘러봤다. 레지스탕스의 기지 바로 밑에, 왜 이런 창이 잠들어 있었을까. 빨려 들어갔다는 그 친구는 어떻게 됐을까. 대답해 줄 사람은 없었다.\n\n---\n\n## 13장 — 불사조의 동굴\n\n프리토리아로 내려가는 길은 산을 끼고 돌았다. 드래건 브레스 산맥의 남쪽 끝자락이었다.\n\n\"사이럽스에서 들은 얘기 기억나?\"\n\n실버가 산봉우리를 올려다보며 말했다.\n\n\"프리토리아 근처 산에서 이상한 기운이 흘러나온다던 거. 술 취한 선원 헛소리인 줄 알았는데.\"\n\n시라노도 느끼고 있었다. 산허리에 뚫린 동굴 입구에서 미지근한 바람이 새어 나왔다. 겨울 산인데도 그 앞의 눈은 다 녹아 있었다.\n\n동굴 안으로 들어갈수록 공기가 뜨거워졌다. 벽의 바위가 군데군데 붉게 달아 있었고, 어둠 속에서 불꽃을 두른 짐승들이 튀어나왔다. 에스메랄다가 이마의 땀을 훔쳤다.\n\n\"이 안에 뭐가 있길래 산이 통째로 달아올라 있는 걸까요.\"\n\n가장 깊은 곳은 둥근 돌방이었다. 가운데에 사람 머리만 한 알 하나가 놓여 있었다. 껍데기 아래로 불빛이 숨을 쉬듯 일렁였다.\n\n시라노가 손을 뻗자 뜨겁지 않았다. 오히려 따뜻했다. 알 속에서 무언가가 날개를 접고 잠들어 있는 기척이 났다.\n\n\"피닉스의 알이군.\"\n\n불 속에서 죽고 재에서 다시 태어난다는 새. 시라노는 알을 품에 안고 동굴을 나섰다. 바깥바람이 차가웠다. 산 아래로 프리토리아의 지붕들이 보였다.\n\n---\n\n## 14장 — 다시, 프리토리아\n\n프리토리아의 골목은 그대로였다. 비탈을 따라 늘어선 지붕들, 산에서 내려오는 찬 바람, 저 위로 보이는 영주 저택의 2층 창문까지.\n\n하지만 그 저택의 주인은 바뀌어 있었다. 라몬이 쫓겨난 자리에, 이번에는 프레데릭이 앉힌 사람이 들어와 있었다. 그리고 그 어딘가에 제피르 팰컨의 동료들이 갇혀 있었다.\n\n에스메랄다는 마을 어귀에서 걸음을 멈췄다. 눈길이 골목 안쪽, 자신의 진료소가 있는 쪽으로 향해 있었다.\n\n\"먼저 가 봐.\"\n\n시라노가 말했다. 에스메랄다는 고개를 끄덕였지만, 발을 떼기 전에 한 번 더 영주 저택 쪽을 올려다봤다.\n\n진료소 문은 잠겨 있지 않았다. 안은 조용했다. 약병이 늘어선 선반에 먼지가 엷게 앉아 있었고, 창가의 침대는 누가 정리해 둔 듯 반듯했다.\n\n에스메랄다는 선반을 손끝으로 한 번 쓸어 보고, 침대 시트를 한 번 펴 보고, 그러고는 돌아섰다.\n\n\"다행이에요. 아무 일도 없었네요.\"\n\n목소리는 밝았지만, 문을 닫는 손은 조금 오래 문고리에 머물렀다. 시라노는 아무 말 없이 기다렸다가, 함께 영주 저택 쪽으로 걸음을 옮겼다.\n\n---\n\n영주 저택의 문을 넘는 순간, 시라노는 묘한 기분이 들었다. 복도의 모양도, 계단의 삐걱임도 그대로였다. 에스메랄다를 구하러 숨어들었던 그날 밤과 다른 건 벽에 걸린 문장 하나뿐이었다.\n\n일행은 1층부터 훑었다. 방마다 문을 열고, 상자마다 뚜껑을 젖혔다. 라몬이 산처럼 쌓아 두었다던 재산은 어디로 갔는지, 남은 건 새 주인이 들여놓은 것들이었다.\n\n\"쓸 만한 건 다 챙겨.\"\n\n실버가 상자 하나를 들어 보이며 히죽 웃었다.\n\n\"악덕 영주 금고 털이는 원래 그 괴도 양반 담당인데, 오늘은 우리가 대신하는 걸로.\"\n\n2층까지 올라가 마지막 방의 서랍까지 비웠을 때, 저택은 이상하리만치 조용했다. 새 영주의 모습도, 갇힌 동료들의 기척도 아직 보이지 않았다.\n\n너무 조용했다. 시라노가 그 생각을 하는 순간, 복도 끝의 큰 문이 안쪽에서 열렸다.\n\n\"생각보다 늦었군.\"\n\n비단 옷을 걸친 사내가 느긋하게 걸어 나왔다. 프레데릭이 이 마을에 앉혔다는 새 영주였다. 그 뒤로 낯선 차림의 사내들이 줄지어 따라 나왔다. 볕에 그을린 얼굴, 휘어진 칼, 이 땅에서는 보기 힘든 옷깃.\n\n실버가 혀를 찼다.\n\n\"투르 놈들이잖아.\"\n\n\"제피르 팰컨이 동료를 버려 두지 못한다는 건 다들 아는 얘기지.\"\n\n영주가 웃었다.\n\n\"찾아올 줄 알았네. 그래서 손님 맞을 사람들을 넉넉히 불러 두었지. 돈만 주면 누구 편이든 드는 친구들이라 쓰기가 편해.\"\n\n에스메랄다의 얼굴이 굳었다. 동쪽 바다 너머에서 이 나라와 오십 년을 싸워 온 사람들이, 이 마을 영주의 저택 안에서 칼을 뽑아 들고 있었다.\n\n시라노는 칼자루에 손을 얹었다. 기다리고 있었다는 건, 누군가 그들이 올 것을 알려 줬다는 뜻일 수도 있었다.\n\n싸움은 길지 않았다. 돈으로 산 칼은 돈만큼만 버텼다. 마지막 용병이 휘어진 칼을 떨어뜨리고 창밖으로 몸을 날리자, 복도에는 영주 혼자 남았다.\n\n영주는 벽에 등을 붙인 채 뒷걸음질 쳤다. 아까의 느긋한 웃음은 온데간데없었다.\n\n시라노는 칼끝을 내렸다.\n\n\"갇힌 사람들을 풀어 줘라.\"\n\n\"그, 그러면…….\"\n\n\"그리고 이 마을에서 떠나. 다시는 돌아오지 마라.\"\n\n영주는 허리춤의 열쇠 꾸러미를 더듬어 바닥에 내려놓았다. 그러고는 돌아보지도 않고 계단을 굴러 내려갔다.\n\n실버가 열쇠를 집어 들며 어깨를 으쓱했다.\n\n\"살려 보내는 거야? 프레데릭한테 쪼르르 가서 다 이를 텐데.\"\n\n\"알려 줄 테면 알려 주라지.\"\n\n지하의 문이 열리고, 제피르 팰컨의 동료들이 햇빛에 눈을 찌푸리며 하나둘 걸어 나왔다. 에스메랄다가 그들의 상처를 살피러 달려갔다.\n\n세 곳 중 한 곳이었다. 아직 멤피스와 보르도가 남아 있었다.\n\n---\n\n## 15장 — 잠긴 투기장\n\n멤피스와 보르도로 가기 전에, 시라노는 리브레빌로 발길을 돌렸다. 처음 왔을 때부터 마음에 걸리던 것이 있었다. 이상한 자물쇠가 걸린 채 굳게 닫혀 있던 투기장이었다.\n\n주점의 단골들은 투기장 주인 얘기라면 할 말이 많았다. 언제부턴가 문을 걸어 잠그고 코빼기도 안 비친다고 했다. 그 사람이랑 가깝게 지낸 건 무기 상점 주인이었다는 말도 덧붙였다.\n\n무기 상점 주인은 처음엔 말을 아꼈다. 그러다 한숨을 쉬더니 주인의 집이 어디인지 알려 주었다.\n\n집 문은 열려 있었다. 안에는 아무도 없었고, 탁자 위에 묵직한 열쇠 하나만 덩그러니 놓여 있었다.\n\n\"초대장인가 보네.\"\n\n실버가 열쇠를 손가락에 걸고 빙글 돌렸다.\n\n투기장 안쪽, 관중석 아래로 내려가는 계단이 있었다. 그 끝은 싸움터가 아니라 동굴이었다. 길은 몇 번이고 갈라졌다가 다시 만났다. 아까 지나온 갈림길인지 처음 보는 곳인지 분간이 안 됐다. 젖은 벽에서 찬 기운이 배어 나왔고, 어둠 속에서 썩은 냄새를 풍기는 것들이 비틀거리며 다가왔다.\n\n얼마나 헤맸을까. 가장 깊은 곳에서 공기가 찌릿하게 떨렸다. 머리카락이 곤두섰다. 어둠 한가운데에서 푸른 번개가 말의 모습으로 일어섰다.\n\n에스메랄다가 숨을 삼켰다. 번개의 말은 한동안 일행을 내려다보다가, 천천히 고개를 숙였다.\n\n시라노가 손을 뻗자, 번개는 작은 빛이 되어 손바닥 위로 내려앉았다. 썬더메어였다.\n\n---\n\n## 16장 — 결혼세의 마을\n\n멤피스는 조용했다. 장이 서야 할 광장에는 빈 좌판만 늘어서 있었고, 창문 몇 개는 판자로 막혀 있었다.\n\n\"사람 사는 마을 맞아?\"\n\n실버가 중얼거렸다. 우물가에서 물을 긷던 노인이 그 말을 들었는지 쓴웃음을 지었다.\n\n\"예전엔 이렇지 않았소. 살기 좋은 곳이었지. 영주님이 바뀌고 나서부터요.\"\n\n새 영주는 성미가 사납기로 소문난 사람이라고 했다. 세금은 하루가 멀다 하고 늘었고, 이제는 이 마을에서 혼례를 올리려면 결혼세까지 바쳐야 했다.\n\n\"그러니 처녀들이 남아 있겠소. 다들 리브레빌로 떠나요. 거긴 그래도 사람 대접은 해 준다니까.\"\n\n에스메랄다가 텅 빈 거리를 돌아보았다. 지나가는 여자를 거의 볼 수 없었다.\n\n주점 앞에서 담배를 말던 사내는 엉뚱한 얘기를 꺼냈다. 얼마 전에 마을 근처로 기막히게 아름다운 여인이 지나갔다는 것이다. 어디서 왔는지, 어디로 갔는지는 아무도 몰랐다.\n\n\"이 동네에 그런 사람이 올 리가 없는데 말이야. 꿈이라도 꾼 줄 알았지.\"\n\n마을 왼쪽 위, 언덕 쪽 외딴집에는 시드라는 남자가 산다고 했다. 이웃들은 그를 두고 늘 혼자고, 늘 슬픈 얼굴이라고만 했다.\n\n문을 두드리자 마른 남자가 얼굴을 내밀었다. 방 안쪽에 낡은 책 몇 권이 쌓여 있었다.\n\n\"학자가 되고 싶었지요. 한때는.\"\n\n그는 그 말만 하고 한참 말이 없었다.\n\n\"목숨만 겨우 건져서 도망쳐 왔소. 여기 온 지도 벌써 십 년이 되어 가는군.\"\n\n어디서 도망쳤느냐고 묻자, 시드는 고개를 저으며 문을 닫았다. 시라노는 닫힌 문 앞에 잠시 서 있었다. 무엇을 알았다는 이유로 모든 것을 잃는다는 게 어떤 건지, 그는 누구보다 잘 알았다.\n\n그날 밤, 일행은 영주 저택 뒷담을 넘었다.\n\n복도 끝에서 들려온 말소리는 이 땅의 말이 아니었다. 횃불 아래 선 병사들의 갑옷은 동방식으로 둥글게 휘어 있었다.\n\n\"투르 놈들이네. 여기도.\"\n\n실버가 혀를 찼다. 프리토리아에서 본 것과 똑같았다. 영주들이 하나같이 바다 건너 원수의 칼을 빌려 쓰고 있었다.\n\n싸움은 길지 않았다. 마지막까지 버티던 영주는 칼을 놓치고 벽에 등을 붙였다. 사납다던 소문과 달리, 그의 얼굴은 겁에 질려 하얗게 떠 있었다.\n\n\"누가 투르 병사를 대 주었지?\"\n\n영주는 입술만 달싹일 뿐 대답하지 못했다.\n\n지하 감옥의 문이 열렸다. 쇠사슬에 묶여 있던 제피르 팰컨 대원들이 비틀거리며 일어섰다. 에스메랄다가 그들 곁으로 달려갔다.\n\n이제 남은 곳은 보르도 하나였다.\n\n---\n\n## 17장 — 산에 박힌 별\n\n보르도로 올라가는 길에 로우엔이 있었다. 그리고 로우엔 근처 산에는 이상한 칼이 박혀 있다는 소문이 있었다. 카라카스 주점에서 흘려들었던 얘기였다.\n\n\"칼 한 자루 때문에 산을 타자고?\"\n\n실버가 투덜거렸지만 발걸음은 누구보다 빨랐다.\n\n산허리의 동굴은 안으로 들어갈수록 넓어졌다. 벽 군데군데에서 광석이 희미하게 반짝였다. 길은 둘로 갈라졌다. 한쪽에서는 곡괭이 소리가 아득하게 들려왔고, 다른 한쪽은 차가운 바람만 불어 나왔다. 시라노는 바람이 나오는 쪽을 골랐다.\n\n물이 고인 웅덩이 근처에서 무언가가 노래를 불렀다. 맑고 서늘한 목소리였다. 다음 순간 공기가 얼어붙고 얼음 조각이 쏟아졌다. 인어였다. 그 발치에서 푸른 슬라임들이 꿈틀거리며 다가왔다.\n\n싸움을 몇 번 치르고 나서야 동굴 끝에 닿았다.\n\n바위 한가운데에 칼 한 자루가 꽂혀 있었다. 칼날은 쇠라기엔 너무 검었고, 그 검은 바탕 위로 작은 빛 알갱이들이 별처럼 박혀 있었다. 동굴 안에 빛이라곤 횃불뿐인데, 칼은 스스로 빛나는 것 같았다.\n\n\"하늘에서 떨어진 걸로 만든 칼이라던데.\"\n\n에스메랄다가 작게 말했다. 시라노는 손잡이를 쥐었다. 생각보다 가벼웠다. 바위가 낮게 울더니, 칼이 미끄러지듯 빠져나왔다.\n\n유성의 검이었다.\n\n동굴 어귀의 늙은 광부는 빛나는 돌을 헐값에 내놓았다. 실버는 일행의 돈주머니를 거의 다 털어 다이아몬드잼을 사들였다. \"로우엔에 가면 값이 달라\" 하며 히죽 웃었다.\n\n---\n\n## 18장 — 마검의 숲\n\n보르도로 가는 길가에, 갈라지는 오솔길이 하나 있었다. 그 너머 숲은 한낮인데도 어두웠다. 칼스 장군의 검이 잠들어 있다는 숲이었다.\n\n나무 사이를 한참 걷다가 이끼 낀 비석 하나를 만났다. 시라노가 손으로 이끼를 걷어 냈다.\n\n*칼 스타이너, 이곳에서 검의 도를 얻다.*\n\n비석 앞은 텅 비어 있었다. 꽂힌 칼도, 칼이 뽑혀 나간 자국도 없었다.\n\n\"뭐야, 검은 어디 있고?\"\n\n실버가 비석 주변 풀숲을 발로 헤집었다.\n\n\"여기는 칼이 있던 자리가 아니야. 누군가 칼을 깨우친 자리지.\"\n\n시라노는 비석의 이름을 한 번 더 읽었다. 칼 스타이너. 처음 듣는 이름이었다. 그는 숲 안쪽, 더 짙은 어둠을 바라보았다.\n\n---\n\n## 19장 — 반란군의 마을\n\n로우엔으로 내려가는 길목에, 지도에 이름이 제대로 적혀 있지 않은 마을이 있었다. 사람들은 그곳을 그냥 반란군의 마을이라고 불렀다.\n\n마을 어귀에 들어서자 우물가의 사람들이 일제히 고개를 들었다. 낯선 이를 반기는 눈빛은 아니었다.\n\n\"반란군이라고 해서 대단한 걸 기대했다면 미안하게 됐소.\"\n\n나무를 패던 사내가 도끼를 내려놓으며 말했다.\n\n\"누가 세워 준 것도 아니고, 그냥 버티다 못한 사람들이 하나둘 모인 거요. 이 정도 규모로는 영주들 눈에도 안 차지. 당신네 제피르 팰컨도 우리한텐 관심 없잖소?\"\n\n실버가 어깨를 으쓱했다. 메디치에게서도 이 마을 이름을 들은 적은 없었다.\n\n시라노는 마을을 둘러보았다. 낡은 창 몇 자루, 울타리 대신 쌓은 통나무 더미. 누구에게 맞서려고 모인 사람들인지, 사내는 끝내 말하지 않았다.\n\n마을은 금방 다 돌아볼 만큼 작았다. 해가 기울기 전에 일행은 다시 길을 나섰다. 비석 너머, 아직 들어가 보지 못한 숲의 안쪽이 남아 있었다.\n\n---\n\n## 20장 — 원수의 도시\n\n로우엔은 반듯했다. 길은 넓게 닦여 있었고, 성벽 위 병사들은 하나같이 자세가 곧았다. 멤피스의 텅 빈 광장과는 딴 세상이었다.\n\n\"잘 다스리는 동네네.\"\n\n실버가 감탄 반 비꼼 반으로 말했다. 시라노는 대답하지 않았다.\n\n이 도시의 주인은 프레데릭이었다. 아버지를 결투에서 쓰러뜨린 사람, 그리고 메르세데스를 아내로 맞은 사람. 지금 제피르 팰컨을 치겠다고 군대를 움직이는 사람도 그였다.\n\n시라노는 망토 깃을 올리고 사람들 사이로 섞여 들었다.\n\n약국은 쓴 풀 냄새로 가득했다. 실버의 눈은 약이 아니라 계산대 너머 안쪽 방에 꽂혀 있었다. 거기 낡은 상자 하나가 보였다.\n\n\"거긴 들어가시면 안 됩니다!\"\n\n약사가 앞을 막아섰다. 실버는 혀를 차며 물러났다.\n\n대신 운은 다른 데서 따랐다. 거리를 돌던 실버가 히죽거리며 종이 한 장을 흔들어 보였다.\n\n*투기장 평생 이용권.*\n\n\"이걸로 평생 공짜로 싸울 수 있다는 거야? 싸움을 공짜로 시켜 주는 게 무슨 선물이람.\"\n\n에스메랄다가 어이없다는 듯 웃었다.\n\n로우엔을 떠나기 전, 주점에서 귀에 익은 이름이 흘러나왔다. 카라카스 주점의 요리사 카그. 그가 그토록 찾던 사랑의 향초를 파로 마을에서 구할 수 있다는 얘기였다.\n\n\"요리사 하나 때문에 길을 돌자고?\"\n\n\"맛있는 걸 얻어먹을 수 있으면 남는 장사지.\"\n\n실버의 말에, 이번만큼은 아무도 반대하지 않았다.\n\n---\n\n## 21장 — 파로 마을\n\n파로 마을은 작고 조용했다. 낮은 지붕들 사이로 약초 말리는 냄새가 났다. 마을 어귀의 약국 앞에는 바구니 가득 풀잎이 널려 있었다.\n\n\"향초라면 여기 어디쯤 있겠지.\"\n\n에스메랄다가 코를 킁킁거리며 앞장섰다.\n\n\"바깥은 시끄럽다지요? 여긴 늘 이렇게 조용하답니다.\"\n\n빨래를 널던 아주머니가 자랑스럽게 말했다. 영주가 사람을 들볶는 일도, 군대가 지나가는 일도 이 마을과는 먼 얘기 같았다.\n\n\"영주님도 좋은 분이에요. 아이들을 얼마나 좋아하시는지, 댁에 아이들이 아주 많답니다.\"\n\n아주머니는 웃으며 말했다. 시라노는 고개를 끄덕였지만, 그 말이 귀에 걸렸다. 아이들이 많다. 어디서 온 아이들이라는 말은 없었다.\n\n\"그런데 다 여자아이들이래요.\"\n\n옆에서 물을 긷던 처녀가 거들었다. 에스메랄다의 얼굴에서 웃음기가 가셨다.\n\n\"꽃도 좋아하셔서, 저택 정원은 온통 꽃밭이에요. 한번 구경해 보세요.\"\n\n처녀는 아무렇지 않게 덧붙였다. 아이들과 꽃. 듣기엔 다정한 말인데, 시라노는 그 두 가지가 나란히 놓인 게 어쩐지 마음에 걸렸다.\n\n우물가에서 고무줄놀이를 하던 소녀 하나가 일행을 보더니 쪼르르 달려왔다.\n\n\"아저씨들, 여행하는 사람들이죠? 혹시 샤론 만나면요, 사인 좀 받아다 주세요!\"\n\n\"샤론? 그 가수?\"\n\n실버가 되묻자 소녀는 눈을 반짝이며 고개를 끄덕였다. 니코시아의 여관에서 본, 노래가 지겹다던 그 가수였다. 이 작은 마을의 아이까지 그녀의 노래를 알고 있었다.\n\n마을 안쪽, 창마다 두꺼운 휘장을 친 집이 있었다. 문을 두드리자 깡마른 노인이 얼굴을 내밀었다. 댄 웨어링이라고 했다.\n\n향초 얘기를 꺼내기도 전에 노인이 먼저 입을 열었다.\n\n\"우리 집안은 저주받은 집안이오. 그래서 아들놈 혼인을 말리고 있지. 그런 피를 남의 집 딸한테까지 물려줄 순 없는 노릇이니까.\"\n\n노인은 잠시 말을 멈추더니, 입꼬리를 비틀어 올렸다.\n\n\"그런데 요즘 일이 좀 있고 나서는… 그 녀석도 제 몸에 흐르는 피가 뭔지 알아챈 모양이더군. 클클클.\"\n\n문이 닫혔다. 에스메랄다가 저도 모르게 팔을 쓸어내렸다.\n\n\"방금… 웃은 거 맞지?\"\n\n시라노는 대답 대신 휘장 친 창문을 한 번 더 올려다보았다.\n\n집 뒤편 장작더미 옆에 젊은 남자가 주저앉아 있었다. 노인과 닮은 얼굴이었다. 브리앙 웨어링. 노인이 말한 그 아들인 듯했다.\n\n\"괜찮으세요?\"\n\n에스메랄다가 다가가자 남자는 제 두 손을 내려다보았다. 손이 떨리고 있었다.\n\n\"난 끝났어요. 이 손으로… 그런 끔찍한 짓을 하다니.\"\n\n\"무슨 일이 있었는데요?\"\n\n\"결혼이요? 그런 걸 꿈꾼 내가 바보지. 하하… 하하하!\"\n\n웃음소리가 점점 커지더니 갈라졌다. 남자는 대답하지 않았다. 에스메랄다는 더 묻지 못하고 한 걸음 물러섰다.\n\n마을 바깥 길에서 마주친 사람은 웨어링이라는 이름만 듣고도 얼굴을 붉혔다.\n\n\"그 약혼은 처음부터 잘못된 거였다고요! 그 집안은 아예 혼인 같은 걸 시키면 안 돼요. 그게 정상이에요!\"\n\n그는 더 말하기 싫다는 듯 휙 돌아섰다. 마을 초입의 그 집, 저주받은 피를 말하던 노인과 넋이 나간 아들이 떠올랐다.\n\n마을 게시판 앞에서 실버가 걸음을 멈췄다. 낯익은 얼굴이 종이 위에서 그들을 노려보고 있었다.\n\n*현상수배 — 로베르토 데 메디치.*\n\n\"이야, 우리 대장 몸값 좀 보게.\"\n\n실버가 휘파람을 불었다. 시라노는 말없이 종이를 내려다보았다. 이 조용한 마을까지 수배령이 와 있었다.\n\n게시판 옆 그늘에서 수다를 떨던 여자들이 웨어링이라는 이름에 귀를 쫑긋 세웠다.\n\n\"다이아나 말이에요? 이 마을 최고 미인이죠. 그런 애가 브리앙이랑 결혼한다고 했을 때 얼마나 말이 많았는지 몰라요.\"\n\n\"브리앙이 또 인기가 좀 많았어야지. 마을 처녀들이 다 그 사람만 쳐다봤거든.\"\n\n여자들은 서로 눈짓을 주고받으며 웃었다.\n\n\"솔직히 말해서, 그 약혼 반긴 사람 아무도 없었어요. 다들 배가 아팠으니까.\"\n\n향초를 가진 사람은 뜻밖에도 카그의 형이었다. 동생 얘기를 꺼내자, 그는 어이없다는 듯 웃으며 선반 위의 작은 꾸러미를 내렸다.\n\n\"그 녀석, 아직도 요리 타령이오? 이거나 갖다주시오. 동생이 애타게 찾던 거니까.\"\n\n꾸러미를 풀자 달콤하면서도 알싸한 향이 확 퍼졌다. 사랑의 향초였다.\n\n\"이제 카라카스로 가면 되겠네. 맛있는 거 얻어먹으러.\"\n\n실버가 꾸러미를 소중히 품에 넣었다.\n\n골목을 돌아 나오는데, 주막 앞 나무 그늘에서 노인들이 수군거리고 있었다.\n\n\"들었나? 그 아수라를 누가 뽑았다는구먼.\"\n\n\"흑태자의 검 말인가? 제국의 패자를 정한다는 그거?\"\n\n\"그래. 그걸 뽑은 자가 제국의 주인이 된다고들 하잖나.\"\n\n실버가 슬쩍 시라노를 돌아보았다. 시라노는 망토 자락으로 허리춤의 검을 덮었다. 폭풍도 꼭대기에서 영혼을 빨아들이던 그 검이었다.\n\n소문의 주인공은 마을 끝 작은 집에 있었다. 다이아나는 소문만큼 아름다웠고, 소문과 달리 지쳐 보였다.\n\n\"브리앙은 게이시르 학술원에서 처음 만났어요. 둘 다 조용한 데서 지내고 싶어서 여기로 왔고, 일 년 뒤에 약혼했죠.\"\n\n그녀는 무릎 위에서 손가락을 맞잡았다.\n\n\"그런데 일 년 전쯤부터 그 사람이 자꾸 가라앉더니… 요즘은 이상한 소리를 해요. 자기가 끔찍한 짓을 했다고. 하지만 제 눈엔 멀쩡해요. 정말 병이라면, 무슨 수를 써서라도 고칠 거예요.\"\n\n돌아 나오는 길에 백발의 사내가 일행을 불러 세웠다. 헤이슨, 댄의 오랜 친구라고 했다.\n\n\"그 아가씨를 만나고 오는 길이오? 딱한 일이지. 미친 사람이란 늘 미쳐 있는 게 아니오. 멀쩡하다가 한 번씩 발작이 오는 거요. 그건 고칠 수 있는 병이 아니라 그 집안 피요.\"\n\n헤이슨은 다이아나의 집 쪽을 돌아보며 한숨을 쉬었다.\n\n\"친구 아들이 더 불행해지는 꼴은 못 보겠소. 그 아가씨를 설득해서 단념시켜야지.\"\n\n\"그게 브리앙을 위한 거라고 생각하세요?\"\n\n에스메랄다가 물었지만, 헤이슨은 대답 대신 고개를 저으며 걸어갔다.\n\n일행은 다시 웨어링가의 뒷마당을 찾았다. 브리앙은 여전히 장작더미 옆에 앉아 있었다. 이번엔 그가 먼저 입을 열었다.\n\n\"작년 가을, 마을 축제가 있던 날이었어요. 그날 정신을 잃을 만큼 마셨죠. 깨어나 보니 머리가 깨질 것 같아서 세면실로 갔는데… 손에 피가 묻어 있었어요. 전 다친 데가 하나도 없었고요.\"\n\n그는 제 손바닥을 내려다보았다.\n\n\"다음 날, 마을에 늑대가 나타나 닭이며 가축을 물어 죽이고 달아났다는 소문이 돌았어요. 그게 저예요. 자는 동안, 저도 모르게.\"\n\n\"직접 본 건 아니잖아요.\"\n\n에스메랄다가 조심스레 말했지만 브리앙은 고개를 저었다.\n\n\"다이아나랑 한 지붕 아래 살다가, 어느 밤 깨어났는데 이 손에 묻은 게 그녀의 피라면요? 결혼은 못 해요. 안 돼요.\"\n\n주점은 그 집 얘기로 시끄러웠다. 술잔을 든 사내가 혀를 찼다.\n\n\"웨어링 집안이야 원래 돈이 썩어나니 유산이다 상속이다 해서 바람 잘 날이 없었지. 다툼 줄이겠다고 사촌끼리 혼인을 시키더니, 결국 피가 상해서 미친 사람이 나온 거요. 돈 많다고 좋은 게 아니라니까.\"\n\n옆자리의 여자가 목소리를 낮췄다.\n\n\"그것만이 아니에요. 댄 씨 부인 레이첼 말이에요. 헤이슨 씨도 그 여자를 좋아했거든요. 둘이 결혼하자 헤이슨 씨는 멀리 떠나 버렸고… 그런데 얼마 안 가서 브리앙이 태어났어요. 날짜를 세어 보면 좀 일렀죠.\"\n\n\"댄 씨는 자기 아들이 맞다고 했잖아.\"\n\n\"그러니까 더 말이 많았던 거죠. 헤이슨 씨가 돌아온 것도 얼마 전이고.\"\n\n주점을 나서며 시라노가 낮게 말했다.\n\n\"저주라기엔 너무 사람 냄새가 나는군.\"\n\n\"무슨 뜻이야?\"\n\n\"브리앙이 정말 미친 게 아니라, 누가 그렇게 만든 거라면. 약을 썼다면 흔적이 남았겠지.\"\n\n마을 약국의 약사는 시라노의 첫마디에 얼굴을 붉혔다.\n\n\"극약이요? 우리 가게가 그런 걸 판다는 소리요? 손님, 말씀 가려서 하시오!\"\n\n일행은 등 떠밀리듯 약국을 나왔다. 실버가 킥킥거렸다.\n\n\"대놓고 묻는 사람이 어딨어. 다음엔 내가 말할게.\"\n\n다음 날, 실버는 말대로 약국 문을 밀고 들어가 사람 좋은 웃음을 지었다.\n\n\"댄 웨어링 씨 댁에 들를 일이 있는데, 빈손으로 가기가 좀 그래서요. 그분이 좋아할 만한 게 있을까요?\"\n\n약사의 얼굴이 금세 풀렸다.\n\n\"아, 댄 씨라면. 요즘 눈이 침침하다고 가시독말풀로 지은 약을 드시지. 오래 드셔서 양은 본인이 잘 아시고. 그런데 요새 통 발길이 없으시네. 그거 한 첩 사다 드리면 좋아하실 거요.\"\n\n시라노는 약을 받지 않았다. 대신 짧게 인사하고 약국을 나섰다.\n\n\"가시독말풀이라.\"\n\n에스메랄다가 그 이름을 되뇌었다. 그녀의 표정이 굳어 있었다.\n\n\"눈에 쓰는 약이긴 해요. 그런데 많이 먹으면… 헛것을 보고, 날뛰고, 깨어나면 아무것도 기억 못 해요.\"\n\n일행은 말없이 마을 초입의 웨어링 집으로 걸음을 옮겼다.\n\n브리앙은 거실 창가에 앉아 있었다. 시라노가 입을 떼려는 순간 문이 열리고 다이아나가 들어섰다. 그 뒤로 헤이슨이 숨을 몰아쉬며 따라 들어왔다. 계단 위에서 댄이 천천히 내려왔다.\n\n방 안의 사람들이 모두 시라노를 보았다.\n\n\"브리앙 웨어링은 미치지 않았소.\"\n\n시라노의 목소리는 낮았지만 방 안을 가득 채웠다.\n\n\"누군가 그를 미친 사람으로 보이게 만들고 싶어 했지. 저주도, 피도 아니오. 이건 함정이오.\"\n\n그는 계단 아래의 노인을 보았다.\n\n\"가시독말풀. 오래 먹어서 양을 잘 안다고 하더군. 얼마를 먹이면 사람이 헛것을 보고 날뛰는지, 얼마면 깨어나서 아무것도 기억 못 하는지도 잘 알았겠지. 축제 날 밤, 술에 취한 아들에게 그걸 먹인 건 당신이오, 댄 웨어링.\"\n\n다이아나가 입을 막았다. 브리앙은 아버지를 올려다보았다.\n\n\"당신 아들이 아니라서였소? 그 질투로 여기까지 온 거요?\"\n\n시라노는 한 마디를 더 보탰다.\n\n\"레이첼 부인의 사고도, 내겐 단순한 사고로 보이지 않는군.\"\n\n댄의 얼굴이 일그러졌다. 그리고 그는 웃기 시작했다.\n\n\"레이첼이… 아이를 가졌다고 하던 날을 아시오? 난 그 자리에서 숨이 멎는 줄 알았지. 난 자식을 볼 수 없는 몸이었거든! 그런데 아이라니! 아이라니!\"\n\n웃음은 비명처럼 갈라졌다. 댄은 관자놀이를 움켜쥐었다.\n\n\"빌어먹을, 머리가… 약을 사 와야겠어. 약국에 가야겠어.\"\n\n아무도 그를 붙잡지 못했다. 문이 닫히고 얼마 지나지 않아, 마을 쪽에서 총소리 한 발이 울렸다.\n\n오랫동안 아무도 말하지 않았다.\n\n해 질 무렵, 브리앙은 다이아나의 손을 잡고 일행을 배웅했다.\n\n\"당분간 다이아나랑 여행을 다니려고요. 이 집에서 좀 떨어져서, 머리를 식히고 싶어요.\"\n\n그는 품에서 붉은 돌 하나를 꺼내 시라노의 손에 쥐여 주었다. 핏빛이 감도는 돌이었다.\n\n\"집안 대대로 내려온 가보예요. 블러디 스톤이라고 하죠. 이 집에서 나온 것 중에 좋은 걸 하나쯤은 드리고 싶어서요.\"\n\n헤이슨은 멀찍이 서서 두 사람을 지켜보았다. 그 눈빛이 오래 브리앙에게 머물렀다.\n\n---\n\n## 22장 — 향초 한 다발\n\n카라카스 주점은 여전히 시끌벅적했다. 부엌 쪽 문을 밀자 기름 냄새와 함께 카그의 목소리가 터져 나왔다.\n\n\"뭐요, 바쁜데! …어? 당신들은.\"\n\n실버가 품에서 꾸러미를 꺼내 도마 위에 올려놓았다. 끈을 풀자 달콤하고 알싸한 향이 부엌을 가득 채웠다. 카그의 손에서 국자가 미끄러졌다.\n\n\"이거… 사랑의 향초 아니오? 이걸 대체 어디서?\"\n\n\"파로 마을. 당신 형이 안부 전하더군.\"\n\n카그는 한참 꾸러미를 들여다보다가 코를 훌쩍였다. 그러고는 앞치마에 손을 닦고, 서랍 깊숙한 데서 은빛으로 반짝이는 돌 하나를 꺼냈다.\n\n\"빈손으로 보낼 순 없지. 받아 두시오. 실버잼이오.\"\n\n\"이름 한번 마음에 드네.\"\n\n실버가 히죽 웃으며 돌을 받아 들었다.\n\n---\n\n## 23장 — 노래에 지친 가수\n\n니코시아 여관의 구석 자리에 샤론은 그때처럼 앉아 있었다. 잔을 앞에 두고, 창밖만 내다보며.\n\n\"또 노래 부탁이라면 사양할게요.\"\n\n\"노래가 아니오. 사인 하나면 되오.\"\n\n시라노가 파로 마을의 소녀 얘기를 꺼냈다. 시골 우물가에서 고무줄을 하던 아이가, 혹시 샤론을 만나면 꼭 사인을 받아 달라고 했다고.\n\n샤론은 한동안 말이 없었다. 그러다 피식 웃었다.\n\n\"그런 데까지 내 노래가 갔구나.\"\n\n그녀는 종이에 이름을 길게 흘려 쓰고, 그 아래 짧은 말을 덧붙였다. 무엇이라 썼는지 시라노는 보지 않았다.\n\n\"그 아이한테 전해 줘요. 고맙다고.\"\n\n파로 마을 우물가의 소녀는 사인을 받아 들고 한참 동안 입만 벌리고 있었다. 그러다 종이를 가슴에 꼭 끌어안고 폴짝폴짝 뛰었다.\n\n\"진짜다! 진짜 샤론이야!\"\n\n소녀는 집으로 쪼르르 달려갔다가, 작은 반지 하나를 들고 돌아왔다. 손바닥에 올려놓자 서늘한 기운이 피부로 스며들었다.\n\n\"할머니가 주신 건데요, 얼음의 반지래요. 아저씨들 줄게요. 이건 정말 정말 고마운 거니까.\"\n\n웨어링 집 창문에는 이제 휘장이 걷혀 있었다. 집은 비어 있었다.\n\n---\n\n## 24장 — 다시 로우엔\n\n로우엔 성문을 지나자마자 누군가 일행을 붙잡았다. 시라노는 잠시 망설이다가 고개를 끄덕였다.\n\n\"이렇게까지 부탁하는데, 들어주지.\"\n\n돌아온 건 은빛 돌 하나였다. 실버가 손바닥 위에서 그것을 굴리며 고개를 갸웃했다.\n\n\"카그한테 받은 거랑 똑같은데. 요즘 이 동네에선 이게 인사인가 봐.\"\n\n로우엔의 주점은 군대 막사 같았다. 탁자마다 앉은 사내들의 어깨가 하나같이 곧았다. 물어보니 이 도시 남자들은 모두 프레데릭군 병사라고 했다.\n\n\"실버 애로우 놈들, 투르랑 싸우느라 기둥뿌리가 다 뽑혔다지?\"\n\n\"그러니 지금이야. 옛 제국의 영광을 되찾을 때가 왔다고.\"\n\n잔이 부딪히고 웃음이 터졌다. 로우엔이라는 이름을 말할 때마다 사내들의 목소리에는 자부심이 묻어났다.\n\n\"프레데릭 공 같은 분이 또 어디 있나. 제피르 팰컨인지 뭔지 하는 도적 떼만 아니면 세상이 조용할 텐데.\"\n\n실버가 슬그머니 모자를 눌러썼다. 다른 마을에선 악덕 영주를 몰아낸 의적 소리를 듣던 이름이, 이 도시에선 도적 떼였다.\n\n시라노는 잔을 들지 않았다. 그 영광을 되찾겠다는 사람들의 맨 앞에, 아버지를 쓰러뜨린 사내가 서 있었다.\n\n리브레빌에서 듣다 만 이야기의 끝은 로우엔 한구석에서 들을 수 있었다. 전쟁 통에 결혼을 약속했던 아웬과 엘의 이야기, 그리고 카오스 큐브. 이야기를 다 들려준 이는 일행에게 작은 물건 하나를 내밀었다. 호크아이였다.\n\n떠나기 전 주점에서 들은 소문 둘이 귀에 남았다. 보르도 근처에 이상한 안경을 쓴 자들이 어슬렁거린다는 것. 그리고 검을 고치는 달인 파즈가 안타나나리보 근방에서 본 것을 마지막으로 자취를 감췄다는 것.\n\n시라노는 허리에 찬 낡은 엑스칼리버를 내려다보았다. 이올린에게서 받은, 날이 다 상한 검이었다.\n\n---\n\n## 25장 — 숲의 끝\n\n두 번째로 찾은 숲은 처음보다 더 고요했다. 이끼 낀 비석이 그대로 서 있었다. *칼 스타이너, 이곳에서 검의 도를 얻다.* 시라노는 이번엔 걸음을 멈추지 않았다.\n\n나무가 점점 빽빽해지고, 햇빛이 가늘어졌다. 그 끝에서 낯선 말소리가 들렸다.\n\n검은 옷차림의 사내들이 길을 막고 서 있었다. 이 근방 사람 같지 않았다. 말투도, 손에 든 무기도.\n\n\"여기까지 기어 들어오다니 운이 없군. 그 칼은 우리 윗분께서 점찍어 두신 물건이다.\"\n\n\"윗분이라. 누구 말이지?\"\n\n\"알 것 없다. 어차피 여기서 끝날 테니까.\"\n\n실버가 혀를 찼다.\n\n\"악당이 꼭 저런 말을 하더라.\"\n\n사내들의 칼끝은 매서웠다. 몇 합 만에 실버의 칼날에 이가 빠졌다. 그래도 끝내 쓰러진 건 사내들 쪽이었다. 마지막 하나가 무릎을 꿇으며 내뱉은 건 커티스라는 이름이었다. 리브레빌 동쪽 도로가 닿는 곳. 제국령 밖의 사람들이 이 숲까지 와 있었다.\n\n그들이 지키던 자리 너머, 숲이 끝나는 곳에 검 한 자루가 땅에 박혀 있었다. 칼날은 빛을 머금지 않았다. 오히려 둘레의 빛을 빨아들이는 것 같았다.\n\n칼스 장군의 멸살지옥검.\n\n시라노는 자루를 쥐었다. 손바닥이 서늘해졌다. 아수라를 처음 쥐던 날이 떠올랐지만, 이 검은 영혼을 빨아들이려 들지 않았다. 다만 무거웠다. 오래 주인을 기다린 무게였다.\n\n검은 의외로 쉽게 뽑혔다.\n\n\"커티스 놈들의 윗분이라는 게 누군지는 몰라도,\" 실버가 쓰러진 사내들을 돌아보았다. \"이 칼이 우리 손에 들어온 걸 알면 꽤 배가 아프겠는데.\"\n\n시라노는 대답하지 않았다. 로우엔 주점에서 들은 말이 떠올랐다. 보르도 근처에 이상한 안경을 쓴 자들이 돌아다닌다고. 보르도는 바로 위였다.\n\n---\n\n## 26장 — 마지막 도시\n\n숲을 빠져나오자 길이 북쪽으로 곧게 뻗어 있었다. 그 끝에 보르도의 성벽이 보였다.\n\n프리토리아, 멤피스, 그리고 보르도. 제피르 팰컨의 동료들이 갇힌 세 도시 가운데 마지막이었다.\n\n실버가 멸살지옥검이 든 짐을 고쳐 메며 말했다.\n\n\"여기만 끝내면 돌아가는 거지?\"\n\n\"끝내면.\"\n\n시라노는 성문 앞에서 잠시 걸음을 멈추고 둘레를 살폈다. 이상한 안경을 쓴 자들은 보이지 않았다. 숲에서 쓰러뜨린 커티스의 사내들도 떠올랐다. 그들의 윗분이라는 자는 이 근처 어딘가에 눈을 두고 있을지도 몰랐다.\n\n성문을 지나자 낯선 도시의 소리가 일행을 감쌌다.\n\n주점은 어느 도시나 비슷했다. 술 냄새, 낮은 웃음소리, 구석에서 카드를 섞는 소리. 다른 게 하나 있다면 창가 자리였다. 거기 초록빛 개구리 한 마리가 의자에 사람처럼 앉아 있었다. 사람 몸집만 한 개구리였다.\n\n\"저거, 박제지?\" 실버가 속삭였다.\n\n개구리가 한쪽 눈만 굴려 실버를 보았다.\n\n시라노는 다가가 말을 걸었다. 대꾸가 없었다. 다시 걸었다. 개구리는 혀로 입가를 한 번 훑을 뿐이었다. 세 번, 네 번. 실버가 그만두라고 소매를 끌었지만 시라노는 물러서지 않았다. 프리토리아의 감옥 벽도 말없이 버틴 그였다. 개구리 하나쯤이야.\n\n열 번째에, 마침내 개구리가 목을 울렸다.\n\n\"끈질긴 양반이로군. 좋아, 좋아. 비밀의 개구리 상점이다. 어디서 났는지는 묻지 말고.\"\n\n탁자 밑에서 보따리가 풀려 나왔다. 칼, 창, 총, 갑옷 조각. 하나같이 주인이 따로 있었을 법한 물건들이었다. 그 가운데 클레이모어가 여러 자루 눈에 띄었다. 카라카스 검 연구회에서라면 두 배는 쳐 줄 물건이었다.\n\n\"이 값에?\" 실버가 눈을 크게 떴다.\n\n\"싸게 들여왔으니 싸게 파는 거지.\" 개구리는 태연했다.\n\n시라노는 다이아몬드잼을 판 돈을 아낌없이 털었다. 그 뒤로도 몇 번이고 보따리를 다시 풀게 했다. 개구리는 단골이 마음에 들었는지 그때마다 덤을 하나씩 얹었다. 긴 창 사리사다, 자동소총, 그리고 날이 검게 가라앉은 암흑검.\n\n\"자주 오쇼, 끈질긴 양반.\"\n\n주점을 나서며 실버가 무거워진 짐을 고쳐 멨다.\n\n\"포로 구하러 와서 장사꾼이 다 됐네.\"\n\n\"돈이 있어야 사람도 구하는 거다.\"\n\n시라노는 성 안쪽을 바라보았다. 이제 남은 일은 하나였다.\n\n거리로 나서자 보르도의 다른 얼굴이 보였다. 골목마다 주신의 표식이 걸려 있었다. 길 가던 사람들이 교회 앞을 지날 때면 하나같이 걸음을 늦추고 고개를 숙였다. 로우엔에서는 프레데릭의 이름에 가슴을 펴던 사람들이었다. 반나절 길을 올라왔을 뿐인데, 여기 사람들이 우러르는 건 칼이 아니라 신이었다.\n\n\"이 동네는 기도를 밥 먹듯 하네.\" 실버가 목소리를 낮췄다.\n\n우물가의 아낙들이 수군거리는 이름은 따로 있었다.\n\n\"루치아 씨네 말이야. 이사 온 지 얼마 안 됐잖아.\"\n\n\"그 집 식구들, 서로 말을 안 섞더라고. 한 지붕 밑에 사는 남들 같아.\"\n\n\"이상한 집이야, 정말.\"\n\n그 옆에서는 사내 하나가 숲 쪽을 가리키며 떠들었다. 저 너머 숲에 이상한 칼이 박혀 있다더라, 밤이면 이상한 소리가 난다더라.\n\n실버가 등에 멘 짐을 툭 쳤다. 멸살지옥검이 든 짐이었다.\n\n\"그 칼이라면 여기 있는데.\"\n\n시라노는 대꾸하지 않고 아낙들이 눈짓하던 쪽을 한 번 더 보았다. 낡은 집 한 채가 창을 굳게 닫고 있었다.\n\n해가 기울 무렵, 일행은 도시 한가운데 높직이 선 영주의 저택 앞에 섰다. 프리토리아에서도, 멤피스에서도 동료들은 영주의 손아귀에 있었다. 여기라고 다를 것 같지 않았다.\n\n담장 너머 창 몇 개에 불이 들어와 있었다. 교회 종소리가 멀리서 저녁 기도를 알렸다.\n\n\"마지막이다.\" 시라노가 말했다.\n\n실버가 칼자루에 손을 얹었다.\n\n대문을 넘자마자 그림자들이 길을 막았다. 구릿빛 얼굴, 굽은 칼, 낯선 말씨. 투르족이었다.\n\n실버가 어이없다는 듯 웃었다.\n\n\"또야? 프리토리아도, 멤피스도, 여기도. 이쯤 되면 투르에서 단체로 일자리를 구하러 온 거 아냐?\"\n\n시라노는 웃지 않았다. 한 영주가 투르 칼을 빌렸다면 탐욕이다. 두 영주라면 유행이다. 세 영주가 다 그렇다면, 누군가 그 길을 깔아 준 것이다.\n\n그것도 이 도시에서. 골목마다 주신의 표식을 걸어 둔 보르도의 영주가, 투르의 칼로 제 집 문을 지키고 있었다.\n\n\"이야기는 나중에.\" 시라노가 칼을 뽑았다.\n\n굽은 칼들이 한꺼번에 덤벼들었다. 실버가 앞을 막고, 시라노의 칼이 그 틈을 갈랐다. 투르의 사내들은 거칠었지만 돈으로 산 칼이었다. 하나둘 쓰러지자 나머지는 등을 돌렸다.\n\n계단 위에서 보르도 영주가 소리를 질렀다. 지킬 사람이 없어진 목소리는 금세 갈라졌다. 시라노는 계단을 올라 그 앞에 섰고, 몇 합 지나지 않아 영주는 바닥에 무릎을 꿇었다.\n\n지하 감옥 문이 열렸다. 어둠 속에서 눈을 끔뻑이던 얼굴들이 시라노를 알아보았다. 제피르 팰컨의 동료들이었다.\n\n\"늦었다.\" 시라노가 말했다.\n\n\"아니, 딱 맞춰 왔지.\" 누군가 갈라진 목소리로 웃었다.\n\n프리토리아, 멤피스, 보르도. 세 도시에 흩어져 있던 동료들이 이제 모두 풀려났다.\n\n실버가 감옥 계단에 털썩 주저앉았다.\n\n\"끝났다. 진짜로.\"\n\n시라노는 대답 대신 창밖을 보았다. 세 영주가 모두 투르의 칼을 빌렸다. 그 칼값을 누가 치렀는지는 아직 아무도 말해 주지 않았다.\n\n---\n\n## 27장 — 바뀐 약속\n\n약속한 자리는 조용했다. 해가 한 뼘쯤 기울도록 메디치는 나타나지 않았다.\n\n\"그 양반이 늦는 사람은 아닌데.\" 실버가 길 끝을 보며 중얼거렸다.\n\n말발굽 소리 대신 낯익은 얼굴 하나가 숨을 몰아쉬며 달려왔다. 제피르 팰컨의 병사 보르스였다.\n\n\"다들 로우엔 산 정상으로 갔습니다. 클라우제비츠 님 요청이랍니다.\"\n\n\"이유는?\"\n\n\"저도 자세히는 모릅니다. 다만 프레데릭 장군이 로우엔 산 근처에 와 있다더군요. 그 일 때문이 아닐까 싶습니다.\"\n\n\"프레데릭이라.\"\n\n시라노는 그 이름을 입 안에서 천천히 굴렸다. 아버지를 결투로 쓰러뜨린 사람. 메르세데스의 남편. 제국 최강이라 불리는 사내.\n\n카나가 망토 자락을 여미며 한 걸음 물러섰다.\n\n\"난 잠깐 들를 데가 있어. 금방 따라갈게. 거기서 보자.\"\n\n어디냐고 묻기도 전에 카나는 길을 꺾어 사라졌다.\n\n---\n\n## 28장 — 로우엔 산 정상\n\n산길은 가팔랐다. 정상에 오르자 바람이 거셌고, 바위 사이에 사람 그림자가 하나뿐이었다.\n\n클라우제비츠였다. 그가 시라노를 보고 눈썹을 올렸다.\n\n\"왔군. 그런데 다른 사람들은? 자네가 여기서 만나자 하지 않았나.\"\n\n시라노의 발이 멈췄다.\n\n\"나는 당신이 불렀다고 들었다.\"\n\n둘 사이에 바람 소리만 지나갔다. 실버가 먼저 입을 열었다.\n\n\"그럼 대체 누가…….\"\n\n대답은 산 아래에서 왔다. 둔중한 울림이 땅을 흔들고, 한 박자 늦게 바위 하나가 산산이 부서졌다. 흙먼지 너머로 늘어선 포구가 보였다. 프레데릭의 깃발이었다.\n\n\"함정이다.\" 클라우제비츠가 낮게 말했다.\n\n두 번째 포성이 울렸다. 시라노는 칼을 쥐고 내려갈 길을 훑었다. 누가 이 판을 짰는지는 나중 일이었다. 지금은 이 산을 빠져나가야 했다.\n\n포탄이 떨어질 때마다 산길이 무너졌다. 시라노는 클라우제비츠를 앞세우고 바위틈을 골라 내달렸다. 등 뒤에서 흙과 돌이 비처럼 쏟아졌다. 숨이 턱에 닿을 무렵, 포성이 멀어지고 발밑이 평평해졌다.\n\n산을 빠져나온 것이다.\n\n---\n\n## 막간 — 포병대의 웃음\n\n산 아래 진지에는 포연이 아직 걷히지 않았다. 포수들이 식은 포신에 물을 끼얹는 사이, 프레데릭은 망원경을 내리고 산등성이를 바라보았다.\n\n\"겁도 없이 덤벼들더니, 이 정도 함정에 걸리다니.\"\n\n부관이 앞으로 나섰다. \"추격대를 보낼까요?\"\n\n\"됐다. 이만큼 혼내 줬으면 충분하다. 놔둬라.\"\n\n부관이 잠시 머뭇거리다 덧붙였다.\n\n\"저, 달아나는 무리 가운데……크리스티나 아가씨로 보이는 분이 있었다는 보고가 있습니다.\"\n\n진지가 조용해졌다. 부관은 불벼락이 떨어질 줄 알고 어깨를 움츠렸다.\n\n그런데 터져 나온 건 웃음이었다. 프레데릭은 고개를 젖히고 호탕하게 웃었다.\n\n\"정말 녀석답군.\"\n\n웃음이 잦아들자 그는 망토를 털고 돌아섰다.\n\n\"목적은 이뤘다. 돌아갈 채비를 해라.\"\n\n---\n\n## 막간 — 군주와 책사\n\n촛불이 하나뿐인 방이었다. 체사레 보르자는 등받이 높은 의자에 몸을 묻은 채, 앞에 선 사내의 보고를 끝까지 들었다.\n\n\"쓸어버릴 수 있었습니다. 산 하나에 몰아넣고 포까지 걸어 두었으니까요. 그런데 프레데릭 공은 추격을 멈추고 군을 물렸습니다.\"\n\n마키아벨리의 목소리는 낮고 고르게 흘렀다. 체사레는 반지 낀 손가락으로 팔걸이를 한 번 두드렸다.\n\n\"사위라는 자가 갈수록 제 생각만 하는군.\"\n\n\"크리스티나 아가씨 혼사도 끝까지 반대하셨지요. 비프로스트 쪽에는 아직 답을 주지 못했습니다.\"\n\n\"이제 그자는 믿을 수 없다.\" 체사레가 짧게 끊었다. \"조세핀에게서는?\"\n\n마키아벨리의 입가에 옅은 웃음이 걸렸다.\n\n\"모젤 2세는 이미 푹 빠졌습니다. 그 여자 말이라면 원로원도 내쫓는 사람이니까요. 거슬리던 자들은 암흑살수를 보내 정리했습니다.\"\n\n\"좋다.\" 체사레가 몸을 앞으로 기울였다. 촛불이 그의 눈 속에서 흔들렸다. \"비프로스트군을 데려와라.\"\n\n마키아벨리가 처음으로 잠시 말을 골랐다.\n\n\"조금 위험하지 않겠습니까.\"\n\n\"모젤은 쉬운 자다. 이 기회를 잘만 쓰면 비프로스트까지 우리 손에 들어온다.\"\n\n\"프레데릭 공의 반발이 클 텐데요.\"\n\n체사레는 다시 의자에 등을 기댔다.\n\n\"대책은 있다. 비프로스트군을 쓰면 된다. 제피르 팰컨이든 프레데릭이든, 그 칼로 치우면 우리 손엔 피 한 방울 안 묻는다.\"\n\n더 묻지 않아도 되는 목소리였다. 마키아벨리는 고개를 숙였다. 흩어진 제국령을 하나로 묶는 일. 그 판 위에 이제 북쪽 나라 하나가 더 올라가 있었다.\n\n---\n\n## 29장 — 두 현자\n\n작전 회의실의 공기는 무거웠다. 로우엔 산에서 잃은 것들이 탁자 위 장부에 그대로 적혀 있었다.\n\n클라우제비츠가 지도 한 장을 펼쳤다.\n\n\"체사레가 비프로스트군을 제국 안으로 끌어들이려 하네. 그 일을 맡은 자가 벌써 북쪽으로 떠났어. 마키아벨리다.\"\n\n시라노의 손이 탁자 모서리에서 멈췄다.\n\n\"마키아벨리.\"\n\n\"아는 이름인가.\" 메디치가 물었다.\n\n\"어릴 때 함께 자랐다.\" 시라노가 천천히 말했다. \"가장 가까운 친구였지.\"\n\n클라우제비츠가 고개를 끄덕였다. \"사람들은 나와 그를 묶어 제국의 두 현자라고 부르지. 달갑진 않지만.\"\n\n\"내가 쫓겠다.\"\n\n망설임 없는 목소리였다. 카나가 곧장 의자를 밀고 일어섰다.\n\n\"나도 갈래.\"\n\n\"자네에겐 따로 부탁할 게 있네.\" 클라우제비츠가 낡은 양피지를 꺼냈다. 가장자리가 바스러진 지도였다. \"카슈미르가 남긴 보물 지도다. 진짜라는 건 확인했어. 이걸 찾으면 프레데릭에게 털린 돈과 장비를 메울 수 있지. 실버가 함께 가 주면 좋겠군.\"\n\n실버가 눈을 끔뻑였다. \"나? 보물이라면야 마다할 리 없지만.\"\n\n이자벨과 메디치도 그쪽에 붙었다. 그러자 클라우제비츠의 눈이 마지막 남은 사람에게 갔다.\n\n\"리델. 자네는 시라노와 함께 가게.\"\n\n\"……내가? 시라노랑?!\"\n\n리델의 목소리가 회의실 천장에 부딪혔다. 실버가 웃음을 참느라 어깨를 떨었다. 시라노는 아무 말 없이 지도에서 비프로스트를 찾고 있었다.\n\n회의가 끝나고도 사람들은 쉽게 흩어지지 않았다.\n\n\"비프로스트라면 발키리가 있는 나라 아냐?\" 누군가 짐을 꾸리며 중얼거렸다. \"정예 중의 정예라던데. 마주치지 않길 빌어야지.\"\n\n클라우제비츠가 지도 북쪽의 산줄기 하나를 손끝으로 짚었다.\n\n\"망티고아 산이다. 저 산 어딘가에 유니콘의 정령을 가둬 둔 동굴이 있다는 이야기가 전해지지. 지나는 길이라면 눈여겨보게.\"\n\n\"마키아벨리는 리브레빌을 거쳐 안타나나리보로 갔다는군.\" 클라우제비츠가 덧붙였다. \"그 길 끝이 비프로스트다.\"\n\n시라노는 고개만 끄덕였다. 안타나나리보. 비프로스트군과 손잡은 영주를 베었던 곳이었다. 거기서 올려다보기만 했던 산도 그 길 위에 있었다.\n\n카나는 문가에 기대어 그 모습을 보고 있었다. 무슨 말을 꺼내려다 그만두고, 대신 총의 노리쇠만 괜히 한 번 당겼다 놓았다.\n\n\"……같이 가고 싶었는데.\"\n\n혼잣말처럼 작은 소리였다. 들은 사람이 있었는지는 알 수 없었다.\n\n---\n\n## 30장 — 둘만의 길\n\n리브레빌은 지난번과 다르지 않았다. 다른 건 곁에 선 사람이었다.\n\n리델은 길을 걷는 내내 한 발짝쯤 떨어져 있었다. 무슨 말을 하려다 그만두기를 몇 번 했다.\n\n\"마키아벨리가 여길 지나갔다는 거지.\" 마침내 리델이 입을 열었다. \"그럼 우리도 서둘러야 하는 거 아냐?\"\n\n\"서두를 거다. 그 전에 준비부터.\" 시라노가 상점 문을 밀었다.\n\n선반에 작은 병들이 줄지어 있었다. 각성제였다. 한 병 먹으면 몸속에 잠든 힘이 단번에 끓어오르는 약이다. 시라노는 망설이지 않고 넉넉히 셈을 치렀다.\n\n\"그렇게나?\" 리델이 눈을 크게 떴다.\n\n\"비프로스트까지 가는 길이다. 모자란 것보단 남는 게 낫지.\"\n\n리델은 뭐라고 더 하려다 입을 다물었다.\n\n마을에서 들은 소식은 하나였다. 마키아벨리는 안타나나리보를 지나 망티고아 산으로 올랐다고 했다.\n\n\"망티고아 산.\" 리델이 중얼거렸다. \"그 사람이 말한 유니콘 어쩌고 하는 데 아냐?\"\n\n\"그래.\" 시라노가 북쪽을 바라보았다. \"그 길로 간다.\"\n\n시라노가 앞서 걸었고, 리델은 이번에도 한 발짝 떨어져 그 뒤를 따랐다.\n\n---\n\n## 31장 — 일각수의 동굴\n\n망티고아 산의 바람은 차가웠다. 안타나나리보에서 올려다보기만 하던 산을, 이제 두 사람이 오르고 있었다.\n\n동굴 입구는 바위틈에 숨듯 나 있었다. 안으로 들어서자 공기가 달라졌다. 벽을 타고 희미한 빛이 흘렀다. 얼음 같기도, 수정 같기도 했다.\n\n\"여기가 그 유니콘 어쩌고 하는 데야?\" 리델이 목소리를 낮췄다.\n\n그 안쪽에 한 사내가 있었다. 바위에 기대 앉아, 오래 아무도 만나지 못한 사람의 얼굴로 두 사람을 올려다보았다. 검을 고치는 달인, 소식이 끊겼다던 파즈였다.\n\n시라노는 등에 멘 검을 풀었다. 이올린에게 받은 뒤로 한 번도 제대로 휘두르지 못한 검이었다. 날은 이가 빠지고 녹이 슬어 있었다.\n\n파즈는 검을 받아 들고 한참 말이 없었다. 손끝으로 날을 쓸어 보던 그의 눈빛이 조금씩 바뀌었다.\n\n시간이 얼마나 흘렀을까. 다시 시라노의 손에 돌아온 검은 전혀 다른 물건이었다. 녹은 사라지고, 날은 동굴의 빛을 받아 하얗게 빛났다. 엑스칼리버였다.\n\n\"……이게 원래 모습이었어?\" 리델이 저도 모르게 한 발짝 다가섰다.\n\n동굴 가장 깊은 곳에는 뿔 하나가 놓여 있었다. 길고 곧은, 수정처럼 맑은 뿔이었다. 시라노가 손을 대자 서늘한 기운이 손목을 타고 올라왔다. 그 안에 무언가 살아 숨 쉬는 것 같았다.\n\n일각수의 뿔. 유니콘의 정령이 잠든 곳이 바로 여기였다.\n\n---\n\n## 막간 — 금발의 발키리\n\n산마루 너머, 바람이 눈가루를 흩뿌리는 곳에 마키아벨리가 서 있었다. 맞은편에는 갑옷 차림의 여인이 있었다. 바람에 날리는 머리칼이 금빛이었다.\n\n\"뒤를 쫓는 자들이 있습니다.\" 마키아벨리가 말했다. 목소리는 여전히 고요했다. \"둘뿐이지만, 가볍게 볼 상대는 아닙니다. 막아 주시겠습니까.\"\n\n\"제국 사람이 우리 발키리에게 부탁이라.\" 여인이 입꼬리를 올렸다. \"좋아요. 어차피 제국 놈들이라면 누구든 상관없으니까.\"\n\n비프로스트 발키리 대장, 카타리나였다. 허리에 찬 가는 검이 햇빛을 받아 번득였다.\n\n\"공왕 전하께서 기다리고 계십니다.\" 카타리나가 몸을 돌리며 덧붙였다. \"서두르시죠, 책사님.\"\n\n마키아벨리는 고개를 숙였다. 그가 걸음을 옮기는 쪽, 산 너머에 비프로스트가 있었다.\n\n---\n\n## 32장 — 날개 달린 퇴각\n\n산길이 좁아지는 곳에서 금빛 머리칼이 앞을 막았다.\n\n\"여기서부터는 못 지나가요.\" 카타리나가 가는 검을 뽑았다. \"비프로스트 발키리 대장, 카타리나. 제국의 개들은 여기서 돌아가 주시죠.\"\n\n\"발키리……!\" 리델이 침을 삼켰다. 기지에서 들었던 그 이름이었다.\n\n시라노는 대답 대신 엑스칼리버를 뽑았다. 동굴에서 되살아난 날이 산 위의 차가운 빛을 받아 하얗게 빛났다.\n\n싸움은 빨랐다. 카타리나의 검은 가볍고 날랬고, 쉬지 않고 이어졌다. 그러나 시라노의 검은 한 번도 물러서지 않았다. 마지막 일격이 부딪히고, 카타리나의 검끝이 땅에 닿았다.\n\n카타리나가 이를 악물었다. 숨이 거칠었다.\n\n\"……이걸로 끝난 줄 알지 마요.\"\n\n그녀가 손가락을 입에 물고 날카롭게 휘파람을 불었다. 하늘에서 커다란 날개가 그림자를 드리웠다. 비늘 덮인 날짐승이 내려앉자 카타리나는 훌쩍 그 등에 올라탔다. 바람이 한 번 일었고, 금빛 머리칼은 순식간에 산 너머로 멀어졌다.\n\n리델이 멍하니 하늘을 올려다보았다. \"……쟤, 날아서 도망갔어.\"\n\n\"공왕에게 가겠지.\" 시라노가 검을 거뒀다. \"우리도 그쪽이다.\"\n\n---\n\n## 33장 — 개구리를 쫓는 사람들\n\n\"거기 서!\"\n\n숲길에 이자벨의 목소리가 울렸다. 앞에서 초록빛 덩어리 하나가 풀숲을 폴짝폴짝 넘어가고 있었다. 개구리였다.\n\n\"이자벨, 갑자기 왜 개구리를…….\" 메디치가 영문을 몰라 뒤를 따랐다.\n\n그때 뒤에서 카나가 비명 비슷한 소리를 냈다. 짐을 풀어 보던 참이었다.\n\n\"없어. 없어졌어! 내 장비가 하나도 없어!\"\n\n이자벨이 그제야 걸음을 멈추고 돌아섰다. 개구리는 이미 풀숲 너머로 사라진 뒤였다.\n\n\"그럴 줄 알았어. 남의 물건을 훔쳐다 판다는 개구리가 있다는 소문, 들은 적 있거든. 아까부터 우리 짐 근처를 얼쩡거리더라니.\"\n\n\"개구리가? 내 물건을?\" 카나가 어이없다는 듯 입을 벌렸다.\n\n실버는 그 소동에도 아랑곳없이 낡은 양피지를 들여다보고 있었다. 손가락이 지도 위를 몇 번 오가다 한곳에서 멈췄다.\n\n\"……여기다. 게이시르 숲 한가운데, 화룡굴.\"\n\n\"화룡굴?\" 메디치가 눈썹을 올렸다. \"거긴 전에 한 번 들어갔던 곳 아닌가.\"\n\n\"그때 우린 보물을 찾으러 간 게 아니었잖아.\" 실버가 지도를 말아 쥐었다. \"카슈미르 녀석들이 뭘 숨겼다면, 눈에 띄는 데 두진 않았겠지.\"\n\n카나는 빈 허리춤을 한 번 쓸어 보고는 이를 악물었다. \"좋아. 보물도 찾고, 그 개구리도 잡는다.\"\n\n네 사람은 숲 한가운데를 향해 걸음을 옮겼다.\n\n---\n\n## 34장 — 화룡굴의 보물\n\n화룡굴의 열기는 여전했다. 바위벽은 붉게 달아 있었고, 깊이 들어갈수록 숨이 막혔다. 한 번 지나온 길이었지만, 그때와는 눈길이 닿는 곳이 달랐다.\n\n실버가 지도와 벽을 번갈아 보며 앞장섰다. 남들이 그냥 지나쳤을 바위 틈 앞에서 그는 걸음을 멈췄다.\n\n\"여기.\"\n\n틈 너머에 그것이 있었다. 먼지와 재를 뒤집어쓴 채, 오래 아무도 손대지 않은 카슈미르의 보물이었다.\n\n카나가 탄성을 질렀다. 메디치도 한참 말없이 그것을 내려다보았다. 이걸로 로우엔 산에서 잃은 것들을 메울 수 있었다.\n\n\"정말 있었네.\" 이자벨이 중얼거렸다. 그리고 고개를 갸웃했다. \"그런데 클라우제비츠는 이걸 어떻게 안 거지? 지도가 진짜라는 것까지.\"\n\n아무도 대답하지 못했다. 체사레가 비프로스트군을 부르려 한다는 소식도, 그는 늘 남들보다 한발 먼저 알고 있었다.\n\n메디치는 말없이 보물 위의 재를 털었다. 그 얼굴에 잠깐, 무언가 생각하는 빛이 스쳤다.\n\n그 순간, 굴 입구 쪽에서 발소리가 울렸다. 여럿이었다.\n\n\"누구냐!\" 카나가 돌아섰다.\n\n검은 옷차림의 사내들이 열기 속에서 모습을 드러냈다. 하나같이 짙은 색안경을 끼고 있었다. 굴 안의 어둠 속에서도 벗지 않은 안경이 붉은 빛을 받아 번들거렸다.\n\n말은 길지 않았다. 사내들이 먼저 덤벼들었고, 일행은 보물을 등지고 맞섰다. 굴 안이 칼 소리와 총성으로 가득 찼다가, 이윽고 잠잠해졌다.\n\n메디치가 숨을 고르며 입구 쪽을 살폈다. \"이게 끝이 아니야. 더 올 거다.\"\n\n카나는 보물 더미를 돌아보았다. 보석이 끝도 없이 쌓여 있었다. 네 사람이 다 짊어져도 반의반도 못 들 양이었다.\n\n\"아깝다…….\" 카나가 입술을 깨물었다.\n\n\"욕심부리다 다 잃는다.\" 실버가 이미 자루 하나를 채우고 있었다. \"들 수 있는 만큼만. 빨리.\"\n\n일행은 저마다 손에 잡히는 대로 보석을 쓸어 담았다. 그리고 남은 산더미를 뒤로한 채 화룡굴을 빠져나갔다.\n\n\n---\n\n## 막간 — 농부의 딸\n\n비프로스트 궁의 깊은 방. 두꺼운 휘장 너머로 눈보라 소리가 희미하게 들렸다. 비단 침상에 기댄 여인이 마키아벨리를 맞았다. 공왕의 애첩, 조세핀이었다.\n\n\"먼 길 오셨네요, 책사님.\"\n\n\"여전하시군요.\" 마키아벨리가 고개를 숙였다. \"흙 묻은 손으로 밭을 매던 아가씨가 이렇게 되실 줄은, 그때는 아무도 몰랐겠지요.\"\n\n조세핀의 눈이 잠깐 가늘어졌다.\n\n\"체사레 님께 고마운 줄은 알아요. 이 옷도, 이 방도, 다 그분이 만들어 주신 거니까. 하지만 착각은 마세요. 저는 그분과 거래를 할 뿐이에요.\"\n\n\"물론입니다.\" 마키아벨리는 웃음을 지우지 않았다. \"그래서, 공왕께서는.\"\n\n\"준비는 끝났어요.\" 조세핀이 손끝으로 침상 가장자리를 쓸었다. \"전하는 어릴 때 제국에게 당한 수모를 한 번도 잊은 적이 없어요. 원로원 늙은이들이 발목을 잡아 참고 계셨을 뿐. 그런데 그 늙은이들 가운데 높은 자리에 있던 사람들이, 요즘 하나둘 사라졌거든요.\"\n\n\"체사레 님께서 보내신 손님들 덕분이겠지요.\"\n\n\"이제 전하를 막을 사람은 없어요. 군대는 움직일 거예요.\"\n\n마키아벨리가 고개를 끄덕였다. 그리고 지나가는 말처럼 물었다.\n\n\"지난번에 파내고 있다던 그것은 어떻게 되었습니까.\"\n\n\"아스카론 말이군요.\" 조세핀이 한숨처럼 웃었다. \"자리는 찾았어요. 그런데 파내는 데 사람도 시간도 끝없이 들어요. 아직 멀었어요.\"\n\n\"서두를 것 없습니다.\" 마키아벨리가 창밖의 눈보라를 내다보았다. \"비프로스트의 대군이 있는데 굳이 마장기까지 꺼낼 것도 없지요. 발키리가 나서 준다면, 제피르 팰컨이든 프레데릭의 대포 부대든 오래 버티지 못할 겁니다.\"\n\n조세핀이 소리 없이 웃었다.\n\n\"그렇게 큰 군대를 제국 안으로 들였다가, 오히려 비프로스트가 제국을 통째로 삼켜 버리면 어쩌시려고요?\"\n\n비꼬는 말투였다. 마키아벨리는 눈썹 하나 움직이지 않았다.\n\n\"그 일이라면 걱정 마십시오. 체사레 님께서 복안을 마련해 두셨습니다.\"\n\n조세핀은 더 묻지 않았다. 다만 그 대답을 오래 곱씹는 얼굴이었다.\n\n휘장 너머에서 바람이 한 번 크게 울었다.\n\n마키아벨리가 물러간 뒤, 휘장 뒤에서 한 사내가 걸어 나왔다. 비프로스트의 공왕, 모젤 2세였다. 처음부터 거기 서서 모든 이야기를 듣고 있었다.\n\n조세핀은 놀라지 않았다. 그 자리에 공왕이 있다는 걸 알고 꺼낸 말들이었다.\n\n\"들으셨지요, 전하. 추기경은 전하의 군대를 칼로만 쓰려는 거예요. 우습게 보시면 안 돼요.\"\n\n모젤은 코웃음을 쳤다.\n\n\"칼이든 뭐든 상관없다. 추기경이 먼저 군대를 보내 달라 청했다. 그 명분이 있는 한, 팬드래건도 우리를 어쩌지 못해.\"\n\n창밖의 눈보라가 한층 거세졌다.\n\n---\n\n## 35장 — 군주론\n\n문이 거칠게 열렸다.\n\n마키아벨리가 책상에서 고개를 들었다. 문간에 시라노가 서 있었다. 그 뒤에서 리델이 검을 반쯤 뽑은 채 방 안을 훑었다.\n\n\"……시라노.\" 마키아벨리의 목소리는 놀랄 만큼 차분했다. \"결국 여기까지 왔군.\"\n\n\"오랜만이다, 마키아벨리.\"\n\n한동안 둘 다 말이 없었다. 학술원 시절, 같은 책상에서 밤을 새우던 두 사람이었다.\n\n\"왜 체사레를 따르나.\"\n\n\"내 철학이 그렇게 말하니까.\"\n\n시라노의 눈빛이 굳었다.\n\n\"철학? 음모를 꾸며 친구의 아들에게 누명을 씌우는 게 네 철학이냐. 권력을 쥐려고 제 딸을 도구로 쓰는 게? 아니면 이렇게 조국에 남의 나라 군대를 끌어들이는 게?\"\n\n마키아벨리는 자리에서 일어섰다. 피하지 않았다.\n\n\"제국에는 황제가 없어, 시라노. 흑태자가 사라진 뒤로 영주들은 서로 물어뜯기 바빴지. 이대로 두면 이 땅은 백 년이고 이백 년이고 피로 젖을 거다. 누군가는 이걸 하나로 묶어야 해. 손에 피를 묻혀서라도.\"\n\n\"그게 체사레라고.\"\n\n\"지금은 그 사람밖에 없다.\" 마키아벨리가 시라노의 눈을 똑바로 보았다. \"더 많은 피를 막기 위해 흘리는 피. 그게 내 대의다.\"\n\n리델이 검을 마저 뽑았다. \"들을 만큼 들었어. 시라노, 이자를 여기서…….\"\n\n\"아니.\"\n\n시라노가 손을 들어 리델을 막았다. 그리고 마키아벨리를 향해 한 걸음 다가섰다.\n\n\"이번엔 살려 두겠다. 돌아가서 체사레에게 전해라. 시라노가 갈 테니, 기다리고 있으라고.\"\n\n\"시라노! 제정신이야? 이자가 무슨 짓을 꾸몄는지……!\"\n\n\"알아.\" 시라노는 마키아벨리에게서 눈을 떼지 않았다. \"그래도 이번만은. 부탁한다, 리델.\"\n\n리델은 입술을 깨물었다. 한참 만에 검이 칼집으로 돌아갔다.\n\n마키아벨리는 아무 말 없이 두 사람 곁을 지나 문을 나섰다. 문턱에서 그가 잠깐 멈춘 것 같았지만, 끝내 돌아보지는 않았다.\n\n---\n\n## 막간 — 자존심\n\n\"비프로스트군이 국경을 넘었습니다! 대군입니다!\"\n\n전령이 숨을 몰아쉬며 무릎을 꿇었다. 프레데릭은 지도에서 눈을 떼지 않았다.\n\n\"올 줄 알았다.\"\n\n막사 안의 장교들이 서로를 쳐다보았다. 프레데릭은 지도 위 북쪽 국경을 손가락으로 툭 쳤다.\n\n\"추기경께서 불러들이신 손님들이지. 모르는 척하기엔 너무 시끄럽게 오는군.\"\n\n\"그렇다면…… 길을 열어 줘야 합니까?\"\n\n프레데릭이 고개를 들었다. 눈빛이 사나웠다.\n\n\"남의 나라 군대를 빌려 제 나라 일을 치른다. 그건 제국의 자존심을 진흙탕에 처박는 짓이다. 장인어른이 시킨 일이라 해도 두고 볼 수 없어. 비프로스트 놈들은 제국 땅에 한 발도 들이지 못한다.\"\n\n장교 하나가 조심스럽게 입을 열었다. \"하지만 각하, 저쪽엔 발키리가…….\"\n\n\"알고 있다.\" 프레데릭은 잠시 말을 끊었다. 대포만으로 그 날랜 여전사들을 막기는 쉽지 않았다.\n\n그가 붓을 들어 짧은 편지를 썼다. 봉투에 적힌 이름을 본 장교들의 얼굴이 굳었다.\n\n\"제피르 팰컨의 클라우제비츠에게 전해라.\"\n\n\"각하, 그자들은 얼마 전까지 우리가…….\"\n\n\"그래서 더 잘 알지. 그쪽도 비프로스트군이 반갑진 않을 거다.\" 프레데릭이 편지를 내밀었다. \"서둘러라.\"\n\n---\n\n## 막간 — 하나의 나라\n\n\"프레데릭 공께서 출병하셨습니다. 비프로스트군을 막겠다며.\"\n\n보고를 들은 체사레는 잠시 말이 없었다. 그러더니 낮게 웃기 시작했다. 웃음소리는 점점 커져, 넓은 방의 천장에 부딪혔다.\n\n\"역시 그 녀석답군. 제국의 자존심이라도 지키겠다는 거겠지.\"\n\n체사레는 잔을 들어 촛불에 비춰 보았다.\n\n\"이기지 못한다. 발키리가 나선 비프로스트 대군을 대포 몇 문으로 막을 수 있을 리 없지. 내가 손 하나 대지 않아도, 말 안 듣는 사위는 북쪽 눈밭에 묻힌다.\"\n\n그는 잔을 내려놓고 창가로 걸어갔다. 창밖으로 밤의 도시가 펼쳐져 있었다.\n\n\"이제 곧이다. 제국은 물론이고, 비프로스트도, 팬드래건도, 아스타니아도.\"\n\n손을 들어 어둠을 움켜쥐듯 주먹을 쥐었다.\n\n\"안타리아 대륙 전체가 강력한 하나의 나라로 다시 태어나는 것이다.\"\n\n주먹이 천천히 풀렸다. 체사레의 목소리가 낮아졌다. 방 안에는 그 혼자뿐이었지만, 누군가에게 말을 건네는 말투였다.\n\n\"당신이 세상을 뜬 지도 벌써 서른 해가 지났구려.\"\n\n창유리에 비친 그의 얼굴은 잠시, 웃고 있지 않았다.\n\n\"이제 우리의 한을 풀 날이 머지않았소.\"\n\n---\n\n## 36장 — 원수의 편지\n\n에스테의 저택 응접실에 오랜만에 모두가 모였다. 북쪽에서 막 돌아온 시라노와 리델은 아직 눈 냄새를 털어내지 못했고, 카나는 낯선 장비를 어색하게 매만지고 있었다. 실버의 짐 꾸러미에서는 이따금 보석 부딪히는 소리가 났다.\n\n탁자 가운데에 편지 한 장이 놓여 있었다. 봉인에 찍힌 문장을 모르는 사람은 없었다.\n\n\"프레데릭이 보냈네.\" 클라우제비츠가 말했다. \"비프로스트군을 함께 막자는군.\"\n\n방 안이 조용해졌다. 리델이 가장 먼저 입을 열었다.\n\n\"얼마 전까지 우리한테 대포를 쏘던 사람이야.\"\n\n\"그래서 더 믿을 만하지.\" 메디치가 팔짱을 꼈다. \"적어도 그 사람은 외세를 끌어들이는 쪽은 아니야.\"\n\n에스테가 조용히 차를 내려놓았다. \"비프로스트와 가장 가까운 곳이 이 리브레빌이에요. 그 군대가 내려오면 제일 먼저 짓밟히는 것도 여기고요.\"\n\n모두의 눈이 시라노에게 갔다. 아버지를 죽인 사람의 편지였다.\n\n시라노는 편지를 오래 내려다보았다. 그리고 고개를 들었다.\n\n\"남의 나라 군대가 이 땅을 밟는 걸 두고 볼 순 없다. 그건 나도 같다.\"\n\n짧은 침묵 끝에 클라우제비츠가 고개를 끄덕였다.\n\n\"결정됐군. 제피르 팰컨은 프레데릭과 함께 비프로스트군에 맞선다.\"\n\n구석에서 크리스가 남몰래 숨을 내쉬었다. 아무도 그 얼굴을 눈여겨보지 않았다.\n\n클라우제비츠가 지도를 펼쳤다. 북쪽 국경 너머로 비프로스트군을 뜻하는 붉은 표식이 빽빽했다.\n\n\"솔직히 말하지. 수로는 상대가 안 되네. 정면으로 붙으면 지는 싸움이야.\"\n\n\"그럼 어떻게 해.\" 카나가 물었다.\n\n클라우제비츠의 손끝이 지도 위 한 점에 멈췄다. 시라노의 눈이 그곳에 가 닿았다. 잊을 수 없는 이름이었다.\n\n\"인페르노다. 지금은 비프로스트군이 차지하고 있지. 기습으로 그곳을 되찾아 요새로 쓴다. 원래 사람을 가둬 두려고 지은 곳이니, 지키기엔 그만한 데가 없어.\"\n\n시라노는 아무 말도 하지 않았다. 열세 해를 갇혀 유황을 캐던 그곳으로, 이번엔 제 발로 들어가게 된 것이다.\n\n\"그리고 하나 더.\" 클라우제비츠가 길쭉한 꾸러미를 탁자에 올렸다. 천을 걷자 날렵한 검 한 자루가 드러났다. \"팬드래건의 최신형 검, PS-7이네. 가볍고 고치기도 쉽지. 이번 싸움에 요긴할 거야.\"\n\n\"팬드래건 군용 검을?\" 메디치가 눈을 가늘게 떴다. \"그걸 어디서 구했나?\"\n\n\"운이 좋았지.\" 클라우제비츠는 그 한마디뿐, 더 말하지 않았다.\n\n이자벨이 메디치와 눈을 마주쳤다. 화룡굴에서 품었던 물음이 다시 떠오른 얼굴이었다.\n\n---\n\n## 37장 — 그 곡\n\n회의가 끝난 뒤, 저택 이층의 작은 방에 리델과 카나, 이자벨, 크리스가 둘러앉아 있었다.\n\n\"메디치는?\" 이자벨이 물었다.\n\n\"에스테 님이랑 같이 나가던데.\" 카나가 아무렇지 않게 대답했다.\n\n이자벨은 \"그래\" 하고만 말했다. 찻잔을 든 손이 잠깐 멈췄다가 다시 움직였다.\n\n방 한쪽에 피아노가 놓여 있었다. 크리스가 다가가 뚜껑을 열었다. 건반 위로 손가락을 몇 번 굴려 보더니, 조용히 한 곡을 치기 시작했다.\n\n부드럽고, 어딘가 쓸쓸한 선율이었다.\n\n\"좋다. 무슨 곡이야?\" 카나가 물었다.\n\n\"어머니가 좋아하시던 곡이야. 어릴 때 어머니한테 배웠어.\"\n\n그 순간 문이 벌컥 열렸다.\n\n시라노였다. 처음 보는 얼굴이었다. 무섭도록 굳은 얼굴로 그가 방 안을 훑었다.\n\n\"조금 전 피아노, 누가 친 거지?\"\n\n방 안이 얼어붙었다. 크리스가 머뭇거리며 손을 들었다.\n\n\"……저예요. 어머니한테 배운 곡이에요.\"\n\n\"다시 쳐 봐.\"\n\n크리스는 영문을 모른 채 다시 건반에 손을 올렸다. 선율이 흐르기 시작하자, 시라노가 천천히 다가왔다. 그리고 크리스 곁에 앉았다.\n\n시라노의 손이 건반 위에 놓였다. 크리스의 선율 아래로 낮은 화음이 겹쳤다. 처음부터 그렇게 함께 치도록 지어진 곡처럼, 두 소리는 한 번도 어긋나지 않았다.\n\n리델이 입을 벌린 채 굳었다. 이자벨도, 카나도 숨을 죽였다.\n\n마지막 음이 방 안에 오래 남았다.\n\n\"……이 곡을, 어떻게 아세요?\" 크리스가 물었다.\n\n시라노는 잠시 건반을 내려다보았다. 그리고 일어섰다.\n\n\"신경 쓰지 마라.\"\n\n문이 닫혔다. 크리스는 한참 동안 그 문을 바라보고 있었다.\n\n---\n\n## 38장 — 돌아온 지옥\n\n유황 냄새가 먼저 마중 나왔다.\n\n시라노는 갱도 입구에서 걸음을 멈췄다. 매캐한 연기, 벽을 타고 흐르는 누런 얼룩, 멀리서 울리는 곡괭이질 같은 메아리. 열세 해 동안 날마다 맡던 냄새였다.\n\n다른 건 하나였다. 이번엔 쇠사슬 대신 검을 들고 있었다.\n\n\"여기가…… 인페르노.\" 카나가 코를 막으며 중얼거렸다.\n\n갱도 안쪽에서 비프로스트 병사들의 말소리가 들렸다. 감옥을 지키던 제국 간수들은 어디로 갔는지, 이제 이 지옥의 주인은 북쪽에서 온 군대였다.\n\n\"간다.\" 시라노가 엑스칼리버를 뽑았다.\n\n그는 이 길을 누구보다 잘 알았다.\n\n갱도마다 칼 소리가 울렸다. 비프로스트 병사들은 지옥의 생김새를 몰랐고, 시라노는 눈을 감고도 길을 찾을 수 있었다. 막다른 줄 알았던 곳에서 옆구리를 치고, 갈림길 그림자에서 뛰어나왔다. 병사들은 하나둘 무너졌다.\n\n마지막 병사가 쓰러졌을 때, 갱도 위쪽에서 함성이 들려왔다. 다른 길로 들어간 부대들이었다. 곧이어 프레데릭의 병사들이 내건 깃발이 감시탑 위로 올라갔다.\n\n\"모든 부대, 작전 성공입니다!\"\n\n전령의 외침이 동굴 벽에 부딪혀 몇 번이고 메아리쳤다.\n\n리델이 숨을 몰아쉬며 벽에 등을 기댔다. \"……진짜 해냈네. 그 프레데릭이랑 같이.\"\n\n시라노는 대답하지 않았다. 그는 갱도 깊은 곳, 어둠이 가장 짙은 쪽을 오래 바라보았다. 한때 자신이 갇혀 있던 곳이었다.\n\n이제 이 지옥은 그를 가두는 곳이 아니라, 그가 지키는 곳이 되었다.\n\n---\n\n## 39장 — 크리스티나\n\n감시탑 아래 넓은 갱도에서 두 무리가 마주 섰다. 한쪽은 제피르 팰컨, 다른 한쪽은 프레데릭과 그의 장교들이었다. 얼마 전까지 서로에게 포를 겨누던 얼굴들이었다.\n\n프레데릭이 성큼 앞으로 나섰다. 클라우제비츠가 맞이하러 나가는 사이, 크리스는 슬그머니 뒷줄로 물러났다. 고개를 숙이고, 사람들 그림자에 몸을 숨기듯 갱도 옆길 쪽으로 발을 옮겼다.\n\n\"크리스티나.\"\n\n굵은 목소리가 갱도를 울렸다. 크리스의 발이 그 자리에 박혔다.\n\n모두의 눈이 크리스에게 쏠렸다. 크리스는 한참을 그렇게 서 있다가, 체념한 듯 천천히 돌아섰다.\n\n\"……아버지.\"\n\n카나가 입을 틀어막았다. 리델은 크리스와 프레데릭을 번갈아 보았다. 시라노는 움직이지 않았다. 그러나 그 눈이 크리스에게서 떨어지지 않았다.\n\n프레데릭은 딸을 내려다보았다. 꾸짖을 줄 알았던 얼굴에는 뜻밖에 웃음기가 어려 있었다.\n\n\"석 달이다. 네 어머니가 얼마나 걱정하는지 아느냐. 집으로 돌아가거라.\"\n\n크리스는 입술을 깨물었다. 무언가 말하려다 그만두고, 대신 제피르 팰컨 쪽으로 몸을 돌렸다.\n\n\"그동안…… 고마웠어요. 다들.\"\n\n크리스가 깊이 고개를 숙였다. 카나가 달려가 그 손을 꼭 잡았다. 이자벨은 말없이 어깨를 두드려 주었다.\n\n마지막으로 크리스의 눈이 시라노에게 갔다. 시라노는 아무 말도 하지 않았다. 다만 아주 조금, 고개를 끄덕였다.\n\n크리스는 아버지의 병사들을 따라 갱도 밖으로 나갔다. 어머니가 좋아하던 그 곡의 선율이, 시라노의 귓가에 다시 울리는 것 같았다.\n\n---\n\n## 40장 — 드래건 스트라이크\n\n인페르노의 가장 넓은 갱도에 탁자가 놓였다. 한쪽엔 제피르 팰컨, 맞은편엔 프레데릭과 그의 장교들. 그 사이에 커다란 지도가 펼쳐졌다.\n\n\"정면으로는 이길 수 없습니다.\" 클라우제비츠가 먼저 입을 열었다. \"그러니 정면에서 싸우지 않을 겁니다.\"\n\n그의 손가락이 지도 위를 비스듬히 그었다.\n\n\"프레데릭 공께서는 적의 보급 부대를 치십시오. 메디치가 곁을 돕습니다. 시라노는 적 1부대와 보급 부대 사이를 파고들어 보급로를 끊고 흔들어 놓는다. 이자벨, 자네는 적 1부대와 맞붙지 말게. 견제만 하면서 발목을 잡아. 리델은 우리 쪽 보급로를 지키고.\"\n\n프레데릭이 지도를 내려다보며 턱을 쓸었다. \"한쪽에 힘을 몰고, 나머지는 버틴다라. 이건…….\"\n\n\"흑태자의 사선대형입니다.\" 클라우제비츠가 담담히 말했다. \"제 나름대로 손을 봤습니다만.\"\n\n프레데릭의 눈에 잠깐 흥미로운 빛이 스쳤다. 그는 더 묻지 않았다.\n\n\"이름은 드래건 스트라이크 작전으로 하지요.\"\n\n회의가 끝나자 사람들이 저마다 제 길로 흩어졌다. 시라노는 엑스칼리버의 끈을 고쳐 맸다.\n\n\"우리 몫은 적의 등 뒤다.\" 그가 말했다. \"들키는 순간 끝이니, 소리 없이 간다.\"\n\n어둠이 내리기 시작한 산길로, 시라노 일행이 적진 깊숙이 스며들었다.\n\n비프로스트의 보급기지는 골짜기 안쪽에 숨어 있었다. 짐수레와 천막이 늘어서고, 곡식 자루와 화약 상자가 산처럼 쌓여 있었다. 지키는 병사들은 앞쪽 전선만 바라보고 있었다. 뒤에서 누가 올 거라고는 생각지 못한 얼굴들이었다.\n\n시라노가 손짓하자 일행이 한꺼번에 뛰어들었다.\n\n싸움은 길지 않았다. 놀란 병사들이 창을 고쳐 잡기도 전에 대열이 무너졌다. 마지막 병사가 쓰러지자, 골짜기에는 바람에 펄럭이는 천막 소리만 남았다.\n\n\"이걸로 저쪽은 며칠 못 버틸 거야.\" 누군가 숨을 고르며 말했다.\n\n시라노는 쌓인 짐더미를 둘러보았다. 앞쪽에서 싸우는 비프로스트 병사들의 밥과 탄약이 모두 여기 있었다.\n\n---\n\n## 막간 — 잠깐 얘기 좀\n\n같은 시각, 다른 쪽 진영. 모닥불은 낮게 피워져 있었고, 병사들은 교대로 눈을 붙이고 있었다.\n\n메디치가 지도를 접어 넣을 때, 리델이 다가왔다. 평소처럼 투덜거리는 얼굴이 아니었다.\n\n\"메디치. 잠깐 얘기 좀 해.\"\n\n메디치가 고개를 들었다. 리델은 모닥불에서 조금 떨어진 어둠 쪽을 턱으로 가리켰다.\n\n둘이 불빛 밖으로 나서자, 리델이 먼저 입을 열었다.\n\n\"예전엔 말이야. 어디든 맨 앞에는 우리가 있었어. 너랑 나랑.\"\n\n메디치는 대답 없이 들었다.\n\n\"그런데 요즘은 어때? 마키아벨리를 쫓는 것도, 적 뒤를 치는 것도 다 시라노야. 이번엔 프레데릭까지 끼어들었지. 우린 뭐야. 뒤에서 길이나 지키고.\"\n\n리델이 발밑의 돌멩이를 걷어찼다. 돌멩이는 어둠 속으로 굴러가 사라졌다.\n\n\"시라노 덕에 적 보급로는 끊겼어. 지금 카타리나 군은 배를 곯고 있을 거야. 지금 치면 된다고. 기다릴 거 없이.\"\n\n\"클라우제비츠의 작전과는 다르다.\" 메디치가 낮게 말했다.\n\n\"알아. 그래도 지금이 기회야. 우리가 끝내는 거야, 메디치.\"\n\n메디치는 한참 모닥불 쪽을 바라보았다. 그러다 천천히 고개를 끄덕였다.\n\n\"……좋아. 가지.\"\n\n---\n\n## 41장 — 뚫린 등\n\n보급기지의 천막 사이로 말발굽 소리가 달려들었다. 전령이었다. 말에서 굴러떨어지듯 내려선 그가 숨을 헐떡였다.\n\n\"아군 보급로가…… 비프로스트군에게 넘어갔습니다!\"\n\n시라노가 돌아섰다. \"리델이 지키던 곳이다.\"\n\n\"리델 님과 메디치 님이 카타리나군을 치겠다며 자리를 비우셨습니다. 그 틈을 노린 겁니다.\"\n\n카나가 입을 딱 벌렸다. \"둘이 멋대로……?\"\n\n전령이 고개를 들었다. \"클라우제비츠 님의 전갈입니다. 시라노 님과 카나 님께서 보급로를 되찾아 주십사 하셨습니다.\"\n\n시라노는 잠시 말이 없었다. 적의 등을 치러 왔더니, 이번엔 제 편의 등이 뚫려 있었다.\n\n\"카나.\"\n\n\"응, 가자.\" 카나는 벌써 총을 메고 있었다.\n\n보급로 어귀에 이르자, 낯익은 깃발이 먼저 눈에 들어왔다. 비프로스트 발키리의 깃발이었다.\n\n짐수레 사이로 금빛 머리칼이 돌아섰다.\n\n\"또 당신이군요.\" 카타리나가 가는 검을 뽑았다. 망티고아 산에서 떨던 목소리는 온데간데없었다. \"이번엔 날아서 도망칠 일 없을 거예요.\"\n\n\"그쪽이 여기 있었군.\" 시라노가 엑스칼리버를 뽑으며 중얼거렸다. 리델과 메디치가 치러 간 곳은 텅 비어 있었을 것이다.\n\n카나가 총을 들어 올렸다. \"시라노, 이번엔 끝내자.\"\n\n싸움은 망티고아 산 때보다 길었다. 카타리나의 검은 더 빨라져 있었고, 발키리들은 물러서지 않았다. 그러나 이번에도 마지막에 선 것은 시라노였다. 카타리나가 무릎을 꿇었을 때, 보급로 위에 다시 제피르 팰컨의 깃발이 올랐다.\n\n그날 저녁, 비프로스트군이 물러간다는 소식이 전선 곳곳에서 날아들었다. 보급이 끊긴 대군은 오래 버티지 못했다.\n\n승전의 자리였다. 병사들이 술잔을 돌렸고, 프레데릭의 장교들과 제피르 팰컨 사람들이 처음으로 한데 섞여 웃었다.\n\n시라노가 그 사이를 가로질러 프레데릭 앞에 섰다. 웃음소리가 하나둘 잦아들었다.\n\n\"프레데릭.\"\n\n프레데릭이 잔을 내려놓았다. 그 눈이 시라노를 마주 보았다. 오래전부터 이 순간이 올 줄 알았다는 얼굴이었다.\n\n\"결투를 신청한다.\"\n\n방 안이 얼어붙었다. 누군가 숨을 들이켰다. 프레데릭은 한참 시라노를 바라보다가, 천천히 고개를 끄덕였다.\n\n\"좋다. 내일 아침. 단둘이서.\"\n\n---\n\n## 42장 — 아침의 결투\n\n새벽안개가 아직 걷히지 않은 산마루에, 시라노가 먼저 와 있었다.\n\n엑스칼리버를 땅에 꽂고, 그는 해가 오르는 쪽을 바라보았다. 열다섯 해였다. 아버지가 이 사내의 칼에 쓰러졌다는 걸 안 날부터, 이 아침을 몇 번이나 떠올렸는지 몰랐다.\n\n안개 너머로 발소리가 들렸다. 프레데릭이었다. 약속대로 혼자였다.\n\n두 사람은 말없이 마주 섰다. 인사는 필요 없었다.\n\n검이 부딪쳤다. 프레데릭의 칼은 무거웠고, 흔들림이 없었다. 루크 번스타인을 쓰러뜨린 칼이었다. 시라노는 물러서지 않았다. 한 합, 또 한 합. 안개가 검풍에 찢겨 나갔다.\n\n해가 산등성이 위로 걸렸을 때, 마지막 일격이 갈렸다.\n\n프레데릭의 칼이 바위틈에 떨어졌다. 시라노는 숨을 몰아쉬며 그 앞에 서 있었다.\n\n이긴 것은 시라노였다.\n\n프레데릭은 떨어진 칼을 주우려 하지 않았다. 숨을 고르며, 담담하게 시라노를 올려다볼 뿐이었다.\n\n시라노가 입을 열었다.\n\n\"십오 년 전, 당신과의 결투로 목숨을 잃은 루크 번스타인이라는 남자를 기억하시오?\"\n\n프레데릭의 눈이 잠깐 먼 곳을 보았다.\n\n\"루크 번스타인이라면…… 기억하고 있소. 죄목이 악마 숭배와 반란이었지.\"\n\n\"그를 죽인 일을 후회하고 있소?\"\n\n\"후회라.\" 프레데릭이 낮게 되뇌었다. \"그에게 씌워진 죄목은 뻔한 누명이었겠지. 하지만 내가 한 일을 후회한 적은 없소. 그건 결투가 아니었소. 전쟁이었지. 그리고 그 전쟁을 일으킨 건 루크 번스타인이었소. 내가 한 일은 더 큰 희생을 막기 위한, 정당한 희생이었소.\"\n\n시라노는 한동안 말이 없었다.\n\n\"……그런가.\"\n\n\"당신은 루크 번스타인의 죽음을 내 목숨으로 갚으려는 것이었군.\" 프레데릭이 고개를 들었다. \"미안하지만 내 생각은 변하지 않소. 어서 가져가시오.\"\n\n엑스칼리버의 끝이 프레데릭의 목 앞에서 멈춰 있었다.\n\n\"미련은 없소?\"\n\n프레데릭이 희미하게 웃었다.\n\n\"미련 없이 죽을 수 있는 사람이 세상에 있겠소? 아내와 딸이 슬퍼할 걸 생각하면, 어쩌면 비굴해질지도 모르지.\"\n\n\"아내…… 라.\"\n\n칼끝이 아주 조금 흔들렸다.\n\n프레데릭은 아무 말도 하지 않았다. 안개가 두 사람 사이를 천천히 흘러 지나갔다.\n\n\"……메르세데스.\"\n\n시라노의 입술에서, 들릴 듯 말 듯 그 이름이 새어 나왔다.\n\n프레데릭의 눈이 크게 뜨였다.\n\n\"……!\"\n\n시라노는 칼끝을 거두지 않은 채, 그 눈을 똑바로 마주 보았다.\n\n\"당신의 아내는…… 나의 메르세데스였소.\"\n\n\"그게 무슨…….\" 프레데릭이 몸을 일으키려다, 상처를 움켜쥐며 신음했다. \"윽!\"\n\n시라노는 천천히 칼을 내렸다.\n\n\"신이 세상에 사랑을 주었고, 그것을 질투한 악마가 있었지.\"\n\n프레데릭이 숨을 멈췄다. 그 말이 누구를 가리키는지, 그는 묻지 않아도 알 것 같은 얼굴이었다.\n\n시라노는 엑스칼리버를 칼집에 넣었다.\n\n\"당신이 그들의 죗값을 대신 치러야 할 까닭은 없소. 어서 산을 내려가시오.\"\n\n돌아서는 시라노의 등을, 프레데릭이 멍하니 바라보았다. 루크 번스타인. 메르세데스. 흩어져 있던 이름들이 한 사람에게로 모였다.\n\n\"당신은…….\" 목소리가 떨렸다. \"번스타인…… 시라노…… 번스타인……!\"\n\n시라노는 걸음을 멈추지 않았다. 대답도 하지 않았다. 안개 속으로, 그의 뒷모습이 천천히 멀어져 갔다.\n\n---\n\n## 43장 — 막사의 시신\n\n진영으로 돌아오는 길, 시라노의 발걸음은 무거웠다. 이긴 싸움이었는데, 이긴 사람의 걸음 같지 않았다.\n\n진영 어귀가 이상하게 술렁이고 있었다. 병사들이 무리 지어 수군거리다가 시라노를 보고 입을 다물었다. 몇몇은 눈을 피했다.\n\n\"무슨 일이냐.\"\n\n카나가 막사 쪽에서 뛰어왔다. 얼굴이 하얗게 질려 있었다.\n\n\"시라노…… 프레데릭이…… 죽었대.\"\n\n시라노의 걸음이 멈췄다.\n\n막사 안에는 천을 덮은 몸이 누워 있었다. 천 아래로 드러난 손에, 아침 산마루에서 본 반지가 끼워져 있었다.\n\n\"말도 안 돼.\" 시라노가 낮게 말했다. \"나는 그를 살려 보냈다.\"\n\n아무도 대답하지 않았다. 막사 밖에서 바람이 천막 자락을 거칠게 흔들었다. 결투를 한 사람은 둘뿐이었고, 돌아온 건 하나였다.\n\n---\n\n## 막간 — 잔\n\n프레데릭 저택의 응접실은 불이 반쯤 꺼져 있었다. 메르세데스는 창가 의자에 앉아 움직이지 않았다. 손에 쥔 손수건이 젖어 있었다.\n\n문이 열리고 체사레가 들어왔다. 검은 옷차림이었다.\n\n\"얼마나 상심이 크겠느냐.\" 체사레가 딸의 어깨에 손을 얹었다. 목소리는 부드러웠다. \"그 사람은 끝까지 제국을 위해 싸웠다. 그런 자를, 그렇게…….\"\n\n말끝을 흐리며, 체사레는 탁자 위에 잔 하나를 내려놓았다. 잔 속에서 짙은 빛깔의 액체가 촛불을 받아 흔들렸다.\n\n체사레는 그 잔에 대해 아무 말도 하지 않았다. 그대로 방을 나갔다. 문이 닫히는 소리가 길게 울렸다.\n\n메르세데스는 고개를 들지 않았다. 탁자 위의 잔만이, 말없이 그녀 곁에 놓여 있었다.\n\n---\n\n## 44장 — 편지\n\n이틀 뒤, 전령 하나가 진영에 들어섰다. 로우엔에서 왔다고 했다.\n\n\"시라노 번스타인 님께 드리는 편지입니다.\"\n\n봉투는 얇았다. 겉봉에 적힌 이름을 본 순간, 시라노의 손이 멎었다.\n\n메르세데스.\n\n프레데릭 장군의 부인이 보낸 편지라고, 전령은 덧붙였다. 시라노는 아무 대답도 하지 않았다. 그 이름을 이렇게 다시 보게 될 줄은 몰랐다.\n\n봉투를 열자 종이 한 장이 나왔다. 글은 짧았다.\n\n로우엔의 살롱에서 기다리겠습니다.\n\n그뿐이었다. 안부도, 까닭도 없었다. 시라노는 그 한 줄을 오래 내려다보았다. 열다섯 해 전에 보던 그 글씨였다.\n\n\"함정이네.\" 클라우제비츠가 편지를 들여다보고는 곧바로 말했다. \"프레데릭이 죽은 지 이틀이야. 지금 자네를 부르는 게 정말 그 부인일지, 누가 그 이름을 빌렸을지 모르는 일이지.\"\n\n\"알고 있다.\"\n\n\"알면서도 가겠다는 건가.\"\n\n시라노는 편지를 접어 품에 넣었다.\n\n\"그 사람이 기다린다고 했다. 그거면 됐다.\"\n\n클라우제비츠는 더 말리지 않았다. 다만 한숨처럼, 길게 숨을 내쉬었다.\n\n---\n\n## 45장 — 독배\n\n로우엔의 저택은 조용했다. 하인 하나 없이, 촛불 몇 개만 켜져 있었다.\n\n메르세데스는 검은 옷을 입고 있었다. 열다섯 해가 지났지만, 시라노는 단번에 알아보았다. 그녀도 알아보았다. 그 눈에 떠오른 건 반가움이 아니었다.\n\n\"오셨군요.\"\n\n목소리가 차가웠다. 탁자 위에 와인이 담긴 잔 하나가 놓여 있었다.\n\n\"남편을 죽인 사람과 마주 앉을 날이 올 줄은 몰랐어요. 그게 당신일 줄은 더더욱.\"\n\n시라노는 대답하지 않았다. 잔을 보았다. 잔에서 아주 희미하게, 쌉싸름한 냄새가 났다. 무엇인지 알았다. 그녀가 그것을 알고 내미는 건지까지는 알 수 없었다.\n\n\"드세요.\" 메르세데스가 말했다. \"먼 길 오셨으니까.\"\n\n변명할 말은 많았다. 살려 보냈다고, 산을 내려가라 했다고, 그 사람을 죽인 건 내가 아니라고. 그러나 시라노는 그 어떤 말도 하지 않았다. 열다섯 해 전에도, 그는 말로는 아무것도 증명하지 못했다.\n\n그는 잔을 들었다. 그리고 한 번에 비웠다.\n\n잔이 탁자에 내려앉는 소리가 났다. 시라노는 메르세데스를 바라보았다. 아무 원망도 없는, 오래전 그 얼굴로.\n\n메르세데스의 얼굴에서 핏기가 빠져나갔다.\n\n\"……알고 있었군요. 알면서, 마신 거예요.\"\n\n시라노의 무릎이 조금 꺾였다. 그래도 그는 웃으려 했다.\n\n메르세데스가 비틀거리며 뒤로 물러섰다. 그 눈에, 하나씩 하나씩 무언가가 맞춰지고 있었다. 열다섯 해 전의 재판. 아버지가 서둘러 정해 준 혼인. 그리고 사흘 전, 아버지가 직접 가져다 놓은 이 와인.\n\n\"아버지…….\"\n\n그 한마디에 모든 것이 담겨 있었다.\n\n메르세데스는 떨리는 손으로 병을 들었다. 남은 와인을 잔에 따랐다.\n\n\"메르세데스, 안 돼……!\"\n\n시라노가 손을 뻗었지만, 몸이 말을 듣지 않았다. 메르세데스는 그를 바라보며, 열다섯 해 만에 처음으로 웃었다. 그리고 잔을 비웠다.\n\n---\n\n시라노는 어떻게 저택을 나왔는지 몰랐다. 벽을 짚고, 문을 밀고, 계단을 굴러 내려왔다. 뜰에 나섰을 때, 횃불이 그를 둘러쌌다. 병사들이었다. 기다리고 있었던 것이다.\n\n엑스칼리버를 뽑으려 했다. 손에 힘이 들어가지 않았다. 세상이 기울었다. 차가운 돌바닥이 뺨에 닿았다.\n\n멀리서 총성이 울렸다.\n\n\"시라노!\"\n\n카나의 목소리였다. 횃불 사이로 실버가 뛰어들었고, 그 뒤로 하얀 옷자락이 보였다. 에스메랄다였다.\n\n시라노는 그 얼굴들을 끝까지 보지 못하고 눈을 감았다.\n\n---\n\n## 46장 — 남는 사람\n\n실버가 시라노를 등에 업고 골목을 내달렸다. 카나가 앞에서 길을 열었고, 에스메랄다가 뒤에서 시라노의 등에 손을 얹은 채 무언가를 쉬지 않고 읊조렸다. 손끝에서 희미한 빛이 새어 나왔다.\n\n로우엔 성문이 보였다. 그 너머로 어두운 숲이 펼쳐져 있었다.\n\n\"됐다, 빠져나왔어……!\" 카나가 숨을 몰아쉬었다.\n\n그 순간, 사방에서 횃불이 한꺼번에 타올랐다. 숲 가장자리를 따라 병사들이 둥글게 늘어서 있었다. 길은 처음부터 하나뿐이었고, 그 끝에서 그들이 기다리고 있었다.\n\n횃불 사이로 한 사내가 걸어 나왔다.\n\n\"역시 이 길로 오는군.\" 학자의 옷을 입은 사내였다. 목소리가 차분했다. \"번스타인 집안 사람들은 언제나 정직한 길만 고르지.\"\n\n이스카리옷이었다.\n\n실버가 이를 악물었다. 시라노를 업은 채로는 싸울 수 없었다. 에스메랄다의 손이 떨렸다. 독은 아직 시라노의 몸 안에 있었다.\n\n실버는 시라노를 천천히 내려 카나의 어깨에 기대게 했다.\n\n\"실버, 뭐 하는 거야.\"\n\n\"보면 몰라.\" 실버가 수리검을 꺼내 들었다. \"셋이 다 남으면 셋 다 끝이야. 내가 길을 연다. 너희는 시라노를 데리고 뛰어.\"\n\n\"말도 안 돼, 너 혼자서……!\"\n\n\"카나.\" 실버가 처음으로 웃었다. 늘 짓던 그 웃음이었다. \"보물 찾을 때 내 말 잘 들었잖아. 이번에도 들어.\"\n\n에스메랄다가 카나의 팔을 잡았다. 카나는 입술을 깨물었고, 끝내 고개를 끄덕였다.\n\n실버가 횃불의 벽을 향해 뛰어들었다. 그가 만든 틈으로, 카나와 에스메랄다가 시라노를 부축해 어둠 속으로 사라졌다.\n\n등 뒤에서 칼 소리가 길게 이어졌다.\n\n숲길은 어두웠다. 카나와 에스메랄다는 시라노를 양쪽에서 부축한 채 나무 사이를 헤쳐 나갔다. 등 뒤의 칼 소리는 어느새 들리지 않았다.\n\n그때 앞쪽 나뭇가지가 흔들렸다. 카나가 총을 겨눴다.\n\n\"쏘지 마. 나다.\"\n\n달빛 아래로 검은 망토가 내려섰다. 샤른호스트였다.\n\n\"샤른호스트……!\" 카나의 목소리가 떨렸다. \"실버는? 실버 봤어? 뒤에 혼자 남았어, 우리 때문에…….\"\n\n샤른호스트는 대답하지 않았다. 카나를 보던 눈이 잠깐 숲 너머로 갔다가, 다시 땅으로 떨어졌다.\n\n카나는 더 묻지 못했다.\n\n에스메랄다가 조용히 말했다. \"지금은 시라노 님부터 살려야 해요.\"\n\n샤른호스트가 고개를 끄덕이고 시라노의 한쪽 팔을 넘겨받았다. 세 사람은 말없이 다시 걸음을 옮겼다.\n\n---\n\n## 47장 — 대답 없는 사람\n\n산중턱의 바위 그늘에 이르러서야 추격하는 횃불이 보이지 않게 되었다.\n\n시라노를 눕히자 에스메랄다가 곧장 곁에 무릎을 꿇었다. 이마에 땀이 맺혀 있었다. 그런데 손끝은 얼음장 같았다. 숨이 얕고, 입술은 거무스름하게 변해 있었다.\n\n\"독이…… 생각보다 깊이 퍼졌어요.\" 에스메랄다의 목소리가 처음으로 흔들렸다.\n\n카나는 시라노의 손을 꼭 쥐었다가, 고개를 들어 바위 끝에 선 그림자를 보았다. 샤른호스트는 산 아래를 내려다보고 있었다.\n\n\"샤른호스트.\"\n\n그가 돌아보지 않았다.\n\n\"당신, 대체 누구야? 왜 늘 이럴 때만 나타나? 실버는…… 실버는 어떻게 된 건데.\"\n\n대답은 없었다. 바람이 한 번 바위 위를 쓸고 지나갔다. 카나가 다시 고개를 들었을 때, 바위 끝은 비어 있었다.\n\n*(지금 여기까지)*\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
