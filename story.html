<script id="md" type="application/json">"# 서풍의 광시곡 — 스토리 흐름\n\n> **현재 진행 시점**: 마검숲 (2차 — 멸살지옥검을 얻으러) 멸살지옥검 획득\n\n---\n\n## 0. 배경 — 창세전쟁 50년 후\n\n- **창세전쟁**: 신들과 인류의 전쟁. **패왕 흑태자**와 **성왕 라시드** 덕분에 인류가 이겼다.\n- 그런데 진실을 밝히면 신앙이 무너질까 봐 덮어버렸고, 공식적으로는 \"암흑신의 전인 **베라딘**이 일으킨 재난\"이라고 전해진다.\n- 그 결과 암흑신을 믿던 **구 게이시르 제국** 사람들은 **주신교**를 강요받고, 땅은 **실버 애로우 연합국**이 수십 개 영지로 쪼개 다스린다 → \"제국 자치령\".\n- **성왕력 12년**: 동쪽의 **투르 제국**이 바다로 쳐들어와 종교 국가 **아스타니아**를 거의 다 점령. 라시드 왕이 실버 애로우를 다시 모아 반격하지만 끝이 안 나는 소모전이 된다 → 이게 **\"50년 전쟁\"**의 시작.\n- 동쪽이 전쟁에 묶인 틈에 서쪽 제국 자치령에선 타락한 영주들이 날뛴다.\n- 이 혼란 속에서 쪼개진 제국을 다시 묶어 흑태자 시절의 영광을 재현하려는 야심가가 등장 → 제국령 유일의 추기경 **체사레 보르자**.\n\n## 1. 시라노의 몰락 (프롤로그)\n\n- 주인공 **시라노 번스타인**: 제국 7용사 번스타인 가문, 게이시르 시티 영주 **루크 번스타인**의 외아들. **제국 학술원**의 촉망받는 젊은 학자.\n- 약혼녀는 체사레 추기경의 딸 **메르세데스**.\n- **에스겔력 1249년 말, 약혼식 날**: 제국 경찰이 들이닥쳐 시라노를 체포. 죄목은 금서 **『창세전쟁의 비록』**을 읽었다는 것.\n- 종교 재판에서 **친구와 사촌의 모함**까지 겹쳐 악마 숭배자로 몰리고 사형 선고.\n- 사형은 면하고 유황 광산 감옥 **인페르노**로 보내진다.\n- 감옥에서 들은 소식: 번스타인 가문이 반란을 일으켰다가 진압돼 **멸문**, 메르세데스는 영주 **알프레드 프레데릭**과 결혼.\n\n## 2. 인페르노 — 데이모스와의 만남\n\n- 강제 노역 중 낙반 사고로 유황 동굴을 헤매다, 봉인된 13암흑신의 수장 **혼돈의 데이모스**를 만난다.\n- 데이모스에게 『창세비록』이 진짜 역사라는 것, 그리고 자신이 왜 누명을 썼는지를 듣고 **체사레에 대한 복수**를 다짐한다. 역사학, 논리적 추론법도 배운다.\n- 수감 4년째, 몸이 한계에 와서 죽어가던 시라노에게 데이모스가 마지막 힘인 **암흑혈**을 넘겨준다.\n- 데이모스의 유언: **\"폭풍도에 있는 흑태자의 마검 아수라를 찾아 거두어 달라.\"**\n- 이후 시라노는 유황 독에 시달리지 않게 되고, 오히려 몸에 힘이 돈다.\n\n## 3. 인페르노 탈출 (튜토리얼)\n\n- 그로부터 9년 뒤(**에스겔력 1263년 84일**), 레지스탕스 **제피르 팰컨** 제1부대장 **로베르토 데 메디치**가 동료들을 구하러 인페르노를 습격한다.\n- 메디치가 다른 죄수들도 풀어주면서 시라노도 함께 탈출. (간수를 피하려 메디치가 케르베로스의 구멍으로 뛰어들고, 시라노도 따라 뛰어드는 장면)\n- 메디치가 제피르 팰컨 입단을 권하지만 시라노는 정중히 거절하고, 데이모스의 유언대로 **폭풍도**로 향한다.\n\n## 4. 트리시스 사막 → 사이럽스 (1차 — 사막 구조 직후)\n\n- 대상에 섞여 **트리시스 사막**을 건너던 중(1263년 120일경) **도적 떼의 습격**으로 일행과 떨어지고, 헤매다 탈진해 쓰러진다.\n- 젊은 여의사 **에스메랄다**가 구해줘서 **사이럽스 시티의 여관**에서 깨어난다.\n- 사이럽스는 **시장 선거**를 앞두고 어수선하다.\n  - 사막엔 도적, 바다엔 해적이 들끓는데 시장 **샤를르**는 손을 못 쓰고, 오히려 뱃길을 막고 교회가 성금을 더 걷는 걸 눈감아 준다. 해적을 핑계로 항로를 막았는데 다른 속셈이 있다는 말이 돌고, 다카마 행 선장을 싫어해서 다카마 행 배에는 출항 금지까지 걸었다.\n  - 그래서 사람들은 네 번째 도전하는 **루스 그랜드**를 밀고, 제국(흑태자) 시절을 그리워한다.\n  - 팬드래건 국왕 **라시드**는 투르 제국과의 전쟁으로 동쪽에 나가 있어 서쪽 일에 손을 못 쓴다.\n- 폭풍도로 가려면 먼저 **다카마 항**으로 가는 배를 타야 하는데, 시장이 그 배에 출항 금지를 걸어 뒀다.\n- 이 얘기를 들은 시라노는 출항 금지를 풀려고 **시장 샤를르를 찾아간다.**\n- 이어서 시장 후보 **루스 그랜드**를 찾아가 다카마에 가려는 이유를 사실대로 털어놓는다.\n- 루스는 금지된 항로를 쓸 수 있게 손써 주고, **여비까지 대 준다.** → 다카마 행 배를 탈 수 있게 됨\n\n## 5. 다카마 항 (1차 — 폭풍도 가는 길)\n\n- 루스 덕분에 사이럽스에서 배를 타고 팬드래건 왕국의 **다카마 항**에 도착한다.\n- 다카마 항은 머매니안해 무역의 중심 항구로, 폭풍도로 가는 연락선이 여기서 뜬다. 하지만 지금은 투르와의 전쟁 탓에 장사가 안 된다는 불만이 많고, 사람들은 이를 왕국의 정책 실패로 본다.\n- 항구의 자유무역지대 밖, 팬드래건 본토로는 허가증 없이 들어갈 수 없다.\n- 폭풍도 행 연락선은 시라노를 태워 주지 않는다. 결국 **몰래 타기로** 한다.\n\n## 6. 폭풍도 가는 바닷길\n\n- 몰래 탄 연락선이 폭풍도로 가던 중 **거센 회오리바람**을 만나고, 이어서 바다 괴물 **크라켄**까지 나타난다.\n- 결국 **배가 침몰**한다.\n\n## 7. 폭풍도 (1차)\n\n- 난파된 시라노는 폭풍도 해변에 쓰러져 있다가 **이올린 팬드래건**에게 구조된다. 라시드 대왕이 매년 보내던 팬드래건 연락선은 바로 누나 이올린을 위한 배였다.\n- 깨어난 시라노가 **마검 아수라**가 어디 있는지 묻는다. 이올린은 위험하다며 알려주지 않는다. 몸이 나으면 돌아가라는 태도.\n- 이올린의 집 벽에는 **흑태자의 그림**과 **폭풍도 산봉우리를 그린 풍경화**가 걸려 있다. 시라노는 이 그림들과 예전에 읽은 『창세전쟁의 비록』 내용을 맞춰 보며 **마장기 아스모데우스가 잠든 곳(폭풍도 정상)에 아수라가 있을 것**이라고 짐작해 낸다.\n- 시라노의 작은할아버지 **빈센트 번스타인**이 예전에 이올린과 함께 싸운 사이였다는 사실이 드러난다.\n- 시라노는 폭풍도 정상에서 아수라를 손에 넣으려 하지만 **실패**한다. 이올린 말로는 아직 **검술이 모자라서**다.\n- 다른 사람들은 아수라에 손대는 순간 영혼을 빼앗겼지만, 시라노는 **데이모스에게 받은 암흑혈** 덕분에 살아남았다. 이올린도 이걸 알게 된다.\n- 이올린은 번스타인 공(빈센트)에게 진 빚을 갚을 겸, 또 자기 자신을 위해서도 **시라노에게 검술을 가르쳐 주기로** 한다.\n- 이올린 밑에서 검술을 익힌 시라노는 다시 정상에 올라 아수라를 지키는 **아수라 수호신**과 맞붙는다. (이 무렵 필살기 **질풍마영참**을 익히고, 폭풍도 동굴에서 얻은 **유리검**으로 수호신을 상대한다.)\n- 수호신을 쓰러뜨리고 마침내 **마검 아수라를 손에 넣는다.** 데이모스의 유언을 이룬 셈이다.\n\n## 8. 폭풍도를 떠나는 바닷길 (팬드래건 연락선)\n\n- 아수라를 얻은 시라노는 라시드 대왕이 해마다 보내는 **팬드래건 연락선**을 타고 폭풍도를 떠난다. 올 때는 몰래 탄 배였지만 이번엔 제대로 탄다.\n- 그런데 머매니안해를 건너던 중 **해적**이 배를 덮친다.\n- 폭풍도에서 수련을 마친 시라노에게 해적들은 상대가 안 된다. 혼자 해적들을 뚫고 갑판까지 올라가 해적 두목 **실버**와 마주한다.\n- 시라노가 사이럽스까지 데려다 주면 없던 일로 하겠다고 하자, 실버는 오히려 결투를 걸어온다. 자기를 이기면 사이럽스는 물론이고 평생 종 노릇이라도 해 주겠다고.\n- 시라노가 결투에서 **이긴다.** 실버는 약속대로 시라노를 **사이럽스까지 데려다 주고**, 그 뒤로도 **시라노를 따르기로** 한다.\n- 사이럽스에 닿자 실버는 **부하들과 헤어지고** 시라노를 따라나선다.\n\n## 9. 트리시스 사막 (2차 — 게이시르로 가는 길)\n\n- 시라노는 실버와 함께 다시 **트리시스 사막**을 건너 **게이시르**로 향한다. 처음엔 도적 떼에 쓰러졌던 사막을, 이번엔 아수라와 동료를 데리고 거꾸로 건너는 셈이다. (→ 4. 트리시스 사막 1차 참고)\n- 게이시르는 시라노의 고향이자, 시라노를 몰락시킨 체사레가 있는 곳이다.\n\n## 10. 구 게이시르 제국령 (1차 — 폭풍도에서 돌아온 직후)\n\n- 사막을 건너 구 게이시르 제국령에 들어선다. 지도에 **카라카스**가 새로 나타난다.\n- 도착하자마자 **제국 병사들에게 쫓기는 여자**와 마주친다. 레지스탕스 **제피르 팰컨**의 **카나**다.\n- 시라노와 실버가 끼어들어 **제국 병사들을 물리쳐 준다.** 카나는 고맙다는 말만 남기고 **바로 사라진다.**\n\n## 11. 카라카스 (1차 — 폭풍도에서 돌아온 직후)\n\n- 시라노와 실버는 **카라카스 마을**에 도착한다. 게이시르 시티 북쪽 깊은 숲 속의 사냥꾼 마을이자, 여러 지역으로 이어지는 길목이다.\n- 마을 사람들 말로는 프리토리아 영주 **라몬**은 이상한 행동으로 유명하고, 이곳 영주 **루벤 공작**도 그에 못지않다.\n- 마을에서 영주 **루벤**의 행차를 본 시라노가 **분노한다.** 루벤은 13년 전 종교 재판에서 시라노에게 불리한 증언을 해 그를 인페르노로 보낸 사람이다. 그 대가로 체사레에게서 번스타인 가문의 땅 일부를 받아 영주가 돼 있었다.\n- 마을 사람들 말로는 루벤은 **잔혹하기로 유명**하고, **내일 있을 화형식** 때문에 와 있다. **제피르 팰컨을 도와준 사람**을 태우는 화형식이다.\n- 다음 날 화형식. 화형을 막으려고 **카나가 이끄는 제피르 팰컨 부대**가 들이닥친다. 시라노도 싸움에 뛰어들어 경비병들과 맞붙지만, 그사이 **루벤은 도망친다.**\n- 시라노 일행이 루벤의 저택으로 쳐들어가려 하자 **카나**가 나타난다. 서로 돕기로 한다면 **저택으로 이어지는 비밀통로**로 같이 가자고 제안한다.\n- 카나와 함께 비밀통로로 저택에 숨어들어 루벤을 찾아내지만, **가짜**였다. 진짜 루벤은 근처 **다른 영주에게 도망간** 것으로 보인다.\n- 시라노는 카나에게 이제 같이 다니지 말자고 하고, **따로 루벤을 찾아 나선다.**\n\n## 12. 카라카스 근처 숲 (루벤을 쫓는 길)\n\n- 시라노와 실버가 마을 근처 숲으로 나온다. 몰래 뒤따라오던 **카나**가 들킨다.\n- 그때 **제국 병사들이 한 가족을 쫓고** 있다가, 눈앞에서 그 일가족을 **사살**한다.\n- 병사들을 물리치고 보니 가족 중 **두 아이**가 크게 다쳤지만 아직 살아 있다.\n- 카나가 **프리토리아**의 유명한 의사 **에스메랄다**에게 데려가자고 한다. 사막에서 시라노를 살려 준 바로 그 의사다.\n- 프리토리아까지는 카나가 길을 안내해야 해서, 결국 카나와 **다시 함께 가기로** 한다.\n\n## 13. 프리토리아 (1차 — 다친 아이들을 데리고)\n\n- 카나의 안내로 다친 두 아이를 데리고 **프리토리아**에 도착한다. 드래건 브레스 산맥 중턱, 인페르노와 가까운 마을이다.\n- 마을 사람들은 영주 **라몬 자작**을 싫어한다. 여자를 밝히고 사람들을 괴롭히며, 2층 저택에 재산을 잔뜩 쌓아 두고 있다.\n- 반대로 무료로 사람들을 치료해 주는 의사 **에스메랄다**는 모두가 칭송한다.\n- 최근 라몬 자작 때문에 **한 가족이 죽었다**는 말이 돈다. 숲에서 본 그 일가족일 가능성이 크다.\n- 시라노는 **에스메랄다**를 다시 만나 아이들의 치료를 맡긴다. 사막에서 자신을 살려 준 은인과의 재회다.\n- 다음 날 진료소에 가 보니 간호사가 뛰쳐나와 도와 달라고 한다. **라몬 자작이 에스메랄다를 끌고 갔다**는 것이다. 죄목은 **악마의 힘을 빌려 사람들을 치료했다**는 것.\n- 사실은 라몬의 구혼을 에스메랄다가 거절해서 **앙심을 품은 것**이라고 한다.\n- 시라노 일행은 에스메랄다를 구하러 **라몬 자작의 저택**으로 향한다.\n- 저택 안에서 **샤른호스트**라는 사람을 만난다. 악덕 영주만 노리는 **괴도**이고, 카나와는 이미 아는 사이로 보인다.\n- 저택에서 **에스메랄다를 구해 낸다.** 샤른호스트는 조용히 사라진다.\n\n## 14. 제피르 팰컨 기지 (1차 — 에스메랄다 구출 직후)\n\n- 싸움이 끝나자 카나가 제피르 팰컨 사람들이 모인 곳으로 가자고 해서 따라간다.\n- 그곳에서 제피르 팰컨의 **클라우제비츠, 리델, 이자벨**을 만난다.\n- 루벤은 근처에 주둔하던 **이루스 장군**에게 몸을 맡긴 것으로 드러난다. 제국 최고의 맹장이자, 예전에 제국 4천왕으로 꼽히던 전설적인 인물이다.\n- 리델과 이자벨은 카나가 외부인을 데려온 것을 두고 경솔하다고 나무란다.\n- 시라노 일행은 다시 따로 움직이려 하고, 에스메랄다는 시라노 일행을 따라가겠다고 한다.\n- 그때 **메디치**가 나타난다. 클라우제비츠는 에스메랄다가 받는 신망을 믿고 시라노 일행에게 함께하자고 제안한다.\n- 시라노는 인페르노에서 자신을 꺼내 준 메디치를 알아보고, 일단 제피르 팰컨과 함께 움직여 보기로 한다.\n\n## 15. 카라카스 (2차 — 카라카스 공격 작전)\n\n- 제피르 팰컨이 카라카스를 치기로 한다.\n- 메디치는 **이루스 장군**을 상대하러 가고, 카나를 포함한 시라노 일행은 **포로 구출**을 맡는다.\n- 포로를 구하러 **루벤의 저택 지하**로 다시 숨어들려 한다. 1차 때 카나와 함께 가짜 루벤을 잡았던 그 저택이다. (→ 11. 카라카스 1차 참고)\n- 그런데 저택에 들어가기 직전, 시라노는 **뭔가 안 좋은 느낌**을 받는다. 데이모스가 넘겨준 힘 때문인가 싶어하면서, **메디치에게 가 봐야겠다**고 마음먹는다.\n- 가 보니 예감대로였다. 메디치가 **이루스 장군에게 밀려 위험한 상황**이다.\n- 이루스는 시라노에게서 **데이모스와 흑태자의 파동**을 느끼고, **그리마**로 몸을 바꿔 시라노와 맞붙는다.\n- 시라노는 아까 그 불길한 느낌이, 몸 안의 **데이모스의 영혼이 이루스에게 끌려서** 생긴 것이었다고 판단한다.\n- 싸움이 시작되려는 순간 **샤른호스트**가 이루스의 결계를 뚫고 뛰어든다. 자기를 **\"흑영의 마지막 후계자\"**라고 밝히는데, 정작 쓰는 검법은 **팬드래건의 검법**이라 시라노가 이상하게 여긴다.\n- 시라노와 샤른호스트가 힘을 합쳐 **이루스를 물리친다.**\n- 쓰러진 메디치를 실버에게 맡기고, 시라노는 **혼자 루벤의 저택**으로 들어가 루벤을 쫓는다.\n- 저택에서 루벤과 맞붙어 쓰러뜨린다. 죽어 가는 루벤이 털어놓은 사실:\n  - 루벤은 **루크 번스타인의 아들**, 곧 시라노의 **배다른 동생**이었다. 천한 신분으로 자라면서 모든 걸 가진 시라노를 부러워했고, 그 질투 때문에 배신했다.\n  - 아버지 루크는 시라노를 구하려고 **체사레 추기경에게 맞섰고**, 그러다 **프레데릭과의 결투에서 죽었다.**\n  - 마지막으로 시라노에게 미안하다고, 시라노를 함정에 빠뜨린 건 **체사레**이니 조심하라고 말한다. 자기와 **이스카리옷**도 체사레 때문에 어쩔 수 없이 거짓 증언을 했다는 투였다.\n- 형제처럼 지내던 루벤은 그렇게 시라노의 품에서 숨을 거둔다. 첫 번째 복수는 끝났지만, 진짜 원수가 체사레라는 게 더 또렷해졌다.\n- 싸움이 끝나자 **클라우제비츠**가 시라노에게 제피르 팰컨과 함께하자고 한다. 이번 일로 교회 쪽은 시라노를 제피르 팰컨 사람으로 볼 테니, 혼자 움직이기는 어려울 거라는 이유다.\n- 시라노도 체사레를 같은 적으로 둔 제피르 팰컨과 **함께하기로 한다.** 인페르노에서 메디치의 입단 제안을 거절했던 시라노가, 이번엔 스스로 들어간다. (→ 3. 인페르노 탈출 참고)\n\n## 16. 제피르 팰컨 기지 (2차 — 카라카스 공격 직후 작전 회의)\n\n- 제피르 팰컨이 회의를 연다. 시라노가 정식으로 함께한 뒤 처음 맞는 작전 회의다.\n- 체사레 추기경이 **니코시아** 지방에서 일을 꾸미고 있다는 정보가 들어왔다. 게이시르 시티 남쪽의 작은 마을인데, 그곳에 **요새**를 세우고 무언가를 준비하고 있다고 한다.\n- 참고로 **로우엔** 지방은 지금 제국에서 가장 강한 **프레데릭 공**의 영지다. 시라노의 아버지를 결투에서 죽이고 메르세데스와 결혼한 바로 그 사람이다. (→ 15. 카라카스 2차 참고)\n- 다음 임무는 니코시아 요새를 **정탐**하는 것이다.\n- 작전 회의실을 나서며 시라노가 혼잣말을 한다. **\"게이시르 시티, 15년 만인가.\"** 니코시아로 가는 길에 고향 게이시르 시티를 지나게 된다. 약혼식 날 끌려간 뒤 처음 돌아가는 고향이다. (→ 1. 시라노의 몰락 참고)\n- 기지 사람에게서 제국 학술원이 이제 **\"이스카리옷의 학술원\"**으로 불리고, 마법의 극한을 연구하고 있다는 말을 듣는다. 시라노를 모함한 친구가 시라노가 있던 학술원을 차지한 모양이다. (→ 15. 카라카스 2차 참고)\n- 떠나기 전 기지를 둘러보다, 기지 안 벽 뒤로 사람이 빨려 들어간 적이 있다는 이야기를 듣는다. 전에 숲에서 들은 \"본부 안 이상한 동굴\" 소문과 이어진다.\n\n## 17. 게이시르 시티 (1차 — 니코시아로 가는 길)\n\n- 니코시아로 가는 길에 시라노가 **15년 만에 고향 게이시르 시티**에 들른다. (→ 16. 제피르 팰컨 기지 2차 참고)\n- 마을 사람에게서 **게이시르 대성당 아래에 예전에 묻어 둔 지하수로**가 있다는 이야기를 듣는다.\n- 고향의 분위기는 심상치 않다. 마을 곳곳에 **수상한 암살자들**이 돌아다닌다.\n\n## 18. 니코시아 (1차 — 교회 요새 정탐 임무)\n\n- 게이시르 시티를 지나 정탐 목적지인 **니코시아**에 도착한다. (→ 16. 제피르 팰컨 기지 2차 참고)\n- 와 보니 한적한 시골 마을이다. 이런 곳에 체사레가 왜 **요새**를 짓고 있는지부터가 수상하다.\n- 니코시아 근처는 **카나의 고향**이다.\n\n## 19. 니코시아 교회 요새 (1차 — 정탐 작전)\n\n- 마을 동쪽 위의 **교회 요새**로 정탐하러 들어간다.\n- 교회 안에서 **크리스**라는 사람을 만난다. 크리스도 교회와 싸우고 있는데, 왜 싸우는지는 끝내 말해 주지 않는다.\n- 교회 뒤편에서 요새의 정체가 드러난다. 제국 마장기 **아수라 MK.2**가 있었다. 교회 세력이 이곳에서 **마장기를 만들고 있었던** 것이다. (→ 18. 니코시아 1차 참고)\n- 시라노 일행이 아수라 MK.2를 쓰러뜨린다.\n- 싸움이 끝나자 크리스가 **제피르 팰컨에 들어오고 싶다**고 한다. 받아들일지는 **기지로 돌아가 의논**하기로 한다.\n\n## 20. 한편, 비프로스트 (막간 — 니코시아 정탐 직후)\n\n- 장면이 북쪽 나라 **비프로스트 공국**으로 바뀐다.\n- **원로원** 사람들이 **모젤 공왕**을 찾아가 따진다. 공왕이 원로원의 의견을 무시하고 **군비를 늘렸다**는 것이다.\n- 원로원은 공왕이 **어떤 여자에게 놀아나서** 그 여자가 시키는 대로 군사비를 올리고 있다고까지 몰아붙인다.\n- 모젤 공왕은 대꾸 대신 **무력으로 원로원을 쫓아낸다.** 북쪽에서도 전쟁 준비가 시작되는 분위기다.\n\n## 21. 제피르 팰컨 기지 (3차 — 니코시아 정탐 직후 작전 회의)\n\n- 기지 작전회의실로 돌아온다. 의논 끝에 **크리스를 제피르 팰컨 일원으로 받아들인다.** (→ 19. 니코시아 교회 요새 참고)\n- **리브레빌**의 영주 **에스테 도데**에게서 전령이 온다. 절세 미녀로 이름난 영주다. 리브레빌은 교회의 힘이 그리 세지 않은 곳이다.\n- 전령이 전한 소식: **모젤 공왕이 군대를 움직여** 비프로스트 근처 제국령의 **소영주들을 압박**하고 있다. 바로 앞서 원로원을 쫓아내고 늘린 그 군대다. (→ 20. 비프로스트 참고)\n- 시라노는 제국의 영주가 레지스탕스인 제피르 팰컨에 도움을 청하는 게 **이상하다**고 여긴다.\n- 클라우제비츠는 **함정은 아닐 것**이라고 본다. 에스테 영주는 교회 세력과 가깝지 않다는 것이다.\n- 시라노 일행은 **리브레빌로 출발**한다.\n\n## 22. 리브레빌 (1차 — 에스테 도데의 요청)\n\n- 에스테 도데의 부름을 받고 **리브레빌**에 도착한다. (→ 21. 제피르 팰컨 기지 3차 참고)\n- 마을의 **투기장**은 **이상한 자물쇠로 잠겨 있다.**\n- 마을 사람들 말로는 비프로스트 공왕 곁에 **조세핀**이라는 애첩이 있다. 원로원이 \"어떤 여자에게 놀아난다\"고 한 그 여자로 보인다. (→ 20. 비프로스트 참고)\n- 마을을 돌다 보면 **카오스 큐브의 전설**을 들을 수 있다. 이야기가 길어서 뒷부분은 **로우엔**에서 이어진다고 한다. 자기 집에 카오스 큐브가 있다는 사람도 만난다.\n- 카라카스 근처 숲에서 구한 **두 아이**가 리브레빌의 한 집에 살고 있는 것 같다. (→ 12. 카라카스 근처 숲, 13. 프리토리아 참고)\n- 영주 저택에 가 보니 **클라우제비츠**가 먼저 와 있다. **메디치**는 따로 오느라 아직이다. 원래 잘 늦는 모양이다.\n- 먼저 **에스테 도데**를 만나 이야기하던 중에 메디치가 도착한다. 에스테는 처음 보는 메디치를 무척 반기고, 말투에서도 호감이 묻어난다.\n- 에스테가 도움을 청한 사정:\n  - **커티스**로 이어지는 마을 동쪽 도로의 북쪽 고원지대가 **새 영지로 떨어져 나가** 마을이 생겼다.\n  - 그 마을이 리브레빌의 생명줄 같은 이 도로에 **통행세**를 받기 시작했다. 영주에게 연락해 봤지만 답이 없다.\n  - 언제부턴가 그 도로로 일하러 나간 사람들이 **돌아오지 않는다.**\n  - 상대는 화력도 꽤 갖췄고, 특히 **몬스터를 부린다.** 리브레빌 혼자서는 맞설 수가 없다.\n- 도와주는 대가로 에스테가 내건 조건: **해마다 100만 엘드**, **제피르 팰컨 간부들의 신분 보장**, **에스테 저택을 마음대로 써도 좋다**는 것.\n- 그날 밤 저택 화원에서, **메디치가 카나에게 고백**한다. 카나는 **따로 좋아하는 사람이 있다**며 거절하고 자리를 피한다.\n- 카나가 가고 나자 **에스테가 나타나 메디치에게 고백**하고, 두 사람은 함께 방으로 간다.\n- 시라노는 이 모든 걸 **몰래 엿듣는다.**\n- 다음 날, 클라우제비츠가 시라노에게 문제의 마을 **안타나나리보**로 가서 **영주 저택을 조사하고 실종된 마을 사람들을 구해 오라**고 한다.\n\n## 23. 안타나나리보 (1차 — 실종자 조사 임무)\n\n- 클라우제비츠의 지시로 **안타나나리보**에 도착한다. (→ 22. 리브레빌 1차 참고)\n- 그런데 마을 사람들 말을 들어 보니, 이곳은 **통행세를 걷는 문제의 마을이 아닌 것 같다.** 문제의 마을은 이 근처 어딘가로 보인다.\n- 마을 밖으로 나가 보니 **망티고아 산** 위로는 아직 못 올라가고, **안타나나리보 요새** 앞으로 가는 길만 열려 있다.\n- 그 길로 들어가 **영주 저택**을 뒤지던 중, **영주**가 **비프로스트군**과 함께 있는 것을 만나 전투가 벌어진다. 남쪽 제국령을 압박하던 비프로스트군이 이 영지 안에까지 들어와 있었던 것이다. (→ 21. 제피르 팰컨 기지 3차 참고)\n- 싸움 끝에 시라노는 **영주를 처단**한다.\n- 이어서 **갇혀 있던 리브레빌 주민들**을 찾아내 구출한다. 에스테가 말한 \"그 길로 일하러 나갔다가 돌아오지 않은 사람들\"이다. (→ 22. 리브레빌 1차 참고)\n\n## 24. 한편, 프레데릭 저택 (막간 — 안타나나리보 구출 직후)\n\n- 장면이 **게이시르의 프레데릭 저택**으로 바뀐다. **메르세데스**와 남편 **프레데릭**이 이야기를 나눈다.\n- 메르세데스가 딸 **크리스티나**의 소식을 묻는다. 열다섯 살 크리스티나가 집을 나간 지 **석 달**이 됐다.\n  - 할아버지 **체사레**가 모르는 사람에게 시집가라고 밀어붙이자, 피하듯 여행을 떠난 모양이다.\n- 메르세데스는 걱정 하나 없어 보이는 프레데릭을 나무라지만, 프레데릭은 웃어넘긴다. 자기도 그 나이엔 세상을 돌며 견문을 넓혔다는 것이다.\n  - 크리스티나는 어릴 때부터 프레데릭에게 무술을 배웠다. 부녀 사이는 나빠 보이지 않고, 프레데릭도 나쁜 사람으로는 그려지지 않는다.\n- 프레데릭은 장인 체사레가 **니코시아에 세운 교회가 제피르 팰컨에게 부서졌다**는 얘기를 꺼낸다. 시라노 일행이 아수라 MK.2를 쓰러뜨린 그 일이다. (→ 19. 니코시아 교회 요새 참고)\n- 프레데릭은 장인이 평민들을 너무 억누르는 걸 걱정한다. 그래도 **제피르 팰컨은 한번 혼내 줘야겠다**며, 그들을 상대하는 김에 **크리스티나의 행방**도 찾아보려 한다.\n\n## 25. 제피르 팰컨 기지 (4차 — 안타나나리보 구출 직후 작전 회의)\n\n- 리브레빌 주민들을 구해 낸 덕분에 제피르 팰컨에 **후원자**가 생겼다. 도와주면 해마다 돈을 대겠다던 **에스테 도데**로 보인다. (→ 22. 리브레빌 1차 참고)\n- 그런데 그사이 **프레데릭의 로우엔군**이 움직이기 시작했다. 막간에서 프레데릭이 \"제피르 팰컨을 혼내 주겠다\"던 그 움직임이다. (→ 24. 프레데릭 저택 참고)\n- 새 작전 목표는 **아군 포로 구출**이다. 프레데릭의 힘을 등에 업은 지방 영주들이 제피르 팰컨 사람들을 붙잡아 두고 있다.\n- 포로가 갇힌 곳은 **프리토리아, 멤피스, 보르도** 세 곳이다.\n  - **프리토리아**는 라몬 자작을 몰아낸 뒤 제피르 팰컨 손에 있던 도시인데, 얼마 전 프레데릭의 지휘로 **새 영주**가 들어섰다. (→ 13. 프리토리아 1차 참고)\n- **에스메랄다**는 프리토리아에 가면 **자기 병원**에 들러 볼 수 있겠다며 내심 가 보고 싶어 한다.\n- **메디치**는 군사 클라우제비츠가 가끔 **남몰래 사라질 때**가 있다고 귀띔한다.\n- 출발 전, 기지 **지하의 숨은 동굴**에 들어가 **롱기누스의 창**을 손에 넣는다. 전에 들은 \"기지 벽 뒤로 사람이 빨려 들어갔다\"는 그 동굴이다. (→ 16. 제피르 팰컨 기지 2차 참고)\n\n## 26. 프리토리아 산 — 피닉스의 동굴 (포로 구출 가는 길)\n\n- 기지를 나와 프리토리아 쪽으로 가는 길에 **프리토리아 산**에 오른다. 사이럽스에서 \"프리토리아 근처 산에서 이상한 기운이 흘러나온다\"고 들었던 그 산이다. (→ 4. 사이럽스 1차 참고)\n- 산속 **피닉스의 동굴** 깊은 곳에서 **피닉스의 알**을 얻는다. 화염 마법을 쓸 수 있게 해 주고, 소환수 **피닉스**를 불러낼 수 있다.\n\n## 27. 프리토리아 (2차 — 포로 구출 임무)\n\n- 산을 내려와 **프리토리아**에 도착한다. 다친 두 아이를 데리고 왔다가 에스메랄다를 라몬 자작에게서 구해 냈던 마을이다. (→ 13. 프리토리아 1차 참고)\n- 지금은 프레데릭의 지휘로 **새 영주**가 들어섰고, 이곳 어딘가에 **제피르 팰컨 포로**가 붙잡혀 있다. 에스메랄다는 자기 **병원**에 들러 보고 싶어 한다. (→ 25. 제피르 팰컨 기지 4차 참고)\n- 에스메랄다의 **진료소**에 들러 봤지만 따로 벌어지는 일은 없다.\n- 포로를 찾아 **영주 저택**에 들어간다. 1차 때 에스메랄다를 구하러 숨어들었던 그 **옛 라몬 저택**이다. 1층과 2층을 샅샅이 뒤져 상자를 모두 챙긴다.\n- 저택 안에서 **새 영주**와 마주친다. 영주는 제피르 팰컨이 포로를 구하러 올 줄 미리 알고 **투르족 용병**을 고용해 기다리고 있었다.\n- 용병들을 물리친다. 시라노는 영주에게 **포로들을 풀어 주고 프리토리아를 떠나라**고 한다. 이것으로 세 곳 가운데 **프리토리아의 포로**를 구해 낸다. 남은 곳은 **멤피스**와 **보르도**다.\n\n## 28. 리브레빌 (2차 — 포로 구출 임무 중 들름)\n\n- 남은 포로를 구하러 가기 전에 **리브레빌**에 들른다. 1차 때 이상한 자물쇠로 잠겨 있던 **투기장**을 열기 위해서다. (→ 22. 리브레빌 1차 참고)\n- 투기장 주인의 집에서 **투기장 열쇠**를 찾아 문을 열고, 안쪽의 숨은 미로 동굴로 내려간다.\n- 동굴 깊은 곳에서 번개를 부리는 소환수 **썬더메어**를 얻는다.\n\n## 29. 멤피스 (1차 — 포로 구출 임무)\n\n- 남은 두 곳 가운데 먼저 **멤피스**에 도착한다. 이곳 어딘가에 **제피르 팰컨 포로**가 붙잡혀 있다. (→ 25. 제피르 팰컨 기지 4차 참고)\n- 예전엔 살기 좋은 마을이었는데, **영주가 바뀐 뒤로** 사람들을 들볶아 살기 힘든 곳이 됐다. 새 영주는 **난폭하기로 소문난** 사람이다.\n  - 이곳에서 결혼해 살려면 **결혼세**까지 내야 한다. 여자들은 마을에 남으려 하지 않고, **리브레빌로 떠나는** 사람이 많다.\n- 마을 왼쪽 위 집에는 **시드**라는 남자가 10년쯤 혼자 살고 있다. 학자가 꿈이었는데 어딘가에서 **간신히 목숨만 건져 도망쳐 왔다**고 한다.\n- 포로를 찾아 **영주 저택**에 숨어든다. 멤피스 영주도 프리토리아 영주처럼 **투르족 군대**를 사서 기다리고 있었다. (→ 27. 프리토리아 2차 참고)\n- 투르족 군대와 영주를 무찌르고 **멤피스의 포로**를 구해 낸다. 이제 남은 곳은 **보르도** 하나다.\n\n## 30. 로우엔 동굴 — 유성검 던전 (멤피스에서 로우엔 가는 길)\n\n- 마지막 포로가 있는 **보르도**로 가기 전에, 로우엔 근처 산속 동굴에 들른다. 카라카스에서 \"로우엔 근처 산에 이상한 칼이 박혀 있다\"고 들었던 그곳이다. (→ 카라카스 \"소문 — 로우엔 근처에 박힌 이상한 칼\" 참고)\n- 동굴 깊은 곳에서 **유성의 검**을 얻는다. 동굴 안의 상인에게서 **다이아몬드잼**도 사 둔다.\n\n## 31. 마검숲 (보르도 가는 길, 멸살지옥검을 찾으러)\n\n- 칼스 장군의 **멸살지옥검**이 꽂혀 있다는 **마검숲**을 찾아 나선다. (→ 카라카스 근처 숲에서 들은 소문 참고)\n- 가는 길에 **\"칼 스타이너, 이곳에서 검의 도를 얻다\"**라고 새긴 **비석**을 본다. 그런데 그 자리에 검은 보이지 않는다.\n\n## 32. 반란군의 마을 (1차 — 로우엔 가는 길)\n\n- 로우엔으로 가는 길에 **반란군의 마을**에 들른다.\n- 누가 세운 게 아니라 사람들이 **스스로 모여 만든** 반란군 마을이다. 규모가 작아서 **제피르 팰컨도, 영주들도 크게 신경 쓰지 않는다.**\n- 작은 마을이라 따로 벌어지는 일은 없다. 둘러본 뒤 멸살지옥검을 찾으러 **다시 마검숲**으로 향한다.\n\n## 33. 로우엔 (1차 — 포로 구출 임무 중, 보르도 가는 길)\n\n- **로우엔**에 도착한다. 시라노의 아버지를 결투에서 죽이고 메르세데스와 결혼한 **프레데릭 공의 영지**다. 지금 제피르 팰컨을 치려고 움직이는 **로우엔군**의 본거지이기도 하다. (→ 24. 프레데릭 저택, 25. 제피르 팰컨 기지 4차 참고)\n- 약국 안쪽에 상자가 보이지만 NPC가 막아서 들어가지 못한다.\n- 마을에서 **투기장 평생 이용권**을 얻는다.\n- 카라카스 요리사 카그가 찾던 **사랑의 향초**를 **파로 마을**에서 얻을 수 있다는 말을 듣는다. (→ 11. 카라카스 1차 참고)\n\n## 34. 파로 마을 (1차 — 요리사 카그의 사랑의 향초를 찾으러)\n\n- 보르도로 가기 전에 잠시 길을 돌려 **파로 마을**에 들른다. 카그에게 갖다줄 **사랑의 향초**를 구하기 위해서다.\n- 마을 사람들은 바깥과 달리 **평화롭고 조용한 곳**이라고 자랑한다. 그런데 분위기가 어딘가 뒤숭숭하다. **웨어링 집안**의 아버지 댄은 집안이 저주받았다며 아들의 결혼을 반대하고, 아들 브리앙은 **자기 손으로 끔찍한 짓을 했다**며 넋이 나가 있다. 마을 밖에서 만난 사람도 그 집안과의 **약혼은 잘못된 것**이었다며, 그 집안은 아예 결혼을 시키면 안 된다고 화를 낸다. 브리앙의 약혼녀는 마을 최고의 미인 **다이아나**다. 마을 사람들이 질투해서 아무도 두 사람의 약혼을 반기지 않았다.\n- 다이아나는 브리앙이 1년 전부터 우울해하다 이상한 소리를 하지만 자기 눈엔 멀쩡하다며, 병이라면 꼭 고치겠다고 한다. 반면 댄의 오랜 친구 **헤이슨**은 발작이 가끔 오는 **집안 내력**이라 고칠 수 없다며, 다이아나를 설득해 결혼을 말리려 한다.\n- 마을 **영주**는 아이들을 좋아하는지 집에 **아이들이 꽤 많다**고 한다. 그것도 **모두 여자아이**다. 영주는 꽃도 좋아해서 저택 **정원에 꽃이 아주 많다**고 한다. 마을 사람은 좋게 말하지만 어딘가 수상하다.\n- 이 조용한 마을에도 **메디치의 현상수배**가 붙어 있다. **제국의 패자를 정한다는 아수라를 누군가 뽑았다**는 소문도 돈다. 폭풍도에서 시라노가 뽑은 그 검이다. (→ 7. 폭풍도 1차 참고)\n- 파로 마을에 사는 **카그의 형**을 만나 **사랑의 향초**를 얻는다. 이제 카라카스로 가서 카그에게 전한다.\n- 브리앙이 털어놓은 사정은 이렇다. 작년 가을 마을 축제 날 만취했다가 깨어 보니 손에 피가 묻어 있었고, 다음 날 마을에 **늑대**가 나타나 가축을 죽였다는 말이 돌았다. 브리앙은 잠든 사이 **자기가 늑대가 되어** 한 짓이라 믿고, 다이아나를 해칠까 봐 결혼을 포기하려 한다.\n- 마을에선 말이 갈린다. 돈 많은 웨어링 집안이 상속 다툼을 피하려고 친척끼리 혼인하다 **대대로 정신병**이 생겼다는 말도 있고, 브리앙이 **헤이슨과 댄의 아내 레이첼 사이에서 난 아들**이 아니냐는 오래된 수군거림도 있다. 헤이슨은 최근에야 마을로 돌아왔다.\n- 시라노는 누군가 **일부러 꾸민 일**일 수 있다고 보고 **약국**을 찾는다. 하지만 대놓고 극약을 판 적 없냐고 물었다가 혼만 난다.\n- 다시 약국을 찾아 이번엔 **댄이 좋아할 만한 물건**을 묻는다. 약국 주인은 댄이 눈이 나빠 오래전부터 **가시독말풀로 만든 약**을 먹어 왔는데, 요새는 약국에 발길을 끊었다고 한다. 시라노는 약을 받지 않고 **웨어링 집**으로 향한다.\n- 웨어링 집에 다이아나와 헤이슨까지 모이자, 시라노가 진실을 밝힌다. 브리앙은 미친 게 아니었다. 브리앙이 **친아들이 아니라는 데 질투한 댄**이 가시독말풀을 먹여 환각에 빠뜨리고 미친 것처럼 꾸몄다. 시라노는 브리앙의 어머니 레이첼의 사고사도 의심한다.\n- 댄은 자식을 볼 수 없는 몸이었다고 털어놓고는, 머리가 아프다며 집을 나선다. 곧 **총소리**가 울린다.\n- 브리앙은 다이아나와 당분간 여행을 떠나 마음을 추스르기로 하고, 집안의 가보 **블러디 스톤**(흡혈 능력)을 시라노에게 건넨다.\n\n## 35. 카라카스 (3차 — 요리사 카그에게 사랑의 향초 전달)\n\n- 파로 마을에서 얻은 **사랑의 향초**를 들고 **카라카스**로 돌아온다. 처음 왔을 때 좋은 식재료를 구해 달라던 주점 요리사 **카그**의 부탁이다. (→ 11. 카라카스 1차, 34. 파로 마을 1차 참고)\n- 향초를 전하고 답례로 **실버잼**을 받는다.\n\n## 36. 니코시아 (2차 — 샤론의 사인을 받으러)\n\n- 파로 마을 소녀의 부탁으로 다시 **니코시아**를 찾는다. 교회 요새를 정탐하러 왔을 때 여관에서 만났던 가수 **샤론**을 만나기 위해서다. (→ 18. 니코시아 1차, 34. 파로 마을 1차 참고)\n- 샤론에게서 **사인**을 받는다.\n\n## 37. 파로 마을 (2차 — 소녀에게 샤론의 사인 전달)\n\n- 다시 **파로 마을**로 돌아와, 샤론의 사인을 부탁했던 **소녀**에게 전한다. (→ 34. 파로 마을 1차, 36. 니코시아 2차 참고)\n- 소녀는 답례로 **얼음의 반지**를 준다.\n\n## 38. 로우엔 (2차 — 카오스 큐브 전설을 들으러)\n\n- 마검숲으로 가기 전, 카오스 큐브 전설의 뒷부분을 들으려고 다시 **로우엔**에 들른다. (→ 22. 리브레빌 1차, 33. 로우엔 1차 참고)\n- 도착하자마자 시라노가 \"이렇게까지 부탁하는데 들어주자\"며 무언가를 받아들이고, **실버잼**을 얻는다. 무슨 부탁이었는지는 확실치 않다. 주점의 지도 제작을 도와 달라는 사람 이벤트의 보상이 먼저 나온 것으로 보인다.\n- 로우엔 사람들은 실버 애로우가 투르와의 전쟁으로 약해진 **지금이 제국의 영화를 되살릴 때**라고 입을 모은다. 로우엔의 남자는 모두 **프레데릭군 병사**이고, 사람들의 자부심이 대단하다. 대부분 **프레데릭을 따르고 제피르 팰컨은 곱게 보지 않는다.**\n- 리브레빌에서 듣다 만 **카오스 큐브의 전설**을 끝까지 듣고, **호크아이**를 얻는다. (→ 22. 리브레빌 1차 참고)\n- 보르도 근처에 **이상한 안경을 쓴 사람들**이 돌아다닌다는 소문과, 검 고치는 달인 **파즈**가 안타나나리보 근방에서 소식이 끊겼다는 얘기도 듣는다.\n\n## 39. 마검숲 (2차 — 멸살지옥검을 얻으러)\n\n- 볼일을 마치고 보르도로 올라가기 전, 다시 **마검숲**에 들어간다. 이번엔 비석에서 멈추지 않고 숲 가장 안쪽까지 간다. (→ 31. 마검숲 1차 참고)\n- 숲 안에는 **커티스 요원들**이 먼저 와 있다. 자기네 **윗선이 멸살지옥검을 탐낸다**며 덤벼든다. 리브레빌 동쪽 도로가 이어지는 그 **커티스**다. (→ 22. 리브레빌 1차 참고)\n- 요원들을 물리치고, 숲 끝에 꽂힌 칼스 장군의 **멸살지옥검**을 손에 넣는다. ← 지금 여기\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const md = document.getElementById("md").textContent;
const art = document.querySelector("article");
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
if (window.marked) {
  // 한국어는 **"…"**의 처럼 굵은 글씨 바로 뒤에 조사가 붙으면 marked가 굵게 처리하지 못해서 먼저 바꿔 둔다
  const src = JSON.parse(md).replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, "<strong>$1</strong>");
  art.innerHTML = marked.parse(src);
} else {
  // 글자 라이브러리를 못 받아 오면 원문 그대로 보여 준다
  const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = JSON.parse(md); art.replaceChildren(pre);
}
art.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
art.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
const used = new Set();
const heads = [...art.querySelectorAll("h2, h3")];
heads.forEach(h => { let id = slug(h.textContent) || "s"; while (used.has(id)) id += "-"; used.add(id); h.id = id; });
const toc = document.querySelector(".toc ol");
const tocHeads = heads.filter(h => h.tagName === "H2" || heads.filter(x => x.tagName === "H2").length < 6);
toc.innerHTML = tocHeads.map(h => `<li><a href="#${h.id}" style="padding-left:${h.tagName === "H3" ? 12 : 0}px">${h.textContent.replace(/[<>&]/g, "")}</a></li>`).join("");
if (!tocHeads.length) document.querySelector(".toc").hidden = true;
if (matchMedia("(max-width: 900px)").matches) document.querySelector(".toc details").open = false;
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
// 지금 읽는 곳을 목차에 표시
const links = Object.fromEntries([...toc.querySelectorAll("a")].map(a => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && links[e.target.id]) { toc.querySelectorAll(".on").forEach(x => x.classList.remove("on")); links[e.target.id].classList.add("on"); } }), { rootMargin: "-70px 0px -70% 0px" });
tocHeads.forEach(h => io.observe(h));
</script>
</body>
